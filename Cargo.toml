[workspace]
members = [
    "crates/alopex-core",
    "crates/alopex-dataframe",
    "crates/alopex-sql",
    "crates/alopex-embedded", "crates/alopex-server", "crates/alopex-cluster", "crates/alopex-cli", "crates/alopex-py",
]
exclude = ["scripts/release/verify-candidate"]
# crates/alopex-tools は意図的に除外する。開発ツール(競合DB比較ベンチ・
# リリース確認バイナリ等)は製品コードの path 依存ではなく crates.io の
# 公開バージョンに依存させ、ユーザーが実際に手にする配布物を検証する
# ためのクレートであるため、独立ワークスペースとして分離している
# (crates/alopex-tools/Cargo.toml の [workspace] 空テーブルを参照)。
resolver = "2"

[workspace.package]
version = "0.8.4"
license = "Apache-2.0"
repository = "https://github.com/alopex-db/alopex"
edition = "2021"

[workspace.dependencies]
# Internal crates
alopex-core = { version = "0.8.4", path = "crates/alopex-core", features = ["compression-zstd"] }
alopex-sql = { version = "0.8.4", path = "crates/alopex-sql" }
alopex-dataframe = { version = "0.8.4", path = "crates/alopex-dataframe" }
alopex-embedded = { version = "0.8.4", path = "crates/alopex-embedded" }
alopex-cluster = { version = "0.8.4", path = "crates/alopex-cluster" }
# Async runtime
tokio = { version = "1.35", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Logging and tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Object storage
object_store = { version = "0.14", features = ["aws"] }
bytes = "1.5"
futures = "0.3"
futures-core = "0.3"
url = "2.5"

# Testing
criterion = "0.5"
rand = "0.8"
uuid = { version = "1.19", features = ["v4", "v7", "serde"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.dev]
opt-level = 0

[profile.test]
opt-level = 1

[patch.crates-io]
ratatui-testlib = { path = "vendor/ratatui-testlib" }
