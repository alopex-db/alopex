[graph]
all-features = true
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
    "wasm32-unknown-unknown",
]

[bans]
multiple-versions = "deny"
multiple-versions-include-dev = true
wildcards = "allow"
highlight = "simplest-path"

# Keep one unskipped version per duplicate family. A newly introduced version
# therefore creates two unskipped versions and fails the blocking bans check.
# Exact entries also become stale when an old version disappears; CI promotes
# those diagnostics to errors so the exception list can only shrink deliberately.
