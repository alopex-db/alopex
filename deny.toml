[graph]
all-features = true
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
    "wasm32-unknown-unknown",
]

[bans]
multiple-versions = "deny"
multiple-versions-include-dev = true
wildcards = "allow"
highlight = "simplest-path"

# Keep one unskipped version per duplicate family. A newly introduced version
# therefore creates two unskipped versions and fails the blocking bans check.
# Exact entries also become stale when an old version disappears; CI promotes
# those diagnostics to errors. New exceptions must name the owning issue and
# the dependency boundary that prevents convergence; they never suppress advisories.
skip = [
    { crate = "alloc-no-stdlib@2.0.4", reason = "Required by the qualified bounded Brotli 4 decoder; Parquet 60 uses Brotli 6/allocator 3. Remove after bounded-decoder memory acceptance (#740/#196)." },
    { crate = "alloc-stdlib@0.2.2", reason = "Required by the qualified bounded Brotli 4 decoder; Parquet 60 uses allocator 0.3. Remove after bounded-decoder memory acceptance (#740/#196)." },
    { crate = "brotli-decompressor@4.0.3", reason = "Pinned bounded decoder: upgrading to 6.2.0 failed the aggregate-memory acceptance test. Parquet 60 requires 6.2.0; converge only after preserving that contract (#740/#196)." },
    { crate = "base64@0.22.1", reason = "Arrow 60 uses 0.23 while SQL/HTTP/tonic and the wire schema require 0.22; #740/#196 track upstream convergence." },
    { crate = "hashbrown@0.16.1", reason = "The codec-free Parquet 57 wire schema requires 0.16; Arrow/Parquet 60 require 0.17. Remove with the wire bridge (#740/#196)." },
    { crate = "num-bigint@0.4.6", reason = "The codec-free Parquet 57 wire schema requires 0.4; Arrow/Parquet 60 require 0.5. Remove with the wire bridge (#740/#196)." },
    { crate = "parquet@57.3.2", reason = "Pinned Thrift wire schema for the bounded reader only, with default features disabled; production decoding/codecs use 60.1. Remove when a standalone wire schema replaces it (#740/#196)." },

    { crate = "alopex-core@0.3.4", reason = "Existing transitive duplicate tracked by #196; remove this exact exception when dependency owners converge." },
    { crate = "base64@0.21.7", reason = "Existing transitive duplicate tracked by #196; remove this exact exception when dependency owners converge." },
