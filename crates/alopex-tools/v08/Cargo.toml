[workspace]

[package]
name = "alopex-tools-v08"
version = "0.0.0"
publish = false
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/alopex-db/alopex"
description = "Internal v0.8 source verifier for Alopex DB"

[features]
default = ["v08-local"]
v08-local = []

[[bin]]
name = "verify-v08-embedded"
path = "src/main.rs"

[build-dependencies]

[dependencies]
alopex-embedded = { path = "../../alopex-embedded" }
alopex-sql = { path = "../../alopex-sql" }
serde_json = "1.0"
