# 親 alopex/ ワークスペースには意図的に含めない(親 Cargo.toml のコメント
# 参照)。開発ツールは製品コードへの path 依存ではなく、crates.io の
# 公開バージョンに依存させることで「ユーザーが実際に手にする配布物」を
# 検証できるようにする。
[workspace]

[package]
name = "alopex-tools"
version = "0.0.0"
publish = false
edition = "2024"  # Uses let chains feature
license = "Apache-2.0"
repository = "https://github.com/alopex-db/alopex"
description = "Development and debugging tools for Alopex DB"
keywords = ["database", "tools", "debugging"]
categories = ["database-implementations", "development-tools"]

[features]
lane_ci = []

[[bin]]
name = "verify-release-embedded"
path = "src/bin/verify_release_embedded.rs"

[[bin]]
name = "demo-v086-embedded"
path = "src/bin/demo_v086_embedded.rs"

[dependencies]
serde_json = "1.0"

# ローカル開発では同じ worktree の API に追随する。公開物検証では run.sh が
# この bin source を一時 crate へコピーし、ALOPEX_VERSION の完全一致依存を
# 生成するため、固定版の手動追随やローカル path 混入は起きない。
alopex-embedded = { path = "../alopex-embedded" }
alopex-core = { path = "../alopex-core" }
alopex-sql = { path = "../alopex-sql" }
