syntax = "proto3";

package alopex.v0;

message SqlRequest {
  string sql = 1;
  string session_id = 2;
}

message DdlRequest {
  string sql = 1;
  string session_id = 2;
}

message DmlRequest {
  string sql = 1;
  string session_id = 2;
}

message DdlResponse {
  bool success = 1;
}

message DmlResponse {
  uint64 affected_rows = 1;
}

message BeginRequest {}

message TransactionHandle {
  string session_id = 1;
  int64 expires_at_ms = 2;
}

message CommitResponse {
  bool success = 1;
}

message RollbackResponse {
  bool success = 1;
}

message VectorSearchRequest {
  string table = 1;
  repeated float vector = 2;
  uint32 k = 3;
  string index = 4;
  string column = 5;
}

message VectorSearchResult {
  uint64 id = 1;
  float distance = 2;
  Row row = 3;
}

message VectorSearchResponse {
  repeated VectorSearchResult results = 1;
}

message VectorUpsertRequest {
  string table = 1;
  uint64 id = 2;
  repeated float vector = 3;
  string column = 4;
}

message VectorUpsertResponse {
  bool success = 1;
}

message VectorDeleteRequest {
  string table = 1;
  uint64 id = 2;
  string column = 3;
}

message VectorDeleteResponse {
  bool success = 1;
}

message VectorIndexCreateRequest {
  string name = 1;
  string table = 2;
  string column = 3;
  string method = 4;
  map<string, string> options = 5;
  bool if_not_exists = 6;
}

message VectorIndexUpdateRequest {
  string name = 1;
  string table = 2;
  string column = 3;
  string method = 4;
  map<string, string> options = 5;
}

message VectorIndexDeleteRequest {
  string name = 1;
  bool if_exists = 2;
}

message VectorIndexCompactRequest {
  string name = 1;
}

message VectorIndexResponse {
  bool success = 1;
}

message HealthRequest {}

message HealthResponse {
  string status = 1;
}

// The canonical cluster snapshot is serialized with the same JSON schema as
// the HTTP admin surface. This preserves integer precision for fields such as
// update epochs without converting them through protobuf Struct numbers.
message ClusterStatusRequest {}

message ClusterStatusResponse {
  string cluster_json = 1;
}

message ClusterJoinRequest {}

message ClusterLeaveRequest {}

message ClusterOperationResponse {
  string action = 1;
  string cluster_json = 2;
  // Additive v0.9 lifecycle classification; fields 1-2 remain unchanged.
  string operation_id = 3;
  string state = 4;
  string reason_code = 5;
}

// Versioned CRDT wire identity. Optional bounds are represented explicitly so
// an empty boundary cannot be confused with an unbounded range edge.
message CrdtRangeIdentity {
  string cluster_id = 1;
  uint32 table_id = 2;
  string range_id = 3;
  bytes lower_bound = 4;
  bool has_lower_bound = 5;
  bytes upper_bound = 6;
  bool has_upper_bound = 7;
  uint64 schema_version = 8;
  uint64 data_epoch = 9;
}

message CreateCounterRequest {
  string object_id = 1;
  CrdtRangeIdentity range = 2;
  string request_id = 3;
  string operation_id = 4;
  uint64 update_version = 5;
  sint64 initial_value = 6;
}

message ReadCounterRequest {
  string object_id = 1;
  CrdtRangeIdentity range = 2;
  string request_id = 3;
  string operation_id = 4;
  uint64 update_version = 5;
}

message IncrementCounterRequest {
  string object_id = 1;
  CrdtRangeIdentity range = 2;
  string request_id = 3;
  string operation_id = 4;
  uint64 update_version = 5;
  sint64 delta = 6;
}

message DecrementCounterRequest {
  string object_id = 1;
  CrdtRangeIdentity range = 2;
  string request_id = 3;
  string operation_id = 4;
  uint64 update_version = 5;
  sint64 delta = 6;
}

// The flattened common contract mirrors the HTTP/embedded CrdtOutcome. A
// non-OK gRPC status carries this exact encoded message in Status.details.
message CounterOutcome {
  string object_type = 1;
  string object_id = 2;
  CrdtRangeIdentity range = 3;
  uint64 state_epoch = 4;
  string actor = 5;
  string request_id = 6;
  string operation_id = 7;
  string state = 8;
  string failure_class = 9;
  string routing_kind = 10;
  uint64 routing_metadata_version = 11;
  string routing_reason_code = 12;
  bool retryable = 13;
  string original_operation_id = 14;
  string original_request_id = 15;
  string first_outcome = 16;
  string first_state = 17;
  uint64 duplicate_count = 18;
  bool has_value = 19;
  sint64 initial_value = 20;
  sint64 accepted_delta_total = 21;
  sint64 value = 22;
  string value_unavailable = 23;
}

message Vector {
  repeated float values = 1;
}

message Value {
  oneof kind {
    int32 int_value = 1;
    int64 bigint_value = 2;
    float float_value = 3;
    double double_value = 4;
    string text_value = 5;
    bytes blob_value = 6;
    bool bool_value = 7;
    int64 timestamp_value = 8;
    Vector vector_value = 9;
  }
}

message Row {
  repeated Value values = 1;
}

message SqlColumn {
  string name = 1;
  string data_type = 2;
}

message SqlResultSet {
  repeated SqlColumn columns = 1;
  repeated Row rows = 2;
  uint64 affected_rows = 3;
  bool has_affected_rows = 4;
  bool success = 5;
}

service AlopexService {
  rpc ExecuteSql(SqlRequest) returns (stream SqlResultSet);
  rpc ExecuteDdl(DdlRequest) returns (DdlResponse);
  rpc ExecuteDml(DmlRequest) returns (DmlResponse);
  rpc BeginTransaction(BeginRequest) returns (TransactionHandle);
  rpc CommitTransaction(TransactionHandle) returns (CommitResponse);
  rpc RollbackTransaction(TransactionHandle) returns (RollbackResponse);
  rpc VectorSearch(VectorSearchRequest) returns (VectorSearchResponse);
  rpc VectorUpsert(VectorUpsertRequest) returns (VectorUpsertResponse);
  rpc VectorDelete(VectorDeleteRequest) returns (VectorDeleteResponse);
  rpc VectorIndexCreate(VectorIndexCreateRequest) returns (VectorIndexResponse);
  rpc VectorIndexUpdate(VectorIndexUpdateRequest) returns (VectorIndexResponse);
  rpc VectorIndexDelete(VectorIndexDeleteRequest) returns (VectorIndexResponse);
  rpc VectorIndexCompact(VectorIndexCompactRequest) returns (VectorIndexResponse);
  rpc Health(HealthRequest) returns (HealthResponse);
  rpc ClusterStatus(ClusterStatusRequest) returns (ClusterStatusResponse);
  rpc ClusterJoin(ClusterJoinRequest) returns (ClusterOperationResponse);
  rpc ClusterLeave(ClusterLeaveRequest) returns (ClusterOperationResponse);
  rpc CreateCounter(CreateCounterRequest) returns (CounterOutcome);
  rpc ReadCounter(ReadCounterRequest) returns (CounterOutcome);
  rpc IncrementCounter(IncrementCounterRequest) returns (CounterOutcome);
  rpc DecrementCounter(DecrementCounterRequest) returns (CounterOutcome);
}
