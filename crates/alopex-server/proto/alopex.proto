syntax = "proto3";

package alopex.v0;

message SqlRequest {
  string sql = 1;
  string session_id = 2;
}

message DdlRequest {
  string sql = 1;
  string session_id = 2;
}

message DmlRequest {
  string sql = 1;
  string session_id = 2;
}

message DdlResponse {
  bool success = 1;
}

message DmlResponse {
  uint64 affected_rows = 1;
}

message BeginRequest {}

message TransactionHandle {
  string session_id = 1;
  int64 expires_at_ms = 2;
}

message CommitResponse {
  bool success = 1;
}

message RollbackResponse {
  bool success = 1;
}

message VectorSearchRequest {
  string table = 1;
  repeated float vector = 2;
  uint32 k = 3;
  string index = 4;
  string column = 5;
}

message VectorSearchResult {
  uint64 id = 1;
  float distance = 2;
  Row row = 3;
}

message VectorSearchResponse {
  repeated VectorSearchResult results = 1;
}

message VectorUpsertRequest {
  string table = 1;
  uint64 id = 2;
  repeated float vector = 3;
  string column = 4;
}

message VectorUpsertResponse {
  bool success = 1;
}

message VectorDeleteRequest {
  string table = 1;
  uint64 id = 2;
  string column = 3;
}

message VectorDeleteResponse {
  bool success = 1;
}

message VectorIndexCreateRequest {
  string name = 1;
  string table = 2;
  string column = 3;
  string method = 4;
  map<string, string> options = 5;
  bool if_not_exists = 6;
}

message VectorIndexUpdateRequest {
  string name = 1;
  string table = 2;
  string column = 3;
  string method = 4;
  map<string, string> options = 5;
}

message VectorIndexDeleteRequest {
  string name = 1;
  bool if_exists = 2;
}

message VectorIndexCompactRequest {
  string name = 1;
}

message VectorIndexResponse {
  bool success = 1;
}

message HealthRequest {}

message HealthResponse {
  string status = 1;
}

// The canonical cluster snapshot is serialized with the same JSON schema as
// the HTTP admin surface. This preserves integer precision for fields such as
// update epochs without converting them through protobuf Struct numbers.
message ClusterStatusRequest {}

message ClusterStatusResponse {
  string cluster_json = 1;
}

message ClusterJoinRequest {}

message ClusterLeaveRequest {}

message ClusterOperationResponse {
  string action = 1;
  string cluster_json = 2;
  // Additive v0.9 lifecycle classification; fields 1-2 remain unchanged.
  string operation_id = 3;
  string state = 4;
  string reason_code = 5;
}

// Versioned CRDT wire identity. Optional bounds are represented explicitly so
// an empty boundary cannot be confused with an unbounded range edge.
message CrdtRangeIdentity {
  string cluster_id = 1;
  uint32 table_id = 2;
  string range_id = 3;
  bytes lower_bound = 4;
  bool has_lower_bound = 5;
  bytes upper_bound = 6;
  bool has_upper_bound = 7;
  uint64 schema_version = 8;
  uint64 data_epoch = 9;
}

message CreateCounterRequest {
  string object_id = 1;
  CrdtRangeIdentity range = 2;
  string request_id = 3;
  string operation_id = 4;
  uint64 update_version = 5;
  sint64 initial_value = 6;
}

message ReadCounterRequest {
  string object_id = 1;
  CrdtRangeIdentity range = 2;
  string request_id = 3;
  string operation_id = 4;
  uint64 update_version = 5;
}

message IncrementCounterRequest {
  string object_id = 1;
  CrdtRangeIdentity range = 2;
  string request_id = 3;
  string operation_id = 4;
  uint64 update_version = 5;
  sint64 delta = 6;
}

message DecrementCounterRequest {
  string object_id = 1;
  CrdtRangeIdentity range = 2;
  string request_id = 3;
  string operation_id = 4;
  uint64 update_version = 5;
  sint64 delta = 6;
}

message CreateSetRequest {
  string object_id = 1;
  CrdtRangeIdentity range = 2;
  string request_id = 3;
  string operation_id = 4;
  uint64 update_version = 5;
}

message ReadSetRequest {
  string object_id = 1;
  CrdtRangeIdentity range = 2;
  string request_id = 3;
  string operation_id = 4;
  uint64 update_version = 5;
}

message ListSetRequest {
  string object_id = 1;
  CrdtRangeIdentity range = 2;
  string request_id = 3;
  string operation_id = 4;
  uint64 update_version = 5;
}

message AddSetRequest {
  string object_id = 1;
  CrdtRangeIdentity range = 2;
  string request_id = 3;
  string operation_id = 4;
  uint64 update_version = 5;
  string member = 6;
}

message RemoveSetRequest {
  string object_id = 1;
  CrdtRangeIdentity range = 2;
  string request_id = 3;
  string operation_id = 4;
  uint64 update_version = 5;
  string member = 6;
}

message ContainsSetRequest {
  string object_id = 1;
  CrdtRangeIdentity range = 2;
  string request_id = 3;
  string operation_id = 4;
  uint64 update_version = 5;
  string member = 6;
}

// The flattened common contract mirrors the HTTP/embedded CrdtOutcome. A
// non-OK gRPC status carries this exact encoded message in Status.details.
message CounterOutcome {
  string object_type = 1;
  string object_id = 2;
  CrdtRangeIdentity range = 3;
  uint64 state_epoch = 4;
  string actor = 5;
  string request_id = 6;
  string operation_id = 7;
  string state = 8;
  string failure_class = 9;
  string routing_kind = 10;
  uint64 routing_metadata_version = 11;
  string routing_reason_code = 12;
  bool retryable = 13;
  string original_operation_id = 14;
  string original_request_id = 15;
  string first_outcome = 16;
  string first_state = 17;
  uint64 duplicate_count = 18;
  bool has_value = 19;
  sint64 initial_value = 20;
  sint64 accepted_delta_total = 21;
  sint64 value = 22;
  string value_unavailable = 23;
}

message SetMemberVersion {
  string member = 1;
  uint64 update_version = 2;
  string operation_id = 3;
  bool present = 4;
}

message SetOutcome {
  string object_type = 1;
  string object_id = 2;
  CrdtRangeIdentity range = 3;
  uint64 state_epoch = 4;
  string actor = 5;
  string request_id = 6;
  string operation_id = 7;
  string state = 8;
  string failure_class = 9;
  string routing_kind = 10;
  uint64 routing_metadata_version = 11;
  string routing_reason_code = 12;
  bool retryable = 13;
  string original_operation_id = 14;
  string original_request_id = 15;
  string first_outcome = 16;
  string first_state = 17;
  uint64 duplicate_count = 18;
  bool has_value = 19;
  repeated string members = 20;
  repeated SetMemberVersion member_versions = 21;
  string membership_unavailable = 22;
}

// v1 changefeed wire contract.  The contract version is explicit on every
// request and response so later wire additions cannot silently change the
// lifecycle semantics consumed by an older client.
message ChangefeedRetentionV1 {
  uint64 deadline_epoch = 1;
  bool has_deadline_epoch = 2;
  uint64 retained_through_position = 3;
  bool has_retained_through_position = 4;
}

message ChangefeedPlacementV1 {
  string owner_node = 1;
  repeated string replica_nodes = 2;
  string role = 3;
  string readiness = 4;
  uint64 placement_epoch = 5;
}

message ChangefeedFeedIdentityV1 {
  string feed_id = 1;
  CrdtRangeIdentity range = 2;
  uint64 generation = 3;
  ChangefeedPlacementV1 placement = 4;
  string ordering_scope = 5;
  ChangefeedRetentionV1 retention = 6;
  string status = 7;
}

message ChangefeedRoutingOutcomeV1 {
  string kind = 1;
  CrdtRangeIdentity range = 2;
  bool has_range = 3;
  uint64 metadata_version = 4;
  string reason_code = 5;
}

message ChangefeedIdempotencyResultV1 {
  string operation_id = 1;
  string request_id = 2;
  string first_outcome = 3;
  string state = 4;
  uint64 duplicate_count = 5;
}

message ChangefeedCheckpointV1 {
  string feed_id = 1;
  string range_id = 2;
  uint64 generation = 3;
  uint64 commit_position = 4;
  uint32 payload_ordinal = 5;
  uint64 epoch = 6;
  uint64 retention_deadline = 7;
  bool has_retention_deadline = 8;
}

message ChangefeedAckResultV1 {
  string ack_id = 1;
  string ack_state = 2;
  ChangefeedCheckpointV1 committed_checkpoint = 3;
  bool has_committed_checkpoint = 4;
  ChangefeedCheckpointV1 next_resume_position = 5;
  bool has_next_resume_position = 6;
  string operation_state = 7;
  string failure_class = 8;
  string reason_code = 9;
  bool retryable = 10;
  ChangefeedIdempotencyResultV1 idempotency = 11;
}

enum ChangefeedOperationTypeV1 {
  CHANGEFEED_OPERATION_TYPE_V1_UNSPECIFIED = 0;
  CHANGEFEED_OPERATION_TYPE_V1_INSERT = 1;
  CHANGEFEED_OPERATION_TYPE_V1_UPDATE = 2;
  CHANGEFEED_OPERATION_TYPE_V1_DELETE = 3;
  CHANGEFEED_OPERATION_TYPE_V1_SCHEMA = 4;
  CHANGEFEED_OPERATION_TYPE_V1_TOMBSTONE = 5;
}

message ChangefeedEventV1 {
  string event_id = 1;
  string feed_id = 2;
  CrdtRangeIdentity range = 3;
  uint64 generation = 4;
  string operation_id = 5;
  string request_id = 6;
  uint64 commit_position = 7;
  uint32 payload_ordinal = 8;
  ChangefeedOperationTypeV1 operation_type = 9;
  string key_or_hash = 10;
  bytes payload = 11;
  bool has_payload = 12;
  string payload_unavailable = 13;
  ChangefeedCheckpointV1 checkpoint = 14;
  string operation_state = 15;
  string failure_class = 16;
  string reason_code = 17;
  ChangefeedRoutingOutcomeV1 routing = 18;
  bool retryable = 19;
  ChangefeedIdempotencyResultV1 idempotency = 20;
}

message ChangefeedFeedResultV1 {}

message ChangefeedOutcomeV1 {
  uint32 contract_version = 1;
  ChangefeedFeedIdentityV1 feed = 2;
  string operation_id = 3;
  string request_id = 4;
  string operation_state = 5;
  string failure_class = 6;
  string reason_code = 7;
  ChangefeedRoutingOutcomeV1 routing = 8;
  bool retryable = 9;
  ChangefeedIdempotencyResultV1 idempotency = 10;
  // Exactly one typed result field is populated, selected by result_type.
  // This avoids a generated Rust oneof enum large enough to obscure the
  // canonical response payload in memory while retaining typed wire fields.
  string result_type = 11;
  ChangefeedFeedResultV1 feed_result = 12;
  ChangefeedEventV1 event = 13;
  ChangefeedAckResultV1 ack = 14;
  string correlation_id = 15;
}

message ChangefeedDeliveryV1 {
  uint32 contract_version = 1;
  ChangefeedOutcomeV1 outcome = 2;
  repeated ChangefeedEventV1 events = 3;
  string correlation_id = 4;
}

message CreateChangefeedRequestV1 {
  uint32 contract_version = 1;
  string request_id = 2;
  string tenant = 3;
  string actor = 4;
  oneof target {
    string table = 5;
    string range_id = 6;
  }
  ChangefeedRetentionV1 retention = 7;
  repeated ChangefeedOperationTypeV1 change_kinds = 8;
}

message SubscribeChangefeedRequestV1 {
  uint32 contract_version = 1;
  string feed_id = 2;
  string request_id = 3;
  uint64 expected_generation = 4;
  uint64 expected_epoch = 5;
}

message DeliveryChangefeedRequestV1 {
  uint32 contract_version = 1;
  string feed_id = 2;
  string request_id = 3;
  uint32 max_events = 4;
  uint64 deadline_epoch = 5;
}

message AckChangefeedRequestV1 {
  uint32 contract_version = 1;
  string feed_id = 2;
  string request_id = 3;
  string ack_id = 4;
  string checkpoint = 5;
}

message ResumeChangefeedRequestV1 {
  uint32 contract_version = 1;
  string feed_id = 2;
  string request_id = 3;
  string checkpoint = 4;
}

message LifecycleChangefeedRequestV1 {
  uint32 contract_version = 1;
  string feed_id = 2;
  string request_id = 3;
}

message ChangefeedStreamItemV1 {
  uint32 contract_version = 1;
  string correlation_id = 2;
  // Exactly one typed item field is populated, selected by item_type.
  string item_type = 3;
  ChangefeedEventV1 event = 4;
  ChangefeedOutcomeV1 outcome = 5;
}

message Vector {
  repeated float values = 1;
}

message Value {
  oneof kind {
    int32 int_value = 1;
    int64 bigint_value = 2;
    float float_value = 3;
    double double_value = 4;
    string text_value = 5;
    bytes blob_value = 6;
    bool bool_value = 7;
    int64 timestamp_value = 8;
    Vector vector_value = 9;
  }
}

message Row {
  repeated Value values = 1;
}

message SqlColumn {
  string name = 1;
  string data_type = 2;
}

message SqlResultSet {
  repeated SqlColumn columns = 1;
  repeated Row rows = 2;
  uint64 affected_rows = 3;
  bool has_affected_rows = 4;
  bool success = 5;
}

service AlopexService {
  rpc ExecuteSql(SqlRequest) returns (stream SqlResultSet);
  rpc ExecuteDdl(DdlRequest) returns (DdlResponse);
  rpc ExecuteDml(DmlRequest) returns (DmlResponse);
  rpc BeginTransaction(BeginRequest) returns (TransactionHandle);
  rpc CommitTransaction(TransactionHandle) returns (CommitResponse);
  rpc RollbackTransaction(TransactionHandle) returns (RollbackResponse);
  rpc VectorSearch(VectorSearchRequest) returns (VectorSearchResponse);
  rpc VectorUpsert(VectorUpsertRequest) returns (VectorUpsertResponse);
  rpc VectorDelete(VectorDeleteRequest) returns (VectorDeleteResponse);
  rpc VectorIndexCreate(VectorIndexCreateRequest) returns (VectorIndexResponse);
  rpc VectorIndexUpdate(VectorIndexUpdateRequest) returns (VectorIndexResponse);
  rpc VectorIndexDelete(VectorIndexDeleteRequest) returns (VectorIndexResponse);
  rpc VectorIndexCompact(VectorIndexCompactRequest) returns (VectorIndexResponse);
  rpc Health(HealthRequest) returns (HealthResponse);
  rpc ClusterStatus(ClusterStatusRequest) returns (ClusterStatusResponse);
  rpc ClusterJoin(ClusterJoinRequest) returns (ClusterOperationResponse);
  rpc ClusterLeave(ClusterLeaveRequest) returns (ClusterOperationResponse);
  rpc CreateCounter(CreateCounterRequest) returns (CounterOutcome);
  rpc ReadCounter(ReadCounterRequest) returns (CounterOutcome);
  rpc IncrementCounter(IncrementCounterRequest) returns (CounterOutcome);
  rpc DecrementCounter(DecrementCounterRequest) returns (CounterOutcome);
  rpc CreateSet(CreateSetRequest) returns (SetOutcome);
  rpc ReadSet(ReadSetRequest) returns (SetOutcome);
  rpc ListSet(ListSetRequest) returns (SetOutcome);
  rpc AddSet(AddSetRequest) returns (SetOutcome);
  rpc RemoveSet(RemoveSetRequest) returns (SetOutcome);
  rpc ContainsSet(ContainsSetRequest) returns (SetOutcome);
  rpc CreateChangefeed(CreateChangefeedRequestV1) returns (ChangefeedOutcomeV1);
  rpc SubscribeChangefeed(SubscribeChangefeedRequestV1) returns (ChangefeedOutcomeV1);
  rpc PollChangefeed(DeliveryChangefeedRequestV1) returns (ChangefeedDeliveryV1);
  rpc StreamChangefeed(DeliveryChangefeedRequestV1) returns (stream ChangefeedStreamItemV1);
  rpc AckChangefeed(AckChangefeedRequestV1) returns (ChangefeedOutcomeV1);
  rpc ResumeChangefeed(ResumeChangefeedRequestV1) returns (ChangefeedDeliveryV1);
  rpc CancelChangefeed(LifecycleChangefeedRequestV1) returns (ChangefeedOutcomeV1);
  rpc CloseChangefeed(LifecycleChangefeedRequestV1) returns (ChangefeedOutcomeV1);
}
