[package]
name = "alopex-cluster"
version.workspace = true
edition = "2024"  # Uses let chains feature
license.workspace = true
repository.workspace = true
description = "Distributed cluster coordination for Alopex DB"
keywords = ["database", "cluster", "distributed"]
categories = ["database-implementations"]

[features]
default = []
lane_ci = []
# Enables the complete Chirps adapter surface.  A enabled feature is necessary,
# but not sufficient, for multi-node cluster control: runtime bootstrap also
# verifies the authenticated dispatcher and durable storage prerequisites.
chirps = [
    "dep:alopex-chirps",
    "dep:alopex-chirps-core",
    "dep:alopex-chirps-gossip-swim",
    "dep:alopex-chirps-raft-storage",
    "dep:alopex-chirps-transport-quic",
]

[dependencies]
alopex-core.workspace = true
alopex-sql.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror.workspace = true
sha2 = "0.10"
unicode-normalization = "0.1"

# All Chirps dependencies are optional so the default embedded/single-node
# build neither requires nor advertises cluster control.
alopex-chirps = { version = "0.5.1", path = "../../../../chirps/crates/alopex-chirps", optional = true }
alopex-chirps-core = { version = "0.5.1", path = "../../../../chirps/crates/chirps-core", optional = true }
alopex-chirps-gossip-swim = { version = "0.5.1", path = "../../../../chirps/crates/chirps-gossip-swim", optional = true }
alopex-chirps-raft-storage = { version = "0.5.1", path = "../../../../chirps/crates/chirps-raft-storage", optional = true }
alopex-chirps-transport-quic = { version = "0.5.1", path = "../../../../chirps/crates/chirps-transport-quic", optional = true }
