[package]
name = "alopex-cluster"
version.workspace = true
edition = "2024"  # Uses let chains feature
license.workspace = true
repository.workspace = true
description = "Distributed cluster coordination for Alopex DB"
keywords = ["database", "cluster", "distributed"]
categories = ["database-implementations"]

[features]
default = []
lane_ci = []
# Enables the complete Chirps adapter surface.  A enabled feature is necessary,
# but not sufficient, for multi-node cluster control: runtime bootstrap also
# verifies the authenticated dispatcher and durable storage prerequisites.
chirps = [
    "dep:alopex-chirps",
    "dep:alopex-chirps-core",
    "dep:alopex-chirps-gossip-swim",
    "dep:alopex-chirps-raft-storage",
    "dep:alopex-chirps-transport-quic",
]

[dependencies]
alopex-core.workspace = true
alopex-sql.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror.workspace = true
sha2 = "0.10"

# All Chirps dependencies are optional so the default embedded/single-node
# build neither requires nor advertises cluster control.
#
# Taken from crates.io rather than a sibling checkout. A path dependency made
# the build depend on whichever branch the neighbouring working tree happened
# to be on, so an unrelated in-progress change there could add a dependency
# this workspace's lock file did not know about.
alopex-chirps = { version = "0.5.1", optional = true }
alopex-chirps-core = { version = "0.5.1", optional = true }
alopex-chirps-gossip-swim = { version = "0.5.1", optional = true }
alopex-chirps-raft-storage = { version = "0.5.1", optional = true }
alopex-chirps-transport-quic = { version = "0.5.1", optional = true }
