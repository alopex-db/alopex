[package]
name = "alopex-embedded"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Embedded database interface for Alopex DB"
keywords = ["database", "embedded"]
categories = ["database-implementations"]

[features]
default = []
s3 = ["alopex-core/s3", "tokio", "object_store", "bytes", "futures", "url"]

lane_ci = []
[dependencies]
alopex-cluster.workspace = true
alopex-core.workspace = true
alopex-sql.workspace = true
alopex-dataframe.workspace = true
arrow = "53"
thiserror = "1.0"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = "0.10"
tokio = { workspace = true, optional = true }
object_store = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
url = { workspace = true, optional = true }

[dev-dependencies]
tempfile = "3.8"
criterion = { workspace = true }
rand = { workspace = true }
bincode = "1.3"
crc32fast = "1.4"

[[bench]]
name = "memory_vs_disk"
harness = false

[[bench]]
name = "in_memory"
harness = false
