[package]
name = "alopex-sql"
version.workspace = true
edition = "2024"  # Uses let chains feature
license.workspace = true
repository.workspace = true
description = "SQL parser components for the Alopex DB dialect"
keywords = ["database", "sql", "parser"]
categories = ["database-implementations", "parser-implementations"]
# SQL パーサーは Nim で実装され、事前ビルド済み静的ライブラリ
# (nim-sql-parser/vendor/<target-triple>/) を通じて FFI 経由で呼び出す。
# 公開 crate には vendor/ のビルド成果物のみを同梱し、Nim ツールチェーンを
# 必要とする .nim ソース・nimble 定義・開発用 Dockerfile は含めない。Python
# wheel用の共有ライブラリも同じtarget assetに保持する。
# (cargo install/build する側に Nim 環境を要求しないため。build.rs 参照)。
exclude = [
    "nim-sql-parser/src",
    "nim-sql-parser/tests",
    "nim-sql-parser/.devcontainer",
    "nim-sql-parser/Dockerfile",
    "nim-sql-parser/nim_sql_parser.nimble",
    "nim-sql-parser/.gitignore",
    "nim-sql-parser/CONTRACT_VERSION",
    "nim-sql-parser/SHA256SUMS",
]

[features]
default = []
async = ["alopex-core/async", "dep:futures"]
tokio = ["async", "alopex-core/tokio", "dep:tokio"]

lane_ci = []
lane_fuzz = []
# Forward-compatible table-function coverage kept out of the v0.8.9 gate.
generate_series = []
[dependencies]
thiserror = "2.0"
regex = "1.11"
rand.workspace = true
base64 = "0.22"
hex = "0.4"
md-5 = "0.10"
sha2 = "0.10"
uuid.workspace = true
chrono = { version = "0.4", default-features = false, features = ["std"] }
alopex-core.workspace = true
parquet = { version = "53", features = ["arrow"] }
arrow-array = "53"
arrow-schema = "53"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
rmp-serde = "1.3"
bincode = "1.3"
futures-core = { workspace = true }
tokio = { workspace = true, optional = true, features = ["rt-multi-thread", "sync"] }
futures = { workspace = true, optional = true }

[build-dependencies]
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"

[dev-dependencies]
proptest = "1.4"
criterion = "0.5"
rusqlite = { version = "0.31", features = ["bundled"] }
tempfile = "3.10"
serde_json.workspace = true

[[bench]]
name = "key_encoding"
harness = false

[[test]]
name = "build_support"
path = "build_support.rs"

[[bench]]
name = "storage_bench"
harness = false

[[bench]]
name = "storage_macro_bench"
harness = false

[[bench]]
name = "knn_rowid"
harness = false

[[bench]]
name = "group_by_bench"
harness = false

[[bench]]
name = "aggregate_parallel_bench"
harness = false

[[bench]]
name = "parser_exec_bench"
harness = false

[[bench]]
name = "scalar_registry_bench"
harness = false

[[bench]]
name = "name_resolution_bench"
harness = false
