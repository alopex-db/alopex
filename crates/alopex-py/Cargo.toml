[package]
name = "alopex-py"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Python bindings for Alopex DB"
keywords = ["database", "python", "bindings"]
categories = ["database-implementations", "api-bindings"]
build = "build.rs"

[lib]
name = "_alopex"
# Keep the extension artifact for maturin and an rlib for Rust's unit-test harness.
# A cdylib-only target compiles `#[cfg(test)]` code but does not execute it under
# `cargo test`, which would leave the binding's lifecycle tests unverified.
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.29.0", features = ["abi3-py38", "extension-module"] }
numpy = "0.29.0"
alopex-core.workspace = true
alopex-cluster.workspace = true
alopex-dataframe.workspace = true
alopex-embedded.workspace = true
alopex-sql.workspace = true
arrow = "53"

[build-dependencies]
pyo3-build-config = "0.29.0"

[dev-dependencies]
criterion = { workspace = true }
ctor = "0.4"
proptest = "1"
tempfile = "3"

[features]
default = []
lane_ci = []
[[bench]]
name = "binding_overhead"
harness = false
