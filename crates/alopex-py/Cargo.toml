[package]
name = "alopex-py"
version = "0.7.7"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Python bindings for Alopex DB"
keywords = ["database", "python", "bindings"]
categories = ["database-implementations", "api-bindings"]
build = "build.rs"

[lib]
name = "_alopex"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29.0", features = ["abi3-py38", "extension-module"] }
numpy = "0.29.0"
alopex-core.workspace = true
alopex-cluster.workspace = true
alopex-dataframe.workspace = true
alopex-embedded = { path = "../alopex-embedded" }
alopex-sql.workspace = true
arrow = "53"

[build-dependencies]
pyo3-build-config = "0.29.0"

[dev-dependencies]
criterion = { workspace = true }
proptest = "1"

[features]
default = []
lane_ci = []
[[bench]]
name = "binding_overhead"
harness = false
