[build-system]
requires = ["maturin>=1.4,<2.0"]
build-backend = "maturin"

[project]
name = "alopex"
dynamic = ["version"]
description = "Python bindings for Alopex DB"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "Apache-2.0"}
keywords = ["database", "vector", "bindings"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Rust",
  "License :: OSI Approved :: Apache Software License",
]

dependencies = []

[project.optional-dependencies]
numpy = ["numpy>=1.20"]
polars = ["polars>=0.20"]
full = ["numpy>=1.20", "polars>=0.20"]
dev = ["pytest>=7", "pytest-benchmark>=4", "numpy>=1.20", "polars>=0.20"]

[tool.maturin]
bindings = "pyo3"
module-name = "alopex._alopex"
python-source = "python"
features = ["pyo3/extension-module"]
# Core-release parser libraries and their contract sidecars are staged under
# the package-local directory for every wheel target. Maturin includes them in
# wheels only; sdists remain source-only and cannot silently carry reviewed
# native bytes.
include = [{ path = "python/alopex/native/*", format = "wheel" }]
# Native parser files used to build wheels are not part of the source
# distribution.  The sdist is source-only; wheels receive the reviewed,
# target-specific bytes staged by the release workflow.
exclude = [{ path = "../alopex-sql/nim-sql-parser/vendor/**/*", format = "sdist" }]
