name: Stress Tests

on:
  workflow_dispatch:
    inputs:
      fuzz_seconds:
        description: "Seconds per fuzz target"
        required: false
        default: "600"
  schedule:
    - cron: "0 2 * * *"
    - cron: "0 3 * * 0"

env:
  NIM_SQL_PARSER_DIR: crates/alopex-sql/nim-sql-parser
  ALOPEX_NIM_PARSER_ALLOW_LOCAL_BUILD: "1"
  NIM_SQL_PARSER_LIB_DIR: ${{ github.workspace }}/crates/alopex-sql/nim-sql-parser

jobs:
  stress-tests:
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: stable
    timeout-minutes: 30
    steps:
      - &monitored_checkout
        name: Monitored exact-source checkout
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          umask 077
          exec 3>&1 4>&2
          private_log="$(mktemp "${RUNNER_TEMP}/stress-bootstrap-log.XXXXXX" 2>/dev/null)" || { printf 'STRESS_MONITORED_CHECKOUT_REJECTED\n' >&4; exit 1; }
          if ! exec 5>"${private_log}" 2>/dev/null; then printf 'STRESS_MONITORED_CHECKOUT_REJECTED\n' >&4; exit 1; fi
          exec 1>&5 2>&5
          trap 'status=$?; if [ "$status" -ne 0 ]; then printf "STRESS_MONITORED_CHECKOUT_REJECTED\n" >&4; fi' EXIT
          python3 - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          import re
          from urllib.parse import urlparse
          from urllib.request import urlopen

          source = os.environ["GITHUB_SHA"]
          assert re.fullmatch(r"[0-9a-f]{40}", source)
          url = f"https://raw.githubusercontent.com/alopex-db/alopex/{source}/scripts/ci/stress_monitored_checkout.py"
          with urlopen(url, timeout=60) as response:
              resolved = urlparse(response.geturl())
              assert resolved.scheme == "https" and resolved.hostname == "raw.githubusercontent.com"
              body = response.read(100_001)
          assert 0 < len(body) <= 100_000
          assert hashlib.sha256(body).hexdigest() == "be96a2e4a82edf48daadce01d0f1124601fa3f01e72e3c617f64e201092e78b5"
          destination = Path(os.environ["RUNNER_TEMP"]) / "stress-monitored-checkout.py"
          with destination.open("xb") as stream:
              stream.write(body)
          PY
          python3 "${RUNNER_TEMP}/stress-monitored-checkout.py"
          printf 'RUNNER_ENVIRONMENT=github-hosted\nCARGO_TARGET_DIR=%s/target\n' "${GITHUB_WORKSPACE}" >> "${GITHUB_ENV}"
          printf 'STRESS_MONITORED_CHECKOUT_OK\n' >&3

      - name: Install stable Rust under storage guard
        run: python3 scripts/ci/stress_guarded_command.py --case stress --phase toolchain -- rustup toolchain install stable --profile minimal

      - name: Build Nim SQL parser library
        if: runner.os == 'Linux'
        run: python3 scripts/ci/stress_guarded_command.py --case stress --phase parser -- bash scripts/build-nim-parser.sh --backend docker
      - name: Run stress tests (short)
        env:
          RUST_BACKTRACE: 1
          STRESS_TEST_TIMEOUT: 120
          STRESS_REPORT_DIR: target/stress-reports # set empty string to skip artifact upload
          LD_LIBRARY_PATH: ${{ github.workspace }}/${{ env.NIM_SQL_PARSER_DIR }}:${{ env.LD_LIBRARY_PATH }}
        run: python3 scripts/ci/stress_guarded_command.py --case stress --phase test -- cargo test --features test-hooks,lane_ci --test 'stress_*' -- --test-threads=1

      - name: Upload stress reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: stress-reports
          path: target/stress-reports
          if-no-files-found: ignore

  sanitizer-lane:
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ${{ matrix.os }}
    env:
      RUSTUP_TOOLCHAIN: nightly
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            sanitizer: asan
          - os: ubuntu-latest
            sanitizer: tsan
          - os: ubuntu-latest
            sanitizer: lsan
          - os: ubuntu-latest
            sanitizer: msan
    steps:
      - *monitored_checkout

      - name: Install nightly Rust under storage guard
        env:
          STRESS_CASE_ID: ${{ matrix.sanitizer }}
        run: python3 scripts/ci/stress_guarded_command.py --case "${STRESS_CASE_ID}" --phase toolchain -- rustup toolchain install nightly --profile minimal --component rust-src

      - name: Build Nim SQL parser library
        if: runner.os == 'Linux'
        env:
          STRESS_CASE_ID: ${{ matrix.sanitizer }}
        run: python3 scripts/ci/stress_guarded_command.py --case "${STRESS_CASE_ID}" --phase parser -- bash scripts/build-nim-parser.sh --backend docker
      # macOS/Windows ランナーは docker で Linux コンテナを動かせないため、
      # ネイティブ Nim ツールチェーン (2.2 固定) をセットアップして共有ライブラリを生成する。
      # 要 CI 検証: macOS/Windows ランナー上でのみ動作確認可能（ローカル検証不可）。
      - name: Setup Nim (macOS/Windows)
        if: runner.os != 'Linux'
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: '2.2.x'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build Nim SQL parser library (macOS/Windows)
        if: runner.os != 'Linux'
        shell: bash
        run: bash scripts/build-nim-parser.sh --backend host
      - name: Run sanitizer lane
        env:
          STRESS_CASE_ID: ${{ matrix.sanitizer }}
          RUST_BACKTRACE: 1
          STRESS_REPORT_DIR: target/stress-reports/${{ matrix.sanitizer }}
          STRESS_ARTIFACTS_DIR: target/stress-artifacts/${{ matrix.sanitizer }}
          LD_LIBRARY_PATH: ${{ github.workspace }}/${{ env.NIM_SQL_PARSER_DIR }}:${{ env.LD_LIBRARY_PATH }}
        run: python3 scripts/ci/stress_guarded_command.py --case "${STRESS_CASE_ID}" --phase test -- ./scripts/run-sanitizer-lane.sh "${STRESS_CASE_ID}"

      - name: Upload sanitizer reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: sanitizer-${{ matrix.os }}-${{ matrix.sanitizer }}-reports
          path: target/stress-reports/${{ matrix.sanitizer }}
          if-no-files-found: ignore

      - name: Upload sanitizer artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: sanitizer-${{ matrix.os }}-${{ matrix.sanitizer }}-artifacts
          path: target/stress-artifacts/${{ matrix.sanitizer }}
          if-no-files-found: ignore

  fuzz-lane:
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: nightly
    timeout-minutes: 2880
    steps:
      - *monitored_checkout

      - name: Install nightly Rust under storage guard
        run: python3 scripts/ci/stress_guarded_command.py --case sql_parser --phase toolchain -- rustup toolchain install nightly --profile minimal

      - name: Build Nim SQL parser library
        if: runner.os == 'Linux'
        run: python3 scripts/ci/stress_guarded_command.py --case sql_parser --phase parser -- bash scripts/build-nim-parser.sh --backend docker
      - name: Install cargo-fuzz
        run: python3 scripts/ci/stress_guarded_command.py --case sql_parser --phase fuzz_install -- cargo install cargo-fuzz --locked

      - name: Run SQL fuzz target
        env:
          STRESS_REPORT_DIR: target/stress-reports/fuzz/sql_parser
          FUZZ_MAX_TOTAL_TIME: ${{ github.event.inputs.fuzz_seconds || '600' }}
          ASAN_OPTIONS: detect_odr_violation=0:detect_leaks=0
          LD_LIBRARY_PATH: ${{ github.workspace }}/${{ env.NIM_SQL_PARSER_DIR }}:${{ env.LD_LIBRARY_PATH }}
        run: |
          export STRESS_REPORT_DIR="${GITHUB_WORKSPACE}/${STRESS_REPORT_DIR}"
          python3 scripts/ci/stress_guarded_command.py --case sql_parser --phase test -- \
            bash -c 'cd crates/alopex-sql/fuzz && cargo fuzz run sql_parser -- -max_total_time="${FUZZ_MAX_TOTAL_TIME}"'

      - name: Run DataFrame fuzz target
        env:
          STRESS_REPORT_DIR: target/stress-reports/fuzz/dataframe_conversion
          FUZZ_MAX_TOTAL_TIME: ${{ github.event.inputs.fuzz_seconds || '600' }}
          ASAN_OPTIONS: detect_odr_violation=0:detect_leaks=0
          LD_LIBRARY_PATH: ${{ github.workspace }}/${{ env.NIM_SQL_PARSER_DIR }}:${{ env.LD_LIBRARY_PATH }}
        run: |
          export STRESS_REPORT_DIR="${GITHUB_WORKSPACE}/${STRESS_REPORT_DIR}"
          python3 scripts/ci/stress_guarded_command.py --case dataframe_conversion --phase test -- \
            bash -c 'cd crates/alopex-dataframe/fuzz && cargo fuzz run dataframe_conversion -- -max_total_time="${FUZZ_MAX_TOTAL_TIME}"'

      - name: Upload fuzz reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-reports
          path: target/stress-reports/fuzz
          if-no-files-found: ignore

  perf-lane:
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: stable
    timeout-minutes: 90
    steps:
      - *monitored_checkout

      - name: Install stable Rust under storage guard
        run: python3 scripts/ci/stress_guarded_command.py --case perf --phase toolchain -- rustup toolchain install stable --profile minimal

      - name: Download latest perf baselines
        id: perf-baseline
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          mkdir -p "${GITHUB_WORKSPACE}/target/stress-baselines"
          found=false
          for run_id in $(gh run list --workflow stress-tests.yml --event schedule --status success --limit 20 --json databaseId -q '.[].databaseId'); do
            if [ "$run_id" = "$GITHUB_RUN_ID" ]; then
              continue
            fi
            if gh run download "$run_id" -n perf-baselines -D "${GITHUB_WORKSPACE}/target/stress-baselines"; then
              found=true
              echo "Downloaded perf baseline artifact from run ${run_id}."
              break
            fi
          done

          if [ "$found" != "true" ]; then
            echo "No completed scheduled perf baseline artifact found; this run will seed baselines."
          fi
          echo "found=${found}" >> "$GITHUB_OUTPUT"

      - name: Build Nim SQL parser library
        if: runner.os == 'Linux'
        run: python3 scripts/ci/stress_guarded_command.py --case perf --phase parser -- bash scripts/build-nim-parser.sh --backend docker
      - name: Run perf baseline checks
        env:
          RUST_BACKTRACE: 1
          STRESS_BASELINE_REQUIRED: ${{ steps.perf-baseline.outputs.found == 'true' && 'true' || 'false' }}
          STRESS_BASELINE_UPDATE: ${{ steps.perf-baseline.outputs.found == 'true' && 'false' || 'true' }}
          STRESS_BASELINE_DIR: ${{ github.workspace }}/target/stress-baselines
          STRESS_REPORT_DIR: ${{ github.workspace }}/target/stress-reports/perf
          STRESS_ARTIFACTS_DIR: ${{ github.workspace }}/target/stress-artifacts/perf
          LD_LIBRARY_PATH: ${{ github.workspace }}/${{ env.NIM_SQL_PARSER_DIR }}:${{ env.LD_LIBRARY_PATH }}
        run: python3 scripts/ci/stress_guarded_command.py --case perf --phase test -- cargo test -p alopex-core --features lane_perf --test stress_perf_baseline -- --test-threads=1

      - name: Inspect perf outputs
        if: ${{ always() }}
        run: |
          set -euo pipefail
          for dir in \
            "${GITHUB_WORKSPACE}/target/stress-baselines" \
            "${GITHUB_WORKSPACE}/target/stress-reports" \
            "${GITHUB_WORKSPACE}/target/stress-artifacts"; do
            echo "::group::${dir}"
            if [ -d "$dir" ]; then
              find "$dir" -maxdepth 6 -type f -print | sort
            else
              echo "missing"
            fi
            echo "::endgroup::"
          done

      - name: Upload perf reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: perf-reports
          path: ${{ github.workspace }}/target/stress-reports
          if-no-files-found: ignore

      - name: Upload perf artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: perf-artifacts
          path: ${{ github.workspace }}/target/stress-artifacts
          if-no-files-found: ignore

      - name: Upload perf baselines
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: perf-baselines
          path: ${{ github.workspace }}/target/stress-baselines
          if-no-files-found: ignore
