name: Stress Tests

on:
  pull_request:
  workflow_dispatch:
    inputs:
      fuzz_seconds:
        description: "Seconds per fuzz target"
        required: false
        default: "600"
  schedule:
    - cron: "0 2 * * *"
    - cron: "0 3 * * 0"

env:
  NIM_SQL_PARSER_DIR: crates/alopex-sql/nim-sql-parser

jobs:
  stress-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
          profile: minimal

      - name: Build Nim SQL parser library
        if: runner.os == 'Linux'
        run: |
          docker run --rm \
            -v "$PWD":/workspace \
            -w "/workspace/${NIM_SQL_PARSER_DIR}" \
            -e PATH=/opt/nim/bin:/usr/local/bin:/usr/bin:/bin \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            nimlang/nim:2.2 \
            sh -c 'nimble install -y npeg msgpack4nim && nimble lib'
      - name: Run stress tests (short)
        env:
          RUST_BACKTRACE: 1
          STRESS_TEST_TIMEOUT: 120
          STRESS_REPORT_DIR: target/stress-reports # set empty string to skip artifact upload
          LD_LIBRARY_PATH: ${{ github.workspace }}/${{ env.NIM_SQL_PARSER_DIR }}:${{ env.LD_LIBRARY_PATH }}
        run: |
          cargo test --features test-hooks,lane_ci --test stress_* -- --test-threads=1

      - name: Upload stress reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: stress-reports
          path: target/stress-reports
          if-no-files-found: ignore

  sanitizer-lane:
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            sanitizer: asan
          - os: ubuntu-latest
            sanitizer: tsan
          - os: ubuntu-latest
            sanitizer: lsan
          - os: ubuntu-latest
            sanitizer: msan
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust (nightly)
        uses: actions-rs/toolchain@v1
        with:
          toolchain: nightly
          override: true
          profile: minimal
          components: rust-src

      - name: Build Nim SQL parser library
        if: runner.os == 'Linux'
        run: |
          docker run --rm \
            -v "$PWD":/workspace \
            -w "/workspace/${NIM_SQL_PARSER_DIR}" \
            -e PATH=/opt/nim/bin:/usr/local/bin:/usr/bin:/bin \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            nimlang/nim:2.2 \
            sh -c 'nimble install -y npeg msgpack4nim && nimble lib'
      # macOS/Windows ランナーは docker で Linux コンテナを動かせないため、
      # ネイティブ Nim ツールチェーン (2.2 固定) をセットアップして共有ライブラリを生成する。
      # 要 CI 検証: macOS/Windows ランナー上でのみ動作確認可能（ローカル検証不可）。
      - name: Setup Nim (macOS/Windows)
        if: runner.os != 'Linux'
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: '2.2.x'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build Nim SQL parser library (macOS/Windows)
        if: runner.os != 'Linux'
        shell: bash
        run: |
          cd "${NIM_SQL_PARSER_DIR}"
          nimble install -y npeg msgpack4nim
          nimble lib
      - name: Run sanitizer lane
        env:
          RUST_BACKTRACE: 1
          STRESS_REPORT_DIR: target/stress-reports/${{ matrix.sanitizer }}
          STRESS_ARTIFACTS_DIR: target/stress-artifacts/${{ matrix.sanitizer }}
          LD_LIBRARY_PATH: ${{ github.workspace }}/${{ env.NIM_SQL_PARSER_DIR }}:${{ env.LD_LIBRARY_PATH }}
        run: |
          ./scripts/run-sanitizer-lane.sh ${{ matrix.sanitizer }}

      - name: Upload sanitizer reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: sanitizer-${{ matrix.os }}-${{ matrix.sanitizer }}-reports
          path: target/stress-reports/${{ matrix.sanitizer }}
          if-no-files-found: ignore

      - name: Upload sanitizer artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: sanitizer-${{ matrix.os }}-${{ matrix.sanitizer }}-artifacts
          path: target/stress-artifacts/${{ matrix.sanitizer }}
          if-no-files-found: ignore

  fuzz-lane:
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2880
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust (nightly)
        uses: actions-rs/toolchain@v1
        with:
          toolchain: nightly
          override: true
          profile: minimal

      - name: Build Nim SQL parser library
        if: runner.os == 'Linux'
        run: |
          docker run --rm \
            -v "$PWD":/workspace \
            -w "/workspace/${NIM_SQL_PARSER_DIR}" \
            -e PATH=/opt/nim/bin:/usr/local/bin:/usr/bin:/bin \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            nimlang/nim:2.2 \
            sh -c 'nimble install -y npeg msgpack4nim && nimble lib'
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Run SQL fuzz target
        env:
          STRESS_REPORT_DIR: target/stress-reports/fuzz/sql_parser
          FUZZ_MAX_TOTAL_TIME: ${{ github.event.inputs.fuzz_seconds || '600' }}
          ASAN_OPTIONS: detect_odr_violation=0:detect_leaks=0
          LD_LIBRARY_PATH: ${{ github.workspace }}/${{ env.NIM_SQL_PARSER_DIR }}:${{ env.LD_LIBRARY_PATH }}
        run: |
          cd crates/alopex-sql/fuzz
          export STRESS_REPORT_DIR="${GITHUB_WORKSPACE}/${STRESS_REPORT_DIR}"
          cargo fuzz run sql_parser -- -max_total_time="${FUZZ_MAX_TOTAL_TIME}"

      - name: Run DataFrame fuzz target
        env:
          STRESS_REPORT_DIR: target/stress-reports/fuzz/dataframe_conversion
          FUZZ_MAX_TOTAL_TIME: ${{ github.event.inputs.fuzz_seconds || '600' }}
          ASAN_OPTIONS: detect_odr_violation=0:detect_leaks=0
          LD_LIBRARY_PATH: ${{ github.workspace }}/${{ env.NIM_SQL_PARSER_DIR }}:${{ env.LD_LIBRARY_PATH }}
        run: |
          cd crates/alopex-dataframe/fuzz
          export STRESS_REPORT_DIR="${GITHUB_WORKSPACE}/${STRESS_REPORT_DIR}"
          cargo fuzz run dataframe_conversion -- -max_total_time="${FUZZ_MAX_TOTAL_TIME}"

      - name: Upload fuzz reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-reports
          path: target/stress-reports/fuzz
          if-no-files-found: ignore

  perf-lane:
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
          profile: minimal

      - name: Download latest perf baselines
        id: perf-baseline
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          mkdir -p "${GITHUB_WORKSPACE}/target/stress-baselines"
          found=false
          for run_id in $(gh run list --workflow stress-tests.yml --event schedule --status success --limit 20 --json databaseId -q '.[].databaseId'); do
            if [ "$run_id" = "$GITHUB_RUN_ID" ]; then
              continue
            fi
            if gh run download "$run_id" -n perf-baselines -D "${GITHUB_WORKSPACE}/target/stress-baselines"; then
              found=true
              echo "Downloaded perf baseline artifact from run ${run_id}."
              break
            fi
          done

          if [ "$found" != "true" ]; then
            echo "No completed scheduled perf baseline artifact found; this run will seed baselines."
          fi
          echo "found=${found}" >> "$GITHUB_OUTPUT"

      - name: Build Nim SQL parser library
        if: runner.os == 'Linux'
        run: |
          docker run --rm \
            -v "$PWD":/workspace \
            -w "/workspace/${NIM_SQL_PARSER_DIR}" \
            -e PATH=/opt/nim/bin:/usr/local/bin:/usr/bin:/bin \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            nimlang/nim:2.2 \
            sh -c 'nimble install -y npeg msgpack4nim && nimble lib'
      - name: Run perf baseline checks
        env:
          RUST_BACKTRACE: 1
          STRESS_BASELINE_REQUIRED: ${{ steps.perf-baseline.outputs.found == 'true' && 'true' || 'false' }}
          STRESS_BASELINE_UPDATE: ${{ steps.perf-baseline.outputs.found == 'true' && 'false' || 'true' }}
          STRESS_BASELINE_DIR: ${{ github.workspace }}/target/stress-baselines
          STRESS_REPORT_DIR: ${{ github.workspace }}/target/stress-reports/perf
          STRESS_ARTIFACTS_DIR: ${{ github.workspace }}/target/stress-artifacts/perf
          LD_LIBRARY_PATH: ${{ github.workspace }}/${{ env.NIM_SQL_PARSER_DIR }}:${{ env.LD_LIBRARY_PATH }}
        run: |
          cargo test -p alopex-core --features lane_perf --test stress_perf_baseline -- --test-threads=1

      - name: Inspect perf outputs
        if: ${{ always() }}
        run: |
          set -euo pipefail
          for dir in \
            "${GITHUB_WORKSPACE}/target/stress-baselines" \
            "${GITHUB_WORKSPACE}/target/stress-reports" \
            "${GITHUB_WORKSPACE}/target/stress-artifacts"; do
            echo "::group::${dir}"
            if [ -d "$dir" ]; then
              find "$dir" -maxdepth 6 -type f -print | sort
            else
              echo "missing"
            fi
            echo "::endgroup::"
          done

      - name: Upload perf reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: perf-reports
          path: ${{ github.workspace }}/target/stress-reports
          if-no-files-found: ignore

      - name: Upload perf artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: perf-artifacts
          path: ${{ github.workspace }}/target/stress-artifacts
          if-no-files-found: ignore

      - name: Upload perf baselines
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: perf-baselines
          path: ${{ github.workspace }}/target/stress-baselines
          if-no-files-found: ignore
