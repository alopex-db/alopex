name: Stress Tests

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"
    - cron: "0 3 * * 0"

env:
  NIM_SQL_PARSER_DIR: crates/alopex-sql/nim-sql-parser

jobs:
  stress-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
          profile: minimal

      - name: Build Nim SQL parser library
        if: runner.os == 'Linux'
        run: |
          docker run --rm \
            -v "$PWD":/workspace \
            -w "/workspace/${NIM_SQL_PARSER_DIR}" \
            -e PATH=/opt/nim/bin:/usr/local/bin:/usr/bin:/bin \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            nimlang/nim:2.2 \
            sh -c 'nimble install -y npeg msgpack4nim && nimble lib'
      - name: Run stress tests (short)
        env:
          RUST_BACKTRACE: 1
          STRESS_TEST_TIMEOUT: 120
          STRESS_REPORT_DIR: target/stress-reports # set empty string to skip artifact upload
          LD_LIBRARY_PATH: ${{ github.workspace }}/${{ env.NIM_SQL_PARSER_DIR }}:${{ env.LD_LIBRARY_PATH }}
        run: |
          cargo test --features test-hooks,lane_ci --test stress_* -- --test-threads=1

      - name: Upload stress reports
        if: ${{ env.STRESS_REPORT_DIR != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: stress-reports
          path: ${{ env.STRESS_REPORT_DIR }}

  sanitizer-lane:
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            sanitizer: asan
          - os: ubuntu-latest
            sanitizer: tsan
          - os: ubuntu-latest
            sanitizer: lsan
          - os: ubuntu-latest
            sanitizer: msan
          - os: macos-latest
            sanitizer: asan
          - os: macos-latest
            sanitizer: tsan
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust (nightly)
        uses: actions-rs/toolchain@v1
        with:
          toolchain: nightly
          override: true
          profile: minimal

      - name: Build Nim SQL parser library
        if: runner.os == 'Linux'
        run: |
          docker run --rm \
            -v "$PWD":/workspace \
            -w "/workspace/${NIM_SQL_PARSER_DIR}" \
            -e PATH=/opt/nim/bin:/usr/local/bin:/usr/bin:/bin \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            nimlang/nim:2.2 \
            sh -c 'nimble install -y npeg msgpack4nim && nimble lib'
      # macOS/Windows ランナーは docker で Linux コンテナを動かせないため、
      # ネイティブ Nim ツールチェーン (2.2 固定) をセットアップして共有ライブラリを生成する。
      # 要 CI 検証: macOS/Windows ランナー上でのみ動作確認可能（ローカル検証不可）。
      - name: Setup Nim (macOS/Windows)
        if: runner.os != 'Linux'
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: '2.2.x'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build Nim SQL parser library (macOS/Windows)
        if: runner.os != 'Linux'
        shell: bash
        run: |
          cd "${NIM_SQL_PARSER_DIR}"
          nimble install -y npeg msgpack4nim
          nimble lib
      - name: Run sanitizer lane
        env:
          RUST_BACKTRACE: 1
          STRESS_REPORT_DIR: target/stress-reports/${{ matrix.sanitizer }}
          STRESS_ARTIFACTS_DIR: target/stress-artifacts/${{ matrix.sanitizer }}
          LD_LIBRARY_PATH: ${{ github.workspace }}/${{ env.NIM_SQL_PARSER_DIR }}:${{ env.LD_LIBRARY_PATH }}
        run: |
          ./scripts/run-sanitizer-lane.sh ${{ matrix.sanitizer }}

      - name: Upload sanitizer reports
        if: ${{ env.STRESS_REPORT_DIR != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: sanitizer-${{ matrix.os }}-${{ matrix.sanitizer }}-reports
          path: ${{ env.STRESS_REPORT_DIR }}

      - name: Upload sanitizer artifacts
        if: ${{ env.STRESS_ARTIFACTS_DIR != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: sanitizer-${{ matrix.os }}-${{ matrix.sanitizer }}-artifacts
          path: ${{ env.STRESS_ARTIFACTS_DIR }}

  fuzz-lane:
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2880
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust (nightly)
        uses: actions-rs/toolchain@v1
        with:
          toolchain: nightly
          override: true
          profile: minimal

      - name: Build Nim SQL parser library
        if: runner.os == 'Linux'
        run: |
          docker run --rm \
            -v "$PWD":/workspace \
            -w "/workspace/${NIM_SQL_PARSER_DIR}" \
            -e PATH=/opt/nim/bin:/usr/local/bin:/usr/bin:/bin \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            nimlang/nim:2.2 \
            sh -c 'nimble install -y npeg msgpack4nim && nimble lib'
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Run SQL fuzz target (24h)
        env:
          STRESS_REPORT_DIR: target/stress-reports/fuzz/sql_parser
          LD_LIBRARY_PATH: ${{ github.workspace }}/${{ env.NIM_SQL_PARSER_DIR }}:${{ env.LD_LIBRARY_PATH }}
        run: |
          cd crates/alopex-sql/fuzz
          export STRESS_REPORT_DIR="${GITHUB_WORKSPACE}/${STRESS_REPORT_DIR}"
          cargo fuzz run sql_parser -- -max_total_time=86400

      - name: Run DataFrame fuzz target (24h)
        env:
          STRESS_REPORT_DIR: target/stress-reports/fuzz/dataframe_conversion
          LD_LIBRARY_PATH: ${{ github.workspace }}/${{ env.NIM_SQL_PARSER_DIR }}:${{ env.LD_LIBRARY_PATH }}
        run: |
          cd crates/alopex-dataframe/fuzz
          export STRESS_REPORT_DIR="${GITHUB_WORKSPACE}/${STRESS_REPORT_DIR}"
          cargo fuzz run dataframe_conversion -- -max_total_time=86400

      - name: Upload fuzz reports
        if: ${{ env.STRESS_REPORT_DIR != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-reports
          path: target/stress-reports/fuzz

  perf-lane:
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
          profile: minimal

      - name: Download latest perf baselines
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          run_id=$(gh run list --workflow stress-tests.yml --event schedule --limit 1 --json databaseId -q '.[0].databaseId')
          if [ -n "$run_id" ]; then
            gh run download "$run_id" -n perf-baselines -D target/stress-baselines || true
          fi

      - name: Build Nim SQL parser library
        if: runner.os == 'Linux'
        run: |
          docker run --rm \
            -v "$PWD":/workspace \
            -w "/workspace/${NIM_SQL_PARSER_DIR}" \
            -e PATH=/opt/nim/bin:/usr/local/bin:/usr/bin:/bin \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            nimlang/nim:2.2 \
            sh -c 'nimble install -y npeg msgpack4nim && nimble lib'
      - name: Run perf baseline checks
        env:
          RUST_BACKTRACE: 1
          STRESS_BASELINE_REQUIRED: "true"
          STRESS_BASELINE_DIR: target/stress-baselines
          STRESS_REPORT_DIR: target/stress-reports/perf
          STRESS_ARTIFACTS_DIR: target/stress-artifacts/perf
          LD_LIBRARY_PATH: ${{ github.workspace }}/${{ env.NIM_SQL_PARSER_DIR }}:${{ env.LD_LIBRARY_PATH }}
        run: |
          cargo test --features lane_perf --test stress_perf_baseline -- --test-threads=1

      - name: Upload perf reports
        if: ${{ env.STRESS_REPORT_DIR != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: perf-reports
          path: ${{ env.STRESS_REPORT_DIR }}

      - name: Upload perf artifacts
        if: ${{ env.STRESS_ARTIFACTS_DIR != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: perf-artifacts
          path: ${{ env.STRESS_ARTIFACTS_DIR }}

      - name: Upload perf baselines
        if: ${{ env.STRESS_BASELINE_DIR != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: perf-baselines
          path: ${{ env.STRESS_BASELINE_DIR }}
