name: Public release verification

on:
  workflow_call:
    inputs:
      version:
        description: "Release version or tag"
        required: true
        type: string
      publish_report:
        description: "Publish a successful, non-SKIP report to docs"
        required: true
        type: boolean
  workflow_dispatch:
    inputs:
      version:
        description: "Release version or tag; empty resolves the latest PyPI version"
        required: false
        default: ""
        type: string
      publish_report:
        description: "Explicitly publish a successful, non-SKIP report"
        required: true
        default: false
        type: boolean
  schedule:
    - cron: "23 3 * * 1"

concurrency:
  group: public-release-verification-${{ inputs.version || 'latest' }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify public packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Initialize verification report context
        id: report_context
        env:
          REQUESTED_VERSION: ${{ inputs.version || '' }}
        shell: bash
        run: |
          set -euo pipefail
          version="${REQUESTED_VERSION#alopex-py-v}"
          version="${version#v}"
          if [[ -z "${version}" || ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            version="unknown"
          fi
          report_root="${RUNNER_TEMP}/release-verification-v${version}"
          rust_version="$(grep -oP '^ARG RUST_VERSION=\K.*' scripts/release/verify-release/Dockerfile)"
          nim_image="$(grep -oP '^ARG NIM_IMAGE=\K[^@]*' scripts/release/verify-release/Dockerfile)"
          mkdir -p "${report_root}"
          python3 scripts/release/verify-release/report.py init \
            --results "${report_root}/v${version}.json" \
            --version "${version}" --rust "${rust_version:-unknown}" --nim "${nim_image:-unknown}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "REPORT_ROOT=${report_root}" >> "${GITHUB_ENV}"

      - name: Resolve exact public version
        id: release
        env:
          REQUESTED_VERSION: ${{ inputs.version || '' }}
        shell: bash
        run: |
          set -euo pipefail
          version="${REQUESTED_VERSION}"
          version="${version#alopex-py-v}"
          version="${version#v}"
          if [[ -z "${version}" ]]; then
            version="$(python3 - <<'PY'
          import json
          import urllib.request
          with urllib.request.urlopen('https://pypi.org/pypi/alopex/json') as response:
              print(json.load(response)['info']['version'])
          PY
          )"
          fi
          [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git fetch --force origin "refs/tags/v${version}:refs/tags/v${version}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "REPORT_ROOT=${RUNNER_TEMP}/release-verification-v${version}" >> "${GITHUB_ENV}"
          report_root="${RUNNER_TEMP}/release-verification-v${version}"
          mkdir -p "${report_root}"
          rust_version="$(grep -oP '^ARG RUST_VERSION=\K.*' scripts/release/verify-release/Dockerfile)"
          nim_image="$(grep -oP '^ARG NIM_IMAGE=\K[^@]*' scripts/release/verify-release/Dockerfile)"
          python3 scripts/release/verify-release/report.py init \
            --results "${report_root}/v${version}.json" \
            --version "${version}" --rust "${rust_version}" --nim "${nim_image}"

      - name: Wait for exact PyPI release
        id: readiness
        env:
          VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          readiness_dir="${RUNNER_TEMP}/pypi-readiness-v${VERSION}"
          mkdir -p "${readiness_dir}"
          ready=false
          for attempt in $(seq 1 30); do
            echo "PyPI readiness attempt ${attempt}/30 for alopex==${VERSION}"
            if python3 -m pip download \
              --no-cache-dir \
              --disable-pip-version-check \
              --only-binary=:all: \
              --no-deps \
              --dest "${readiness_dir}" \
              "alopex==${VERSION}"; then
              ready=true
              break
            fi
            if [[ "${attempt}" -lt 30 ]]; then
              sleep 20
            fi
          done
          if [[ "${ready}" != true ]]; then
            echo "PyPI did not make alopex==${VERSION} installable within 10 minutes" >&2
            exit 1
          fi

      - name: Run public-package demos and generate reviewable report
        id: demos
        env:
          VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${REPORT_ROOT}"
          bash scripts/release/verify-release/run.sh "${VERSION}" \
            --results-file "${REPORT_ROOT}/v${VERSION}.json" \
            --report-dir "${REPORT_ROOT}"

      - name: Finalize verification report
        if: always()
        env:
          VERSION: ${{ steps.release.outputs.version || steps.report_context.outputs.version || 'unknown' }}
          RELEASE_OUTCOME: ${{ steps.release.outcome }}
          READINESS_OUTCOME: ${{ steps.readiness.outcome }}
          DEMOS_OUTCOME: ${{ steps.demos.outcome }}
        shell: bash
        run: |
          set -u
          version="${VERSION:-unknown}"
          report_root="${REPORT_ROOT:-${RUNNER_TEMP}/release-verification-v${version}}"
          results="${report_root}/v${version}.json"
          mkdir -p "${report_root}"
          if [[ ! -f "${results}" ]]; then
            python3 scripts/release/verify-release/report.py init \
              --results "${results}" --version "${version}" --rust unknown --nim unknown
          fi
          needs_failure=false
          for outcome in "${RELEASE_OUTCOME:-skipped}" "${READINESS_OUTCOME:-skipped}" "${DEMOS_OUTCOME:-skipped}"; do
            if [[ "${outcome}" != success ]]; then
              needs_failure=true
            fi
          done
          if [[ "${needs_failure}" == true ]] && ! python3 - "${results}" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as stream:
              payload = json.load(stream)
          raise SystemExit(0 if any(step.get("status") == "fail" for step in payload.get("steps", [])) else 1)
          PY
          then
            failure_log="${report_root}/workflow-failure.log"
            {
              echo "release=${RELEASE_OUTCOME:-skipped}"
              echo "readiness=${READINESS_OUTCOME:-skipped}"
              echo "demos=${DEMOS_OUTCOME:-skipped}"
            } > "${failure_log}"
            python3 scripts/release/verify-release/report.py record \
              --results "${results}" --name "workflow orchestration" --status fail \
              --description "A verification workflow step failed or was skipped; see the recorded step outcomes." \
              --log "${failure_log}"
          fi
          python3 scripts/release/verify-release/report.py render \
            --results "${results}" --output-dir "${report_root}"

      - name: Upload structured result and Markdown
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-verification-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/release-verification-v*/v*.json
            ${{ runner.temp }}/release-verification-v*/v*.md
          if-no-files-found: error

  publish:
    name: Publish successful report
    needs: verify
    if: needs.verify.result == 'success' && inputs.publish_report == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      REPORT_ROOT: release-verification-output
    steps:
      - uses: actions/checkout@v4

      - name: Download reviewed verification result
        uses: actions/download-artifact@v4
        with:
          name: release-verification-${{ github.run_id }}
          path: ${{ env.REPORT_ROOT }}

      - name: Validate explicit publication candidate
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          report="${REPORT_ROOT}/v${VERSION}.md"
          grep -Fxq '> 総合結果: **✅ 全ステップ成功**' "${report}"
          python3 scripts/release/verify-release/report.py validate-public \
            --results "${REPORT_ROOT}/v${VERSION}.json"

      - name: Publish candidate branch for docs ingestion
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          branch="report/verify-release-v${VERSION}"
          public_url="https://raw.githubusercontent.com/alopex-db/docs/main/reports/release-verification/v${VERSION}.md?cachebust=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if curl -fsSL "${public_url}" -o "${RUNNER_TEMP}/docs-v${VERSION}.md" && \
            cmp -s "${REPORT_ROOT}/v${VERSION}.md" "${RUNNER_TEMP}/docs-v${VERSION}.md"; then
            echo "The exact report is already present on docs main."
            echo "branch=" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          if git ls-remote --exit-code --heads origin "${branch}" >/dev/null 2>&1; then
            echo "publication branch already exists: ${branch}" >&2
            exit 1
          fi
          mkdir -p reports/release-verification
          cp "${REPORT_ROOT}/v${VERSION}.md" "reports/release-verification/v${VERSION}.md"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "${branch}"
          git add "reports/release-verification/v${VERSION}.md"
          git commit -m "docs(release): v${VERSION} verified public-package report"
          git push origin "${branch}"
          echo "branch=${branch}" >> "${GITHUB_OUTPUT}"

      - name: Wait for identical bytes on docs main
        shell: bash
        run: |
          set -euo pipefail
          source_report="${REPORT_ROOT}/v${VERSION}.md"
          for attempt in $(seq 1 60); do
            if curl -fsSL \
              "https://raw.githubusercontent.com/alopex-db/docs/main/reports/release-verification/v${VERSION}.md?cachebust=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${attempt}" \
              -o "${RUNNER_TEMP}/docs-v${VERSION}.md" && \
              cmp -s "${source_report}" "${RUNNER_TEMP}/docs-v${VERSION}.md"; then
              exit 0
            fi
            sleep 30
          done
          echo "docs main did not publish the exact report bytes" >&2
          exit 1

      - name: Cleanup publication branch
        if: always() && steps.publish.outputs.branch != ''
        env:
          BRANCH: ${{ steps.publish.outputs.branch }}
        shell: bash
        run: git push origin --delete "${BRANCH}"

  notify-scheduled-failure:
    name: Notify scheduled verification failure
    needs: verify
    if: always() && github.event_name == 'schedule' && needs.verify.result == 'failure'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Create or update failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          VERSION: ${{ needs.verify.outputs.version }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          title="release verification: scheduled public-package demo failed"
          existing="$(gh issue list --repo "${REPOSITORY}" --state open \
            --search "${title} in:title" --json number --jq '.[0].number // empty')"
          body="v${VERSION:-unknown} の週次公開パッケージ検証が失敗しました。結果 JSON と Markdown は Actions artifact に保存されています: ${RUN_URL}"
          if [[ -n "${existing}" ]]; then
            gh issue comment "${existing}" --repo "${REPOSITORY}" --body "${body}"
          else
            gh issue create --repo "${REPOSITORY}" --title "${title}" --body "${body}"
          fi
