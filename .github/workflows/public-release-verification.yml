name: Public release verification

on:
  workflow_call:
    inputs:
      version:
        description: "Release version or tag"
        required: true
        type: string
      parity_run_id:
        description: "RC-approved exact-SHA parity-performance run ID"
        required: false
        default: ""
        type: string
    secrets:
      DOCS_REPO_TOKEN:
        required: false
  workflow_dispatch:
    inputs:
      version:
        description: "Release version or tag; empty resolves the latest PyPI version"
        required: false
        default: ""
        type: string
      parity_run_id:
        description: "RC-approved parity run ID; optional for an existing report"
        required: false
        default: ""
        type: string
      notify_publication_failure:
        description: "Post an issue if failure evidence cannot be published; disable when tracking a manual acceptance run separately"
        required: false
        default: true
        type: boolean
  schedule:
    - cron: "23 3 * * 1"

concurrency:
  group: public-release-verification-${{ inputs.version || 'latest' }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify public packages
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    permissions:
      actions: read
      contents: read
    outputs:
      version: ${{ steps.release.outputs.version || steps.report_context.outputs.version }}
      commit: ${{ steps.release.outputs.commit }}
      artifact_name: ${{ steps.report_context.outputs.artifact_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Initialize verification report context
        id: report_context
        env:
          REQUESTED_VERSION: ${{ inputs.version || '' }}
        shell: bash
        run: |
          set -euo pipefail
          version="${REQUESTED_VERSION#alopex-py-v}"
          version="${version#v}"
          report_tag="unresolved"
          if [[ -z "${version}" || ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            version="unknown"
          else
            report_tag="alopex-py-v${version}"
          fi
          report_root="${RUNNER_TEMP}/release-verification-v${version}"
          rust_version="$(grep -oP '^ARG RUST_VERSION=\K.*' scripts/release/verify-release/Dockerfile)"
          nim_image="$(grep -oP '^ARG NIM_IMAGE=\K[^@]*' scripts/release/verify-release/Dockerfile)"
          mkdir -p "${report_root}"
          python3 scripts/release/verify-release/report.py init \
            --results "${report_root}/v${version}.json" \
            --version "${version}" --rust "${rust_version:-unknown}" --nim "${nim_image:-unknown}" \
            --commit unresolved --tag "${report_tag}" \
            --run-id "${GITHUB_RUN_ID}" --run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --run-url "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --responsibility "Stable Delivery / downstream availability"
          echo "artifact_name=release-verification-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "REPORT_ROOT=${report_root}" >> "${GITHUB_ENV}"

      - name: Resolve exact public version
        id: release
        env:
          REQUESTED_VERSION: ${{ inputs.version || '' }}
        shell: bash
        run: |
          set -euo pipefail
          provisional_report_root="${REPORT_ROOT}"
          version="${REQUESTED_VERSION}"
          version="${version#alopex-py-v}"
          version="${version#v}"
          if [[ -z "${version}" ]]; then
            version="$(python3 - <<'PY'
          import json
          import urllib.request
          with urllib.request.urlopen('https://pypi.org/pypi/alopex/json') as response:
              print(json.load(response)['info']['version'])
          PY
          )"
          fi
          [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          python_tag="alopex-py-v${version}"
          git fetch --force origin "refs/tags/${python_tag}:refs/tags/${python_tag}"
          python_commit="$(git rev-parse "${python_tag}^{commit}")"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "commit=${python_commit}" >> "${GITHUB_OUTPUT}"
          echo "REPORT_ROOT=${RUNNER_TEMP}/release-verification-v${version}" >> "${GITHUB_ENV}"
          echo "REPORT_COMMIT=${python_commit}" >> "${GITHUB_ENV}"
          echo "REPORT_TAG=${python_tag}" >> "${GITHUB_ENV}"
          report_root="${RUNNER_TEMP}/release-verification-v${version}"
          if [[ "${provisional_report_root}" != "${report_root}" ]]; then
            rm -f "${provisional_report_root}/vunknown.json" "${provisional_report_root}/vunknown.md"
            rmdir "${provisional_report_root}" 2>/dev/null || true
          fi
          if [[ "${GITHUB_REF_TYPE}" == tag ]]; then
            [[ "${GITHUB_REF_NAME}" == "${python_tag}" ]] || {
              echo "tag workflow ref does not match resolved Python tag" >&2
              exit 1
            }
            [[ "${GITHUB_SHA}" == "${python_commit}" ]] || {
              echo "tag workflow commit does not match peeled Python tag" >&2
              exit 1
            }
          fi
          mkdir -p "${report_root}"
          rust_version="$(grep -oP '^ARG RUST_VERSION=\K.*' scripts/release/verify-release/Dockerfile)"
          nim_image="$(grep -oP '^ARG NIM_IMAGE=\K[^@]*' scripts/release/verify-release/Dockerfile)"
          python3 scripts/release/verify-release/report.py init \
            --results "${report_root}/v${version}.json" \
            --version "${version}" --rust "${rust_version}" --nim "${nim_image}" \
            --commit "${python_commit}" --tag "${python_tag}" \
            --run-id "${GITHUB_RUN_ID}" --run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --run-url "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --responsibility "Stable Delivery / downstream availability"

      - name: Verify exact public package availability
        id: availability
        env:
          VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          python3 scripts/compatibility/storage.py \
            --log "${RUNNER_TEMP}/public-release-storage.jsonl" \
            --additional-bytes 1000000000 -- bash -euo pipefail <<'BOUNDED_AVAILABILITY'
          set -euo pipefail
          readiness_dir="${RUNNER_TEMP}/pypi-readiness-v${VERSION}"
          install_dir="${RUNNER_TEMP}/pypi-install-v${VERSION}"
          readiness_log="${readiness_dir}/availability.log"
          mkdir -p "${readiness_dir}"
          ready=false
          for attempt in $(seq 1 30); do
            echo "PyPI readiness attempt ${attempt}/30 for alopex==${VERSION}"
            if python3 -m pip download \
              --no-cache-dir \
              --disable-pip-version-check \
              --only-binary=:all: \
              --no-deps \
              --dest "${readiness_dir}" \
              "alopex==${VERSION}" 2>&1 | tee "${readiness_log}"; then
              rm -rf "${install_dir}"
              if python3 -m pip install --no-index --no-deps \
                --target "${install_dir}" --find-links "${readiness_dir}" \
                "alopex==${VERSION}" 2>&1 | tee -a "${readiness_log}" && \
                PYTHONPATH="${install_dir}" python3 -c 'import importlib.metadata as metadata; import alopex; print(metadata.version("alopex"))' \
                  2>&1 | tee -a "${readiness_log}"; then
                ready=true
                break
              fi
            fi
            if [[ "${attempt}" -lt 30 ]]; then
              sleep 20
            fi
          done
          if [[ "${ready}" != true ]]; then
            echo "PyPI did not make alopex==${VERSION} installable within 10 minutes" >&2
            exit 1
          fi
          python3 scripts/release/verify-release/report.py record \
            --results "${REPORT_ROOT}/v${VERSION}.json" \
            --name "public package availability" --status success \
            --description "PyPIから完全一致wheelを取得し、隔離先へ導入してimportできることを確認する。既知機能の正しさは対象commitのDevelopment CI/Extended Verificationが所有する。" \
            --log "${readiness_log}"
          BOUNDED_AVAILABILITY

      - name: Re-run public wheel scenario
        id: vector_scenario
        env:
          VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          python3 scripts/compatibility/storage.py \
            --log "${RUNNER_TEMP}/public-release-storage.jsonl" \
            --additional-bytes 1000000000 -- bash -euo pipefail <<'BOUNDED_SCENARIO'
          set -euo pipefail
          install_dir="${RUNNER_TEMP}/pypi-install-v${VERSION}"
          scenario="${RUNNER_TEMP}/verify-python-vector-api-v${VERSION}.py"
          scenario_log="${RUNNER_TEMP}/vector-scenario-v${VERSION}.log"
          git show "alopex-py-v${VERSION}:scripts/release/verify_python_vector_api.py" > "${scenario}"
          python3 -m pip install --no-cache-dir --only-binary=:all: --no-deps \
            --target "${install_dir}" numpy==2.2.1
          set +e
          PYTHONPATH="${install_dir}" python3 "${scenario}" 2>&1 | tee "${scenario_log}"
          status="${PIPESTATUS[0]}"
          set -e
          if [[ "${status}" -eq 0 ]]; then
            outcome=success
          else
            outcome=failure
          fi
          python3 scripts/release/verify-release/report.py record \
            --results "${REPORT_ROOT}/v${VERSION}.json" \
            --name "v${VERSION} public vector scenario" --status "${outcome}" \
            --description "PyPIから取得した完全一致wheelで、Kaggleと同じ組み込みPythonのベクトル投入・検索を再実行し、v${VERSION}のget_vectors、バッチHNSW投入、重複キー原子拒否、kNN EXPLAIN経路表示を検証する。" \
            --log "${scenario_log}"
          exit "${status}"
          BOUNDED_SCENARIO

      - name: Verify public Core latest identity
        id: latest_identity
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set +e
          identity="${REPORT_ROOT}/latest-release.json"
          python3 scripts/release/verify_latest_release.py \
            --repository "${GITHUB_REPOSITORY}" --version "${VERSION}" \
            --output "${identity}"
          status=$?
          set -e
          outcome=success
          [[ "${status}" == 0 ]] || outcome=failure
          python3 scripts/release/verify-release/report.py record \
            --results "${REPORT_ROOT}/v${VERSION}.json" \
            --name "Core latest after Python publication" --status "${outcome}" \
            --description "Core stable tag and CLI asset identities remain latest; independent Python wheel/sdist assets are present." \
            --log "${identity}"
          exit "${status}"

      - name: Finalize verification report
        if: always()
        env:
          VERSION: ${{ steps.release.outputs.version || steps.report_context.outputs.version || 'unknown' }}
          RELEASE_OUTCOME: ${{ steps.release.outcome }}
          AVAILABILITY_OUTCOME: ${{ steps.availability.outcome }}
          VECTOR_SCENARIO_OUTCOME: ${{ steps.vector_scenario.outcome }}
          LATEST_IDENTITY_OUTCOME: ${{ steps.latest_identity.outcome }}
        shell: bash
        run: |
          set -u
          version="${VERSION:-unknown}"
          report_root="${REPORT_ROOT:-${RUNNER_TEMP}/release-verification-v${version}}"
          results="${report_root}/v${version}.json"
          mkdir -p "${report_root}"
          if [[ ! -f "${results}" ]]; then
            report_tag="${REPORT_TAG:-unresolved}"
            if [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              report_tag="${REPORT_TAG:-alopex-py-v${version}}"
            fi
            python3 scripts/release/verify-release/report.py init \
              --results "${results}" --version "${version}" --rust unknown --nim unknown \
              --commit "${REPORT_COMMIT:-unresolved}" --tag "${report_tag}" \
              --run-id "${GITHUB_RUN_ID}" --run-attempt "${GITHUB_RUN_ATTEMPT}" \
              --run-url "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
              --responsibility "Stable Delivery / downstream availability"
          fi
          orchestration_status=""
          for outcome in "${RELEASE_OUTCOME:-skipped}" "${AVAILABILITY_OUTCOME:-skipped}" "${VECTOR_SCENARIO_OUTCOME:-skipped}" "${LATEST_IDENTITY_OUTCOME:-skipped}"; do
            if [[ "${outcome}" == failure ]]; then
              orchestration_status=failure
              break
            elif [[ "${outcome}" != success ]]; then
              orchestration_status=incomplete
            fi
          done
          if [[ -n "${orchestration_status}" ]] && ! python3 - "${results}" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as stream:
              payload = json.load(stream)
          raise SystemExit(0 if any(step.get("status") in {"failure", "incomplete"} for step in payload.get("steps", [])) else 1)
          PY
          then
            failure_log="${report_root}/workflow-failure.log"
            {
              echo "release=${RELEASE_OUTCOME:-skipped}"
              echo "availability=${AVAILABILITY_OUTCOME:-skipped}"
              echo "latest_identity=${LATEST_IDENTITY_OUTCOME:-skipped}"
            } > "${failure_log}"
            python3 scripts/release/verify-release/report.py record \
              --results "${results}" --name "workflow orchestration" --status "${orchestration_status}" \
              --description "A verification workflow step failed or was skipped; see the recorded step outcomes." \
              --log "${failure_log}"
          fi
          python3 scripts/release/verify-release/report.py finalize --results "${results}"
          python3 scripts/release/verify-release/report.py render \
            --results "${results}" --output-dir "${report_root}"

      - name: Cleanup public wheel workspace
        if: always()
        env:
          VERSION: ${{ steps.release.outputs.version || steps.report_context.outputs.version || 'unknown' }}
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import re
          import shutil

          version = os.environ["VERSION"]
          if not re.fullmatch(r"(?:[0-9]+\.[0-9]+\.[0-9]+|unknown)", version):
              raise ValueError("refusing cleanup with an invalid version")
          root = Path(os.environ["RUNNER_TEMP"])
          availability_log = root / f"pypi-readiness-v{version}/availability.log"
          if availability_log.is_file():
              report_root = root / f"release-verification-v{version}"
              report_root.mkdir(exist_ok=True)
              shutil.copyfile(availability_log, report_root / "availability.log")
          for prefix in ("pypi-readiness-v", "pypi-install-v"):
              target = root / (prefix + version)
              if target.exists():
                  shutil.rmtree(target)
          (root / f"verify-python-vector-api-v{version}.py").unlink(missing_ok=True)
          PY
          python3 scripts/compatibility/storage.py \
            --log "${RUNNER_TEMP}/public-release-storage.jsonl"

      - name: Upload structured result and Markdown
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.report_context.outputs.artifact_name }}
          path: |
            ${{ runner.temp }}/release-verification-v*/v*.json
            ${{ runner.temp }}/release-verification-v*/v*.md
            ${{ runner.temp }}/release-verification-v*/latest-release.json
            ${{ runner.temp }}/release-verification-v*/availability.log
            ${{ runner.temp }}/vector-scenario-v*.log
            ${{ runner.temp }}/public-release-storage.jsonl
          if-no-files-found: error

  publish:
    name: Publish immutable verification report
    needs: verify
    # Publish both successful and failed terminal verification reports.
    if: ${{ always() && needs.verify.result != 'cancelled' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      failure_stage: ${{ steps.publication_stage.outputs.stage }}
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      REPORT_ROOT: release-verification-output
    steps:
      - uses: actions/checkout@v4

      - name: Download reviewed verification result
        id: download
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.verify.outputs.artifact_name }}
          path: ${{ env.REPORT_ROOT }}

      - name: Select downloaded verification report
        id: selected
        env:
          REPORT_ARTIFACT: ${{ needs.verify.outputs.artifact_name }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/release/report_pair.py select \
            --root "${REPORT_ROOT}" --artifact "${REPORT_ARTIFACT}" \
            --run-id "${GITHUB_RUN_ID}" --repository "${GITHUB_REPOSITORY}" \
            --github-env "${GITHUB_ENV}"

      - name: Validate complete publication report
        id: validated
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/release/verify-release/report.py validate-report \
            --results "${REPORT_ROOT}/v${VERSION}.json"

      - name: Publish candidate branch for docs ingestion
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          report_id="run-${REPORT_RUN_ID}-${REPORT_RUN_ATTEMPT}"
          branch="report/verify-release-v${VERSION}-${REPORT_RUN_ID}-${REPORT_RUN_ATTEMPT}"
          report_path="reports/release-verification/v${VERSION}/${report_id}"
          echo "REPORT_PATH=${report_path}" >> "${GITHUB_ENV}"
          public_url="https://raw.githubusercontent.com/alopex-db/docs/main/${report_path}"
          if curl -fsSL "${public_url}.json?cachebust=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" -o "${RUNNER_TEMP}/docs-report.json" && \
            curl -fsSL "${public_url}.md?cachebust=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" -o "${RUNNER_TEMP}/docs-report.md" && \
            python3 scripts/release/report_pair.py compare \
              --left "${REPORT_ROOT}/v${VERSION}" --right "${RUNNER_TEMP}/docs-report"; then
            echo "The exact JSON/Markdown pair is already present on docs main."
            echo "branch=" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          if git ls-remote --exit-code --heads origin "${branch}" >/dev/null 2>&1; then
            git fetch --force origin "refs/heads/${branch}:refs/remotes/origin/${branch}"
            for extension in json md; do
              git show "refs/remotes/origin/${branch}:${report_path}.${extension}" > "${RUNNER_TEMP}/existing-report.${extension}"
            done
            python3 scripts/release/report_pair.py compare \
              --left "${REPORT_ROOT}/v${VERSION}" --right "${RUNNER_TEMP}/existing-report" || {
              echo "refusing to overwrite immutable report: ${branch}" >&2
              exit 1
            }
            echo "branch=${branch}" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          mkdir -p "$(dirname "${report_path}")"
          if [[ -e "${report_path}.md" || -e "${report_path}.json" ]]; then
            echo "refusing to overwrite immutable report: ${report_path}" >&2
            exit 1
          fi
          cp "${REPORT_ROOT}/v${VERSION}.md" "${report_path}.md"
          cp "${REPORT_ROOT}/v${VERSION}.json" "${report_path}.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "${branch}"
          git add "${report_path}.md" "${report_path}.json"
          git commit -m "docs(release): retain v${VERSION} verification report"
          git push origin "${branch}"
          echo "branch=${branch}" >> "${GITHUB_OUTPUT}"

      # docs owns the scheduled pull and writes with its own GITHUB_TOKEN.
      # Primary evidence retention/ingestion needs no cross-repository PAT.
      - name: Wait for identical bytes on docs main
        id: ingestion
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            public_url="https://raw.githubusercontent.com/alopex-db/docs/main/${REPORT_PATH}"
            cachebust="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${attempt}"
            if curl -fsSL "${public_url}.json?cachebust=${cachebust}" -o "${RUNNER_TEMP}/docs-report.json" && \
              curl -fsSL "${public_url}.md?cachebust=${cachebust}" -o "${RUNNER_TEMP}/docs-report.md" && \
              python3 scripts/release/report_pair.py compare \
                --left "${REPORT_ROOT}/v${VERSION}" --right "${RUNNER_TEMP}/docs-report"; then
              exit 0
            fi
            sleep 30
          done
          echo "docs main did not publish the exact report bytes" >&2
          exit 1

      - name: Cleanup publication branch
        id: cleanup
        if: success() && steps.publish.outputs.branch != ''
        env:
          BRANCH: ${{ steps.publish.outputs.branch }}
        shell: bash
        run: git push origin --delete "${BRANCH}"

      - name: Record publication failure stage
        id: publication_stage
        if: always()
        env:
          DOWNLOAD: ${{ steps.download.outcome }}
          SELECTED: ${{ steps.selected.outcome }}
          VALIDATED: ${{ steps.validated.outcome }}
          RETAINED: ${{ steps.publish.outcome }}
          INGESTED: ${{ steps.ingestion.outcome }}
          CLEANED: ${{ steps.cleanup.outcome }}
        shell: bash
        run: |
          stage=orchestration
          if [[ "$DOWNLOAD" != success ]]; then stage=artifact_download
          elif [[ "$SELECTED" != success || "$VALIDATED" != success ]]; then stage=report_validation
          elif [[ "$RETAINED" != success ]]; then stage=source_retention
          elif [[ "$INGESTED" != success ]]; then stage=docs_ingestion
          elif [[ "$CLEANED" == failure ]]; then stage=branch_cleanup
          fi
          echo "stage=${stage}" >> "$GITHUB_OUTPUT"

  publish-vector-benchmark:
    name: Publish reviewed vector benchmark snapshot
    needs: [verify, publish]
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      VERSION: ${{ needs.verify.outputs.version }}
      SOURCE_COMMIT: ${{ needs.verify.outputs.commit }}
      PARITY_RUN_ID: ${{ inputs.parity_run_id || '' }}
      REPORT_ROOT: benchmark-output/hnsw
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout public docs repository
        uses: actions/checkout@v4
        with:
          repository: alopex-db/docs
          token: ${{ secrets.DOCS_REPO_TOKEN }}
          path: docs-repo

      - name: Download successful exact-SHA Extended Verification evidence
        id: benchmark_evidence
        shell: bash
        run: |
          set -euo pipefail
          published="benchmark-output/published"
          mkdir -p "${published}"
          if cp "docs-repo/reports/vector-benchmarks/v${VERSION}.json" "${published}/hnsw-diagnostic.json" 2>/dev/null && \
             cp "docs-repo/reports/vector-benchmarks/v${VERSION}.md" "${published}/hnsw-diagnostic.md" 2>/dev/null && \
             python3 scripts/performance/release_hnsw_evidence.py \
               --root "${published}" --version "${VERSION}" --commit "${SOURCE_COMMIT}" --public-pair; then
            echo "already_published=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          rm -rf "${published}"
          [[ "${PARITY_RUN_ID}" =~ ^[1-9][0-9]*$ ]]
          run="${RUNNER_TEMP}/parity-performance-run.json"
          gh api "repos/${REPOSITORY}/actions/runs/${PARITY_RUN_ID}" > "${run}"
          run_attempt="$(python3 - "${run}" <<'PY'
          import json
          import os
          import sys

          with open(sys.argv[1], encoding="utf-8") as stream:
              run = json.load(stream)
          if run.get("head_sha") != os.environ["SOURCE_COMMIT"]:
              raise SystemExit("RC-approved parity run does not match the release commit")
          if run.get("path") != ".github/workflows/parity-performance.yml":
              raise SystemExit("RC-approved run is not parity-performance")
          if run.get("conclusion") != "success":
              raise SystemExit("RC-approved parity run is not successful")
          print(run["run_attempt"])
          PY
          )"
          gh run download "${PARITY_RUN_ID}" --repo "${REPOSITORY}" \
            --name "parity-performance-${PARITY_RUN_ID}-${run_attempt}" \
            --dir benchmark-output
          echo "already_published=false" >> "${GITHUB_OUTPUT}"

      - name: Validate the canonical benchmark pair
        if: steps.benchmark_evidence.outputs.already_published != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/performance/release_hnsw_evidence.py \
            --root "${REPORT_ROOT}" --version "${VERSION}" --commit "${SOURCE_COMMIT}"

      - name: Publish candidate branch for docs ingestion
        id: candidate
        if: steps.benchmark_evidence.outputs.already_published != 'true'
        shell: bash
        run: |
          set -euo pipefail
          branch="report/vector-benchmark-v${VERSION}"
          report="reports/vector-benchmarks/v${VERSION}"
          grep -Fq '[Vector benchmark reports](reports/vector-benchmarks/README.md)' docs-repo/README.md
          grep -Fq 'report/vector-benchmark-v*' docs-repo/.github/workflows/publish-vector-benchmarks.yml
          if git ls-remote --exit-code --heads origin "${branch}" >/dev/null 2>&1; then
            git fetch --force origin "refs/heads/${branch}:refs/remotes/origin/${branch}"
            git show "refs/remotes/origin/${branch}:${report}.json" > "${RUNNER_TEMP}/candidate-benchmark.json"
            git show "refs/remotes/origin/${branch}:${report}.md" > "${RUNNER_TEMP}/candidate-benchmark.md"
            cmp -s "${REPORT_ROOT}/hnsw-diagnostic.json" "${RUNNER_TEMP}/candidate-benchmark.json"
            cmp -s "${REPORT_ROOT}/hnsw-diagnostic.md" "${RUNNER_TEMP}/candidate-benchmark.md"
            echo "branch=${branch}" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          git switch -c "${branch}"
          mkdir -p reports/vector-benchmarks
          cp "${REPORT_ROOT}/hnsw-diagnostic.json" "${report}.json"
          cp "${REPORT_ROOT}/hnsw-diagnostic.md" "${report}.md"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${report}.json" "${report}.md"
          git commit -m "docs(vector): publish v${VERSION} benchmark candidate"
          git push origin "${branch}"
          echo "branch=${branch}" >> "${GITHUB_OUTPUT}"

      - name: Wait for identical benchmark bytes on docs main
        shell: bash
        run: |
          set -euo pipefail
          source_root="${REPORT_ROOT}"
          if [[ "${{ steps.benchmark_evidence.outputs.already_published }}" == true ]]; then
            source_root="benchmark-output/published"
          fi
          report="reports/vector-benchmarks/v${VERSION}"
          public="https://raw.githubusercontent.com/alopex-db/docs/main/${report}"
          for attempt in $(seq 1 60); do
            if curl -fsSL "${public}.json?cachebust=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${attempt}" \
                -o "${RUNNER_TEMP}/published-benchmark.json" && \
               curl -fsSL "${public}.md?cachebust=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${attempt}" \
                -o "${RUNNER_TEMP}/published-benchmark.md" && \
               cmp -s "${source_root}/hnsw-diagnostic.json" "${RUNNER_TEMP}/published-benchmark.json" && \
               cmp -s "${source_root}/hnsw-diagnostic.md" "${RUNNER_TEMP}/published-benchmark.md"; then
              exit 0
            fi
            sleep 30
          done
          echo "docs main did not publish the exact benchmark bytes" >&2
          exit 1

      - name: Cleanup benchmark publication branch
        if: always() && steps.candidate.outputs.branch != ''
        env:
          BRANCH: ${{ steps.candidate.outputs.branch }}
        shell: bash
        run: git push origin --delete "${BRANCH}"

  notify-vector-benchmark-failure:
    name: Notify vector benchmark publication failure
    needs: [verify, publish-vector-benchmark]
    if: always() && needs.verify.result == 'success' && needs.publish-vector-benchmark.result == 'failure'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Create or update benchmark publication failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          VERSION: ${{ needs.verify.outputs.version }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          title="release benchmark publication failed: v${VERSION}"
          existing="$(gh issue list --repo "${REPOSITORY}" --state open \
            --search "${title} in:title" --json number --jq '.[0].number // empty')"
          body="v${VERSION} のexact-SHA Extended Verification成果物を公開docsへ取り込めませんでした。Actions artifactを確認してください: ${RUN_URL}"
          if [[ -n "${existing}" ]]; then
            gh issue comment "${existing}" --repo "${REPOSITORY}" --body "${body}"
          else
            gh issue create --repo "${REPOSITORY}" --title "${title}" --body "${body}"
          fi

  publish-publication-failure-report:
    name: Retain independent report-publication failure evidence
    needs: [verify, publish]
    if: always() && needs.publish.result == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download original verification evidence when available
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.verify.outputs.artifact_name }}
          path: release-verification-output

      - name: Prepare independent publication failure bundle
        env:
          REPORT_ARTIFACT: ${{ needs.verify.outputs.artifact_name }}
          VERSION: ${{ needs.verify.outputs.version || 'unknown' }}
          FAILURE_STAGE: ${{ needs.publish.outputs.failure_stage || 'orchestration' }}
        shell: bash
        run: |
          python3 scripts/release/publication_failure.py prepare \
            --root release-verification-output --artifact "$REPORT_ARTIFACT" \
            --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" \
            --version "$VERSION" --commit "$GITHUB_SHA" --stage "$FAILURE_STAGE" \
            --output publication-failure-bundle

      - name: Preserve failure bundle before any publication attempt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publication-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: publication-failure-bundle/reports/
          if-no-files-found: error

      - name: Retain immutable failure branch in Alopex
        id: publish_failure
        run: python3 scripts/release/publication_failure.py retain --root publication-failure-bundle --github-output "$GITHUB_OUTPUT"

      - name: Wait for immutable failure bundle on docs main
        run: python3 scripts/release/publication_failure.py confirm --root publication-failure-bundle

      - name: Cleanup confirmed failure-report branch
        if: success() && steps.publish_failure.outputs.branch != ''
        env:
          BRANCH: ${{ steps.publish_failure.outputs.branch }}
        run: git push origin --delete "$BRANCH"

  notify-publication-failure:
    name: Notify immutable report publication failure
    needs: [verify, publish, publish-publication-failure-report]
    if: >-
      always() && needs.publish-publication-failure-report.result == 'failure' &&
      (github.event_name != 'workflow_dispatch' || inputs.notify_publication_failure)
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Create or update publication failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          VERSION: ${{ needs.verify.outputs.version || 'unknown' }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          title="release verification: immutable report publication failed"
          existing="$(gh issue list --repo "${REPOSITORY}" --state open \
            --search "${title} in:title" --json number --jq '.[0].number // empty')"
          body="v${VERSION} の公開失敗証跡をdocsで確認できませんでした。元の検証結果は変更していません。Actions artifactとAlopexの失敗証跡branchを確認してください: ${RUN_URL}"
          if [[ -n "${existing}" ]]; then
            gh issue comment "${existing}" --repo "${REPOSITORY}" --body "${body}"
          else
            gh issue create --repo "${REPOSITORY}" --title "${title}" --body "${body}"
          fi

  notify-scheduled-failure:
    name: Notify scheduled verification failure
    needs: verify
    if: always() && github.event_name == 'schedule' && needs.verify.result == 'failure'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Create or update failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          VERSION: ${{ needs.verify.outputs.version }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          title="release verification: scheduled public-package availability failed"
          existing="$(gh issue list --repo "${REPOSITORY}" --state open \
            --search "${title} in:title" --json number --jq '.[0].number // empty')"
          body="v${VERSION:-unknown} の週次公開パッケージ到達性検証が失敗しました。不変Markdown/JSONの公開とActions artifactを確認してください: ${RUN_URL}"
          if [[ -n "${existing}" ]]; then
            gh issue comment "${existing}" --repo "${REPOSITORY}" --body "${body}"
          else
            gh issue create --repo "${REPOSITORY}" --title "${title}" --body "${body}"
          fi
