name: Publish retained public report

on:
  workflow_call:
    inputs:
      artifact_run_id:
        required: true
        type: string
      artifact_name:
        required: true
        type: string

jobs:
  publish:
    name: Publish immutable verification report
    # Publish both successful and failed terminal verification reports.
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    env:
      REPORT_ROOT: release-verification-output
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download reviewed verification result
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          run-id: ${{ inputs.artifact_run_id }}
          github-token: ${{ github.token }}
          path: ${{ env.REPORT_ROOT }}

      - name: Select downloaded verification report
        shell: bash
        run: |
          set -euo pipefail
          results="$(find "${REPORT_ROOT}" -type f -name 'v*.json' -print -quit)"
          test -n "${results}"
          report_root="$(dirname "${results}")"
          version="$(python3 - "${results}" <<'PY'
          import json
          import sys
          print(json.load(open(sys.argv[1], encoding="utf-8"))["version"])
          PY
          )"
          report_path="reports/release-verification/v${version}"
          echo "VERSION=${version}" >> "${GITHUB_ENV}"
          echo "REPORT_ROOT=${report_root}" >> "${GITHUB_ENV}"
          echo "REPORT_PATH=${report_path}" >> "${GITHUB_ENV}"
          python3 - "${results}" >> "${GITHUB_ENV}" <<'PY_ENV'
          import json, sys
          identity = json.load(open(sys.argv[1], encoding="utf-8"))["identity"]
          print("REPORT_RUN_ID=" + identity["run_id"])
          print("REPORT_RUN_ATTEMPT=" + str(identity["run_attempt"]))
          PY_ENV

      - name: Validate complete publication report
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/release/verify-release/report.py validate-report \
            --results "${REPORT_ROOT}/v${VERSION}.json"

      - name: Bind report to its actual source run
        env:
          ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id }}
          ARTIFACT_NAME: ${{ inputs.artifact_name }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "${ARTIFACT_RUN_ID}" =~ ^[1-9][0-9]*$ ]]
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${ARTIFACT_RUN_ID}" > "${RUNNER_TEMP}/report-origin.json"
          python3 - "${REPORT_ROOT}/v${VERSION}.json" "${RUNNER_TEMP}/report-origin.json" <<'PY_ORIGIN'
          import json, os, re, sys
          payload = json.load(open(sys.argv[1], encoding="utf-8"))
          origin = json.load(open(sys.argv[2], encoding="utf-8"))
          identity = payload["identity"]
          expected = f"release-verification-{identity['run_id']}-{identity['run_attempt']}"
          assert identity["run_id"] == os.environ["ARTIFACT_RUN_ID"]
          assert expected == os.environ["ARTIFACT_NAME"]
          assert re.fullmatch(r"[0-9a-f]{40}", payload["verifier_commit"])
          assert origin["head_sha"] == payload["verifier_commit"]
          assert origin["head_repository"]["full_name"] == os.environ["GITHUB_REPOSITORY"]
          PY_ORIGIN

      - name: Publish candidate branch for docs ingestion
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          report_id="run-${REPORT_RUN_ID}-${REPORT_RUN_ATTEMPT}"
          branch="report/verify-release-v${VERSION}-${REPORT_RUN_ID}-${REPORT_RUN_ATTEMPT}"
          report_path="reports/release-verification/v${VERSION}/${report_id}"
          echo "REPORT_PATH=${report_path}" >> "${GITHUB_ENV}"
          if git ls-remote --exit-code --heads origin "${branch}" >/dev/null 2>&1; then
            git fetch --force origin "refs/heads/${branch}:refs/remotes/origin/${branch}"
            for ext in md json; do
              git show "refs/remotes/origin/${branch}:${report_path}.${ext}" > "${RUNNER_TEMP}/existing-report.${ext}"
              cmp -s "${REPORT_ROOT}/v${VERSION}.${ext}" "${RUNNER_TEMP}/existing-report.${ext}" || {
                echo "refusing to overwrite immutable report: ${branch}" >&2
                exit 1
              }
            done
            echo "branch=${branch}" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          mkdir -p "$(dirname "${report_path}")"
          for ext in md json; do
            test ! -e "${report_path}.${ext}"
            cp "${REPORT_ROOT}/v${VERSION}.${ext}" "${report_path}.${ext}"
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "${branch}"
          git add "${report_path}.md" "${report_path}.json"
          git commit -m "docs(release): retain v${VERSION} verification report"
          git push origin "${branch}"
          echo "branch=${branch}" >> "${GITHUB_OUTPUT}"

      # docs imports public report branches on its schedule (or workflow_dispatch).
      # No cross-repository PAT or repository_dispatch is required.
      - name: Wait for identical bytes on docs main
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 90); do
            matched=true
            for ext in md json; do
              if ! curl -fsSL \
                "https://raw.githubusercontent.com/alopex-db/docs/main/${REPORT_PATH}.${ext}?cachebust=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${attempt}" \
                -o "${RUNNER_TEMP}/docs-report.${ext}" || \
                ! cmp -s "${REPORT_ROOT}/v${VERSION}.${ext}" "${RUNNER_TEMP}/docs-report.${ext}"; then
                matched=false
                break
              fi
            done
            if [[ "${matched}" == true ]]; then exit 0; fi
            sleep 30
          done
          echo "docs main did not publish the exact report bytes" >&2
          exit 1

      - name: Cleanup publication branch
        if: success() && steps.publish.outputs.branch != ''
        env:
          BRANCH: ${{ steps.publish.outputs.branch }}
        shell: bash
        run: git push origin --delete "${BRANCH}"

