name: alopex-py-release

on:
  push:
    tags:
      - "alopex-py-v*"

defaults:
  run:
    shell: bash

env:
  NIM_SQL_PARSER_DIR: crates/alopex-sql/nim-sql-parser

jobs:
  linux:
    name: linux (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Linux aarch64 wheels are held for v0.6.0: the manylinux cross build
        # builds the Nim SQL parser shared library as x86_64, then the
        # aarch64 linker rejects it as incompatible. Keep x86_64 releasable
        # while the ARM-native/shared-library build path is resolved.
        target: [x86_64]
        target_triple: [x86_64-unknown-linux-gnu]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Checkout Chirps dependency
        run: .github/scripts/checkout-chirps.sh
      - name: Stage exact Alopex v0.8.4 parser assets
        env:
          GH_TOKEN: ${{ github.token }}
          CORE_TAG: v0.8.4
          TARGET_TRIPLE: x86_64-unknown-linux-gnu
        run: |
          set -euo pipefail
          rm -rf .core-parser-assets
          mkdir -p .core-parser-assets
          for attempt in $(seq 1 30); do
            if gh release download "$CORE_TAG" --repo alopex-db/alopex \
              --pattern 'parser-assets-v0.8.4.json' \
              --pattern 'parser-vendor-manifest-v0.8.4.json' \
              --pattern 'alopex-parser-v0.8.4-contract-0.4.0-*.tar.gz' \
              --dir .core-parser-assets --clobber; then
              break
            fi
            rm -rf .core-parser-assets && mkdir -p .core-parser-assets
            test "$attempt" -lt 30
            sleep 20
          done
          python scripts/release/parser_asset_manifest.py verify-manifest \
            --manifest .core-parser-assets/parser-vendor-manifest-v0.8.4.json \
            --asset-dir .core-parser-assets
          python - <<'PY'
          import hashlib, json, tarfile
          from pathlib import Path
          root = Path('.core-parser-assets')
          envelope = json.loads((root / 'parser-assets-v0.8.4.json').read_text())
          assert envelope['source']['tag'] == 'v0.8.4'
          manifest = json.loads((root / 'parser-vendor-manifest-v0.8.4.json').read_text())
          asset = next(item for item in manifest['assets'] if item['target'] == 'x86_64-unknown-linux-gnu')
          archive = root / asset['archive']['filename']
          with tarfile.open(archive, 'r:gz') as handle:
              members = {member.name: handle.extractfile(member).read() for member in handle.getmembers()}
          library = members[asset['library']['path']]
          assert hashlib.sha256(library).hexdigest() == asset['library']['sha256']
          destination = Path('crates/alopex-sql/nim-sql-parser/vendor/x86_64-unknown-linux-gnu')
          destination.mkdir(parents=True, exist_ok=True)
          name = Path(asset['library']['path']).name
          (destination / name).write_bytes(library)
          (destination / 'CONTRACT_VERSION').write_text('0.4.0\n')
          (destination / 'SHA256SUMS').write_text(f"{asset['library']['sha256']}  {name}\n")
          package_native = Path('crates/alopex-py/python/alopex/native')
          package_native.mkdir(parents=True, exist_ok=True)
          (package_native / name).write_bytes(library)
          (package_native / 'CONTRACT_VERSION').write_text('0.4.0\n')
          (package_native / 'SHA256SUMS').write_text(f"{asset['library']['sha256']}  {name}\n")
          PY
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          command: build
          manylinux: auto
          args: -m crates/alopex-py/Cargo.toml --release --out dist
          target: ${{ matrix.target }}
          # `before-script-linux` は maturin-action 公式入力 (action.yml で確認済み):
          #   "Script to run before maturin command on Linux."
          # manylinux: auto では maturin-action が manylinux コンテナ内でビルドするため、
          # このスクリプトも同コンテナ内 (AlmaLinux ベース) で cargo build 前に実行される。
          before-script-linux: |
            set -euxo pipefail
            REPO_ROOT="$PWD"
            CHIRPS_DIR="$(dirname "$(dirname "${REPO_ROOT}")")/chirps"
            rm -rf "${CHIRPS_DIR}"
            git clone --depth 1 https://github.com/alopex-db/alopex-chirps.git "${CHIRPS_DIR}"
            cd "${REPO_ROOT}"
      - name: Inspect Linux wheel contents
        shell: bash
        run: |
          set -euo pipefail
          library_sha="$(python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('.core-parser-assets/parser-vendor-manifest-v0.8.4.json').read_text())
          print(next(a['library']['sha256'] for a in manifest['assets'] if a['target'] == 'x86_64-unknown-linux-gnu'))
          PY
          )"
          for wheel in dist/*.whl; do
            python scripts/release/verify_wheel_contents.py "$wheel" \
              --expected-library-path alopex/native/libalopex_sql_parser.so \
              --expected-library-sha256 "$library_sha" --expected-contract-version 0.4.0
          done
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.target }}
          path: dist/*

  macos:
    name: macos (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # x86_64 macOS wheels must run on an Intel runner because the Nim SQL
          # parser shared library is built natively before linking.
          - os: macos-15-intel
            target: x86_64
            target_triple: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64
            target_triple: aarch64-apple-darwin
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Checkout Chirps dependency
        run: .github/scripts/checkout-chirps.sh
      - name: Stage exact Alopex v0.8.4 parser assets
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_TRIPLE: ${{ matrix.target_triple }}
        run: |
          set -euo pipefail
          rm -rf .core-parser-assets && mkdir -p .core-parser-assets
          for attempt in $(seq 1 30); do
            if gh release download v0.8.4 --repo alopex-db/alopex \
              --pattern 'parser-assets-v0.8.4.json' \
              --pattern 'parser-vendor-manifest-v0.8.4.json' \
              --pattern 'alopex-parser-v0.8.4-contract-0.4.0-*.tar.gz' \
              --dir .core-parser-assets --clobber; then
              break
            fi
            rm -rf .core-parser-assets && mkdir -p .core-parser-assets
            test "$attempt" -lt 30
            sleep 20
          done
          python scripts/release/parser_asset_manifest.py verify-manifest \
            --manifest .core-parser-assets/parser-vendor-manifest-v0.8.4.json \
            --asset-dir .core-parser-assets
          TARGET_TRIPLE="$TARGET_TRIPLE" python - <<'PY'
          import hashlib, json, os, tarfile
          from pathlib import Path
          root = Path('.core-parser-assets')
          envelope = json.loads((root / 'parser-assets-v0.8.4.json').read_text())
          assert envelope['source']['tag'] == 'v0.8.4'
          manifest = json.loads((root / 'parser-vendor-manifest-v0.8.4.json').read_text())
          target = os.environ['TARGET_TRIPLE']
          asset = next(item for item in manifest['assets'] if item['target'] == target)
          with tarfile.open(root / asset['archive']['filename'], 'r:gz') as handle:
              members = {m.name: handle.extractfile(m).read() for m in handle.getmembers()}
          library = members[asset['library']['path']]
          assert hashlib.sha256(library).hexdigest() == asset['library']['sha256']
          destination = Path('crates/alopex-sql/nim-sql-parser/vendor') / target
          destination.mkdir(parents=True, exist_ok=True)
          name = Path(asset['library']['path']).name
          (destination / name).write_bytes(library)
          (destination / 'CONTRACT_VERSION').write_text('0.4.0\n')
          (destination / 'SHA256SUMS').write_text(f"{asset['library']['sha256']}  {name}\n")
          package_native = Path('crates/alopex-py/python/alopex/native')
          package_native.mkdir(parents=True, exist_ok=True)
          (package_native / name).write_bytes(library)
          (package_native / 'CONTRACT_VERSION').write_text('0.4.0\n')
          (package_native / 'SHA256SUMS').write_text(f"{asset['library']['sha256']}  {name}\n")
          PY
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: -m crates/alopex-py/Cargo.toml --release --out dist
          target: ${{ matrix.target }}
      - name: Inspect macOS wheel contents
        shell: bash
        run: |
          set -euo pipefail
          library_sha="$(TARGET_TRIPLE="${{ matrix.target_triple }}" python - <<'PY'
          import json, os
          from pathlib import Path
          manifest = json.loads(Path('.core-parser-assets/parser-vendor-manifest-v0.8.4.json').read_text())
          print(next(a['library']['sha256'] for a in manifest['assets'] if a['target'] == os.environ['TARGET_TRIPLE']))
          PY
          )"
          for wheel in dist/*.whl; do
            python scripts/release/verify_wheel_contents.py "$wheel" \
              --expected-library-path alopex/native/libalopex_sql_parser.dylib \
              --expected-library-sha256 "$library_sha" --expected-contract-version 0.4.0
          done
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-${{ matrix.target }}
          path: dist/*

  windows:
    name: windows (x86_64)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Checkout Chirps dependency
        run: .github/scripts/checkout-chirps.sh
      - name: Stage exact Alopex v0.8.4 parser assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf .core-parser-assets && mkdir -p .core-parser-assets
          for attempt in $(seq 1 30); do
            if gh release download v0.8.4 --repo alopex-db/alopex \
              --pattern 'parser-assets-v0.8.4.json' \
              --pattern 'parser-vendor-manifest-v0.8.4.json' \
              --pattern 'alopex-parser-v0.8.4-contract-0.4.0-*.tar.gz' \
              --dir .core-parser-assets --clobber; then
              break
            fi
            rm -rf .core-parser-assets && mkdir -p .core-parser-assets
            test "$attempt" -lt 30
            sleep 20
          done
          python scripts/release/parser_asset_manifest.py verify-manifest \
            --manifest .core-parser-assets/parser-vendor-manifest-v0.8.4.json \
            --asset-dir .core-parser-assets
          python - <<'PY'
          import hashlib, json, tarfile
          from pathlib import Path
          root = Path('.core-parser-assets')
          envelope = json.loads((root / 'parser-assets-v0.8.4.json').read_text())
          assert envelope['source']['tag'] == 'v0.8.4'
          manifest = json.loads((root / 'parser-vendor-manifest-v0.8.4.json').read_text())
          target = 'x86_64-pc-windows-msvc'
          asset = next(item for item in manifest['assets'] if item['target'] == target)
          with tarfile.open(root / asset['archive']['filename'], 'r:gz') as handle:
              members = {m.name: handle.extractfile(m).read() for m in handle.getmembers()}
          library = members[asset['library']['path']]
          assert hashlib.sha256(library).hexdigest() == asset['library']['sha256']
          destination = Path('crates/alopex-sql/nim-sql-parser/vendor') / target
          destination.mkdir(parents=True, exist_ok=True)
          name = Path(asset['library']['path']).name
          (destination / name).write_bytes(library)
          (destination / 'CONTRACT_VERSION').write_text('0.4.0\n')
          (destination / 'SHA256SUMS').write_text(f"{asset['library']['sha256']}  {name}\n")
          Path('crates/alopex-py/python/alopex/native').mkdir(parents=True, exist_ok=True)
          Path('crates/alopex-py/python/alopex/native', name).write_bytes(library)
          Path('crates/alopex-py/python/alopex/native/CONTRACT_VERSION').write_text('0.4.0\n')
          Path('crates/alopex-py/python/alopex/native/SHA256SUMS').write_text(f"{asset['library']['sha256']}  {name}\n")
          PY
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: -m crates/alopex-py/Cargo.toml --release --out dist
      - name: Inspect Windows wheel contents
        shell: bash
        run: |
          set -euo pipefail
          wheel="$(find dist -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "$wheel"
          library_sha="$(python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('.core-parser-assets/parser-vendor-manifest-v0.8.4.json').read_text())
          print(next(a['library']['sha256'] for a in manifest['assets'] if a['target'] == 'x86_64-pc-windows-msvc'))
          PY
          )"
          python scripts/release/verify_wheel_contents.py "$wheel" --require-nim-dll \
            --expected-library-sha256 "$library_sha" --expected-contract-version 0.4.0 \
            --expected-loader-path alopex/native/alopex_sql_parser.dll
      - name: Import Windows wheel without ALOPEX_DLL_DIR
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $venv = Join-Path $env:RUNNER_TEMP "alopex-wheel-clean-venv"
          if (Test-Path $venv) { Remove-Item -Recurse -Force $venv }
          python -m venv $venv
          $wheel = (Get-ChildItem dist\*.whl | Select-Object -First 1).FullName
          & "$venv\Scripts\python.exe" -m pip install --no-index --no-deps $wheel
          Remove-Item Env:ALOPEX_DLL_DIR -ErrorAction SilentlyContinue
          Push-Location $env:RUNNER_TEMP
          try {
            & "$venv\Scripts\python.exe" -c "from alopex import Database; print('clean wheel import OK')"
          } finally {
            Pop-Location
          }
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-x86_64
          path: dist/*

  sdist:
    name: sdist
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Checkout Chirps dependency
        run: .github/scripts/checkout-chirps.sh
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: -m crates/alopex-py/Cargo.toml --out dist
      - name: Inspect sdist contents
        shell: bash
        run: |
          set -euo pipefail
          for archive in dist/*.tar.gz; do
            python scripts/release/verify_wheel_contents.py "$archive"
          done
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*

  publish-testpypi:
    name: publish-testpypi
    runs-on: ubuntu-latest
    needs: [linux, macos, windows, sdist]
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Flatten dist directory
        run: |
          mkdir -p wheels
          find dist -name "*.whl" -exec cp {} wheels/ \;
          find dist -name "*.tar.gz" -exec cp {} wheels/ \;
          ls -la wheels/
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: wheels/
          skip-existing: true

  verify-testpypi:
    name: verify-testpypi
    runs-on: ubuntu-latest
    needs: [publish-testpypi]
    steps:
      - name: Wait for TestPyPI indexing
        run: sleep 60
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install from TestPyPI
        run: |
          pip install --index-url https://test.pypi.org/simple/ \
            --extra-index-url https://pypi.org/simple/ \
            alopex
      - name: Verify import
        run: |
          python -c "from alopex import Database; print('Database import OK')"
          python -c "from alopex import Transaction; print('Transaction import OK')"

  publish-pypi:
    name: publish-pypi
    runs-on: ubuntu-latest
    needs: [verify-testpypi]
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Flatten dist directory
        run: |
          mkdir -p wheels
          find dist -name "*.whl" -exec cp {} wheels/ \;
          find dist -name "*.tar.gz" -exec cp {} wheels/ \;
          ls -la wheels/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: wheels/
          skip-existing: true

  github-release:
    name: github-release
    runs-on: ubuntu-latest
    needs: [linux, macos, windows, sdist]
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
