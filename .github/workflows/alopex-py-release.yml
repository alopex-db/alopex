name: alopex-py-release

on:
  push:
    tags:
      - "alopex-py-v*"

defaults:
  run:
    shell: bash

env:
  NIM_SQL_PARSER_DIR: crates/alopex-sql/nim-sql-parser

jobs:
  linux:
    name: linux (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64, aarch64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          command: build
          manylinux: auto
          args: -m crates/alopex-py/Cargo.toml --release --out dist
          target: ${{ matrix.target }}
          # `before-script-linux` は maturin-action 公式入力 (action.yml で確認済み):
          #   "Script to run before maturin command on Linux."
          # manylinux: auto では maturin-action が manylinux コンテナ内でビルドするため、
          # このスクリプトも同コンテナ内 (AlmaLinux ベース) で cargo build 前に実行される。
          # ここで Nim 2.2 をセットアップし、alopex-sql の build.rs が要求する
          # libalopex_sql_parser.so を crates/alopex-sql/nim-sql-parser/ に生成する。
          #
          # Nim 公式は aarch64 向けプリビルドバイナリ tar.xz を配布していない
          # (x64 のみ。https://nim-lang.org/download/ で確認)。そのため両ターゲットで
          # 確実に動くソースからのブートストラップ (csources 同梱) を採用する。
          # manylinux には gcc/make があるためソースビルドが可能。
          #
          # 要 CI 検証:
          #   - aarch64 ターゲットは maturin-action が QEMU エミュレーションの
          #     aarch64 コンテナで実行する可能性が高く、ソースビルドは動作するが
          #     低速。実際の所要時間・成否は CI 上でのみ確認可能。
          #   - manylinux コンテナ内の curl/xz/gcc 可用性は CI 上で要確認。
          before-script-linux: |
            set -euxo pipefail
            NIM_VERSION=2.2.4
            curl -fsSL "https://nim-lang.org/download/nim-${NIM_VERSION}.tar.xz" -o /tmp/nim.tar.xz
            mkdir -p /opt/nim-src
            tar -xJf /tmp/nim.tar.xz -C /opt/nim-src --strip-components=1
            cd /opt/nim-src
            sh build.sh
            bin/nim c --skipUserCfg --skipParentCfg koch
            ./koch boot -d:release
            ./koch tools
            export PATH="/opt/nim-src/bin:${HOME}/.nimble/bin:${PATH}"
            # env (NIM_SQL_PARSER_DIR) のコンテナ内伝播は不確実なためパスを直書き。
            # CWD は repo ルート (maturin-action がマウント) を前提。
            # 要 CI 検証: コンテナ内 CWD が repo ルートか確認。
            cd crates/alopex-sql/nim-sql-parser
            nimble install -y npeg msgpack4nim
            nimble lib
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.target }}
          path: dist/*

  macos:
    name: macos (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # x86_64 macOS wheels must run on an Intel runner because the Nim SQL
          # parser shared library is built natively before linking.
          - os: macos-15-intel
            target: x86_64
          - os: macos-latest
            target: aarch64
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # ネイティブ Nim ツールチェーン (2.2 固定) をホスト上でセットアップ。
      # 他ワークフロー (alopex-py.yml 等) の macOS/Windows パターンと整合。
      # 要 CI 検証: x86_64 は Intel runner、aarch64 は macos-latest 上で検証する。
      - name: Setup Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: '2.2.x'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build Nim SQL parser library
        run: |
          cd "${NIM_SQL_PARSER_DIR}"
          nimble install -y npeg msgpack4nim
          nimble lib
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: -m crates/alopex-py/Cargo.toml --release --out dist
          target: ${{ matrix.target }}
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-${{ matrix.target }}
          path: dist/*

  windows:
    name: windows (x86_64)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # ネイティブ Nim ツールチェーン (2.2 固定) をホスト上でセットアップ。
      # 他ワークフロー (alopex-py.yml 等) の macOS/Windows パターンと整合。
      - name: Setup Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: '2.2.x'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build Nim SQL parser library
        run: |
          cd "${NIM_SQL_PARSER_DIR}"
          nimble install -y npeg msgpack4nim
          nimble lib
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: -m crates/alopex-py/Cargo.toml --release --out dist
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-x86_64
          path: dist/*

  sdist:
    name: sdist
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: -m crates/alopex-py/Cargo.toml --out dist
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*

  publish-testpypi:
    name: publish-testpypi
    runs-on: ubuntu-latest
    needs: [linux, macos, windows, sdist]
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Flatten dist directory
        run: |
          mkdir -p wheels
          find dist -name "*.whl" -exec cp {} wheels/ \;
          find dist -name "*.tar.gz" -exec cp {} wheels/ \;
          ls -la wheels/
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: wheels/
          skip-existing: true

  verify-testpypi:
    name: verify-testpypi
    runs-on: ubuntu-latest
    needs: [publish-testpypi]
    steps:
      - name: Wait for TestPyPI indexing
        run: sleep 60
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install from TestPyPI
        run: |
          pip install --index-url https://test.pypi.org/simple/ \
            --extra-index-url https://pypi.org/simple/ \
            alopex
      - name: Verify import
        run: |
          python -c "from alopex import Database; print('Database import OK')"
          python -c "from alopex import Transaction; print('Transaction import OK')"

  publish-pypi:
    name: publish-pypi
    runs-on: ubuntu-latest
    needs: [verify-testpypi]
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Flatten dist directory
        run: |
          mkdir -p wheels
          find dist -name "*.whl" -exec cp {} wheels/ \;
          find dist -name "*.tar.gz" -exec cp {} wheels/ \;
          ls -la wheels/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: wheels/
          skip-existing: true

  github-release:
    name: github-release
    runs-on: ubuntu-latest
    needs: [linux, macos, windows, sdist]
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
