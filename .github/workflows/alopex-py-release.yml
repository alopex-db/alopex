name: alopex-py-release

on:
  # The core release dispatches this workflow with all immutable identities.
  # Tag creation alone cannot race a second publication run.
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Immutable source ref to build (for repair-forward runs)"
        required: false
        default: ""
        type: string
      target_sha:
        description: "Explicit reviewed SHA bound to the Python tag"
        required: false
        default: ""
        type: string
      release_tag:
        description: "Existing immutable Python tag to publish"
        required: false
        default: ""
        type: string
      core_run_id:
        description: "Core release workflow run that published crates and assets"
        required: true
        type: string
      repair_forward:
        description: "Create/verify the historical Python tag without a push-triggered workflow"
        required: false
        default: false
        type: boolean

defaults:
  run:
    shell: bash

env:
  NIM_SQL_PARSER_DIR: crates/alopex-sql/nim-sql-parser

jobs:
  prepare-repair-release:
    name: Prepare immutable repair release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create or verify immutable Python tag
        if: ${{ inputs.repair_forward }}
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_ref }}
          TARGET_SHA: ${{ inputs.target_sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: bash scripts/release/prepare-python-repair.sh

  linux:
    name: linux (${{ matrix.target }})
    runs-on: ubuntu-latest
    needs: [prepare-repair-release]
    if: ${{ !inputs.repair_forward }}
    strategy:
      fail-fast: false
      matrix:
        # Linux aarch64 wheels are held for v0.6.0: the manylinux cross build
        # builds the Nim SQL parser shared library as x86_64, then the
        # aarch64 linker rejects it as incompatible. Keep x86_64 releasable
        # while the ARM-native/shared-library build path is resolved.
        target: [x86_64]
        target_triple: [x86_64-unknown-linux-gnu]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.ref }}
      - name: Resolve source release version
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\([0-9][0-9.]*\)"/\1/p' Cargo.toml | head -1)"
          [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "ALOPEX_VERSION=${version}" >> "${GITHUB_ENV}"
          echo "CORE_TAG=v${version}" >> "${GITHUB_ENV}"
          echo "PARSER_MANIFEST=.core-parser-assets/parser-vendor-manifest-v${version}.json" >> "${GITHUB_ENV}"
      - name: Stage exact Alopex parser assets
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_TRIPLE: x86_64-unknown-linux-gnu
        run: |
          set -euo pipefail
          rm -rf .core-parser-assets
          mkdir -p .core-parser-assets
          for attempt in $(seq 1 30); do
            if gh release download "$CORE_TAG" --repo alopex-db/alopex \
              --pattern "parser-assets-v${ALOPEX_VERSION}.json" \
              --pattern "parser-vendor-manifest-v${ALOPEX_VERSION}.json" \
              --pattern "alopex-parser-v${ALOPEX_VERSION}-contract-0.12.0-*.tar.gz" \
              --dir .core-parser-assets --clobber; then
              break
            fi
            rm -rf .core-parser-assets && mkdir -p .core-parser-assets
            test "$attempt" -lt 30
            sleep 20
          done
          python scripts/release/parser_asset_manifest.py verify-manifest \
            --manifest "${PARSER_MANIFEST}" \
            --asset-dir .core-parser-assets
          python - <<'PY'
          import hashlib, json, os, tarfile
          from pathlib import Path
          root = Path('.core-parser-assets')
          version = os.environ['ALOPEX_VERSION']
          envelope = json.loads((root / f'parser-assets-v{version}.json').read_text())
          assert envelope['source']['tag'] == f'v{version}'
          manifest = json.loads((root / f'parser-vendor-manifest-v{version}.json').read_text())
          asset = next(item for item in manifest['assets'] if item['target'] == 'x86_64-unknown-linux-gnu')
          archive = root / asset['archive']['filename']
          with tarfile.open(archive, 'r:gz') as handle:
              members = {member.name: handle.extractfile(member).read() for member in handle.getmembers()}
          library = members[asset['library']['path']]
          static_library = members[asset['static_library']['path']]
          assert hashlib.sha256(library).hexdigest() == asset['library']['sha256']
          assert hashlib.sha256(static_library).hexdigest() == asset['static_library']['sha256']
          destination = Path('crates/alopex-sql/nim-sql-parser/vendor/x86_64-unknown-linux-gnu')
          destination.mkdir(parents=True, exist_ok=True)
          name = Path(asset['library']['path']).name
          static_name = Path(asset['static_library']['path']).name
          (destination / name).write_bytes(library)
          (destination / static_name).write_bytes(static_library)
          (destination / 'CONTRACT_VERSION').write_bytes(b'0.12.0\n')
          (destination / 'SHA256SUMS').write_bytes(f"{asset['library']['sha256']}  {name}\n{asset['static_library']['sha256']}  {static_name}\n".encode())
          package_native = Path('crates/alopex-py/python/alopex/native')
          package_native.mkdir(parents=True, exist_ok=True)
          (package_native / name).write_bytes(library)
          (package_native / 'CONTRACT_VERSION').write_bytes(b'0.12.0\n')
          (package_native / 'SHA256SUMS').write_bytes(f"{asset['library']['sha256']}  {name}\n".encode())
          PY
      - name: Checkout exact-SHA release repair tool
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: .release-tools
          sparse-checkout: scripts/release/retarget_python_parser_source.py
          sparse-checkout-cone-mode: false
      - name: Bind source parser pins to release assets
        run: |
          python .release-tools/scripts/release/retarget_python_parser_source.py \
            --manifest "${PARSER_MANIFEST}" \
            --vendor-dir crates/alopex-sql/nim-sql-parser/vendor \
            --build-support crates/alopex-sql/build_support.rs
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          maturin-version: "1.14.1"
          command: build
          manylinux: auto
          args: -m crates/alopex-py/Cargo.toml --release --out dist
          target: ${{ matrix.target }}
          # `before-script-linux` は maturin-action 公式入力 (action.yml で確認済み):
          #   "Script to run before maturin command on Linux."
          # manylinux: auto では maturin-action が manylinux コンテナ内でビルドするため、
          # このスクリプトも同コンテナ内 (AlmaLinux ベース) で cargo build 前に実行される。
          before-script-linux: |
            set -euxo pipefail
            REPO_ROOT="$PWD"
            cd "${REPO_ROOT}"
      - name: Inspect Linux wheel contents
        shell: bash
        run: |
          set -euo pipefail
          library_sha="$(python - <<'PY'
          import json, os
          from pathlib import Path
          version = os.environ['ALOPEX_VERSION']
          manifest = json.loads(Path(f'.core-parser-assets/parser-vendor-manifest-v{version}.json').read_text())
          print(next(a['library']['sha256'] for a in manifest['assets'] if a['target'] == 'x86_64-unknown-linux-gnu'))
          PY
          )"
          for wheel in dist/*.whl; do
            python scripts/release/verify_wheel_contents.py "$wheel" \
              --expected-library-path alopex/native/libalopex_sql_parser.so \
              --expected-library-sha256 "$library_sha" --expected-contract-version 0.12.0
          done
      - name: Exercise Linux wheel vector and streaming APIs
        shell: bash
        run: |
          set -euo pipefail
          smoke_venv="${RUNNER_TEMP}/alopex-wheel-api-smoke"
          python -m venv "${smoke_venv}"
          "${smoke_venv}/bin/python" -m pip install numpy==2.2.1
          "${smoke_venv}/bin/python" -m pip install --no-index --no-deps dist/*.whl
          "${smoke_venv}/bin/python" scripts/release/verify_python_vector_api.py
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.target }}
          path: dist/*

  macos:
    name: macos (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    needs: [prepare-repair-release]
    if: ${{ !inputs.repair_forward }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # x86_64 macOS wheels must run on an Intel runner because the Nim SQL
          # parser shared library is built natively before linking.
          - os: macos-15-intel
            target: x86_64
            target_triple: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64
            target_triple: aarch64-apple-darwin
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.ref }}
      - name: Resolve source release version
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\([0-9][0-9.]*\)"/\1/p' Cargo.toml | head -1)"
          [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "ALOPEX_VERSION=${version}" >> "${GITHUB_ENV}"
          echo "CORE_TAG=v${version}" >> "${GITHUB_ENV}"
          echo "PARSER_MANIFEST=.core-parser-assets/parser-vendor-manifest-v${version}.json" >> "${GITHUB_ENV}"
      - name: Stage exact Alopex parser assets
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_TRIPLE: ${{ matrix.target_triple }}
        run: |
          set -euo pipefail
          rm -rf .core-parser-assets && mkdir -p .core-parser-assets
          for attempt in $(seq 1 30); do
            if gh release download "${CORE_TAG}" --repo alopex-db/alopex \
              --pattern "parser-assets-v${ALOPEX_VERSION}.json" \
              --pattern "parser-vendor-manifest-v${ALOPEX_VERSION}.json" \
              --pattern "alopex-parser-v${ALOPEX_VERSION}-contract-0.12.0-*.tar.gz" \
              --dir .core-parser-assets --clobber; then
              break
            fi
            rm -rf .core-parser-assets && mkdir -p .core-parser-assets
            test "$attempt" -lt 30
            sleep 20
          done
          python scripts/release/parser_asset_manifest.py verify-manifest \
            --manifest "${PARSER_MANIFEST}" \
            --asset-dir .core-parser-assets
          TARGET_TRIPLE="$TARGET_TRIPLE" python - <<'PY'
          import hashlib, json, os, tarfile
          from pathlib import Path
          root = Path('.core-parser-assets')
          version = os.environ['ALOPEX_VERSION']
          envelope = json.loads((root / f'parser-assets-v{version}.json').read_text())
          assert envelope['source']['tag'] == f'v{version}'
          manifest = json.loads((root / f'parser-vendor-manifest-v{version}.json').read_text())
          target = os.environ['TARGET_TRIPLE']
          asset = next(item for item in manifest['assets'] if item['target'] == target)
          with tarfile.open(root / asset['archive']['filename'], 'r:gz') as handle:
              members = {m.name: handle.extractfile(m).read() for m in handle.getmembers()}
          library = members[asset['library']['path']]
          static_library = members[asset['static_library']['path']]
          assert hashlib.sha256(library).hexdigest() == asset['library']['sha256']
          assert hashlib.sha256(static_library).hexdigest() == asset['static_library']['sha256']
          destination = Path('crates/alopex-sql/nim-sql-parser/vendor') / target
          destination.mkdir(parents=True, exist_ok=True)
          name = Path(asset['library']['path']).name
          static_name = Path(asset['static_library']['path']).name
          (destination / name).write_bytes(library)
          (destination / static_name).write_bytes(static_library)
          (destination / 'CONTRACT_VERSION').write_bytes(b'0.12.0\n')
          (destination / 'SHA256SUMS').write_bytes(f"{asset['library']['sha256']}  {name}\n{asset['static_library']['sha256']}  {static_name}\n".encode())
          package_native = Path('crates/alopex-py/python/alopex/native')
          package_native.mkdir(parents=True, exist_ok=True)
          (package_native / name).write_bytes(library)
          (package_native / 'CONTRACT_VERSION').write_bytes(b'0.12.0\n')
          (package_native / 'SHA256SUMS').write_bytes(f"{asset['library']['sha256']}  {name}\n".encode())
          PY
      - name: Checkout exact-SHA release repair tool
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: .release-tools
          sparse-checkout: scripts/release/retarget_python_parser_source.py
          sparse-checkout-cone-mode: false
      - name: Bind source parser pins to release assets
        run: |
          python .release-tools/scripts/release/retarget_python_parser_source.py \
            --manifest "${PARSER_MANIFEST}" \
            --vendor-dir crates/alopex-sql/nim-sql-parser/vendor \
            --build-support crates/alopex-sql/build_support.rs
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          maturin-version: "1.14.1"
          command: build
          args: -m crates/alopex-py/Cargo.toml --release --auditwheel repair --out dist
          target: ${{ matrix.target }}
      - name: Inspect macOS wheel contents
        shell: bash
        run: |
          set -euo pipefail
          library_sha="$(TARGET_TRIPLE="${{ matrix.target_triple }}" python - <<'PY'
          import json, os
          from pathlib import Path
          version = os.environ['ALOPEX_VERSION']
          manifest = json.loads(Path(f'.core-parser-assets/parser-vendor-manifest-v{version}.json').read_text())
          print(next(a['library']['sha256'] for a in manifest['assets'] if a['target'] == os.environ['TARGET_TRIPLE']))
          PY
          )"
          for wheel in dist/*.whl; do
            python scripts/release/verify_wheel_contents.py "$wheel" \
              --expected-library-path alopex/native/libalopex_sql_parser.dylib \
              --expected-library-sha256 "$library_sha" --expected-contract-version 0.12.0
          done
      - name: Exercise macOS wheel vector and streaming APIs
        shell: bash
        run: |
          set -euo pipefail
          smoke_venv="${RUNNER_TEMP}/alopex-wheel-api-smoke"
          python -m venv "${smoke_venv}"
          "${smoke_venv}/bin/python" -m pip install numpy==2.2.1
          "${smoke_venv}/bin/python" -m pip install --no-index --no-deps dist/*.whl
          "${smoke_venv}/bin/python" scripts/release/verify_python_vector_api.py
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-${{ matrix.target }}
          path: dist/*

  windows:
    name: windows (x86_64)
    runs-on: windows-latest
    needs: [prepare-repair-release]
    if: ${{ !inputs.repair_forward }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.ref }}
      - name: Resolve source release version
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\([0-9][0-9.]*\)"/\1/p' Cargo.toml | head -1)"
          [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "ALOPEX_VERSION=${version}" >> "${GITHUB_ENV}"
          echo "CORE_TAG=v${version}" >> "${GITHUB_ENV}"
          echo "PARSER_MANIFEST=.core-parser-assets/parser-vendor-manifest-v${version}.json" >> "${GITHUB_ENV}"
      - name: Stage exact Alopex parser assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf .core-parser-assets && mkdir -p .core-parser-assets
          for attempt in $(seq 1 30); do
            if gh release download "${CORE_TAG}" --repo alopex-db/alopex \
              --pattern "parser-assets-v${ALOPEX_VERSION}.json" \
              --pattern "parser-vendor-manifest-v${ALOPEX_VERSION}.json" \
              --pattern "alopex-parser-v${ALOPEX_VERSION}-contract-0.12.0-*.tar.gz" \
              --dir .core-parser-assets --clobber; then
              break
            fi
            rm -rf .core-parser-assets && mkdir -p .core-parser-assets
            test "$attempt" -lt 30
            sleep 20
          done
          python scripts/release/parser_asset_manifest.py verify-manifest \
            --manifest "${PARSER_MANIFEST}" \
            --asset-dir .core-parser-assets
          python - <<'PY'
          import hashlib, json, os, tarfile
          from pathlib import Path
          root = Path('.core-parser-assets')
          version = os.environ['ALOPEX_VERSION']
          envelope = json.loads((root / f'parser-assets-v{version}.json').read_text())
          assert envelope['source']['tag'] == f'v{version}'
          manifest = json.loads((root / f'parser-vendor-manifest-v{version}.json').read_text())
          target = 'x86_64-pc-windows-msvc'
          asset = next(item for item in manifest['assets'] if item['target'] == target)
          with tarfile.open(root / asset['archive']['filename'], 'r:gz') as handle:
              members = {m.name: handle.extractfile(m).read() for m in handle.getmembers()}
          library = members[asset['library']['path']]
          static_library = members[asset['static_library']['path']]
          assert hashlib.sha256(library).hexdigest() == asset['library']['sha256']
          assert hashlib.sha256(static_library).hexdigest() == asset['static_library']['sha256']
          destination = Path('crates/alopex-sql/nim-sql-parser/vendor') / target
          destination.mkdir(parents=True, exist_ok=True)
          name = Path(asset['library']['path']).name
          static_name = Path(asset['static_library']['path']).name
          (destination / name).write_bytes(library)
          (destination / static_name).write_bytes(static_library)
          (destination / 'CONTRACT_VERSION').write_bytes(b'0.12.0\n')
          (destination / 'SHA256SUMS').write_bytes(f"{asset['library']['sha256']}  {name}\n{asset['static_library']['sha256']}  {static_name}\n".encode())
          Path('crates/alopex-py/python/alopex/native').mkdir(parents=True, exist_ok=True)
          Path('crates/alopex-py/python/alopex/native', name).write_bytes(library)
          Path('crates/alopex-py/python/alopex/native/CONTRACT_VERSION').write_bytes(b'0.12.0\n')
          Path('crates/alopex-py/python/alopex/native/SHA256SUMS').write_bytes(f"{asset['library']['sha256']}  {name}\n".encode())
          PY
      - name: Checkout exact-SHA release repair tool
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: .release-tools
          sparse-checkout: scripts/release/retarget_python_parser_source.py
          sparse-checkout-cone-mode: false
      - name: Bind source parser pins to release assets
        run: |
          python .release-tools/scripts/release/retarget_python_parser_source.py \
            --manifest "${PARSER_MANIFEST}" \
            --vendor-dir crates/alopex-sql/nim-sql-parser/vendor \
            --build-support crates/alopex-sql/build_support.rs
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          maturin-version: "1.14.1"
          command: build
          args: -m crates/alopex-py/Cargo.toml --release --out dist
      - name: Inspect Windows wheel contents
        shell: bash
        run: |
          set -euo pipefail
          wheel="$(find dist -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "$wheel"
          library_sha="$(python - <<'PY'
          import json, os
          from pathlib import Path
          version = os.environ['ALOPEX_VERSION']
          manifest = json.loads(Path(f'.core-parser-assets/parser-vendor-manifest-v{version}.json').read_text())
          print(next(a['library']['sha256'] for a in manifest['assets'] if a['target'] == 'x86_64-pc-windows-msvc'))
          PY
          )"
          python scripts/release/verify_wheel_contents.py "$wheel" --require-nim-dll \
            --expected-library-sha256 "$library_sha" --expected-contract-version 0.12.0 \
            --expected-loader-path alopex/native/alopex_sql_parser.dll
      - name: Exercise Windows wheel APIs without external DLL overrides
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $venv = Join-Path $env:RUNNER_TEMP "alopex-wheel-clean-venv"
          if (Test-Path $venv) { Remove-Item -Recurse -Force $venv }
          python -m venv $venv
          $wheel = (Get-ChildItem dist\*.whl | Select-Object -First 1).FullName
          & "$venv\Scripts\python.exe" -m pip install numpy==2.2.1
          & "$venv\Scripts\python.exe" -m pip install --no-index --no-deps $wheel
          Push-Location $env:RUNNER_TEMP
          try {
            & "$venv\Scripts\python.exe" "$env:GITHUB_WORKSPACE\scripts\release\verify_python_vector_api.py"
          } finally {
            Pop-Location
          }
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-x86_64
          path: dist/*

  sdist:
    name: sdist
    runs-on: ubuntu-latest
    needs: [prepare-repair-release]
    if: ${{ !inputs.repair_forward }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.ref }}
      - name: Remove native parser vendor files from sdist staging
        run: |
          set -euo pipefail
          find crates/alopex-sql/nim-sql-parser/vendor \
            -mindepth 1 -maxdepth 1 -type d -exec rm -rf {} +
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          maturin-version: "1.14.1"
          command: sdist
          args: -m crates/alopex-py/Cargo.toml --out dist
      - name: Inspect sdist contents
        shell: bash
        run: |
          set -euo pipefail
          for archive in dist/*.tar.gz; do
            python scripts/release/verify_wheel_contents.py "$archive"
          done
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*

  publish-testpypi:
    name: publish-testpypi
    runs-on: ubuntu-latest
    needs: [linux, macos, windows, sdist]
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Flatten dist directory
        run: |
          mkdir -p wheels
          find dist -name "*.whl" -exec cp {} wheels/ \;
          find dist -name "*.tar.gz" -exec cp {} wheels/ \;
          ls -la wheels/
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: wheels/
          skip-existing: true

  verify-testpypi:
    name: verify-testpypi
    runs-on: ubuntu-latest
    needs: [publish-testpypi]
    steps:
      - name: Wait for TestPyPI indexing
        run: sleep 60
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install from TestPyPI
        run: |
          pip install --index-url https://test.pypi.org/simple/ \
            --extra-index-url https://pypi.org/simple/ \
            alopex
      - name: Verify import
        run: |
          python -c "from alopex import Database; print('Database import OK')"
          python -c "from alopex import Transaction; print('Transaction import OK')"

  publish-pypi:
    name: publish-pypi
    runs-on: ubuntu-latest
    needs: [verify-testpypi]
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Flatten dist directory
        run: |
          mkdir -p wheels
          find dist -name "*.whl" -exec cp {} wheels/ \;
          find dist -name "*.tar.gz" -exec cp {} wheels/ \;
          ls -la wheels/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: wheels/
          skip-existing: true

  github-release:
    name: github-release
    runs-on: ubuntu-latest
    needs: [linux, macos, windows, sdist]
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          files: dist/**/*

  final-release-join:
    name: final-release-join
    runs-on: ubuntu-latest
    needs: [prepare-repair-release, publish-pypi, github-release]
    if: ${{ always() && needs.prepare-repair-release.result == 'success' && (inputs.repair_forward || (needs.publish-pypi.result == 'success' && needs.github-release.result == 'success')) }}
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          # The join verifier evolves with the workflow repair; packaging
          # jobs above still checkout the immutable Python source tag.
          ref: ${{ github.sha }}

      - name: Resolve exact core and Python workflow identities
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PYTHON_RUN_ID: ${{ github.run_id }}
          PYTHON_HEAD_SHA: ${{ inputs.target_sha || github.sha }}
          PYTHON_TAG_NAME: ${{ inputs.release_tag || github.ref_name }}
          CORE_RUN_ID: ${{ inputs.core_run_id }}
          REPAIR_FORWARD: ${{ inputs.repair_forward }}
        run: |
          set -euo pipefail
          version="${PYTHON_TAG_NAME#alopex-py-v}"
          [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          core_tag="v${version}"
          printf 'VERSION=%s\nCORE_TAG=%s\n' "${version}" "${core_tag}" >> "${GITHUB_ENV}"
          core_tag_sha="$(gh api "repos/${REPOSITORY}/git/ref/tags/${core_tag}" | jq -r '.object.sha')"
          core_tag_type="$(gh api "repos/${REPOSITORY}/git/ref/tags/${core_tag}" | jq -r '.object.type')"
          if [[ "${core_tag_type}" == "tag" ]]; then
            core_tag_sha="$(gh api "repos/${REPOSITORY}/git/tags/${core_tag_sha}" | jq -r '.object.sha')"
          fi
          python_tag_sha="$(gh api "repos/${REPOSITORY}/git/ref/tags/${PYTHON_TAG_NAME}" | jq -r '.object.sha')"
          python_tag_type="$(gh api "repos/${REPOSITORY}/git/ref/tags/${PYTHON_TAG_NAME}" | jq -r '.object.type')"
          if [[ "${python_tag_type}" == "tag" ]]; then
            python_tag_sha="$(gh api "repos/${REPOSITORY}/git/tags/${python_tag_sha}" | jq -r '.object.sha')"
          fi
          if [[ "${REPAIR_FORWARD}" == "true" ]]; then
            PYTHON_HEAD_SHA="${python_tag_sha}"
          fi
          printf 'PYTHON_HEAD_SHA=%s\n' "${PYTHON_HEAD_SHA}" >> "${GITHUB_ENV}"
          [[ "${core_tag_sha}" == "${python_tag_sha}" ]] || {
            echo "core and Python tags do not share a peeled SHA" >&2
            exit 1
          }
          [[ "${PYTHON_HEAD_SHA}" == "${python_tag_sha}" ]] || {
            echo "Python workflow HEAD is not the peeled Python tag SHA" >&2
            exit 1
          }
          [[ "${CORE_RUN_ID}" =~ ^[1-9][0-9]*$ ]]
          core_run_json="$(gh api "repos/${REPOSITORY}/actions/runs/${CORE_RUN_ID}")"
          core_run_head_sha="$(jq -r '.head_sha' <<< "${core_run_json}")"
          test "$(jq -r '.repository.full_name' <<< "${core_run_json}")" = "${REPOSITORY}"
          test "$(jq -r '.path' <<< "${core_run_json}")" = ".github/workflows/release.yml"
          jobs="$(gh api "repos/${REPOSITORY}/actions/runs/${CORE_RUN_ID}/jobs?per_page=100")"
          JOBS="${jobs}" REPAIR_FORWARD="${REPAIR_FORWARD}" python3 - <<'PY'
          import json
          import os

          jobs = json.loads(os.environ["JOBS"])["jobs"]
          conclusions = {job["name"]: job.get("conclusion") for job in jobs}
          if conclusions.get("Publish to crates.io") != "success":
              raise SystemExit("bound core run has not successfully published crates")
          if os.environ["REPAIR_FORWARD"] != "true" and conclusions.get(
              "Create GitHub Release"
          ) != "success":
              raise SystemExit("bound core run has not successfully created the release")
          PY
          core_run_id="${CORE_RUN_ID}"
          printf 'CORE_TAG_SHA=%s\nCORE_RUN_ID=%s\nCORE_RUN_HEAD_SHA=%s\nPYTHON_RUN_ID=%s\n' \
            "${core_tag_sha}" "${core_run_id}" "${core_run_head_sha}" "${PYTHON_RUN_ID}" >> "${GITHUB_ENV}"

      - name: Download the immutable parser envelope
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p join-assets
          gh release download "${CORE_TAG}" --repo "${REPOSITORY}" \
            --pattern "parser-assets-v${VERSION}.json" \
            --pattern "parser-vendor-manifest-v${VERSION}.json" \
            --dir join-assets --clobber

      - name: Build and verify the public same-SHA join
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 - "${CORE_TAG_SHA}" "${CORE_RUN_ID}" "${CORE_RUN_HEAD_SHA}" \
            "${PYTHON_RUN_ID}" "${PYTHON_HEAD_SHA}" "join-assets" "${REPOSITORY}" "${VERSION}" <<'PY'
          import json
          import pathlib
          import sys
          import urllib.request

          core_sha, core_run, core_run_head, python_run, python_head, asset_dir, repository, version = sys.argv[1:]
          root = pathlib.Path(asset_dir)
          envelope = json.loads((root / f"parser-assets-v{version}.json").read_text())
          manifest = json.loads((root / f"parser-vendor-manifest-v{version}.json").read_text())
          def get_json(url):
              with urllib.request.urlopen(url) as response:
                  return json.load(response)
          def digest(value):
              if not isinstance(value, str) or len(value) != 64:
                  raise SystemExit(f"invalid digest: {value!r}")
              return value
          crates = []
          for name in ("alopex-core", "alopex-sql", "alopex-dataframe", "alopex-embedded", "alopex-cluster", "alopex-server", "alopex-cli"):
              payload = get_json(f"https://crates.io/api/v1/crates/{name}/{version}")
              if payload.get("version", {}).get("num") != version:
                  raise SystemExit(f"crates.io version mismatch for {name}")
              crates.append({"name": name, "status": "published"})
          pypi = get_json(f"https://pypi.org/pypi/alopex/{version}/json")
          distributions = [
              {"name": item["filename"], "status": "published", "sha256": digest(item["digests"]["sha256"])}
              for item in pypi.get("urls", [])
              if item["filename"].endswith((".whl", ".tar.gz"))
          ]
          if not distributions:
              raise SystemExit("PyPI has no wheel/sdist for the release")
          envelope_assets = {item["target"]: item for item in envelope["assets"]}
          assets = []
          for item in manifest["assets"]:
              target = item["target"]
              if target not in envelope_assets:
                  raise SystemExit(f"missing envelope target {target}")
              assets.append({
                  "target": target,
                  "archive_sha256": digest(envelope_assets[target]["sha256"]),
                  "library_sha256": digest(item["library"]["sha256"]),
                  # The core release gate's successful run is the recorded native-smoke evidence.
                  "native_smoke": True,
              })
          candidate = {
              "version": version,
              "reviewed_main_sha": core_sha,
              "tag": {"name": f"v{version}", "peeled_sha": core_sha},
              "core": {"status": "success", "published": True, "run_id": core_run, "head_sha": core_run_head, "source_sha": core_sha, "peeled_sha": core_sha, "registry": "crates.io", "crates": crates},
              "python": {"status": "success", "published": True, "run_id": python_run, "head_sha": python_head, "peeled_sha": core_sha, "registry": "pypi", "distributions": distributions},
              "parser": {"contract": manifest["contract_version"], "manifest_sha256": digest(__import__("hashlib").sha256((root / f"parser-vendor-manifest-v{version}.json").read_bytes()).hexdigest()), "envelope_sha256": digest(__import__("hashlib").sha256((root / f"parser-assets-v{version}.json").read_bytes()).hexdigest()), "assets": assets},
              "publication_order": {"core_before_python": True},
              "repair_forward": {"complete": True},
          }
          (root / "release-join.json").write_text(json.dumps(candidate, sort_keys=True))
          PY
          bash scripts/release/verify-release/run.sh --verify-join join-assets/release-join.json

  verify-public-release:
    name: Verify demos and publish docs report
    needs: [final-release-join]
    if: ${{ always() && needs.final-release-join.result == 'success' }}
    permissions:
      contents: write
      issues: write
    uses: ./.github/workflows/public-release-verification.yml
    with:
      version: ${{ inputs.release_tag || github.ref_name }}
      publish_report: true
