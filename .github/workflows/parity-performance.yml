name: Required parity performance

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Owning issue number for this acceptance run'
        required: true
        type: string
      suite:
        type: choice
        options: [curated, full]
        default: curated

permissions:
  contents: read

concurrency:
  group: parity-performance-${{ github.sha }}
  cancel-in-progress: true

env:
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  POLARS_MAX_THREADS: "1"
  RAYON_NUM_THREADS: "1"
  ALOPEX_NIM_PARSER_ALLOW_LOCAL_BUILD: "1"
  NIM_SQL_PARSER_LIB_DIR: ${{ github.workspace }}/crates/alopex-sql/nim-sql-parser

jobs:
  runner-preflight:
    if: inputs.issue_number == '712-runner-preflight'
    name: v0.8.17 HNSW runner capability preflight
    runs-on: [self-hosted, Linux, X64, alopex-performance]
    timeout-minutes: 15
    steps:
      - name: Measure without checking out or building
        timeout-minutes: 10
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import gzip
          import os
          import platform
          import shutil
          import stat
          import subprocess
          from pathlib import Path

          temp = Path(os.environ["RUNNER_TEMP"])
          private = temp / "v0817-hnsw-runner-preflight.private.json"
          public_dir = temp / "v0817-hnsw-runner-preflight-public"
          public_dir.mkdir(mode=0o700, exist_ok=True)
          errors = []
          report = {"schema": "alopex.hnsw-runner-preflight.private/v1",
                    "source_sha": os.environ["GITHUB_SHA"],
                    "qualification": "capability_probe_only"}
          try:
              release = platform.release()
              report["system"] = {
                  "machine": platform.machine(), "release": release,
                  "uid": os.geteuid(), "cpu_model": next(
                      (line.split(":", 1)[1].strip()
                       for line in Path("/proc/cpuinfo").read_text().splitlines()
                       if line.startswith("model name")), None),
                  "allowed_cpus": sorted(os.sched_getaffinity(0)),
              }
              if platform.system() != "Linux" or platform.machine() != "x86_64":
                  errors.append("incompatible_kernel_or_arch")
              if "microsoft" in release.lower():
                  errors.append("combined_wsl_windows_storage_unmeasured")
              if os.geteuid() == 0:
                  errors.append("runner_is_root")
              if len(report["system"]["allowed_cpus"]) < 2:
                  errors.append("insufficient_cpu_affinity")
              report["runtime_tools"] = {
                  name: shutil.which(name) is not None
                  for name in ("docker", "podman", "powershell.exe", "wslpath")
              }
              report["runtime_probes"] = {}
              for name, command in {
                  "docker_info": ["docker", "info", "--format", "{{json .}}"],
                  "docker_images": ["docker", "image", "ls", "--format", "{{json .}}"],
                  "podman_storage": ["podman", "system", "df", "--format", "json"],
                  "podman_images": ["podman", "images", "--format", "json"],
                  "podman_containers": ["podman", "ps", "-a", "--size",
                                        "--format", "json"],
                  "podman_volumes": ["podman", "volume", "ls", "--format", "json"],
              }.items():
                  if not report["runtime_tools"][command[0]]:
                      report["runtime_probes"][name] = {"available": False}
                      continue
                  try:
                      result = subprocess.run(command, capture_output=True,
                                              text=True, timeout=20)
                      report["runtime_probes"][name] = {
                          "available": True, "returncode": result.returncode,
                          "stdout": result.stdout[:200000],
                          "stdout_truncated": len(result.stdout) > 200000,
                          "stderr": result.stderr[:2000],
                      }
                  except subprocess.TimeoutExpired:
                      report["runtime_probes"][name] = {
                          "available": True, "timeout": True,
                      }
              report["proc_io_presence"] = {
                  name: (Path("/proc") / name / "io").exists()
                  for name in ("self", "1")
              }
              config = Path("/proc/config.gz")
              try:
                  if config.exists():
                      with gzip.open(config, "rt") as source:
                          report["task_io_config"] = [
                              line.strip() for line in source
                              if "CONFIG_TASK_IO_ACCOUNTING" in line
                          ]
                  else:
                      config = Path("/boot") / ("config-" + release)
                      report["task_io_config"] = [
                          line.strip() for line in config.read_text().splitlines()
                          if "CONFIG_TASK_IO_ACCOUNTING" in line
                      ] if config.exists() else None
              except OSError as config_error:
                  report["task_io_config_error"] = config_error.errno
              report["filesystem_usage"] = {}
              for name, path in {"wsl_root": Path("/"),
                                 "windows_c": Path("/mnt/c"),
                                 "windows_d": Path("/mnt/d")}.items():
                  if path.is_mount():
                      try:
                          usage = shutil.disk_usage(path)
                          report["filesystem_usage"][name] = {
                              "used": usage.used, "free": usage.free,
                          }
                      except OSError as usage_error:
                          report["filesystem_usage"][name] = {
                              "errno": usage_error.errno,
                          }
              report["observation_errors"] = {}
              for name, path in {
                  "self_io": Path("/proc/self/io"),
                  "self_status": Path("/proc/self/status"),
                  "cgroup": Path("/proc/self/cgroup"),
                  "mountinfo": Path("/proc/self/mountinfo"),
                  "perf_event_paranoid": Path("/proc/sys/kernel/perf_event_paranoid"),
                  "lsm": Path("/sys/kernel/security/lsm"),
              }.items():
                  try:
                      report[name] = path.read_text()
                  except OSError as exc:
                      report[name] = None
                      report["observation_errors"][name] = {
                          "errno": exc.errno, "path": str(path),
                      }
              if report["self_io"] is None or report["self_status"] is None:
                  errors.append("self_process_counters_unavailable")
              child = subprocess.Popen(["sleep", "2"])
              try:
                  for name, path in {
                      "owned_child_io": Path(f"/proc/{child.pid}/io"),
                      "owned_child_status": Path(f"/proc/{child.pid}/status"),
                  }.items():
                      try:
                          report[name] = path.read_text()
                      except OSError as exc:
                          report[name] = None
                          report["observation_errors"][name] = {
                              "errno": exc.errno, "path": str(path),
                          }
                          errors.append("owned_process_observation_unavailable")
              finally:
                  try:
                      child.wait(timeout=5)
                  except subprocess.TimeoutExpired:
                      child.kill()
                      child.wait()
                      errors.append("owned_process_cleanup_timeout")
              roots = [Path(os.environ["RUNNER_WORKSPACE"]), temp,
                       Path.home(), Path("/tmp"), Path("/var/tmp")]
              if os.environ.get("CARGO_TARGET_DIR"):
                  roots.append(Path(os.environ["CARGO_TARGET_DIR"]))
              roots = [path.resolve() for path in roots if path.exists()]
              seen = set()
              total = 0
              scan_context = {}
              for root in roots:
                  pending = [root]
                  while pending:
                      path = pending.pop()
                      try:
                          scan_context = {"root": str(root), "path": str(path),
                                          "operation": "lstat"}
                          info = path.lstat()
                      except FileNotFoundError:
                          continue
                      key = (info.st_dev, info.st_ino)
                      if key in seen or stat.S_ISLNK(info.st_mode):
                          continue
                      seen.add(key)
                      total += info.st_blocks * 512
                      if stat.S_ISDIR(info.st_mode):
                          scan_context["operation"] = "scandir"
                          with os.scandir(path) as entries:
                              pending.extend(Path(entry.path) for entry in entries)
              report["storage"] = {
                  "conservative_roots": [str(path) for path in roots],
                  "allocated_bytes": total,
                  "workspace_free_bytes": shutil.disk_usage(
                      os.environ["RUNNER_WORKSPACE"]).free,
              }
              if total >= 40_000_000_000:
                  errors.append("storage_stop_reached")
              if total + 8_000_000_000 >= 40_000_000_000:
                  errors.append("measurement_headroom_unproven")
              if report["storage"]["workspace_free_bytes"] < 8_000_000_000:
                  errors.append("filesystem_free_space_insufficient")
          except Exception as exc:
              errors.append("preflight_measurement_error")
              report["private_error"] = repr(exc)
              report["storage_scan_error"] = scan_context if "scan_context" in locals() else None
              if "scan_context" in locals() and scan_context:
                  path = Path(scan_context["path"])
                  report["storage_scan_ancestors"] = []
                  for ancestor in (path, *path.parents):
                      try:
                          info = ancestor.lstat()
                          report["storage_scan_ancestors"].append({
                              "path": str(ancestor), "mode": stat.S_IMODE(info.st_mode),
                              "uid": info.st_uid, "gid": info.st_gid,
                              "blocks": info.st_blocks,
                          })
                      except OSError as ancestor_error:
                          report["storage_scan_ancestors"].append({
                              "path": str(ancestor), "errno": ancestor_error.errno,
                          })
          report["error_codes"] = sorted(set(errors))
          private.write_text(json.dumps(report, sort_keys=True))
          private.chmod(0o600)
          (public_dir / "result.json").write_text(json.dumps({
              "schema": "alopex.hnsw-runner-preflight-public/v1",
              "case_id": "hnsw_runner_capability",
              "outcome": "ready_for_private_review" if not errors else "failed",
              "error_codes": sorted(set(errors)),
              "performance_qualified": False,
          }, sort_keys=True))
          print("PREFLIGHT_RECORDED")
          PY
      - name: Encrypt private diagnostics
        shell: bash
        run: |
          set -euo pipefail
          cert="$RUNNER_TEMP/v0817-hnsw-runner-preflight-cert.pem"
          public_dir="$RUNNER_TEMP/v0817-hnsw-runner-preflight-public"
          trap 'rm -f "$cert" "$RUNNER_TEMP/v0817-hnsw-runner-preflight.private.json"' EXIT
          curl -fsSL --max-time 30 \
            https://raw.githubusercontent.com/alopex-db/alopex/2911b9201d54233ebdcb63ed27322509624f7140/.github/ops/native-evidence-cert.pem \
            -o "$cert"
          echo "d33a612dab2f76986e0dc6ba0ba45be15265ceccd2d56b07c14f9f696259f6b2  $cert" | sha256sum --check --status
          openssl cms -encrypt -aes-256-cbc -binary -outform DER \
            -in "$RUNNER_TEMP/v0817-hnsw-runner-preflight.private.json" \
            -out "$public_dir/private-evidence.cms" "$cert"
      - uses: actions/upload-artifact@v4
        with:
          name: v0817-hnsw-runner-preflight
          path: ${{ runner.temp }}/v0817-hnsw-runner-preflight-public/
          if-no-files-found: error
          retention-days: 7
      - name: Enforce preflight outcome
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          result = json.loads((Path(os.environ["RUNNER_TEMP"]) /
                               "v0817-hnsw-runner-preflight-public/result.json").read_text())
          if result["outcome"] != "ready_for_private_review":
              raise SystemExit("preflight failed; inspect fixed error codes in result.json")
          PY
      - name: Remove owned preflight files
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/v0817-hnsw-runner-preflight.private.json" \
            "$RUNNER_TEMP/v0817-hnsw-runner-preflight-cert.pem"
          rm -rf "$RUNNER_TEMP/v0817-hnsw-runner-preflight-public"

  performance:
    if: inputs.issue_number != '712-runner-preflight'
    name: ${{ github.event_name == 'schedule' && 'full' || inputs.suite || 'curated' }} parity performance
    runs-on: [self-hosted, Linux, X64, alopex-performance]
    timeout-minutes: 360
    services:
      postgres:
        image: postgres:16.14
        env:
          POSTGRES_PASSWORD: alopex
          POSTGRES_DB: alopex_perf
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d alopex_perf"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.11"
      - name: Prepare isolated Python environment
        id: prepare_python
        run: |
          python -m venv .venv-performance
          echo "VIRTUAL_ENV=$PWD/.venv-performance" >> "$GITHUB_ENV"
          echo "$PWD/.venv-performance/bin" >> "$GITHUB_PATH"
      - uses: dtolnay/rust-toolchain@1.96.0
      - name: Install pinned reference engines
        id: dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            -r scripts/performance/requirements-v0811.txt
      - name: Build release Alopex and pinned Nim parser
        id: build
        run: |
          bash scripts/build-nim-parser.sh --backend docker
          maturin develop --release -m crates/alopex-py/Cargo.toml
      - name: Verify performance contracts
        id: contracts
        run: |
          python scripts/validate_v0811_ledgers.py
          python scripts/reference_tests/polars_public_inventory.py \
            docs/parity/polars-v1.43.2.json
          python scripts/reference_tests/sql_public_inventory.py \
            docs/parity/sql-v0.8.11.json
          python scripts/reference_tests/hnsw_public_inventory.py \
            docs/parity/hnsw-v0.8.11.json
      - name: Run pinned SQL live differential
        id: differential
        env:
          ALOPEX_REFERENCE_POSTGRES_DSN: postgresql://postgres:alopex@127.0.0.1:5432/alopex_perf
        run: |
          python -m scripts.reference_tests.sql_v0811_differential \
            --engine sqlite --engine postgresql --engine duckdb --engine datafusion \
            --output performance-artifacts/sql/reference-evidence.json
          python -m scripts.reference_tests.sql_v0811_advanced_dml \
            --engine postgresql --engine duckdb \
            --output performance-artifacts/sql/advanced-dml-evidence.json
      - name: Download the checksum-pinned HNSW dataset
        id: hnsw_dataset
        run: |
          curl -fL https://github.com/user-attachments/files/31764184/archive.zip -o "$RUNNER_TEMP/amazon.zip"
          echo "fb3c0bc51dbfaae83c8b72cf472a69fe4a894d4d9e8fa639ff22f4100da123ea  $RUNNER_TEMP/amazon.zip" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/amazon"
          python -m zipfile -e "$RUNNER_TEMP/amazon.zip" "$RUNNER_TEMP/amazon"
          dataset="$RUNNER_TEMP/amazon/home/sdf/marketing_sample_for_amazon_com-ecommerce__20200101_20200131__10k_data.csv"
          echo "ec7ad773a70e654d65ee3757748fe99d614be24ad087330e437bcc84cda85291  $dataset" | sha256sum --check --strict
          echo "HNSW_DATASET=$dataset" >> "$GITHUB_ENV"
      - name: Download the checksum-pinned scale dataset
        id: scale_dataset
        run: |
          dataset="$RUNNER_TEMP/glove-100-angular.hdf5"
          curl -fL https://ann-benchmarks.com/glove-100-angular.hdf5 -o "$dataset"
          echo "544af1d5e84e112cd4749571dcfd8ca109818a572f850af75a3a09e093a953c4  $dataset" | sha256sum --check --strict
          echo "GLOVE_DATASET=$dataset" >> "$GITHUB_ENV"
      - name: Measure paired engines
        id: benchmark
        env:
          SUITE: ${{ github.event_name == 'schedule' && 'full' || inputs.suite || 'curated' }}
          ALOPEX_PERF_POSTGRES_DSN: postgresql://postgres:alopex@127.0.0.1:5432/alopex_perf
        run: |
          mkdir -p performance-artifacts/hnsw
          RELEASE_VERSION="$(python - <<'PY'
          import tomllib
          with open("Cargo.toml", "rb") as stream:
              print(tomllib.load(stream)["workspace"]["package"]["version"])
          PY
          )"
          export RELEASE_VERSION
          cpu_model="$(lscpu | sed -n 's/^Model name:[[:space:]]*//p')"
          test -n "$cpu_model"
          {
            echo "cpu_model=$cpu_model"
            echo "benchmark_core=0"
            taskset -c 0 python -c 'import os; print("benchmark_affinity=" + ",".join(map(str, sorted(os.sched_getaffinity(0)))))'
            uname -a
            python --version
            python -m pip freeze --all
          } > performance-artifacts/hnsw/environment.txt
          taskset -c 0 python scripts/performance/hnsw_v0811_contract.py \
            --dataset "$HNSW_DATASET" \
            --glove-dataset "$GLOVE_DATASET" \
            --max-scale-n 50000 \
            --output performance-artifacts/hnsw \
            --release-version "$RELEASE_VERSION"
          taskset -c 0 python scripts/performance/flat_vector_ingest_v0814.py \
            --output performance-artifacts/hnsw/flat-vector-ingest-v0814.json
          python scripts/performance/release_hnsw_evidence.py \
            --root performance-artifacts/hnsw \
            --version "$RELEASE_VERSION" \
            --commit "$GITHUB_SHA"
          taskset -c 0 python scripts/performance/parity_v0811_measure.py \
            --suite "$SUITE" \
            --hnsw-measurements performance-artifacts/hnsw/hnsw-diagnostic.json \
            --output performance-artifacts/measurements.json
      - name: Verify SQL HNSW cost regression
        id: sql_knn_cost
        env:
          ALOPEX_KNN_COST_RAW_NDJSON: ${{ github.workspace }}/performance-artifacts/hnsw/sql-knn-index-cost.raw.ndjson
          ALOPEX_KNN_COST_SOURCE_COMMIT: ${{ github.sha }}
          ALOPEX_KNN_COST_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -o pipefail
          taskset -c 0 cargo test --release -p alopex-embedded --features lane_ci --test knn_index_cost \
            sql_knn_hnsw_cost_process_separated_evidence -- --ignored --exact --nocapture \
            2>&1 | tee performance-artifacts/hnsw/sql-knn-index-cost.txt
      - name: Verify prepared batch throughput
        id: prepared_batch_throughput
        run: |
          set -o pipefail
          taskset -c 0 cargo test --release -p alopex-embedded --features lane_ci --test prepared_statement \
            prepared_execute_many_hnsw_throughput_matches_literal_batch \
            -- --ignored --exact --nocapture \
            2>&1 | tee performance-artifacts/hnsw/prepared-batch-throughput.txt
      - name: Enforce curated/full performance contracts
        id: gate
        env:
          SUITE: ${{ github.event_name == 'schedule' && 'full' || inputs.suite || 'curated' }}
        run: |
          python scripts/performance/parity_v0811_gate.py \
            --suite "$SUITE" \
            --measurements performance-artifacts/measurements.json \
            --output performance-artifacts/gate.json
      - name: Record immutable run status
        if: always()
        env:
          DEPENDENCIES: ${{ steps.dependencies.outcome }}
          BUILD: ${{ steps.build.outcome }}
          CONTRACTS: ${{ steps.contracts.outcome }}
          DIFFERENTIAL: ${{ steps.differential.outcome }}
          HNSW_DATASET: ${{ steps.hnsw_dataset.outcome }}
          SCALE_DATASET: ${{ steps.scale_dataset.outcome }}
          BENCHMARK: ${{ steps.benchmark.outcome }}
          SQL_KNN_COST: ${{ steps.sql_knn_cost.outcome }}
          PREPARED_BATCH_THROUGHPUT: ${{ steps.prepared_batch_throughput.outcome }}
          GATE: ${{ steps.gate.outcome }}
        run: |
          mkdir -p performance-artifacts/hnsw
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          names = ("dependencies", "build", "contracts", "differential", "hnsw_dataset", "scale_dataset", "benchmark", "sql_knn_cost", "prepared_batch_throughput", "gate")
          stages = {name: os.environ[name.upper()] for name in names}
          failure = next((name for name in names if stages[name] == "failure"), None)
          incomplete = next((name for name in names if stages[name] != "success"), None)
          status = "failure" if failure else "incomplete" if incomplete else "success"
          payload = {
              "schema": "alopex.hnsw-diagnostic-run/v1",
              "source_commit": os.environ["GITHUB_SHA"],
              "run_id": int(os.environ["GITHUB_RUN_ID"]),
              "run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "status": status,
              "failure_stage": failure or incomplete,
              "stages": stages,
          }
          root = Path("performance-artifacts/hnsw")
          (root / "benchmark-status.json").write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          lines = ["# HNSW benchmark run", "", f"Status: `{status}`", "", f"Source commit: `{payload['source_commit']}`", "", "| stage | outcome |", "|---|---|"]
          lines.extend(f"| {name} | {stages[name]} |" for name in names)
          (root / "benchmark-status.md").write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parity-performance-${{ github.run_id }}-${{ github.run_attempt }}
          path: performance-artifacts
          if-no-files-found: error
          retention-days: 30

  retain-run-outcome:
    name: retain immutable performance run outcome
    needs: performance
    if: ${{ always() && inputs.issue_number != '712-runner-preflight' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Record the terminal performance job result
        env:
          PERFORMANCE_JOB_RESULT: ${{ needs.performance.result }}
        run: |
          mkdir -p performance-outcome
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          result = os.environ["PERFORMANCE_JOB_RESULT"]
          status = "success" if result == "success" else "failure" if result == "failure" else "incomplete"
          payload = {
              "schema": "alopex.parity-performance-run/v1",
              "source_commit": os.environ["GITHUB_SHA"],
              "run_id": int(os.environ["GITHUB_RUN_ID"]),
              "run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "status": status,
              "failure_stage": None if status == "success" else "performance_job",
              "performance_job_result": result,
          }
          root = Path("performance-outcome")
          (root / "outcome.json").write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          lines = [
              "# Parity performance run outcome",
              "",
              f"Status: `{status}`",
              "",
              f"Performance job result: `{result}`",
              "",
              f"Source commit: `{payload['source_commit']}`",
              "",
              f"Run: `{payload['run_id']}` attempt `{payload['run_attempt']}`",
          ]
          (root / "outcome.md").write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY
      - name: Upload the run outcome independently of the benchmark runner
        uses: actions/upload-artifact@v4
        with:
          name: parity-performance-outcome-${{ github.run_id }}-${{ github.run_attempt }}
          path: performance-outcome
          if-no-files-found: error
          retention-days: 90
