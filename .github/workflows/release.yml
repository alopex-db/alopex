name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always
  NIM_SQL_PARSER_DIR: crates/alopex-sql/nim-sql-parser

jobs:
  # Run CI checks before release
  ci-gate:
    name: v0.8 CI Gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Free disk space
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Setup Python venv
        shell: bash
        run: |
          VENV_DIR="${RUNNER_TEMP:-/tmp}/alopex-v08-gate-venv"
          rm -rf "$VENV_DIR"
          python -m venv "$VENV_DIR"
          VENV_ROOT=$(VENV_DIR="$VENV_DIR" python -c "import os; from pathlib import Path; print(Path(os.environ['VENV_DIR']).resolve().as_posix())")
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            VENV_BIN="$VENV_ROOT/Scripts"
            VENV_PY="$VENV_BIN/python.exe"
          else
            VENV_BIN="$VENV_ROOT/bin"
            VENV_PY="$VENV_BIN/python"
          fi
          test -x "$VENV_PY"
          echo "$VENV_BIN" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$VENV_ROOT" >> "$GITHUB_ENV"
          echo "PYO3_PYTHON=$VENV_PY" >> "$GITHUB_ENV"
          echo "PYTHON_SYS_EXECUTABLE=$VENV_PY" >> "$GITHUB_ENV"
          echo "ALOPEX_PYTHON=$VENV_PY" >> "$GITHUB_ENV"
          echo "V07_GATE_VENV_DIR=$VENV_ROOT" >> "$GITHUB_ENV"
      - name: Install Python deps
        run: python -m pip install --upgrade pip maturin pytest numpy
      - name: Setup exact Nim parser toolchain
        uses: ./.github/actions/setup-nim-parser-toolchain
      - name: Build Nim SQL parser library
        shell: bash
        run: bash scripts/build-nim-parser.sh --backend host
      - name: Run Nim SQL parser tests
        shell: bash
        run: bash scripts/test-nim-parser.sh --backend host
      - name: Run controlled Nim parser failure
        id: nim_parser_controlled_failure
        continue-on-error: true
        shell: bash
        run: |
          proof_root="${RUNNER_TEMP:-/tmp}"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            proof_root="$(cygpath -u "$proof_root")"
          fi
          proof_path="${proof_root}/alopex-nim-controlled-failure-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.txt"
          test ! -e "$proof_path"
          export ALOPEX_NIM_CONTROLLED_FAILURE_PROOF="$proof_path"
          echo "ALOPEX_NIM_CONTROLLED_FAILURE_PROOF=$proof_path" >> "$GITHUB_ENV"
          bash scripts/test-nim-parser.sh --backend host --controlled-failure
      - name: Stage reviewed parser candidate for v0.8 surfaces
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux)
              parser_target="x86_64-unknown-linux-gnu"
              parser_library="libalopex_sql_parser.so"
              ;;
            Windows)
              parser_target="x86_64-pc-windows-msvc"
              parser_library="alopex_sql_parser.dll"
              ;;
            *)
              echo "unsupported v0.8 parser gate runner: $RUNNER_OS" >&2
              exit 2
              ;;
          esac
          reviewed_dir="${NIM_SQL_PARSER_DIR}/vendor/${parser_target}"
          for candidate in "$parser_library" CONTRACT_VERSION SHA256SUMS; do
            test -f "${reviewed_dir}/${candidate}"
            cp -f -- "${reviewed_dir}/${candidate}" "${NIM_SQL_PARSER_DIR}/${candidate}"
            cmp -s "${reviewed_dir}/${candidate}" "${NIM_SQL_PARSER_DIR}/${candidate}"
          done
          mkdir -p crates/alopex-py/python/alopex/native
          cp -f -- "${reviewed_dir}/${parser_library}" crates/alopex-py/python/alopex/native/
          cp -f -- "${reviewed_dir}/CONTRACT_VERSION" crates/alopex-py/python/alopex/native/
          cp -f -- "${reviewed_dir}/SHA256SUMS" crates/alopex-py/python/alopex/native/
      - name: Add Nim library to PATH (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: echo "${GITHUB_WORKSPACE}/${NIM_SQL_PARSER_DIR}" >> "$GITHUB_PATH"
      - name: Run v0.7 baseline gate (Linux)
        if: runner.os == 'Linux'
        env:
          # The baseline crate contract is tied to the checked-in, checksummed
          # vendor identity. The fresh parser build above is independently
          # tested and packaged as a v0.8.5 release asset; it must not be fed
          # into build_support's v0.8.4 vendor verifier.
          NIM_SQL_PARSER_DIR: crates/alopex-sql/nim-sql-parser/vendor/x86_64-unknown-linux-gnu
          LD_LIBRARY_PATH: ${{ github.workspace }}/crates/alopex-sql/nim-sql-parser/vendor/x86_64-unknown-linux-gnu:${{ env.LD_LIBRARY_PATH }}
        run: bash scripts/release/v07_gate.sh
      - name: Build Python extension for v0.8 gate (Windows)
        if: runner.os == 'Windows'
        run: maturin develop -m crates/alopex-py/Cargo.toml
      - name: Run v0.8 release gate
        shell: bash
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
          LD_LIBRARY_PATH: ${{ github.workspace }}/${{ env.NIM_SQL_PARSER_DIR }}:${{ env.LD_LIBRARY_PATH }}
          ALOPEX_NIM_CONTROLLED_FAILURE_OUTCOME: ${{ steps.nim_parser_controlled_failure.outcome }}
        run: bash crates/alopex-tools/v08/verify-v08-surfaces.sh

  build-release:
    name: Build Release (${{ matrix.target }})
    needs: [ci-gate]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: alopex
            asset_name: alopex-linux-x86_64
          # x86_64 macOS release builds must run on an Intel runner because
          # the Nim SQL parser shared library is built natively before linking.
          - os: macos-15-intel
            target: x86_64-apple-darwin
            artifact_name: alopex
            asset_name: alopex-macos-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: alopex
            asset_name: alopex-macos-aarch64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: alopex.exe
            asset_name: alopex-windows-x86_64.exe

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.90.0
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Setup Python for archive verification
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup exact Nim parser toolchain
        uses: ./.github/actions/setup-nim-parser-toolchain
      - name: Build Nim SQL parser library
        shell: bash
        run: |
          bash scripts/build-nim-parser.sh --backend host \
            --target "${{ matrix.target }}" --archive-dir artifacts/parser
      - name: Verify parser target record
        shell: bash
        run: |
          set -euo pipefail
          record="$(find artifacts/parser -maxdepth 1 -name '*${{ matrix.target }}.json' -type f -print -quit)"
          test -n "$record"
          python scripts/release/parser_asset_manifest.py verify-target \
            --record "$record" --asset-dir artifacts/parser
      - name: Extract and run native smoke
        shell: bash
        run: |
          set -euo pipefail
          RECORD="$(find artifacts/parser -maxdepth 1 -name '*${{ matrix.target }}.json' -type f -print -quit)" \
          ARCHIVE_DIR="artifacts/parser/native-smoke" \
          python - <<'PY'
          import ctypes
          import json
          import os
          from pathlib import Path
          import tarfile

          record = json.loads(Path(os.environ["RECORD"]).read_text(encoding="utf-8"))
          archive_path = Path("artifacts/parser") / record["archive"]["filename"]
          extract_dir = Path(os.environ["ARCHIVE_DIR"])
          extract_dir.mkdir(parents=True, exist_ok=True)
          with tarfile.open(archive_path, "r:gz") as archive:
              archive.extractall(extract_dir)
          library = extract_dir / record["library"]["path"]
          loaded = ctypes.CDLL(str(library))
          loaded.alopex_parser_version.restype = ctypes.c_char_p
          version = loaded.alopex_parser_version().decode("ascii")
          if version != "0.4.0":
              raise SystemExit(f"native smoke version mismatch: {version}")
          print(f"native smoke passed: {record['target']} parser {version}")
          PY
      - name: Build
        run: cargo build --release --target ${{ matrix.target }} -p alopex-cli

      - name: Strip binary (Linux and macOS)
        if: matrix.os != 'windows-latest'
        run: strip target/${{ matrix.target }}/release/${{ matrix.artifact_name }}

      - name: Rename artifact
        shell: bash
        run: |
          mkdir -p artifacts
          cp target/${{ matrix.target }}/release/${{ matrix.artifact_name }} artifacts/${{ matrix.asset_name }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: |
            artifacts/${{ matrix.asset_name }}
            artifacts/parser/*.json
            artifacts/parser/*.tar.gz

  create-release:
    name: Create GitHub Release
    needs: build-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Verify peeled release tag
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --tags origin
          test "$(git describe --tags --exact-match HEAD)" = "${GITHUB_REF_NAME}"
          test "$(git rev-parse "${GITHUB_REF_NAME}^{commit}")" = "${GITHUB_SHA}"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Assemble and verify parser manifest
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t records < <(find artifacts -maxdepth 1 -name 'alopex-parser-*.json' -type f | sort)
          test "${#records[@]}" -eq 4
          args=()
          for record in "${records[@]}"; do args+=(--record "$record"); done
          python scripts/release/parser_asset_manifest.py assemble-manifest \
            "${args[@]}" --asset-dir artifacts --output artifacts/parser-vendor-manifest-v0.8.5.json
          python scripts/release/parser_asset_manifest.py verify-manifest \
            --manifest artifacts/parser-vendor-manifest-v0.8.5.json --asset-dir artifacts
          python scripts/release/parser_asset_manifest.py release-envelope \
            --manifest artifacts/parser-vendor-manifest-v0.8.5.json \
            --asset-dir artifacts --tag "$GITHUB_REF_NAME" --tag-sha "$GITHUB_SHA" \
            --output artifacts/parser-assets-v0.8.5.json

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-crate:
    name: Publish to crates.io
    needs: [build-release, create-release]
    runs-on: ubuntu-latest
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_TOKEN }}
      NIM_SQL_PARSER_LIB_DIR: ${{ github.workspace }}/crates/alopex-sql/nim-sql-parser
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90.0
      - uses: Swatinem/rust-cache@v2

      - name: Verify peeled release tag and create clean source staging
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --tags origin
          test "$(git describe --tags --exact-match HEAD)" = "${GITHUB_REF_NAME}"
          test "$(git rev-parse "${GITHUB_REF_NAME}^{commit}")" = "${GITHUB_SHA}"
          test -z "$(git status --porcelain)"
          stage="${RUNNER_TEMP}/alopex-release-source"
          rm -rf "$stage"
          mkdir -p "$stage"
          git archive --format=tar "${GITHUB_REF_NAME}^{commit}" | tar -xf - -C "$stage"
          test -z "$(git -C "$stage" status --porcelain 2>/dev/null || true)"
          echo "RELEASE_STAGE=$stage" >> "$GITHUB_ENV"

      - name: Create publish helper
        run: |
          cat > publish-crate.sh <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          crate="$1"
          version="$(python - "$crate" "$RELEASE_STAGE" <<'PY'
          import json
          from pathlib import Path
          import subprocess
          import sys
          name = sys.argv[1]
          stage = Path(sys.argv[2])
          data = json.loads(subprocess.check_output([
              "cargo", "metadata", "--manifest-path", str(stage / "Cargo.toml"),
              "--no-deps", "--format-version", "1"
          ]))
          for pkg in data["packages"]:
              if pkg["name"] == name:
                  print(pkg["version"])
                  sys.exit(0)
          sys.exit(1)
          PY
          )"
          status="$(curl -sS --retry 5 --retry-connrefused --retry-delay 2 \
            -H "User-Agent: alopex-release/${GITHUB_RUN_ID:-local}" \
            -H "Accept: application/json" \
            -o /dev/null -w "%{http_code}" \
            "https://crates.io/api/v1/crates/${crate}/${version}")"
          if [[ "$status" == "200" ]]; then
            echo "skip: ${crate}@${version} already published"
            exit 0
          fi
          if [[ "$status" != "404" ]]; then
            echo "unexpected crates.io status ${status} for ${crate}@${version}" >&2
            exit 1
          fi
          cargo publish --manifest-path "${RELEASE_STAGE}/Cargo.toml" -p "${crate}"
          EOF
          chmod +x publish-crate.sh

      - name: Publish alopex-core
        run: ./publish-crate.sh alopex-core

      - name: Wait for crates.io index update
        run: sleep 30

      - name: Publish alopex-sql
        run: ./publish-crate.sh alopex-sql

      - name: Wait for crates.io index update
        run: sleep 30

      - name: Publish alopex-dataframe
        run: ./publish-crate.sh alopex-dataframe

      - name: Wait for crates.io index update
        run: sleep 30

      # alopex-embedded depends on alopex-cluster at the same release
      # version, so cluster must be visible on crates.io first.
      - name: Publish alopex-cluster
        run: ./publish-crate.sh alopex-cluster

      - name: Wait for crates.io index update
        run: sleep 30

      - name: Publish alopex-embedded
        run: ./publish-crate.sh alopex-embedded

      - name: Wait for crates.io index update
        run: sleep 30

      - name: Publish alopex-server
        run: ./publish-crate.sh alopex-server

      - name: Wait for crates.io index update
        run: sleep 30

      - name: Publish alopex-cli
        run: ./publish-crate.sh alopex-cli

  dispatch-python-release:
    name: Publish Python and require public demos
    needs: [publish-crate]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create or verify matching Python tag
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\([0-9][0-9.]*\)"/\1/p' Cargo.toml | head -1)"
          [[ "${GITHUB_REF_NAME}" == "v${version}" ]]
          python_tag="alopex-py-v${version}"
          if git rev-parse --verify --quiet "refs/tags/${python_tag}" >/dev/null; then
            test "$(git rev-parse "${python_tag}^{commit}")" = "${GITHUB_SHA}"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "${python_tag}" "${GITHUB_SHA}" -m "Release ${python_tag}"
            git push origin "${python_tag}"
          fi
          started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh workflow run alopex-py-release.yml --ref "${GITHUB_REF_NAME}" \
            -f "source_ref=${python_tag}" -f "target_sha=${GITHUB_SHA}" \
            -f "release_tag=${python_tag}"
          echo "python_tag=${python_tag}" >> "${GITHUB_OUTPUT}"
          echo "started_at=${started_at}" >> "${GITHUB_OUTPUT}"

      - name: Wait for Python publish, demos, and docs report
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHON_TAG: ${{ steps.release.outputs.python_tag }}
          STARTED_AT: ${{ steps.release.outputs.started_at }}
        shell: bash
        run: |
          set -euo pipefail
          run_id=""
          for attempt in $(seq 1 60); do
            run_id="$(gh run list --workflow alopex-py-release.yml \
              --event workflow_dispatch --limit 20 --json databaseId,headSha,createdAt \
              --jq ".[] | select(.headSha == \"${GITHUB_SHA}\" and .createdAt >= \"${STARTED_AT}\") | .databaseId" | head -1)"
            [[ -n "${run_id}" ]] && break
            sleep 10
          done
          [[ -n "${run_id}" ]]
          gh run watch "${run_id}" --exit-status
