name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing immutable core release tag"
        required: false
        default: ""
        type: string
      target_sha:
        description: "Peeled commit SHA of the immutable release tag"
        required: false
        default: ""
        type: string

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always
  NIM_SQL_PARSER_DIR: crates/alopex-sql/nim-sql-parser
  # A tag push uses github.ref_name/github.sha. A manual run names its tag.
  RELEASE_TAG_NAME: ${{ inputs.release_tag || github.ref_name }}
  RELEASE_TARGET_SHA: ${{ inputs.target_sha || github.sha }}

jobs:
  ci-gate:
    name: Approved source evidence
    runs-on: ubuntu-latest
    outputs:
      kind: ${{ steps.identity.outputs.kind }}
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_tag || github.ref }}
      - name: Verify immutable tag and approved CI evidence
        id: identity
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${RELEASE_TAG_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-rc\.[1-9][0-9]*$ ]]; then
            echo "kind=rc" >> "${GITHUB_OUTPUT}"
          elif [[ "${RELEASE_TAG_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "kind=stable" >> "${GITHUB_OUTPUT}"
          else
            echo "release tag must be vX.Y.Z or vX.Y.Z-rc.N" >&2
            exit 1
          fi
          [[ "${RELEASE_TARGET_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git cat-file -t "${RELEASE_TAG_NAME}")" == "tag" ]]
          test "$(git rev-parse "${RELEASE_TAG_NAME}^{commit}")" = "${RELEASE_TARGET_SHA}"
          test "$(git rev-parse HEAD)" = "${RELEASE_TARGET_SHA}"
          # The immutable tag, not branch membership, selects the release candidate.
          approved=false
          for attempt in $(seq 1 30); do
            if gh run list --workflow ci.yml --commit "${RELEASE_TARGET_SHA}" \
              --json status,conclusion,headSha --limit 20 \
              --jq 'any(.[]; .status == "completed" and .conclusion == "success")' \
              | grep -qx true; then
              approved=true
              break
            fi
            sleep 10
          done
          test "${approved}" = true
      - name: Verify SQL type capability contract
        if: ${{ steps.identity.outputs.kind == 'rc' }}
        shell: bash
        run: |
          version="${RELEASE_TAG_NAME#v}"
          python scripts/release/type_capability_gate.py --release-version "${version%-rc.*}"

  build-release:
    name: Build Release (${{ matrix.target }})
    needs: [ci-gate]
    if: ${{ needs.ci-gate.outputs.kind == 'rc' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: alopex
            asset_name: alopex-linux-x86_64
          # x86_64 macOS release builds must run on an Intel runner because
          # the Nim SQL parser shared library is built natively before linking.
          - os: macos-15-intel
            target: x86_64-apple-darwin
            artifact_name: alopex
            asset_name: alopex-macos-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: alopex
            asset_name: alopex-macos-aarch64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: alopex.exe
            asset_name: alopex-windows-x86_64.exe

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.90.0
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Setup Python for archive verification
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup exact Nim parser toolchain
        uses: ./.github/actions/setup-nim-parser-toolchain
      - name: Build Nim SQL parser library
        shell: bash
        run: |
          bash scripts/build-nim-parser.sh --backend host \
            --target "${{ matrix.target }}" --archive-dir artifacts/parser
      - name: Verify parser target record
        shell: bash
        run: |
          set -euo pipefail
          record="$(find artifacts/parser -maxdepth 1 -name '*${{ matrix.target }}.json' -type f -print -quit)"
          test -n "$record"
          python scripts/release/parser_asset_manifest.py verify-target \
            --record "$record" --asset-dir artifacts/parser
      - name: Extract and run native smoke
        shell: bash
        run: |
          set -euo pipefail
          RECORD="$(find artifacts/parser -maxdepth 1 -name '*${{ matrix.target }}.json' -type f -print -quit)" \
          ARCHIVE_DIR="artifacts/parser/native-smoke" \
          python - <<'PY'
          import ctypes
          import json
          import os
          from pathlib import Path
          import tarfile

          record = json.loads(Path(os.environ["RECORD"]).read_text(encoding="utf-8"))
          archive_path = Path("artifacts/parser") / record["archive"]["filename"]
          extract_dir = Path(os.environ["ARCHIVE_DIR"])
          extract_dir.mkdir(parents=True, exist_ok=True)
          with tarfile.open(archive_path, "r:gz") as archive:
              archive.extractall(extract_dir)
          library = extract_dir / record["library"]["path"]
          loaded = ctypes.CDLL(str(library))
          loaded.alopex_parser_version.restype = ctypes.c_char_p
          version = loaded.alopex_parser_version().decode("ascii")
          if version != "0.25.0":
              raise SystemExit(f"native smoke version mismatch: {version}")
          print(f"native smoke passed: {record['target']} parser {version}")
          PY
      - name: Build
        env:
          ALOPEX_NIM_PARSER_ALLOW_LOCAL_BUILD: "1"
          NIM_SQL_PARSER_LIB_DIR: ${{ github.workspace }}/crates/alopex-sql/nim-sql-parser
        run: cargo build --release --target ${{ matrix.target }} -p alopex-cli

      - name: Strip binary (Linux and macOS)
        if: matrix.os != 'windows-latest'
        run: strip target/${{ matrix.target }}/release/${{ matrix.artifact_name }}

      - name: Rename artifact
        shell: bash
        run: |
          mkdir -p artifacts
          cp target/${{ matrix.target }}/release/${{ matrix.artifact_name }} artifacts/${{ matrix.asset_name }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: |
            artifacts/${{ matrix.asset_name }}
            artifacts/parser/*.json
            artifacts/parser/*.tar.gz

  create-release:
    name: Create RC GitHub Release
    needs: [ci-gate, build-release]
    if: ${{ needs.ci-gate.outputs.kind == 'rc' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Verify release workflow contract
        shell: bash
        run: bash scripts/release/v07_gate.sh --workflow-contract-only

      - name: Verify peeled release tag
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --tags origin
          test "$(git rev-parse "${RELEASE_TAG_NAME}^{commit}")" = "${RELEASE_TARGET_SHA}"
          test "$(git rev-parse HEAD)" = "${RELEASE_TARGET_SHA}"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Flatten parser artifact payloads
        shell: bash
        run: |
          set -euo pipefail
          parser_dir="artifacts/parser"
          test -d "$parser_dir"
          mapfile -t parser_records < <(find "$parser_dir" -maxdepth 1 -name 'alopex-parser-*.json' -type f | sort)
          mapfile -t parser_archives < <(find "$parser_dir" -maxdepth 1 -name 'alopex-parser-*.tar.gz' -type f | sort)
          test "${#parser_records[@]}" -eq 4
          test "${#parser_archives[@]}" -eq 4
          for asset in "${parser_records[@]}" "${parser_archives[@]}"; do
            destination="artifacts/$(basename "$asset")"
            test ! -e "$destination"
            mv -- "$asset" "$destination"
          done
          test -z "$(find "$parser_dir" -mindepth 1 -print -quit)"
          rmdir "$parser_dir"

      - name: Assemble and verify parser manifest
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG_NAME#v}"
          version="${version%-rc.*}"
          manifest="artifacts/parser-vendor-manifest-v${version}.json"
          envelope="artifacts/parser-assets-v${version}.json"
          mapfile -t records < <(find artifacts -maxdepth 1 -name 'alopex-parser-*.json' -type f | sort)
          test "${#records[@]}" -eq 4
          args=()
          for record in "${records[@]}"; do args+=(--record "$record"); done
          python scripts/release/parser_asset_manifest.py assemble-manifest \
            "${args[@]}" --asset-dir artifacts --output "${manifest}"
          python scripts/release/parser_asset_manifest.py verify-manifest \
            --manifest "${manifest}" --asset-dir artifacts
          python scripts/release/parser_asset_manifest.py release-envelope \
            --manifest "${manifest}" \
            --asset-dir artifacts --tag "$RELEASE_TAG_NAME" --tag-sha "$RELEASE_TARGET_SHA" \
            --output "${envelope}"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG_NAME }}
          files: artifacts/*
          generate_release_notes: true
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  package-crates:
    name: Package qualified crate archives
    needs: [ci-gate, create-release]
    if: ${{ needs.ci-gate.outputs.kind == 'rc' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: dtolnay/rust-toolchain@1.90.0
      - name: Create exact source staging with candidate parser assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG_NAME#v}"
          version="${version%-rc.*}"
          git fetch --force --tags origin
          test "$(git rev-parse "${RELEASE_TAG_NAME}^{commit}")" = "${RELEASE_TARGET_SHA}"
          stage="${RUNNER_TEMP}/alopex-release-source"
          rm -rf "$stage"
          mkdir -p "$stage"
          git archive --format=tar "${RELEASE_TAG_NAME}^{commit}" | tar -xf - -C "$stage"
          asset_dir="${RUNNER_TEMP}/alopex-release-parser-assets"
          rm -rf "${asset_dir}"
          mkdir -p "${asset_dir}"
          gh release download "${RELEASE_TAG_NAME}" --repo "${GITHUB_REPOSITORY}" \
            --pattern "parser-vendor-manifest-v${version}.json" \
            --pattern "alopex-parser-v${version}-contract-0.25.0-*.tar.gz" \
            --dir "${asset_dir}" --clobber
          manifest="${asset_dir}/parser-vendor-manifest-v${version}.json"
          python "${stage}/scripts/release/parser_asset_manifest.py" verify-manifest \
            --manifest "${manifest}" --asset-dir "${asset_dir}"
          RELEASE_STAGE="${stage}" MANIFEST="${manifest}" ASSET_DIR="${asset_dir}" \
            python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path, PurePosixPath
          import tarfile

          stage = Path(os.environ["RELEASE_STAGE"])
          manifest_path = Path(os.environ["MANIFEST"])
          asset_dir = Path(os.environ["ASSET_DIR"])
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          vendor = stage / "crates/alopex-sql/nim-sql-parser/vendor"
          for asset in manifest["assets"]:
              archive = asset_dir / asset["archive"]["filename"]
              with tarfile.open(archive, "r:gz") as handle:
                  def read_asset(identity):
                      path = PurePosixPath(identity["path"])
                      if path.is_absolute() or ".." in path.parts:
                          raise SystemExit(f"unsafe parser library path: {path}")
                      source = handle.extractfile(handle.getmember(str(path)))
                      if source is None:
                          raise SystemExit(f"parser library is not a file: {path}")
                      data = source.read()
                      if hashlib.sha256(data).hexdigest() != identity["sha256"]:
                          raise SystemExit(f"parser library digest mismatch: {asset['target']}")
                      return path.name, data
                  dynamic_name, library = read_asset(asset["library"])
                  static_name, static_library = read_asset(asset["static_library"])
              target_dir = vendor / asset["target"]
              target_dir.mkdir(parents=True, exist_ok=True)
              (target_dir / dynamic_name).write_bytes(library)
              (target_dir / static_name).write_bytes(static_library)
              (target_dir / "CONTRACT_VERSION").write_bytes(b"0.25.0\n")
              (target_dir / "SHA256SUMS").write_bytes(
                  f"{asset['library']['sha256']}  {dynamic_name}\n{asset['static_library']['sha256']}  {static_name}\n".encode()
              )
          destination_manifest = vendor / "parser-vendor-manifest.json"
          destination_manifest.write_bytes(manifest_path.read_bytes())
          PY
          python scripts/release/retarget_python_parser_source.py \
            --manifest "${manifest}" \
            --vendor-dir "${stage}/crates/alopex-sql/nim-sql-parser/vendor" \
            --build-support "${stage}/crates/alopex-sql/build_support.rs"
          mkdir -p "${RUNNER_TEMP}/alopex-crate-assets"
          echo "RELEASE_STAGE=${stage}" >> "$GITHUB_ENV"
          echo "CRATE_ASSETS=${RUNNER_TEMP}/alopex-crate-assets" >> "$GITHUB_ENV"
      - name: Package and bind every published crate once
        shell: bash
        run: |
          set -euo pipefail
          python "${RELEASE_STAGE}/scripts/release/package_candidate_crates.py" \
            --manifest "${RELEASE_STAGE}/Cargo.toml" --output "${CRATE_ASSETS}" \
            --target-dir "${RUNNER_TEMP}/alopex-release-package-target"
      - name: Attach qualified crate archives
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release upload "${RELEASE_TAG_NAME}" "${CRATE_ASSETS}"/* --clobber

  qualify-python:
    name: Qualify Python candidate artifacts
    needs: [ci-gate, create-release]
    if: ${{ needs.ci-gate.outputs.kind == 'rc' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - name: Dispatch and require Python artifact qualification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh workflow run alopex-py-release.yml --ref "${RELEASE_TAG_NAME}" \
            -f "core_run_id=${GITHUB_RUN_ID}" \
            -f "source_ref=${RELEASE_TAG_NAME}" \
            -f "core_tag=${RELEASE_TAG_NAME}" \
            -f "mode=qualification"
          run_id=""
          for attempt in $(seq 1 60); do
            run_id="$(gh run list --workflow alopex-py-release.yml \
              --event workflow_dispatch --limit 20 --json databaseId,headSha,createdAt \
              --jq ".[] | select(.headSha == \"${RELEASE_TARGET_SHA}\" and .createdAt >= \"${started_at}\") | .databaseId" | head -1)"
            [[ -n "${run_id}" ]] && break
            sleep 10
          done
          [[ -n "${run_id}" ]]
          gh run watch "${run_id}" --exit-status

  record-candidate-manifest:
    name: Record qualified candidate manifest
    needs: [ci-gate, qualify-python, package-crates]
    if: ${{ needs.ci-gate.outputs.kind == 'rc' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_tag || github.ref }}
      - name: Bind candidate assets and source evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG_NAME#v}"
          version="${version%-rc.*}"
          candidate_dir="${RUNNER_TEMP}/alopex-candidate-assets"
          mkdir -p "${candidate_dir}"
          gh release download "${RELEASE_TAG_NAME}" --repo "${GITHUB_REPOSITORY}" \
            --dir "${candidate_dir}" --clobber
          ci_run_id="$(gh run list --workflow ci.yml --commit "${RELEASE_TARGET_SHA}" \
            --json databaseId,status,conclusion --limit 20 \
            --jq '.[] | select(.status == "completed" and .conclusion == "success") | .databaseId' | head -1)"
          [[ "${ci_run_id}" =~ ^[1-9][0-9]*$ ]]
          verification="${RUNNER_TEMP}/candidate-verification.json"
          python - "${verification}" "${RELEASE_TARGET_SHA}" "${ci_run_id}" <<'PY'
          import json
          import sys

          path, commit_sha, run_id = sys.argv[1:]
          with open(path, "w", encoding="utf-8") as handle:
              json.dump(
                  {
                      "commit_sha": commit_sha,
                      "runs": [
                          {
                              "name": "Development CI",
                              "run_id": int(run_id),
                              "conclusion": "success",
                          }
                      ],
                  },
                  handle,
              )
          PY
          manifest="${RUNNER_TEMP}/candidate-manifest-v${version}.json"
          python scripts/release/candidate_manifest.py build \
            --version "${version}" --rc-tag "${RELEASE_TAG_NAME}" \
            --commit-sha "${RELEASE_TARGET_SHA}" --artifact-dir "${candidate_dir}" \
            --verification "${verification}" --output "${manifest}"
          python scripts/release/candidate_manifest.py verify \
            --manifest "${manifest}" --artifact-dir "${candidate_dir}" \
            --stable-tag "v${version}" --stable-sha "${RELEASE_TARGET_SHA}"
          gh release upload "${RELEASE_TAG_NAME}" "${manifest}" --clobber

  promote-release:
    name: Promote qualified candidate artifacts
    needs: [ci-gate]
    if: ${{ needs.ci-gate.outputs.kind == 'stable' }}
    runs-on: ubuntu-latest
    outputs:
      rc_tag: ${{ steps.candidate.outputs.rc_tag }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_tag || github.ref }}
      - name: Verify candidate manifest and immutable artifact bytes
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG_NAME#v}"
          git fetch --force --tags origin
          mapfile -t rc_tags < <(git tag --points-at "${RELEASE_TARGET_SHA}" \
            --list "v${version}-rc.*" --sort=-v:refname)
          test "${#rc_tags[@]}" -gt 0
          rc_tag="${rc_tags[0]}"
          candidate_dir="${RUNNER_TEMP}/alopex-candidate-assets"
          mkdir -p "${candidate_dir}"
          gh release download "${rc_tag}" --repo "${GITHUB_REPOSITORY}" \
            --dir "${candidate_dir}" --clobber
          manifest_name="candidate-manifest-v${version}.json"
          manifest="${RUNNER_TEMP}/${manifest_name}"
          mv "${candidate_dir}/${manifest_name}" "${manifest}"
          python scripts/release/candidate_manifest.py verify \
            --manifest "${manifest}" --artifact-dir "${candidate_dir}" \
            --stable-tag "${RELEASE_TAG_NAME}" --stable-sha "${RELEASE_TARGET_SHA}"
          mv "${manifest}" "${candidate_dir}/${manifest_name}"
          echo "rc_tag=${rc_tag}" >> "${GITHUB_OUTPUT}"
  publish-crate:
    name: Publish qualified crate archives to crates.io
    needs: [ci-gate, promote-release]
    if: ${{ needs.ci-gate.outputs.kind == 'stable' && needs.promote-release.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_tag || github.ref }}
      - name: Verify and publish exact qualified crate bytes
        env:
          GH_TOKEN: ${{ github.token }}
          RC_TAG: ${{ needs.promote-release.outputs.rc_tag }}
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG_NAME#v}"
          candidate_dir="${RUNNER_TEMP}/alopex-candidate-crates"
          mkdir -p "${candidate_dir}"
          gh release download "${RC_TAG}" --repo "${GITHUB_REPOSITORY}" \
            --pattern "*.crate" --pattern "*-publish-metadata.json" \
            --pattern "candidate-manifest-v${version}.json" \
            --dir "${candidate_dir}" --clobber
          manifest="${RUNNER_TEMP}/candidate-manifest-v${version}.json"
          mv "${candidate_dir}/$(basename "${manifest}")" "${manifest}"
          # This delivery job downloads only crate assets, so validate their digests
          # against the full manifest entries before the registry upload.
          python - "${manifest}" "${candidate_dir}" <<'PY'
          import hashlib
          import json
          import sys
          from pathlib import Path

          manifest_path, artifact_dir = map(Path, sys.argv[1:])
          expected = {
              item["name"]: item
              for item in json.loads(manifest_path.read_text(encoding="utf-8"))["artifacts"]
              if item["name"].endswith(".crate") or item["name"].endswith("-publish-metadata.json")
          }
          actual = {path.name for path in artifact_dir.iterdir() if path.is_file()}
          if actual != set(expected):
              raise SystemExit("candidate crate asset inventory differs from manifest")
          for name, item in expected.items():
              path = artifact_dir / name
              if path.stat().st_size != item["size"]:
                  raise SystemExit(f"candidate crate asset size mismatch: {name}")
              if hashlib.sha256(path.read_bytes()).hexdigest() != item["sha256"]:
                  raise SystemExit(f"candidate crate asset digest mismatch: {name}")
          PY
          for crate in alopex-core alopex-sql alopex-dataframe alopex-cluster alopex-embedded alopex-server alopex-cli; do
            archive="${candidate_dir}/${crate}-${version}.crate"
            metadata="${candidate_dir}/${crate}-publish-metadata.json"
            test -f "${archive}" && test -f "${metadata}"
            status="$(curl -sS --retry 5 --retry-connrefused --retry-delay 2 \
              -H "User-Agent: alopex-release/${GITHUB_RUN_ID}" -o /dev/null -w "%{http_code}" \
              "https://crates.io/api/v1/crates/${crate}/${version}")"
            case "${status}" in
              404) python scripts/release/publish_crate_archive.py upload --archive "${archive}" --metadata "${metadata}" ;;
              200) ;;
              *) echo "unexpected crates.io status ${status} for ${crate}@${version}" >&2; exit 1 ;;
            esac
            published=false
            for attempt in $(seq 1 120); do
              if python scripts/release/publish_crate_archive.py verify-published --archive "${archive}"; then
                published=true
                break
              fi
              sleep 10
            done
            test "${published}" = true
          done

  create-stable-release:
    name: Create stable GitHub Release
    needs: [ci-gate, promote-release, publish-crate]
    if: ${{ needs.ci-gate.outputs.kind == 'stable' && needs.publish-crate.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_tag || github.ref }}
      - name: Verify qualified bytes for stable delivery
        env:
          GH_TOKEN: ${{ github.token }}
          RC_TAG: ${{ needs.promote-release.outputs.rc_tag }}
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG_NAME#v}"
          candidate_dir="${RUNNER_TEMP}/alopex-candidate-assets"
          mkdir -p "${candidate_dir}"
          gh release download "${RC_TAG}" --repo "${GITHUB_REPOSITORY}" \
            --dir "${candidate_dir}" --clobber
          manifest_name="candidate-manifest-v${version}.json"
          manifest="${RUNNER_TEMP}/${manifest_name}"
          mv "${candidate_dir}/${manifest_name}" "${manifest}"
          python scripts/release/candidate_manifest.py verify \
            --manifest "${manifest}" --artifact-dir "${candidate_dir}" \
            --stable-tag "${RELEASE_TAG_NAME}" --stable-sha "${RELEASE_TARGET_SHA}"
          mv "${manifest}" "${candidate_dir}/${manifest_name}"
      - name: Create stable GitHub Release from qualified bytes
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG_NAME }}
          files: ${{ runner.temp }}/alopex-candidate-assets/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dispatch-python-release:
    name: Publish Python and require public demos
    needs: [create-stable-release, promote-release]
    if: ${{ needs.create-stable-release.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Create Python tag and dispatch publication
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          CORE_RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\([0-9][0-9.]*\)"/\1/p' Cargo.toml | head -1)"
          [[ "${RELEASE_TAG_NAME}" == "v${version}" ]]
          test "$(git rev-parse HEAD)" = "${RELEASE_TARGET_SHA}"
          python_tag="alopex-py-v${version}"
          started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          bash scripts/release/prepare-python-release.sh
          python_workflow_ref="${python_tag}"
          expected_workflow_sha="$(git rev-parse "${python_tag}^{commit}")"
          gh workflow run alopex-py-release.yml --ref "${python_workflow_ref}" \
            -f "core_run_id=${GITHUB_RUN_ID}" \
            -f "source_ref=${python_tag}" \
            -f "core_tag=${RELEASE_TAG_NAME}" \
            -f "candidate_tag=${{ needs.promote-release.outputs.rc_tag }}" \
            -f "mode=promotion"
          echo "python_tag=${python_tag}" >> "${GITHUB_OUTPUT}"
          echo "workflow_sha=${expected_workflow_sha}" >> "${GITHUB_OUTPUT}"
          echo "started_at=${started_at}" >> "${GITHUB_OUTPUT}"

      - name: Wait for Python publish, demos, and docs report
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHON_TAG: ${{ steps.release.outputs.python_tag }}
          WORKFLOW_SHA: ${{ steps.release.outputs.workflow_sha }}
          STARTED_AT: ${{ steps.release.outputs.started_at }}
        shell: bash
        run: |
          set -euo pipefail
          run_id=""
          for attempt in $(seq 1 60); do
            run_id="$(gh run list --workflow alopex-py-release.yml \
              --event workflow_dispatch --limit 20 --json databaseId,headSha,createdAt \
              --jq ".[] | select(.headSha == \"${WORKFLOW_SHA}\" and .createdAt >= \"${STARTED_AT}\") | .databaseId" | head -1)"
            [[ -n "${run_id}" ]] && break
            sleep 10
          done
          [[ -n "${run_id}" ]]
          gh run watch "${run_id}" --exit-status
