name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      repair_forward:
        description: "Resume registry publication for an immutable release tag"
        required: false
        default: false
        type: boolean
      release_tag:
        description: "Existing immutable core release tag"
        required: false
        default: ""
        type: string
      target_sha:
        description: "Peeled commit SHA of the immutable release tag"
        required: false
        default: ""
        type: string

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always
  NIM_SQL_PARSER_DIR: crates/alopex-sql/nim-sql-parser
  # A tag push uses github.ref_name/github.sha. A workflow_dispatch recovery
  # must name the already-immutable tag and its peeled SHA explicitly.
  RELEASE_TAG_NAME: ${{ inputs.release_tag || github.ref_name }}
  RELEASE_TARGET_SHA: ${{ inputs.target_sha || github.sha }}

jobs:
  # Implementation correctness belongs to local tests and the normal CI lane.
  # Release only binds this immutable tag to already-approved CI evidence.
  ci-gate:
    name: Approved source evidence
    if: ${{ !inputs.repair_forward }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_tag || github.ref }}
      - name: Verify SQL type capability contract
        shell: bash
        run: python scripts/release/type_capability_gate.py --release-version "${RELEASE_TAG_NAME#v}"
      - name: Verify immutable tag and approved CI evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "${RELEASE_TAG_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "${RELEASE_TARGET_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git cat-file -t "${RELEASE_TAG_NAME}")" == "tag" ]]
          test "$(git rev-parse "${RELEASE_TAG_NAME}^{commit}")" = "${RELEASE_TARGET_SHA}"
          test "$(git rev-parse HEAD)" = "${RELEASE_TARGET_SHA}"
          git fetch origin main
          git merge-base --is-ancestor "${RELEASE_TARGET_SHA}" origin/main
          approved=false
          for attempt in $(seq 1 30); do
            if gh run list --workflow ci.yml --commit "${RELEASE_TARGET_SHA}" \
              --json status,conclusion,headSha --limit 20 \
              --jq 'any(.[]; .status == "completed" and .conclusion == "success")' \
              | grep -qx true; then
              approved=true
              break
            fi
            sleep 10
          done
          test "${approved}" = true

  build-release:
    name: Build Release (${{ matrix.target }})
    needs: [ci-gate]
    if: ${{ !inputs.repair_forward }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: alopex
            asset_name: alopex-linux-x86_64
          # x86_64 macOS release builds must run on an Intel runner because
          # the Nim SQL parser shared library is built natively before linking.
          - os: macos-15-intel
            target: x86_64-apple-darwin
            artifact_name: alopex
            asset_name: alopex-macos-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: alopex
            asset_name: alopex-macos-aarch64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: alopex.exe
            asset_name: alopex-windows-x86_64.exe

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.90.0
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Setup Python for archive verification
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup exact Nim parser toolchain
        uses: ./.github/actions/setup-nim-parser-toolchain
      - name: Build Nim SQL parser library
        shell: bash
        run: |
          bash scripts/build-nim-parser.sh --backend host \
            --target "${{ matrix.target }}" --archive-dir artifacts/parser
      - name: Verify parser target record
        shell: bash
        run: |
          set -euo pipefail
          record="$(find artifacts/parser -maxdepth 1 -name '*${{ matrix.target }}.json' -type f -print -quit)"
          test -n "$record"
          python scripts/release/parser_asset_manifest.py verify-target \
            --record "$record" --asset-dir artifacts/parser
      - name: Extract and run native smoke
        shell: bash
        run: |
          set -euo pipefail
          RECORD="$(find artifacts/parser -maxdepth 1 -name '*${{ matrix.target }}.json' -type f -print -quit)" \
          ARCHIVE_DIR="artifacts/parser/native-smoke" \
          python - <<'PY'
          import ctypes
          import json
          import os
          from pathlib import Path
          import tarfile

          record = json.loads(Path(os.environ["RECORD"]).read_text(encoding="utf-8"))
          archive_path = Path("artifacts/parser") / record["archive"]["filename"]
          extract_dir = Path(os.environ["ARCHIVE_DIR"])
          extract_dir.mkdir(parents=True, exist_ok=True)
          with tarfile.open(archive_path, "r:gz") as archive:
              archive.extractall(extract_dir)
          library = extract_dir / record["library"]["path"]
          loaded = ctypes.CDLL(str(library))
          loaded.alopex_parser_version.restype = ctypes.c_char_p
          version = loaded.alopex_parser_version().decode("ascii")
          if version != "0.19.0":
              raise SystemExit(f"native smoke version mismatch: {version}")
          print(f"native smoke passed: {record['target']} parser {version}")
          PY
      - name: Build
        env:
          ALOPEX_NIM_PARSER_ALLOW_LOCAL_BUILD: "1"
          NIM_SQL_PARSER_LIB_DIR: ${{ github.workspace }}/crates/alopex-sql/nim-sql-parser
        run: cargo build --release --target ${{ matrix.target }} -p alopex-cli

      - name: Strip binary (Linux and macOS)
        if: matrix.os != 'windows-latest'
        run: strip target/${{ matrix.target }}/release/${{ matrix.artifact_name }}

      - name: Rename artifact
        shell: bash
        run: |
          mkdir -p artifacts
          cp target/${{ matrix.target }}/release/${{ matrix.artifact_name }} artifacts/${{ matrix.asset_name }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: |
            artifacts/${{ matrix.asset_name }}
            artifacts/parser/*.json
            artifacts/parser/*.tar.gz

  create-release:
    name: Create GitHub Release
    needs: build-release
    if: ${{ !inputs.repair_forward }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Verify release workflow contract
        shell: bash
        run: bash scripts/release/v07_gate.sh --workflow-contract-only

      - name: Verify peeled release tag
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --tags origin
          test "$(git describe --tags --exact-match HEAD)" = "${RELEASE_TAG_NAME}"
          test "$(git rev-parse "${RELEASE_TAG_NAME}^{commit}")" = "${RELEASE_TARGET_SHA}"
          test "$(git rev-parse HEAD)" = "${RELEASE_TARGET_SHA}"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Flatten parser artifact payloads
        shell: bash
        run: |
          set -euo pipefail
          parser_dir="artifacts/parser"
          test -d "$parser_dir"
          mapfile -t parser_records < <(find "$parser_dir" -maxdepth 1 -name 'alopex-parser-*.json' -type f | sort)
          mapfile -t parser_archives < <(find "$parser_dir" -maxdepth 1 -name 'alopex-parser-*.tar.gz' -type f | sort)
          test "${#parser_records[@]}" -eq 4
          test "${#parser_archives[@]}" -eq 4
          for asset in "${parser_records[@]}" "${parser_archives[@]}"; do
            destination="artifacts/$(basename "$asset")"
            test ! -e "$destination"
            mv -- "$asset" "$destination"
          done
          test -z "$(find "$parser_dir" -mindepth 1 -print -quit)"
          rmdir "$parser_dir"

      - name: Assemble and verify parser manifest
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG_NAME#v}"
          test "${RELEASE_TAG_NAME}" = "v${version}"
          manifest="artifacts/parser-vendor-manifest-v${version}.json"
          envelope="artifacts/parser-assets-v${version}.json"
          mapfile -t records < <(find artifacts -maxdepth 1 -name 'alopex-parser-*.json' -type f | sort)
          test "${#records[@]}" -eq 4
          args=()
          for record in "${records[@]}"; do args+=(--record "$record"); done
          python scripts/release/parser_asset_manifest.py assemble-manifest \
            "${args[@]}" --asset-dir artifacts --output "${manifest}"
          python scripts/release/parser_asset_manifest.py verify-manifest \
            --manifest "${manifest}" --asset-dir artifacts
          python scripts/release/parser_asset_manifest.py release-envelope \
            --manifest "${manifest}" \
            --asset-dir artifacts --tag "$RELEASE_TAG_NAME" --tag-sha "$RELEASE_TARGET_SHA" \
            --output "${envelope}"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG_NAME }}
          files: artifacts/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-crate:
    name: Publish to crates.io
    needs: [build-release, create-release]
    if: ${{ always() && (inputs.repair_forward == true || (needs.build-release.result == 'success' && needs.create-release.result == 'success')) }}
    runs-on: ubuntu-latest
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_TOKEN }}
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG_NAME: ${{ inputs.release_tag }}
      RELEASE_TARGET_SHA: ${{ inputs.target_sha }}
      REPAIR_FORWARD: ${{ inputs.repair_forward || false }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Historical repair-forward needs the current workflow tooling;
          # a pre-publication resume checks out the immutable release tag.
          ref: ${{ inputs.repair_forward && github.ref || inputs.release_tag || github.ref }}
      - uses: dtolnay/rust-toolchain@1.90.0
      - uses: Swatinem/rust-cache@v2

      - name: Verify peeled release tag and create clean source staging
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --tags origin
          release_tag="${RELEASE_TAG_NAME}"
          release_target_sha="${RELEASE_TARGET_SHA}"
          if [[ "${REPAIR_FORWARD}" == "true" ]]; then
            [[ "${release_tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
            [[ "${release_target_sha}" =~ ^[0-9a-f]{40}$ ]]
            peeled_sha="$(git rev-parse "${release_tag}^{commit}")"
            test "${peeled_sha}" = "${release_target_sha}"
            gh release view "${release_tag}" --json isDraft --jq '.isDraft' \
              | grep -qx false
            gh release view "${release_tag}" --json tagName --jq '.tagName' \
              | grep -qx "${release_tag}"
          else
            release_tag="${release_tag:-${GITHUB_REF_NAME}}"
            release_target_sha="${release_target_sha:-${GITHUB_SHA}}"
            test "$(git describe --tags --exact-match HEAD)" = "${release_tag}"
            test "$(git rev-parse HEAD)" = "${release_target_sha}"
          fi
          RELEASE_TAG_NAME="${release_tag}"
          RELEASE_TARGET_SHA="${release_target_sha}"
          test "$(git rev-parse "${RELEASE_TAG_NAME}^{commit}")" = "${RELEASE_TARGET_SHA}"
          test -z "$(git status --porcelain)"
          stage="${RUNNER_TEMP}/alopex-release-source"
          rm -rf "$stage"
          mkdir -p "$stage"
          git archive --format=tar "${RELEASE_TAG_NAME}^{commit}" | tar -xf - -C "$stage"
          test -z "$(git -C "$stage" status --porcelain 2>/dev/null || true)"
          echo "RELEASE_TAG_NAME=${RELEASE_TAG_NAME}" >> "$GITHUB_ENV"
          echo "RELEASE_TARGET_SHA=${RELEASE_TARGET_SHA}" >> "$GITHUB_ENV"
          echo "RELEASE_STAGE=$stage" >> "$GITHUB_ENV"

      - name: Bind crate source staging to freshly built parser assets
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG_NAME#v}"
          [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          asset_dir="${RUNNER_TEMP}/alopex-release-parser-assets"
          rm -rf "${asset_dir}"
          mkdir -p "${asset_dir}"
          gh release download "${RELEASE_TAG_NAME}" --repo "${GITHUB_REPOSITORY}" \
            --pattern "parser-vendor-manifest-v${version}.json" \
            --pattern "alopex-parser-v${version}-contract-0.19.0-*.tar.gz" \
            --dir "${asset_dir}" --clobber
          manifest="${asset_dir}/parser-vendor-manifest-v${version}.json"
          python "${RELEASE_STAGE}/scripts/release/parser_asset_manifest.py" verify-manifest \
            --manifest "${manifest}" --asset-dir "${asset_dir}"
          RELEASE_STAGE="${RELEASE_STAGE}" MANIFEST="${manifest}" ASSET_DIR="${asset_dir}" \
            python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path, PurePosixPath
          import tarfile

          stage = Path(os.environ["RELEASE_STAGE"])
          manifest_path = Path(os.environ["MANIFEST"])
          asset_dir = Path(os.environ["ASSET_DIR"])
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          vendor = stage / "crates/alopex-sql/nim-sql-parser/vendor"
          for asset in manifest["assets"]:
              archive = asset_dir / asset["archive"]["filename"]
              library_path = PurePosixPath(asset["library"]["path"])
              if library_path.is_absolute() or ".." in library_path.parts:
                  raise SystemExit(f"unsafe parser library path: {library_path}")
              with tarfile.open(archive, "r:gz") as handle:
                  def read_asset(identity):
                      path = PurePosixPath(identity["path"])
                      if path.is_absolute() or ".." in path.parts:
                          raise SystemExit(f"unsafe parser library path: {path}")
                      member = handle.getmember(str(path))
                      source = handle.extractfile(member)
                      if source is None:
                          raise SystemExit(f"parser library is not a file: {path}")
                      data = source.read()
                      if hashlib.sha256(data).hexdigest() != identity["sha256"]:
                          raise SystemExit(f"parser library digest mismatch: {asset['target']}")
                      return path.name, data
                  dynamic_name, library = read_asset(asset["library"])
                  static_name, static_library = read_asset(asset["static_library"])
              expected = asset["library"]["sha256"]
              target_dir = vendor / asset["target"]
              target_dir.mkdir(parents=True, exist_ok=True)
              (target_dir / dynamic_name).write_bytes(library)
              (target_dir / static_name).write_bytes(static_library)
              (target_dir / "CONTRACT_VERSION").write_bytes(b"0.19.0\n")
              (target_dir / "SHA256SUMS").write_bytes(
                  f"{expected}  {dynamic_name}\n{asset['static_library']['sha256']}  {static_name}\n".encode()
              )
          fixed_manifest = vendor / "parser-vendor-manifest.json"
          versioned_manifests = sorted(vendor.glob("parser-vendor-manifest-v*.json"))
          if fixed_manifest.is_file() and not versioned_manifests:
              destination_manifest = fixed_manifest
          elif not fixed_manifest.exists() and len(versioned_manifests) == 1:
              destination_manifest = versioned_manifests[0]
          else:
              raise SystemExit(
                  "unknown or ambiguous parser vendor manifest layout in release staging"
              )
          destination_manifest.write_bytes(manifest_path.read_bytes())
          PY
          python scripts/release/retarget_python_parser_source.py \
            --manifest "${manifest}" \
            --vendor-dir "${RELEASE_STAGE}/crates/alopex-sql/nim-sql-parser/vendor" \
            --build-support "${RELEASE_STAGE}/crates/alopex-sql/build_support.rs"
          staged_manifest="${RELEASE_STAGE}/crates/alopex-sql/nim-sql-parser/vendor/parser-vendor-manifest.json"
          if [[ ! -f "${staged_manifest}" ]]; then
            mapfile -t historical_manifests < <(find \
              "${RELEASE_STAGE}/crates/alopex-sql/nim-sql-parser/vendor" \
              -maxdepth 1 -name 'parser-vendor-manifest-v*.json' -type f | sort)
            test "${#historical_manifests[@]}" -eq 1
            staged_manifest="${historical_manifests[0]}"
          fi
          python "${RELEASE_STAGE}/scripts/release/parser_asset_manifest.py" verify-manifest \
            --manifest "${staged_manifest}" \
            --asset-dir "${asset_dir}"

      - name: Create publish helper
        run: |
          cat > publish-crate.sh <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          crate="$1"
          version="$(python - "$crate" "$RELEASE_STAGE" <<'PY'
          import json
          from pathlib import Path
          import subprocess
          import sys
          name = sys.argv[1]
          stage = Path(sys.argv[2])
          data = json.loads(subprocess.check_output([
              "cargo", "metadata", "--manifest-path", str(stage / "Cargo.toml"),
              "--no-deps", "--format-version", "1"
          ]))
          for pkg in data["packages"]:
              if pkg["name"] == name:
                  print(pkg["version"])
                  sys.exit(0)
          sys.exit(1)
          PY
          )"
          status="$(curl -sS --retry 5 --retry-connrefused --retry-delay 2 \
            -H "User-Agent: alopex-release/${GITHUB_RUN_ID:-local}" \
            -H "Accept: application/json" \
            -o /dev/null -w "%{http_code}" \
            "https://crates.io/api/v1/crates/${crate}/${version}")"
          if [[ "$status" == "200" ]]; then
            echo "skip: ${crate}@${version} already published"
            exit 0
          fi
          if [[ "$status" != "404" ]]; then
            echo "unexpected crates.io status ${status} for ${crate}@${version}" >&2
            exit 1
          fi
          env -u NIM_SQL_PARSER_LIB_DIR cargo publish \
            --manifest-path "${RELEASE_STAGE}/Cargo.toml" -p "${crate}"
          EOF
          chmod +x publish-crate.sh

      - name: Publish alopex-core
        run: ./publish-crate.sh alopex-core

      - name: Wait for crates.io index update
        run: sleep 30

      - name: Publish alopex-sql
        run: ./publish-crate.sh alopex-sql

      - name: Wait for crates.io index update
        run: sleep 30

      - name: Publish alopex-dataframe
        run: ./publish-crate.sh alopex-dataframe

      - name: Wait for crates.io index update
        run: sleep 30

      # alopex-embedded depends on alopex-cluster at the same release
      # version, so cluster must be visible on crates.io first.
      - name: Publish alopex-cluster
        run: ./publish-crate.sh alopex-cluster

      - name: Wait for crates.io index update
        run: sleep 30

      - name: Publish alopex-embedded
        run: ./publish-crate.sh alopex-embedded

      - name: Wait for crates.io index update
        run: sleep 30

      - name: Publish alopex-server
        run: ./publish-crate.sh alopex-server

      - name: Wait for crates.io index update
        run: sleep 30

      - name: Publish alopex-cli
        run: ./publish-crate.sh alopex-cli

  dispatch-python-release:
    name: Publish Python and require public demos
    needs: [publish-crate]
    # repair-forward intentionally skips build/create ancestors; always() is
    # required so GitHub evaluates the immediate publish result instead of
    # applying the implicit success() gate to those skipped ancestors.
    if: ${{ always() && needs.publish-crate.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Create or verify matching Python tag
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REPAIR_FORWARD: ${{ inputs.repair_forward }}
          WORKFLOW_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\([0-9][0-9.]*\)"/\1/p' Cargo.toml | head -1)"
          [[ "${RELEASE_TAG_NAME}" == "v${version}" ]]
          test "$(git rev-parse HEAD)" = "${RELEASE_TARGET_SHA}"
          python_tag="alopex-py-v${version}"
          started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          if git rev-parse --verify --quiet "refs/tags/${python_tag}" >/dev/null; then
            test "$(git rev-parse "${python_tag}^{commit}")" = "${RELEASE_TARGET_SHA}"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "${python_tag}" "${RELEASE_TARGET_SHA}" -m "Release ${python_tag}"
            git push origin "${python_tag}"
          fi
          # Normal publication runs from the Python tag so environment tag
          # protection applies. Repair-forward uses corrected orchestration,
          # skips protected publication jobs, and verifies public packages.
          python_workflow_ref="${python_tag}"
          python_source_ref="${python_tag}"
          expected_workflow_sha="${RELEASE_TARGET_SHA}"
          if [[ "${REPAIR_FORWARD}" == "true" ]]; then
            python_workflow_ref="${GITHUB_REF_NAME}"
            python_source_ref="${RELEASE_TARGET_SHA}"
            expected_workflow_sha="${WORKFLOW_SHA}"
          fi
          gh workflow run alopex-py-release.yml --ref "${python_workflow_ref}" \
            -f "source_ref=${python_source_ref}" -f "target_sha=${RELEASE_TARGET_SHA}" \
            -f "release_tag=${python_tag}" -f "core_run_id=${GITHUB_RUN_ID}" \
            -f "repair_forward=${REPAIR_FORWARD}"
          echo "python_tag=${python_tag}" >> "${GITHUB_OUTPUT}"
          echo "workflow_sha=${expected_workflow_sha}" >> "${GITHUB_OUTPUT}"
          echo "started_at=${started_at}" >> "${GITHUB_OUTPUT}"

      - name: Wait for Python publish, demos, and docs report
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHON_TAG: ${{ steps.release.outputs.python_tag }}
          WORKFLOW_SHA: ${{ steps.release.outputs.workflow_sha }}
          STARTED_AT: ${{ steps.release.outputs.started_at }}
        shell: bash
        run: |
          set -euo pipefail
          run_id=""
          for attempt in $(seq 1 60); do
            run_id="$(gh run list --workflow alopex-py-release.yml \
              --event workflow_dispatch --limit 20 --json databaseId,headSha,createdAt \
              --jq ".[] | select(.headSha == \"${WORKFLOW_SHA}\" and .createdAt >= \"${STARTED_AT}\") | .databaseId" | head -1)"
            [[ -n "${run_id}" ]] && break
            sleep 10
          done
          [[ -n "${run_id}" ]]
          gh run watch "${run_id}" --exit-status
