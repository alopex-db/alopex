name: Release

on:
  push:
    tags:
      - 'v*'

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always
  NIM_SQL_PARSER_DIR: crates/alopex-sql/nim-sql-parser

jobs:
  # Run CI checks before release
  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
      - uses: actions/checkout@v4
      - name: Checkout Chirps dependency
        run: bash .github/scripts/checkout-chirps.sh
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python deps
        run: python -m pip install --upgrade pip maturin pytest numpy
      - name: Build Nim SQL parser library
        if: runner.os == 'Linux'
        run: bash scripts/build-nim-parser.sh --backend docker
      - name: Run v0.7 release gate
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/${{ env.NIM_SQL_PARSER_DIR }}:${{ env.LD_LIBRARY_PATH }}
        run: bash scripts/release/v07_gate.sh

  build-release:
    name: Build Release (${{ matrix.target }})
    needs: [ci-gate]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: alopex
            asset_name: alopex-linux-x86_64
          # x86_64 macOS release builds must run on an Intel runner because
          # the Nim SQL parser shared library is built natively before linking.
          - os: macos-15-intel
            target: x86_64-apple-darwin
            artifact_name: alopex
            asset_name: alopex-macos-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: alopex
            asset_name: alopex-macos-aarch64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: alopex.exe
            asset_name: alopex-windows-x86_64.exe

    steps:
      - uses: actions/checkout@v4
      - name: Checkout Chirps dependency
        run: bash .github/scripts/checkout-chirps.sh

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Build Nim SQL parser library
        if: runner.os == 'Linux'
        run: bash scripts/build-nim-parser.sh --backend docker
      # macOS/Windows ランナーは docker で Linux コンテナを動かせないため、
      # ネイティブ Nim ツールチェーン (2.2 固定) をセットアップして共有ライブラリを生成する。
      # 要 CI 検証: macOS/Windows ランナー上でのみ動作確認可能（ローカル検証不可）。
      - name: Setup Nim (macOS/Windows)
        if: runner.os != 'Linux'
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: '2.2.x'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build Nim SQL parser library (macOS/Windows)
        if: runner.os != 'Linux'
        shell: bash
        run: bash scripts/build-nim-parser.sh --backend host
      - name: Build
        run: cargo build --release --target ${{ matrix.target }} -p alopex-cli

      - name: Strip binary (Linux and macOS)
        if: matrix.os != 'windows-latest'
        run: strip target/${{ matrix.target }}/release/${{ matrix.artifact_name }}

      - name: Rename artifact
        shell: bash
        run: |
          mkdir -p artifacts
          cp target/${{ matrix.target }}/release/${{ matrix.artifact_name }} artifacts/${{ matrix.asset_name }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: artifacts/${{ matrix.asset_name }}

      # crates.io に公開する alopex-sql は Nim ツールチェーンを持たない環境
      # でも `cargo install`/`cargo build` できる必要がある(D2 是正)。この
      # ジョブが alopex-cli リンク用に既にビルド済みの Nim 共有ライブラリを
      # vendor アーティファクトとしてもアップロードし、publish-crate ジョブが
      # nim-sql-parser/vendor/<target-triple>/ へ配置してから publish する。
      - name: Upload vendored Nim shared library
        uses: actions/upload-artifact@v4
        with:
          name: nim-vendor-${{ matrix.target }}
          # Linux: libalopex_sql_parser.so / macOS: libalopex_sql_parser.dylib
          # / Windows: alopex_sql_parser.dll (lib 接頭辞なし)。
          path: |
            ${{ env.NIM_SQL_PARSER_DIR }}/libalopex_sql_parser.so
            ${{ env.NIM_SQL_PARSER_DIR }}/libalopex_sql_parser.dylib
            ${{ env.NIM_SQL_PARSER_DIR }}/alopex_sql_parser.dll
          if-no-files-found: ignore

  create-release:
    name: Create GitHub Release
    needs: build-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Checkout Chirps dependency
        run: bash .github/scripts/checkout-chirps.sh

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-crate:
    name: Publish to crates.io
    needs: [build-release, create-release]
    runs-on: ubuntu-latest
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_TOKEN }}
      NIM_SQL_PARSER_LIB_DIR: ${{ github.workspace }}/crates/alopex-sql/nim-sql-parser
    steps:
      - uses: actions/checkout@v4
      - name: Checkout Chirps dependency
        run: bash .github/scripts/checkout-chirps.sh
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build Nim SQL parser library
        if: runner.os == 'Linux'
        run: bash scripts/build-nim-parser.sh --backend docker

      # alopex-sql の公開 crate は Nim ツールチェーンを持たない環境でも
      # `cargo install`/`cargo build` できる必要がある(D2 是正)。build-release
      # ジョブが4プラットフォーム分ビルド済みの Nim 共有ライブラリを
      # nim-sql-parser/vendor/<target-triple>/ へ配置してから publish する
      # (alopex-sql/build.rs の解決順序に vendor/ を追加済み)。
      - name: Download vendored Nim shared libraries
        uses: actions/download-artifact@v4
        with:
          pattern: nim-vendor-*
          path: /tmp/nim-vendor

      - name: Place vendored libraries under nim-sql-parser/vendor/<target-triple>
        run: |
          set -euo pipefail
          for dir in /tmp/nim-vendor/nim-vendor-*; do
            target="$(basename "${dir}" | sed 's/^nim-vendor-//')"
            dest="${NIM_SQL_PARSER_DIR}/vendor/${target}"
            mkdir -p "${dest}"
            cp "${dir}"/* "${dest}/"
            echo "vendored for ${target}:"
            ls -la "${dest}"
          done

      # `cargo publish` は working directory が git 的にクリーンであることを
      # 要求する(dirty チェック)。vendor/ 配下のファイルは nim-sql-parser/
      # .gitignore の `!vendor/**` で cargo package の除外対象からは外れて
      # いるが、git 自体には add/commit していないため untracked のまま
      # であり、cargo publish の dirty チェックには依然として引っかかる
      # (cargo package の除外ロジックと cargo publish の dirty チェックは
      # 別物)。このランナー上だけの一時コミットを作り(push しない)、
      # `--allow-dirty` でチェック自体を無効化せずに解決する。
      - name: Commit vendored libraries locally (not pushed)
        run: |
          set -euo pipefail
          git add "${NIM_SQL_PARSER_DIR}/vendor"
          git -c user.name="github-actions[bot]" \
              -c user.email="github-actions[bot]@users.noreply.github.com" \
              commit -m "chore: vendor Nim shared libraries for release (CI-local, not pushed)"

      - name: Create publish helper
        run: |
          cat > publish-crate.sh <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          crate="$1"
          version="$(cargo metadata --no-deps --format-version 1 | python - "$crate" <<'PY'
          import json
          import subprocess
          import sys
          name = sys.argv[1]
          data = json.loads(subprocess.check_output(["cargo", "metadata", "--no-deps", "--format-version", "1"]))
          for pkg in data["packages"]:
              if pkg["name"] == name:
                  print(pkg["version"])
                  sys.exit(0)
          sys.exit(1)
          PY
          )"
          status="$(curl -sS --retry 5 --retry-connrefused --retry-delay 2 \
            -H "User-Agent: alopex-release/${GITHUB_RUN_ID:-local}" \
            -H "Accept: application/json" \
            -o /dev/null -w "%{http_code}" \
            "https://crates.io/api/v1/crates/${crate}/${version}")"
          if [[ "$status" == "200" ]]; then
            echo "skip: ${crate}@${version} already published"
            exit 0
          fi
          if [[ "$status" != "404" ]]; then
            echo "unexpected crates.io status ${status} for ${crate}@${version}" >&2
            exit 1
          fi
          cargo publish -p "${crate}"
          EOF
          chmod +x publish-crate.sh

      - name: Publish alopex-core
        run: ./publish-crate.sh alopex-core

      - name: Wait for crates.io index update
        run: sleep 30

      - name: Publish alopex-sql
        run: ./publish-crate.sh alopex-sql

      - name: Wait for crates.io index update
        run: sleep 30

      - name: Publish alopex-dataframe
        run: ./publish-crate.sh alopex-dataframe

      - name: Wait for crates.io index update
        run: sleep 30

      - name: Publish alopex-embedded
        run: ./publish-crate.sh alopex-embedded

      - name: Wait for crates.io index update
        run: sleep 30

      - name: Publish alopex-cluster
        run: ./publish-crate.sh alopex-cluster

      - name: Wait for crates.io index update
        run: sleep 30

      - name: Publish alopex-server
        run: ./publish-crate.sh alopex-server

      - name: Wait for crates.io index update
        run: sleep 30

      - name: Publish alopex-cli
        run: ./publish-crate.sh alopex-cli
