name: Native VM capability preflight
on:
  workflow_dispatch:
    inputs:
      runner_label:
        description: GitHub-hosted VM label for this private execution profile
        required: true
        type: string
      expected_machine:
        description: Machine ABI required by the comparison artifacts
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: alopex-v0817-vm-preflight
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ${{ inputs.runner_label }}
    timeout-minutes: 3
    steps:
      - name: Read VM capabilities without checkout, installation or workloads
        env:
          RUNNER_KIND: ${{ runner.environment }}
          EXPECTED_MACHINE: ${{ inputs.expected_machine }}
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import json, os, pathlib, platform, subprocess, sys
          result = {"schema": "alopex.vm-readiness/v1"}
          result["managed_vm"] = os.environ.get("RUNNER_KIND") == "github-hosted"
          if not result["managed_vm"]:
              print(json.dumps(result, sort_keys=True))
              raise SystemExit(78)
          result["normal_user"] = os.geteuid() != 0
          result["native_asset_machine_matches"] = platform.machine() == os.environ["EXPECTED_MACHINE"]
          def command(args):
              try:
                  return subprocess.run(args, capture_output=True, text=True, timeout=15)
              except (OSError, subprocess.TimeoutExpired):
                  return None
          sudo = command(["sudo", "-n", "true"])
          result["guest_sudo_available"] = sudo is not None and sudo.returncode == 0
          try:
              io = dict(line.split(":", 1) for line in pathlib.Path("/proc/self/io").read_text().splitlines())
              result["process_io_readable"] = all(int(io[key]) >= 0 for key in ("read_bytes", "write_bytes", "cancelled_write_bytes"))
          except (OSError, ValueError, KeyError):
              result["process_io_readable"] = False
          try:
              result["separate_cpu_assignment_available"] = len(os.sched_getaffinity(0)) >= 2
          except (AttributeError, OSError):
              result["separate_cpu_assignment_available"] = False
          docker = command(["docker", "info", "--format", "{{json .}}"])
          try:
              info = json.loads(docker.stdout) if docker is not None and docker.returncode == 0 else {}
          except (ValueError, AttributeError):
              info = {}
          result["docker_available"] = info.get("OSType") == "linux"
          security = info.get("SecurityOptions", [])
          result["docker_seccomp"] = any(x.startswith("name=seccomp") for x in security)
          result["docker_lsm"] = any(x.startswith(("name=apparmor", "name=selinux")) for x in security)
          result["docker_cgroup_v2"] = str(info.get("CgroupVersion")) == "2"
          result["passed"] = all(value for key, value in result.items() if key != "schema")
          print(json.dumps(result, sort_keys=True))
          raise SystemExit(0 if result["passed"] else 78)
          PYCODE
