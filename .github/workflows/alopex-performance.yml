              temporary = pathlib.Path(e['RUNNER_TEMP'])
              assert (temporary.is_absolute() and temporary.is_dir() and
                      not temporary.is_symlink() and temporary.resolve(strict=True) == temporary and
                      temporary.stat().st_uid == os.geteuid())
              credentials = base64.b64encode(('x-access-token:' + e['GH_CHECKOUT_TOKEN']).encode()).decode()
              with tempfile.TemporaryDirectory(dir=temporary) as template:
                  git_env = {'HOME': str(pathlib.Path.home()), 'PATH': '/usr/bin:/bin',
                             'LANG': 'C', 'GIT_CONFIG_COUNT': '1',
                             'GIT_CONFIG_NOSYSTEM': '1', 'GIT_CONFIG_GLOBAL': '/dev/null',
                             'GIT_TEMPLATE_DIR': template,
                             'GIT_CONFIG_KEY_0': 'http.https://github.com/.extraheader',
                             'GIT_CONFIG_VALUE_0': 'AUTHORIZATION: basic ' + credentials,
                             'GIT_TERMINAL_PROMPT': '0', 'GIT_LFS_SKIP_SMUDGE': '1'}
                  def git(*args, read=False):
                      result = subprocess.run([str(git_binary), '-C', str(workspace), *args],
                                              env=git_env, stdin=subprocess.DEVNULL,
                                              stdout=subprocess.PIPE if read else subprocess.DEVNULL,
                                              stderr=subprocess.DEVNULL, timeout=105)
                      assert result.returncode == 0
                      if read:
                          assert len(result.stdout) <= 4096
                          return result.stdout.decode('ascii').strip()
                  git('init', '-q')
                  git('fetch', '--no-tags', '--depth=1',
                      'https://github.com/alopex-db/alopex.git', ref)
                  assert git('rev-parse', 'FETCH_HEAD', read=True) == e['EXPECTED_CONTROLLER_SHA']
                  git('checkout', '--detach', '-q', 'FETCH_HEAD')
                  assert git('rev-parse', 'HEAD', read=True) == e['EXPECTED_CONTROLLER_SHA']
                  assert git('rev-parse', 'HEAD^{tree}', read=True) == e['EXPECTED_WAL_COST_SOURCE_TREE']
                  assert git('status', '--porcelain', '--untracked-files=all', read=True) == ''
              print(json.dumps({'case': 'WAL_COST_682_CHECKOUT', 'outcome': 'passed'}, sort_keys=True))
          except BaseException:
              print(json.dumps({'case': 'WAL_COST_682_CHECKOUT', 'outcome': 'failed',
                                'error_code': 'SOURCE'}, sort_keys=True))
              sys.exit(1)
          PY
      - name: Acquire, build, measure, and audit public WAL cost (stage-budget and early-stop)
        timeout-minutes: 75
        env:
          EXPECTED_CONTROLLER_SHA: ${{ inputs.expected_controller_sha }}
          EXPECTED_WAL_COST_SOURCE_TREE: ${{ inputs.expected_wal_cost_source_tree }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          RUNNER_KIND: github_hosted_ubuntu2404
          WAL_QUICK: ${{ inputs.wal_quick }}
        run: |
          args=()
          if [[ -n "$WAL_QUICK" ]]; then
            if [[ ! "$WAL_QUICK" =~ ^((kv|sql)-(16|2048)):([0-9]+([.][0-9]+)?)(:compare)?$ ]]; then
              exit 2
            fi
            args+=(--quick "${BASH_REMATCH[1]}" --regression-ratio "${BASH_REMATCH[4]}")
            if [[ "${BASH_REMATCH[6]}" == ":compare" ]]; then
              args+=(--compare-full)
            fi
          fi
          python3 -B scripts/performance/issue682_hosted_wal_cost.py "${args[@]}"
      - name: Upload audited public WAL cost JSON artifact
        if: ${{ success() && inputs.wal_quick == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: issue682-wal-cost-public-${{ github.run_id }}
          path: ${{ runner.temp }}/issue682-public-export/
          if-no-files-found: error
          retention-days: 14
  s04_inspect:
    if: ${{ !inputs.hnsw_release_admission_mode && !inputs.hnsw_release_measure_mode && inputs.s04_inspect_mode && inputs.issue_number == '684' && !inputs.qualification_mode && !inputs.sql_four_case_mode && !inputs.sql_final_mode && !inputs.wal_cost_mode && !inputs.sql_diagnostic_mode && !inputs.s04_socket_inventory_mode && !inputs.s04_capture_mode && !inputs.public_native_build_mode }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Gate exact source before checkout
        env:
          EXPECTED_CONTROLLER_SHA: ${{ inputs.expected_controller_sha }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        run: |
          python3 - <<'PY'
          import os, re, sys
          expected = os.environ.get('EXPECTED_CONTROLLER_SHA', '')
          passed = (os.environ.get('GITHUB_EVENT_NAME') == 'workflow_dispatch' and
                    os.environ.get('ISSUE_NUMBER') == '684' and
                    re.fullmatch(r'[a-f0-9]{40}', expected) is not None and
                    expected == os.environ.get('GITHUB_SHA'))
          print('{"case":"S04_INSPECT_SHA","outcome":"passed"}' if passed else
                '{"case":"S04_INSPECT_SHA","outcome":"failed"}')
          sys.exit(0 if passed else 1)
          PY
      - name: Measure selected-host storage before checkout
        run: |
          python3 - <<'PY'
          import json, os, pathlib, subprocess, sys
          code = 'MEASUREMENT'
          try:
              workspace_input = pathlib.Path(os.environ['GITHUB_WORKSPACE']).parent
              home_input = pathlib.Path.home()
              temporary_input = pathlib.Path(os.environ['RUNNER_TEMP'])
              assert all(path.is_absolute() and not path.is_symlink() for path in
                         (workspace_input, home_input, temporary_input))
              workspace = workspace_input.resolve(strict=True)
              home = home_input.resolve(strict=True)
              temporary = temporary_input.resolve(strict=True)
              assert workspace.is_dir() and home.is_dir() and temporary.is_dir()

              def command(argv, timeout=10):
                  result = subprocess.run(argv, stdin=subprocess.DEVNULL,
                                          capture_output=True, timeout=timeout, check=False)
                  assert result.returncode == 0 and not result.stderr
                  return result.stdout.decode('utf-8').strip()

              context = command(['/usr/bin/docker', 'context', 'show'])
              selected = json.loads(command(['/usr/bin/docker', 'context', 'inspect', context]))[0]
              assert selected['Endpoints']['docker']['Host'].startswith('unix://')
              docker = pathlib.Path(json.loads(command(['/usr/bin/docker', 'info', '--format',
                                                        '{{json .}}']))['DockerRootDir'])
              assert docker.is_absolute() and docker.resolve(strict=True) == docker
              roots = [workspace, home, temporary, docker]
              for area in (pathlib.Path('/tmp'), pathlib.Path('/var/tmp')):
                  if not area.exists():
                      continue
                  assert area.is_dir()
                  with os.scandir(area) as entries:
                      seen = 0
                      for entry in entries:
                          seen += 1
                          assert seen <= 1024
                          info = entry.stat(follow_symlinks=False)
                          if info.st_uid == os.getuid() or 'alopex' in entry.name.lower():
                              roots.append(pathlib.Path(entry.path).resolve(strict=True))
              roots = list(set(roots))
              assert len(roots) <= 64
              assert all(docker == root or
                         (not docker.is_relative_to(root) and not root.is_relative_to(docker))
                         for root in roots)
              roots = [root for root in roots if not any(root != other and
                       root.is_relative_to(other) for other in roots)]

              def allocation(root):
                  argv = (['/usr/bin/sudo', '-n'] if root == docker else []) + [
                      '/usr/bin/du', '-sk' if root == docker else '-skL', '--', str(root)]
                  value = command(argv, timeout=60 if root == docker else 10).split('\t')
                  assert len(value) == 2 and value[0].isascii() and value[0].isdecimal()
                  assert value[1] == str(root)
                  return int(value[0]) * 1024

              aggregate = sum(allocation(root) for root in roots)
              code = 'CAPACITY'
              # One GiB covers checkout, the <=1 MiB receipt, and <=2 MiB CMS export.
              assert aggregate + 1_000_000_000 < 40_000_000_000
              assert aggregate + 1_000_000_000 < 50_000_000_000
              for root in (workspace, temporary, docker):
                  vfs = os.statvfs(root)
                  assert vfs.f_bavail * vfs.f_frsize > 1_000_000_000
              print('{"case":"S04_INSPECT_STORAGE","outcome":"passed"}')
          except BaseException:
              print(json.dumps({'case': 'S04_INSPECT_STORAGE', 'outcome': 'failed',
                                'error_code': code}, sort_keys=True))
              sys.exit(1)
          PY
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_controller_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Check evidence recipient validity before work
        run: python3 -B scripts/ops/check_evidence_certificate.py --minimum-seconds 86400
      - name: Inspect selected Docker context read-only
        id: inspect
        run: |
          set -euo pipefail
          private="$RUNNER_TEMP/alopex-s04-inspect"
          mkdir -m 700 "$private"
          context=$(/usr/bin/docker context show)
          python3 -B scripts/ops/s04_wire_preflight.py \
            --output "$private/inspector.private.json" --cli /usr/bin/docker \
            inspect --context "$context"
      - name: Seal bounded private inspector evidence
        if: always() && steps.inspect.outcome != 'skipped'
        env:
          INSPECT_OUTCOME: ${{ steps.inspect.outcome }}
        run: |
          python3 -B scripts/ops/s04_inspect_seal.py \
            --private "$RUNNER_TEMP/alopex-s04-inspect" \
            --export native-s04-inspect-export \
            --inspect-outcome "$INSPECT_OUTCOME"
      - name: Upload only encrypted inspector and public status
        if: always() && steps.inspect.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: s04-readonly-inspect
          path: |
            native-s04-inspect-export/private-evidence.cms
            native-s04-inspect-export/public.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
  public_native_build:
    if: ${{ inputs.public_native_build_mode && inputs.issue_number == '712' && !inputs.qualification_mode && !inputs.sql_four_case_mode && !inputs.wal_cost_mode && !inputs.sql_diagnostic_mode && !inputs.s04_inspect_mode && !inputs.s04_socket_inventory_mode && !inputs.s04_capture_mode && !inputs.sql_final_mode && !inputs.hnsw_release_admission_mode && !inputs.hnsw_release_measure_mode }}
    runs-on: ${{ inputs.public_native_runner_label }}
    timeout-minutes: 210
    steps:
      - name: Prepare source within the measured VM work budget
        env:
          RUNNER_KIND: ${{ runner.environment }}
          EXPECTED_CONTROLLER_SHA: ${{ inputs.expected_controller_sha }}
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import json, os, pathlib, re, signal, stat, subprocess, time
          os.umask(0o077)
          try:
              assert os.environ.get('RUNNER_KIND') == 'github-hosted'
              assert os.environ.get('GITHUB_REPOSITORY') == 'alopex-db/alopex'
              assert re.fullmatch(r'[a-f0-9]{40}', os.environ.get('EXPECTED_CONTROLLER_SHA', ''))
              assert os.environ['EXPECTED_CONTROLLER_SHA'] == os.environ['GITHUB_SHA']
              root = pathlib.Path(os.environ['GITHUB_WORKSPACE'])
              temporary = pathlib.Path(os.environ['RUNNER_TEMP'])
              roots = [root.parent, temporary]
              for candidate in (root.parent.parent / '_actions', pathlib.Path.home() / '.cargo', pathlib.Path.home() / '.cache'):
                  if candidate.exists(): roots.append(candidate)
              def measure():
                  seen, total = set(), 0
                  pending = list(roots)
                  while pending:
                      path = pending.pop()
                      info = path.lstat()
                      identity = info.st_dev, info.st_ino
                      if identity in seen: continue
                      seen.add(identity)
                      total += info.st_blocks * 512
                      if stat.S_ISDIR(info.st_mode): pending.extend(path.iterdir())
                      elif stat.S_ISLNK(info.st_mode):
                          target = path.resolve()
                          if target.exists(): pending.append(target)
                  return total
              initial = measure()
              allowance = 1_000_000_000
              assert initial + allowance < 40_000_000_000
              assert root.is_dir() and not (root / '.git').exists()
              for args in (['git','init','--quiet'],
                           ['git','fetch','--quiet','--depth=1','https://github.com/alopex-db/alopex.git',os.environ['GITHUB_SHA']],
                           ['git','checkout','--quiet','--detach','FETCH_HEAD']):
                  with (temporary / 'alopex-source.log').open('ab') as output:
                      process = subprocess.Popen(args,cwd=root,stdout=output,stderr=output,start_new_session=True)
                      deadline = time.monotonic() + 120
                      try:
                          while process.poll() is None:
                              assert time.monotonic() < deadline and measure() <= initial + allowance
                              try: process.wait(timeout=2)
                              except subprocess.TimeoutExpired: pass
                          assert process.returncode == 0 and measure() <= initial + allowance
                      finally:
                          if process.poll() is None:
                              os.killpg(process.pid,signal.SIGTERM)
                              try: process.wait(timeout=5)
                              except subprocess.TimeoutExpired:
                                  os.killpg(process.pid,signal.SIGKILL)
                                  process.wait(timeout=5)
              actual = subprocess.run(['git','rev-parse','HEAD'],cwd=root,capture_output=True,text=True,check=True).stdout.strip()
              assert actual == os.environ['GITHUB_SHA']
              (temporary / 'alopex-source.log').unlink()
              print('{"source_preparation":"passed"}')
          except BaseException:
              print('{"source_preparation":"failed"}')
              raise SystemExit(1)
          PYCODE
      - name: Build source-bound server and wheel serially
        env:
          RUNNER_KIND: ${{ runner.environment }}
          PUBLIC_BUILD_CONFIG: ${{ inputs.public_native_build_config }}
        shell: bash
        run: python3 -B scripts/ops/hosted_native_assets.py
      - name: Verify public asset export
        if: always()
        id: public_export
        run: python3 -B scripts/ops/native_public_export.py
      - name: Preserve public software assets and fixed result
        if: always() && steps.public_export.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: native-product-assets
          path: native-assets-export/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
