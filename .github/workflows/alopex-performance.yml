name: Candidate Parquet HNSW path

on:
  workflow_dispatch:
    inputs:
      runner_label:
        description: Approved hosted runner label
        required: true
        type: string
      e2e_config:
        description: Base64 encoded private identity contract
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  parquet-hnsw-path:
    runs-on: ${{ inputs.runner_label }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify HNSW path after Parquet import
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          RUNNER_KIND: github-hosted
          E2E_CONFIG: ${{ inputs.e2e_config }}
        run: python3 scripts/ops/hosted_sequence_e2e.py
      - name: Preserve allowlisted result and encrypted evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-parquet-hnsw-path
          path: parquet-hnsw-path-export/
          if-no-files-found: error
          retention-days: 7
