name: Alopex Python Performance Advisory

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: Owning issue for read-only host inventory or qualification
        required: true
        type: string
      qualification_mode:
        description: Run the bounded #804 qualification job
        required: false
        type: boolean
        default: false
      hnsw_release_admission_mode:
        description: Admission-only selected #681 hosted job; no acquisition or measurement
        required: false
        type: boolean
        default: false
      sql_four_case_mode:
        description: Continue same-job #804 qualification into the pinned #712 SQL matrix
        required: false
        type: boolean
        default: false
      wal_cost_mode:
        description: Continue same-job #804 qualification into pinned #682 WAL cost
        required: false
        type: boolean
        default: false
      sql_diagnostic_mode:
        description: Run separate paired #712 SQL stage diagnostic after same-job 1951 qualification
        required: false
        type: boolean
        default: false
      s04_inspect_mode:
        description: Read-only selected Docker inspector for #684; no #804 assets or create
        required: false
        type: boolean
        default: false
      s04_socket_inventory_mode:
        description: Offline selected socket metadata inventory for #684
        required: false
        type: boolean
        default: false
      s04_capture_mode:
        description: Run #804 qualification then capture selected CLI against an offline fake socket
        required: false
        type: boolean
        default: false
      expected_controller_sha:
        description: Exact controller commit for qualification or selected #681 admission
        required: false
        type: string
      expected_hnsw_source_tree:
        description: Independently reviewed exact #681 source tree SHA
        required: false
        type: string
      four_case_lock_sha256:
        description: Independently reviewed SHA-256 of the #712 private lock
        required: false
        type: string
      four_case_lock_base64:
        description: Base64 of the exact #712 private lock bytes
        required: false
        type: string
      four_case_manifest_sha256:
        description: Independently reviewed SHA-256 of the #712 static manifest
        required: false
        type: string
      four_case_manifest_base64:
        description: Base64 of the exact #712 static manifest bytes
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: alopex-v0817-host-preflight
  cancel-in-progress: false

jobs:
  hnsw_release_admission:
    if: ${{ inputs.hnsw_release_admission_mode && inputs.issue_number == '681' && !inputs.qualification_mode && !inputs.sql_four_case_mode && !inputs.wal_cost_mode && !inputs.sql_diagnostic_mode && !inputs.s04_inspect_mode && !inputs.s04_socket_inventory_mode && !inputs.s04_capture_mode }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - name: Gate selected source and storage before checkout
        env:
          EXPECTED_CONTROLLER_SHA: ${{ inputs.expected_controller_sha }}
          EXPECTED_HNSW_SOURCE_TREE: ${{ inputs.expected_hnsw_source_tree }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, platform, re, stat, sys, time
          code = 'SOURCE'
          try:
              e = os.environ
              assert e.get('GITHUB_EVENT_NAME') == 'workflow_dispatch'
              assert e.get('GITHUB_JOB') == 'hnsw_release_admission'
              assert e.get('ISSUE_NUMBER') == '681'
              assert re.fullmatch(r'[0-9a-f]{40}', e.get('EXPECTED_CONTROLLER_SHA', ''))
              assert re.fullmatch(r'[0-9a-f]{40}', e.get('EXPECTED_HNSW_SOURCE_TREE', ''))
              assert e['EXPECTED_CONTROLLER_SHA'] == e.get('GITHUB_SHA')
              assert e.get('GITHUB_REF', '').startswith('refs/heads/')
              assert e.get('RUNNER_ENVIRONMENT') == 'github-hosted'
              assert platform.system() == 'Linux' and platform.machine() == 'x86_64'
              code = 'STORAGE_WORKSPACE'
              workspace = pathlib.Path(e['GITHUB_WORKSPACE'])
              temporary = pathlib.Path(e['RUNNER_TEMP'])
              home = pathlib.Path.home()
              scratch = pathlib.Path('/tmp/alopex-nim-parser-v0.8.17-contract-0.28.0-x86_64-unknown-linux-gnu')
              def root_identity(path, scratch_parent=False):
                  assert (path.is_absolute() and path.is_dir() and
                          not path.is_symlink() and path.resolve(strict=True) == path)
                  info = path.lstat()
                  assert stat.S_ISDIR(info.st_mode)
                  if scratch_parent:
                      mode = stat.S_IMODE(info.st_mode)
                      assert ((info.st_uid == 0 and mode == 0o1777) or
                              (info.st_uid == os.geteuid() and mode == 0o700))
                  else:
                      assert info.st_uid == os.geteuid()
                  return info.st_dev, info.st_ino, info.st_uid, info.st_mode
              for path in (workspace, workspace.parent, temporary, home):
                  root_identity(path)
              root_identity(scratch.parent, scratch_parent=True)
              assert not any(path.exists() or path.is_symlink() for path in
                             (scratch, pathlib.Path(str(scratch) + '.lock')))
              assert not any(workspace.iterdir())
              code = 'STORAGE_FS_STATS'
              free_by_device = {}
              for path in (workspace.parent, temporary, home, scratch.parent):
                  fs = os.statvfs(path)
                  assert fs.f_frsize > 0 and 0 <= fs.f_bavail <= fs.f_bfree <= fs.f_blocks
                  device = path.stat().st_dev
                  free = fs.f_bavail * fs.f_frsize
                  free_by_device[device] = min(free_by_device.get(device, free), free)
              local = home / '.local'
              if local.exists() or local.is_symlink():
                  assert local.is_dir() and not local.is_symlink() and local.stat().st_uid == os.geteuid()
                  installs = tuple(sorted(path for path in local.iterdir()
                                          if path.name.startswith('alopex-')))
              else:
                  installs = ()
              roots = (workspace.parent, temporary, home / '.cargo', home / '.cache',
                       home / '.rustup', *installs, scratch, pathlib.Path(str(scratch) + '.lock'))
              optional = {home / '.cargo', home / '.cache', home / '.rustup', scratch,
                          pathlib.Path(str(scratch) + '.lock')}
              code = 'STORAGE_ROOTS'
              def mount_text():
                  with open('/proc/self/mountinfo', encoding='utf-8') as source:
                      value = source.read(4_000_001)
                  assert len(value.encode('utf-8')) <= 4_000_000
                  return value
              def mount_path(value):
                  assert isinstance(value, str) and not re.search(r'\\(?![0-7]{3})', value)
                  decoded = re.sub(r'\\([0-7]{3})',
                                   lambda found: chr(int(found.group(1), 8)), value)
                  assert (decoded.startswith('/') and '\x00' not in decoded and
                          (decoded == '/' or (not decoded.endswith('/') and
                           all(part not in ('', '.', '..')
                               for part in decoded.split('/')[1:]))))
                  return pathlib.Path(decoded)
              def mount_topology(anchors, roots, value):
                  assert isinstance(value, str) and len(value.encode('utf-8')) <= 4_000_000
                  lines = value.splitlines()
                  assert 1 <= len(lines) <= 4096
                  rows, ids, points = [], set(), set()
                  for line in lines:
                      assert len(line) <= 8192 and line.count(' - ') == 1
                      before, after = line.split(' - ', 1)
                      fields, tail = before.split(), after.split()
                      assert (len(fields) >= 6 and len(tail) >= 3 and
                              fields[0].isdecimal() and fields[1].isdecimal() and
                              re.fullmatch(r'[0-9]+:[0-9]+', fields[2]))
                      mount_id, parent_id = int(fields[0]), int(fields[1])
                      root, point = mount_path(fields[3]), mount_path(fields[4])
                      assert mount_id > 0 and parent_id > 0 and mount_id not in ids
                      ids.add(mount_id)
                      points.add(point)
                      major, minor = (int(part) for part in fields[2].split(':'))
                      rows.append((mount_id, parent_id, major, minor, str(root),
                                   str(point), tuple(fields[5:]), tuple(tail)))
                  assert pathlib.Path('/') in points
                  grouped = {}
                  for row in rows:
                      grouped.setdefault(pathlib.Path(row[5]), []).append(row)
                  def visible(point):
                      stack = grouped[point]
                      by_id = {row[0]: row for row in stack}
                      bases = [row for row in stack if row[1] not in by_id or
                               row[1] == row[0]]
                      assert len(bases) == 1
                      ordered = [bases[0]]
                      while len(ordered) < len(stack):
                          children = [row for row in stack if
                                      row[1] == ordered[-1][0] and row[0] != ordered[-1][0]]
                          assert len(children) == 1 and children[0] not in ordered
                          ordered.append(children[0])
                      return ordered[-1]
                  admitted = {path for path, _ in anchors} | set(roots)
                  relevant = set()
                  for path, _ in anchors:
                      covering = [point for point in grouped if path == point or
                                  path.is_relative_to(point)]
                      assert covering
                      point = max(covering, key=lambda item: len(item.parts))
                      selected = visible(point)
                      device = path.stat().st_dev
                      assert (selected[2], selected[3]) == (os.major(device), os.minor(device))
                      relevant.update(grouped[point])
                  for root in roots:
                      if not root.exists() and not root.is_symlink():
                          continue
                      covering = [point for point in grouped if root == point or
                                  root.is_relative_to(point)]
                      assert covering
                      point = max(covering, key=lambda item: len(item.parts))
                      visible(point)
                      relevant.update(grouped[point])
                      for point, stack in grouped.items():
                          if point != root and point.is_relative_to(root):
                              assert point in admitted
                              visible(point)
                              relevant.update(stack)
                  return tuple(sorted(relevant))
              fixed = (workspace, workspace.parent, temporary, home, scratch.parent)
              if local.exists():
                  fixed += (local,)
              fixed += tuple(path for path in (home / '.cargo', home / '.cache',
                                               home / '.rustup', *installs)
                              if path.exists() or path.is_symlink())
              root_link_codes = {
                  workspace.parent: 'STORAGE_LINK_ROOT_WORKSPACE',
                  temporary: 'STORAGE_LINK_ROOT_TEMP',
                  home: 'STORAGE_LINK_ROOT_HOME',
                  scratch.parent: 'STORAGE_LINK_ROOT_SCRATCH_PARENT',
                  local: 'STORAGE_LINK_ROOT_LOCAL',
                  home / '.cargo': 'STORAGE_LINK_ROOT_CARGO',
                  home / '.cache': 'STORAGE_LINK_ROOT_CACHE',
                  home / '.rustup': 'STORAGE_LINK_ROOT_RUSTUP',
              }
              for path in fixed:
                  if path.is_symlink():
                      code = (root_link_codes[path] if path in root_link_codes else
                              'STORAGE_LINK_ROOT_INSTALL' if path in installs else
                              'STORAGE_LINK_ROOT_OTHER')
                      assert False
              code = 'STORAGE_ROOT_IDENTITY'
              anchors = tuple((path, root_identity(path, scratch_parent=path == scratch.parent))
                              for path in dict.fromkeys(fixed))
              code = 'STORAGE_MOUNT'
              mounts = mount_topology(anchors, roots, mount_text())
              def check_anchors():
                  assert all(root_identity(path, scratch_parent=path == scratch.parent) == identity
                             for path, identity in anchors)
              def check_mounts():
                  assert mount_topology(anchors, roots, mount_text()) == mounts
              code = 'STORAGE_ROOT_IDENTITY'
              check_anchors()
              code = 'STORAGE_MOUNT'
              check_mounts()
              code = 'STORAGE_TREE'
              seen = set()
              baseline = entries = 0
              deadline = time.monotonic() + 90
              tree_link_codes = {
                  workspace.parent: 'STORAGE_LINK_TREE_WORKSPACE',
                  temporary: 'STORAGE_LINK_TREE_TEMP',
                  home / '.cargo': 'STORAGE_LINK_TREE_CARGO',
                  home / '.cache': 'STORAGE_LINK_TREE_CACHE',
                  home / '.rustup': 'STORAGE_LINK_TREE_RUSTUP',
                  scratch: 'STORAGE_LINK_TREE_SCRATCH',
                  pathlib.Path(str(scratch) + '.lock'): 'STORAGE_LINK_TREE_SCRATCH_LOCK',
              }
              for root in roots:
                  if not root.exists() and not root.is_symlink():
                      assert root in optional
                      continue
                  pending = [(root, 0)]
                  while pending:
                      code = 'STORAGE_BOUNDS'
                      assert time.monotonic() <= deadline and entries < 200000
                      path, depth = pending.pop()
                      assert depth <= 64
                      code = 'STORAGE_TREE'
                      info = path.lstat()
                      if stat.S_ISLNK(info.st_mode):
                          code = (tree_link_codes[root] if root in tree_link_codes else
                                  'STORAGE_LINK_TREE_INSTALL' if root in installs else
                                  'STORAGE_LINK_TREE_OTHER')
                          assert False
                      assert (info.st_uid == os.geteuid() and
                              info.st_dev in free_by_device and info.st_blocks >= 0 and
                              (stat.S_ISDIR(info.st_mode) or stat.S_ISREG(info.st_mode)))
                      if path in (scratch, pathlib.Path(str(scratch) + '.lock')):
                          assert (stat.S_ISDIR(info.st_mode) and
                                  stat.S_IMODE(info.st_mode) == 0o700)
                      identity = (info.st_dev, info.st_ino)
                      if identity in seen:
                          continue
                      seen.add(identity)
                      entries += 1
                      baseline += info.st_blocks * 512
                      code = 'STORAGE_BOUNDS'
                      assert baseline < 50_000_000_000
                      code = 'STORAGE_TREE'
                      if stat.S_ISDIR(info.st_mode):
                          with os.scandir(path) as children:
                              pending.extend((pathlib.Path(child.path), depth + 1)
                                             for child in children)
              code = 'STORAGE_ROOT_IDENTITY'
              check_anchors()
              code = 'STORAGE_MOUNT'
              check_mounts()
              code = 'STORAGE_BUDGET'
              assert baseline + 10_000_000_000 < 40_000_000_000
              code = 'STORAGE_FREE'
              assert all(free > 10_000_000_000 for free in free_by_device.values())
              code = 'STORAGE_ENV'
              with open(e['GITHUB_ENV'], 'a', encoding='ascii') as output:
                  output.write('HNSW_ADMISSION_BASELINE=' + str(baseline) + '\n')
                  values = (tuple((str(path), identity) for path, identity in anchors), mounts)
                  output.write('HNSW_ADMISSION_ROOT_SEAL=' +
                               hashlib.sha256(repr(values).encode('utf-8')).hexdigest() + '\n')
              print(json.dumps({'case': 'HNSW_HOSTED_PRECHECK', 'outcome': 'passed'}))
          except BaseException:
              print(json.dumps({'case': 'HNSW_HOSTED_PRECHECK', 'outcome': 'failed', 'error_code': code}))
              sys.exit(1)
          PY
      - name: Fetch exact selected source without path output
        timeout-minutes: 2
        env:
          EXPECTED_CONTROLLER_SHA: ${{ inputs.expected_controller_sha }}
          EXPECTED_HNSW_SOURCE_TREE: ${{ inputs.expected_hnsw_source_tree }}
          GH_CHECKOUT_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, json, os, pathlib, re, stat, subprocess, sys, tempfile
          try:
              e = os.environ
              assert re.fullmatch(r'[0-9a-f]{40}', e.get('EXPECTED_CONTROLLER_SHA', ''))
              assert re.fullmatch(r'[0-9a-f]{40}', e.get('EXPECTED_HNSW_SOURCE_TREE', ''))
              ref = e.get('GITHUB_REF', '')
              assert re.fullmatch(r'refs/heads/[A-Za-z0-9._/-]+', ref)
              assert '..' not in ref and '//' not in ref and not ref.endswith('/')
              workspace = pathlib.Path(e['GITHUB_WORKSPACE'])
              assert (workspace.is_absolute() and workspace.is_dir() and
                      not workspace.is_symlink() and workspace.resolve(strict=True) == workspace and
                      workspace.stat().st_uid == os.geteuid() and not any(workspace.iterdir()))
              workspace.chmod(0o700)
              git_binary = pathlib.Path('/usr/bin/git')
              git_info = git_binary.stat()
              assert (stat.S_ISREG(git_info.st_mode) and git_info.st_uid == 0 and
                      not git_info.st_mode & 0o022)
              temporary = pathlib.Path(e['RUNNER_TEMP'])
              assert (temporary.is_absolute() and temporary.is_dir() and
                      not temporary.is_symlink() and temporary.resolve(strict=True) == temporary and
                      temporary.stat().st_uid == os.geteuid())
              credentials = base64.b64encode(('x-access-token:' + e['GH_CHECKOUT_TOKEN']).encode()).decode()
              with tempfile.TemporaryDirectory(dir=temporary) as template:
                  git_env = {'HOME': str(pathlib.Path.home()), 'PATH': '/usr/bin:/bin',
                             'LANG': 'C', 'GIT_CONFIG_COUNT': '1',
                             'GIT_CONFIG_NOSYSTEM': '1', 'GIT_CONFIG_GLOBAL': '/dev/null',
                             'GIT_TEMPLATE_DIR': template,
                             'GIT_CONFIG_KEY_0': 'http.https://github.com/.extraheader',
                             'GIT_CONFIG_VALUE_0': 'AUTHORIZATION: basic ' + credentials,
                             'GIT_TERMINAL_PROMPT': '0', 'GIT_LFS_SKIP_SMUDGE': '1'}
                  def git(*args, read=False):
                      result = subprocess.run([str(git_binary), '-C', str(workspace), *args],
                                              env=git_env, stdin=subprocess.DEVNULL,
                                              stdout=subprocess.PIPE if read else subprocess.DEVNULL,
                                              stderr=subprocess.DEVNULL, timeout=105)
                      assert result.returncode == 0
                      if read:
                          assert len(result.stdout) <= 4096
                          return result.stdout.decode('ascii').strip()
                  git('init', '-q')
                  git('fetch', '--no-tags', '--depth=1',
                      'https://github.com/alopex-db/alopex.git', ref)
                  assert git('rev-parse', 'FETCH_HEAD', read=True) == e['EXPECTED_CONTROLLER_SHA']
                  git('checkout', '--detach', '-q', 'FETCH_HEAD')
                  assert git('rev-parse', 'HEAD', read=True) == e['EXPECTED_CONTROLLER_SHA']
                  assert git('rev-parse', 'HEAD^{tree}', read=True) == e['EXPECTED_HNSW_SOURCE_TREE']
                  assert git('status', '--porcelain', '--untracked-files=all', read=True) == ''
              print(json.dumps({'case': 'HNSW_HOSTED_CHECKOUT', 'outcome': 'passed'}))
          except BaseException:
              print(json.dumps({'case': 'HNSW_HOSTED_CHECKOUT', 'outcome': 'failed',
                                'error_code': 'SOURCE'}))
              sys.exit(1)
          PY
      - name: Authenticate selected job and admit host
        timeout-minutes: 5
        env:
          EXPECTED_CONTROLLER_SHA: ${{ inputs.expected_controller_sha }}
          EXPECTED_HNSW_SOURCE_TREE: ${{ inputs.expected_hnsw_source_tree }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          GH_ACTIONS_READ_TOKEN: ${{ github.token }}
        run: python3 -B scripts/performance/issue681_hosted_identity.py
  s04_socket_inventory:
    if: ${{ inputs.s04_socket_inventory_mode && inputs.issue_number == '684' && !inputs.hnsw_release_admission_mode && !inputs.qualification_mode && !inputs.sql_four_case_mode && !inputs.wal_cost_mode && !inputs.sql_diagnostic_mode && !inputs.s04_inspect_mode && !inputs.s04_capture_mode }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Gate exact source and host allocation before checkout
        env:
          EXPECTED_CONTROLLER_SHA: ${{ inputs.expected_controller_sha }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re, stat, subprocess, sys, tempfile
          gate = 'SOURCE_BINDING'
          root_id = 'none'
          try:
              e = os.environ
              assert e.get('GITHUB_EVENT_NAME') == 'workflow_dispatch'
              assert e.get('ISSUE_NUMBER') == '684'
              assert re.fullmatch(r'[0-9a-f]{40}', e.get('EXPECTED_CONTROLLER_SHA', ''))
              assert e['EXPECTED_CONTROLLER_SHA'] == e['GITHUB_SHA']
              runner_temp = pathlib.Path(e['RUNNER_TEMP']).resolve(strict=True)
              assert runner_temp == pathlib.Path(e['RUNNER_TEMP']) and runner_temp.is_dir()
              env_file = pathlib.Path(e['GITHUB_ENV'])
              assert env_file.is_absolute()
              for key in ('TMPDIR', 'TMP', 'TEMP'):
                  os.environ[key] = str(runner_temp)
              fd = os.open(env_file, os.O_WRONLY | os.O_APPEND | os.O_NOFOLLOW)
              try:
                  info = os.fstat(fd)
                  assert stat.S_ISREG(info.st_mode) and info.st_uid == os.getuid()
                  payload = ''.join(f'{key}={runner_temp}\n' for key in
                                    ('TMPDIR', 'TMP', 'TEMP')).encode()
                  assert os.write(fd, payload) == len(payload)
              finally:
                  os.close(fd)
              assert pathlib.Path(tempfile.gettempdir()).resolve(strict=True) == runner_temp
              gate = 'DAEMON_DISCOVERY'
              # A selected local daemon must be identifiable before checkout.
              # Unknown flags/configuration stop the inventory; no Docker API is queried.
              daemons = []
              for entry in pathlib.Path('/proc').iterdir():
                  if not entry.name.isdecimal():
                      continue
                  try:
                      comm = (entry / 'comm').read_text().strip()
                  except FileNotFoundError:
                      continue
                  assert comm
                  if comm != 'dockerd':
                      continue
                  try:
                      raw = (entry / 'cmdline').read_bytes()
                  except FileNotFoundError:
                      continue
                  assert len(raw) <= 65536
                  args = [os.fsdecode(part) for part in raw.split(b'\0') if part]
                  assert args and pathlib.Path(args[0]).name == 'dockerd'
                  daemons.append(args)
              assert len(daemons) == 1
              gate = 'DAEMON_CONFIG'
              args = daemons[0][1:]
              assert not any(arg.startswith('--rootless') or arg.startswith('--config-file') or
                             arg == '-g' or arg.startswith('-g=') for arg in args)
              roots_in_args = [arg.split('=', 1)[1] for arg in args if arg.startswith('--data-root=')]
              for index, arg in enumerate(args):
                  if arg == '--data-root':
                      assert index + 1 < len(args)
                      roots_in_args.append(args[index + 1])
              assert len(roots_in_args) <= 1
              setting = pathlib.Path('/etc/docker/daemon.json')
              configured_root = None
              if setting.exists():
                  assert not setting.is_symlink() and setting.stat().st_size <= 65536
                  configured_root = json.loads(setting.read_text()).get('data-root')
              if configured_root is not None and roots_in_args:
                  assert configured_root == roots_in_args[0]
              gate = 'DAEMON_ROOT'
              daemon = pathlib.Path(roots_in_args[0] if roots_in_args else
                                    configured_root or '/var/lib/docker')
              assert daemon.is_absolute() and daemon.resolve(strict=True) == daemon
              gate = 'ROOT_SCOPE'
              temp_areas = ((pathlib.Path('/tmp'), 'tmp'),
                            (pathlib.Path('/var/tmp'), 'var_tmp'))
              def temp_entries(areas):
                  selected = []
                  for area, label in areas:
                      if not area.exists():
                          continue
                      assert area.is_dir() and not area.is_symlink()
                      with os.scandir(area) as entries:
                          for entry in entries:
                              if 'alopex' not in entry.name.lower():
                                  continue
                              info = entry.stat(follow_symlinks=False)
                              actual = pathlib.Path(entry.path).resolve(strict=True)
                              assert actual.is_absolute()
                              selected.append((label, entry.name, info.st_dev, info.st_ino,
                                               info.st_uid, str(actual)))
                  return sorted(selected)
              temp_snapshot = temp_entries(temp_areas)
              roots = [('workspace_parent', pathlib.Path(e['GITHUB_WORKSPACE']).parent),
                       ('home', pathlib.Path.home()), ('runner_temp', runner_temp),
                       ('daemon', daemon)]
              roots.extend((label, pathlib.Path(actual)) for label, _, _, _, _, actual
                           in temp_snapshot)
              roots = [(name, p) for name, p in roots if p.exists()]
              assert all(p.is_absolute() and (p.is_dir() or p.is_file()) and
                         not p.is_symlink() for _, p in roots)
              roots = [(name, p) for name, p in roots
                       if not any(p != q and p.is_relative_to(q) for _, q in roots)]
              total = 0
              for root_id, root in roots:
                  gate = 'ROOT_SCAN'
                  prefix = ['/usr/bin/sudo', '-n'] if root == daemon else []
                  run = subprocess.run(prefix + ['/usr/bin/du', '-sk' if root == daemon else '-skL',
                                                 '--', str(root)],
                                       stdin=subprocess.DEVNULL, capture_output=True, timeout=60)
                  gate = 'ROOT_EXIT'
                  if run.returncode != 0:
                      lines = run.stderr.decode('utf-8', errors='replace').splitlines()
                      vanished = (run.returncode == 1 and bool(lines) and all(
                          re.fullmatch(r'(?:/usr/bin/)?du: cannot access .+: No such file or directory',
                                       line) is not None for line in lines))
                      gate = 'ROOT_EXIT_VANISHED' if vanished else 'ROOT_EXIT_OTHER'
                      raise AssertionError
                  gate = 'ROOT_STDERR'
                  assert not run.stderr
                  gate = 'ROOT_OUTPUT_SHAPE'
                  parts = run.stdout.decode().strip().split('\t')
                  assert len(parts) == 2
                  gate = 'ROOT_OUTPUT_COUNT'
                  assert parts[0].isdecimal()
                  gate = 'ROOT_OUTPUT_ROOT'
                  assert parts[1] == str(root)
                  total += int(parts[0]) * 1024
                  gate = 'ROOT_FREE_SPACE'
                  fs = os.statvfs(root)
                  assert fs.f_bavail * fs.f_frsize > 1_000_000_000
              root_id = 'none'
              gate = 'TEMP_SNAPSHOT'
              assert temp_entries(temp_areas) == temp_snapshot
              gate = 'CAPACITY'
              assert total + 1_000_000_000 < 40_000_000_000
              print('{"case":"S04_SOCKET_STORAGE","outcome":"passed"}')
          except BaseException:
              print(json.dumps({'case': 'S04_SOCKET_STORAGE', 'outcome': 'failed',
                                'error_code': gate, 'root_id': root_id}, sort_keys=True))
              sys.exit(1)
