name: Alopex Python Performance Advisory

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: Owning issue for read-only host inventory or qualification
        required: true
        type: string
      qualification_mode:
        description: Run the bounded #804 qualification job
        required: false
        type: boolean
        default: false
      sql_four_case_mode:
        description: Continue same-job #804 qualification into the pinned #712 SQL matrix
        required: false
        type: boolean
        default: false
      wal_cost_mode:
        description: Continue same-job #804 qualification into pinned #682 WAL cost
        required: false
        type: boolean
        default: false
      sql_diagnostic_mode:
        description: Run separate paired #712 SQL stage diagnostic after same-job 1951 qualification
        required: false
        type: boolean
        default: false
      s04_inspect_mode:
        description: Read-only selected Docker inspector for #684; no #804 assets or create
        required: false
        type: boolean
        default: false
      s04_socket_inventory_mode:
        description: Offline selected socket metadata inventory for #684
        required: false
        type: boolean
        default: false
      s04_capture_mode:
        description: Run #804 qualification then capture selected CLI against an offline fake socket
        required: false
        type: boolean
        default: false
      expected_controller_sha:
        description: Exact controller commit for qualification mode
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: alopex-v0817-host-preflight
  cancel-in-progress: false

jobs:
  s04_socket_inventory:
    if: ${{ inputs.s04_socket_inventory_mode && inputs.issue_number == '684' && !inputs.qualification_mode && !inputs.sql_four_case_mode && !inputs.wal_cost_mode && !inputs.sql_diagnostic_mode && !inputs.s04_inspect_mode && !inputs.s04_capture_mode }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Gate exact source and host allocation before checkout
        env:
          EXPECTED_CONTROLLER_SHA: ${{ inputs.expected_controller_sha }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re, subprocess, sys
          try:
              e = os.environ
              assert e.get('GITHUB_EVENT_NAME') == 'workflow_dispatch'
              assert e.get('ISSUE_NUMBER') == '684'
              assert re.fullmatch(r'[0-9a-f]{40}', e.get('EXPECTED_CONTROLLER_SHA', ''))
              assert e['EXPECTED_CONTROLLER_SHA'] == e['GITHUB_SHA']
              # A selected local daemon must be identifiable before checkout.
              # Unknown flags/configuration stop the inventory; no Docker API is queried.
              daemons = []
              for entry in pathlib.Path('/proc').iterdir():
                  if not entry.name.isdecimal():
                      continue
                  try:
                      comm = (entry / 'comm').read_text().strip()
                  except FileNotFoundError:
                      continue
                  assert comm
                  if comm != 'dockerd':
                      continue
                  try:
                      raw = (entry / 'cmdline').read_bytes()
                  except FileNotFoundError:
                      continue
                  assert len(raw) <= 65536
                  args = [os.fsdecode(part) for part in raw.split(b'\0') if part]
                  assert args and pathlib.Path(args[0]).name == 'dockerd'
                  daemons.append(args)
              assert len(daemons) == 1
              args = daemons[0][1:]
              assert not any(arg.startswith('--rootless') or arg.startswith('--config-file') or
                             arg == '-g' or arg.startswith('-g=') for arg in args)
              roots_in_args = [arg.split('=', 1)[1] for arg in args if arg.startswith('--data-root=')]
              for index, arg in enumerate(args):
                  if arg == '--data-root':
                      assert index + 1 < len(args)
                      roots_in_args.append(args[index + 1])
              assert len(roots_in_args) <= 1
              setting = pathlib.Path('/etc/docker/daemon.json')
              configured_root = None
              if setting.exists():
                  assert not setting.is_symlink() and setting.stat().st_size <= 65536
                  configured_root = json.loads(setting.read_text()).get('data-root')
              if configured_root is not None and roots_in_args:
                  assert configured_root == roots_in_args[0]
              daemon = pathlib.Path(roots_in_args[0] if roots_in_args else
                                    configured_root or '/var/lib/docker')
              assert daemon.is_absolute() and daemon.resolve(strict=True) == daemon
              roots = [pathlib.Path(e['GITHUB_WORKSPACE']).parent, pathlib.Path.home(),
                       pathlib.Path(e['RUNNER_TEMP']), daemon, pathlib.Path('/tmp'), pathlib.Path('/var/tmp')]
              roots = [p for p in roots if p.exists()]
              assert all(p.is_absolute() and p.is_dir() and not p.is_symlink() for p in roots)
              roots = [p for p in roots if not any(p != q and p.is_relative_to(q) for q in roots)]
              total = 0
              for root in roots:
                  prefix = ['/usr/bin/sudo', '-n'] if root == daemon else []
                  run = subprocess.run(prefix + ['/usr/bin/du', '-sk' if root == daemon else '-skL',
                                                 '--', str(root)],
                                       stdin=subprocess.DEVNULL, capture_output=True, timeout=60)
                  parts = run.stdout.decode().strip().split('\t')
                  assert run.returncode == 0 and not run.stderr and len(parts) == 2
                  assert parts[0].isdecimal() and parts[1] == str(root)
                  total += int(parts[0]) * 1024
                  fs = os.statvfs(root)
                  assert fs.f_bavail * fs.f_frsize > 1_000_000_000
              assert total + 1_000_000_000 < 40_000_000_000
              print('{"case":"S04_SOCKET_STORAGE","outcome":"passed"}')
          except BaseException:
              print('{"case":"S04_SOCKET_STORAGE","outcome":"failed"}')
              sys.exit(1)
          PY
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_controller_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Collect selected socket metadata without connection
        id: collect
        env:
          EXPECTED_CONTROLLER_SHA: ${{ inputs.expected_controller_sha }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        run: python3 -B scripts/ops/s04_socket_inventory.py
      - name: Seal private socket inventory
        if: always() && steps.collect.outcome != 'skipped'
        env:
          COLLECT_OUTCOME: ${{ steps.collect.outcome }}
        run: python3 -B scripts/ops/s04_socket_inventory_seal.py
      - name: Upload encrypted socket inventory
        if: always() && steps.collect.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: s04-socket-metadata-inventory
          path: |
            native-s04-socket-inventory-export/private-evidence.cms
            native-s04-socket-inventory-export/public.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
  inventory:
    if: ${{ !inputs.qualification_mode && !inputs.sql_four_case_mode && !inputs.wal_cost_mode && !inputs.sql_diagnostic_mode && !inputs.s04_inspect_mode && !inputs.s04_socket_inventory_mode && !inputs.s04_capture_mode }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Collect encrypted read-only host inventory
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: python3 -B scripts/ops/hosted_test_env_inventory.py
      - name: Preserve encrypted inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: host-preflight-inventory
          path: native-inventory-export/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
  qualification:
    if: inputs.qualification_mode && !inputs.wal_cost_mode && !inputs.s04_inspect_mode && !inputs.s04_socket_inventory_mode && ((inputs.issue_number == '804' && !inputs.sql_four_case_mode && !inputs.sql_diagnostic_mode && !inputs.s04_capture_mode) || (inputs.issue_number == '712' && !inputs.s04_capture_mode && ((inputs.sql_four_case_mode && !inputs.sql_diagnostic_mode) || (inputs.sql_diagnostic_mode && !inputs.sql_four_case_mode))) || (inputs.issue_number == '684' && inputs.s04_capture_mode && !inputs.sql_four_case_mode && !inputs.sql_diagnostic_mode))
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Bound checkout before source acquisition
        env:
          EXPECTED_CONTROLLER_SHA: ${{ inputs.expected_controller_sha }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re, stat, subprocess, sys, tempfile
          phase, error_code = 'SHA', 'IDENTITY'
          try:
              expected = os.environ['EXPECTED_CONTROLLER_SHA']
              assert re.fullmatch(r'[a-f0-9]{40}', expected) and expected == os.environ['GITHUB_SHA']
              phase, error_code = 'ROOTS', 'MEASUREMENT'
              workspace = pathlib.Path(os.environ['GITHUB_WORKSPACE']).parent
              workspace.mkdir(parents=True, exist_ok=True)
              assert workspace.is_absolute() and not workspace.is_symlink()
              runner_temp = pathlib.Path(os.environ['RUNNER_TEMP']).resolve(strict=True)
              assert runner_temp.is_absolute() and runner_temp.is_dir()
              assert not any(character in str(runner_temp) for character in ('\r', '\n', '\0'))
              env_file = pathlib.Path(os.environ['GITHUB_ENV'])
              assert env_file.is_absolute()
              for key in ('TMPDIR', 'TMP', 'TEMP'):
                  os.environ[key] = str(runner_temp)
              lines = ''.join(f'{key}={runner_temp}\n' for key in ('TMPDIR', 'TMP', 'TEMP'))
              fd = os.open(env_file, os.O_WRONLY | os.O_APPEND | os.O_NOFOLLOW)
              try:
                  info = os.fstat(fd)
                  assert stat.S_ISREG(info.st_mode) and info.st_uid == os.getuid()
                  payload = lines.encode('utf-8')
                  assert os.write(fd, payload) == len(payload)
              finally:
                  os.close(fd)
              assert all(pathlib.Path(os.environ[key]).resolve(strict=True) == runner_temp
                         for key in ('TMPDIR', 'TMP', 'TEMP'))
              assert pathlib.Path(tempfile.gettempdir()).resolve(strict=True) == runner_temp
              phase, error_code = 'BINARY', 'POLICY'
              binaries = [pathlib.Path('/usr/bin/du'), pathlib.Path('/usr/bin/sudo'),
                          pathlib.Path('/usr/bin/docker')]
              for path in (pathlib.Path('/'), pathlib.Path('/usr'), pathlib.Path('/usr/bin')):
                  info = path.lstat()
                  assert stat.S_ISDIR(info.st_mode) and info.st_uid == 0 and not info.st_mode & 0o022
              for binary in binaries:
                  info = binary.lstat()
                  assert stat.S_ISREG(info.st_mode) and info.st_uid == 0
                  assert not info.st_mode & 0o022 and info.st_mode & 0o111
              phase, error_code = 'DOCKER', 'PREREQUISITE'
              def run(args):
                  result = subprocess.run(args, stdin=subprocess.DEVNULL,
                                          capture_output=True, text=True, timeout=10)
                  assert result.returncode == 0 and not result.stderr
                  return result.stdout.strip()
              phase = 'DOCKER_CONTEXT'
              context = run(['/usr/bin/docker', 'context', 'show'])
              phase = 'DOCKER_INSPECT'
              inspection = json.loads(run(['/usr/bin/docker', 'context', 'inspect', context]))[0]
              assert inspection['Endpoints']['docker']['Host'].startswith('unix://')
              phase = 'DOCKER_INFO'
              docker = pathlib.Path(json.loads(run(['/usr/bin/docker', 'info', '--format',
                                                    '{{json .}}']))['DockerRootDir'])
              phase, error_code = 'ROOTS', 'MEASUREMENT'
              assert docker.is_absolute() and docker.resolve(strict=True) == docker
              home = pathlib.Path.home()
              temp = pathlib.Path(os.environ['RUNNER_TEMP'])
              candidates = [('WORK', workspace), ('HOME', home), ('TEMP', temp),
                            ('DOCKER', docker)]
              temp_snapshot = []
              for area, label in ((pathlib.Path('/tmp'), 'TMP'),
                                  (pathlib.Path('/var/tmp'), 'VARTMP')):
                  if not area.exists():
                      continue
                  assert area.is_dir()
                  with os.scandir(area) as entries:
                      for entry in entries:
                          info = entry.stat(follow_symlinks=False)
                          if info.st_uid == os.getuid() or 'alopex' in entry.name.lower():
                              actual = pathlib.Path(entry.path).resolve(strict=True)
                              candidates.append((label, actual))
                              temp_snapshot.append((str(area), entry.name, info.st_dev,
                                                    info.st_ino, info.st_uid, str(actual)))
              temp_snapshot.sort()
              categories = {}
              for label, path in candidates:
                  categories.setdefault(path.resolve(strict=True), label)
              roots = list(categories)
              assert docker in roots and all(not docker.is_relative_to(root) and
                                             not root.is_relative_to(docker)
                                             for root in roots if root != docker)
              selected = [root for root in roots if not any(root != other and
                          root.is_relative_to(other) for other in roots)]
              phase, error_code = 'DU', 'MEASUREMENT'
              def du_code(category, failure):
                  assert category in {'WORK', 'HOME', 'TEMP', 'TMP', 'VARTMP', 'DOCKER'}
                  assert failure in {'TIMEOUT', 'EXIT', 'PARSE'}
                  return 'DU_' + category + '_' + failure
              def allocation(root, category, privileged=False):
                  global error_code
                  args = (['/usr/bin/sudo', '-n'] if privileged else []) + [
                      '/usr/bin/du', '-skL' if not privileged else '-sk', '--', str(root)]
                  error_code = du_code(category, 'EXIT')
                  try:
                      result = subprocess.run(args, stdin=subprocess.DEVNULL,
                                              capture_output=True, text=True,
                                              timeout=60 if privileged else 10)
                  except subprocess.TimeoutExpired:
                      error_code = du_code(category, 'TIMEOUT')
                      raise
                  assert result.returncode == 0 and not result.stderr
                  error_code = du_code(category, 'PARSE')
                  fields = result.stdout.strip().split('\t')
                  assert len(fields) == 2 and fields[0].isascii()
                  assert fields[0].isdecimal() and fields[1] == str(root)
                  return int(fields[0]) * 1024
              aggregate = sum(allocation(root, categories[root], root == docker) for root in selected)
              workspace_bytes = allocation(workspace, 'WORK')
              phase, error_code = 'CAPACITY', 'CAPACITY'
              assert aggregate + 1_000_000_000 + 7_500_000_000 < 40_000_000_000
              assert os.statvfs(workspace).f_bavail * os.statvfs(workspace).f_frsize > 1_000_000_000
              assert os.statvfs(docker).f_bavail * os.statvfs(docker).f_frsize > 7_500_000_000
              phase, error_code = 'RECEIPT', 'COMMAND'
              private = pathlib.Path(os.environ['RUNNER_TEMP']) / 'alopex-804-qualification'
              private.mkdir(mode=0o700, exist_ok=True)
              private.chmod(0o700)
              receipt = private / 'checkout-preflight.private.json'
              receipt.write_text(json.dumps({'workspace_root': str(workspace),
                                             'allocated_bytes': workspace_bytes,
                                             'aggregate_allocated_bytes': aggregate,
                                             'roots': list(map(str, selected)),
                                             'temp_snapshot': temp_snapshot,
                                             'docker_root': str(docker),
                                             'expected_controller_sha': expected}) + '\n')
              receipt.chmod(0o600)
              print('{"case":"CHECKOUT_PREFLIGHT","outcome":"passed"}')
          except BaseException:
              public = {'schema': 'alopex.checkout-preflight-public/v1',
                        'case': 'CHECKOUT_PREFLIGHT', 'outcome': 'failed',
                        'phase': phase, 'error_code': error_code}
              try:
                  export = pathlib.Path(os.environ.get('GITHUB_WORKSPACE', '.')) / 'native-qualification-export'
                  export.mkdir(mode=0o700, parents=True, exist_ok=True)
                  (export / 'public.json').write_text(json.dumps(public, sort_keys=True) + '\n')
              except BaseException:
                  print('{"case":"CHECKOUT_PREFLIGHT","outcome":"evidence_failed"}')
                  sys.exit(1)
              print(json.dumps(public, sort_keys=True))
              sys.exit(1)
          PY
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Admit this runner before candidate acquisition
        if: ${{ !inputs.sql_diagnostic_mode }}
        env:
          EXPECTED_CONTROLLER_SHA: ${{ inputs.expected_controller_sha }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          ALOPEX_804_ASSETS: ${{ runner.temp }}/alopex-804-candidate
        run: python3 -B scripts/ops/hosted_test_env_qualification.py --admission-only
      - name: Retrieve exact candidate assets
        if: ${{ !inputs.sql_diagnostic_mode }}
        env:
          EXPECTED_CONTROLLER_SHA: ${{ inputs.expected_controller_sha }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          ALOPEX_804_ASSETS: ${{ runner.temp }}/alopex-804-candidate
          GH_TOKEN: ${{ github.token }}
        run: python3 -B scripts/ops/hosted_test_env_qualification.py --acquire-assets
      - name: Qualify on this runner
        if: ${{ !inputs.sql_diagnostic_mode }}
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          ALOPEX_804_ASSETS: ${{ runner.temp }}/alopex-804-candidate
          EXPECTED_CONTROLLER_SHA: ${{ inputs.expected_controller_sha }}
        run: python3 -B scripts/ops/hosted_test_env_qualification.py --execute
      - name: Admit runner for exact 1951 diagnostic qualification
        if: inputs.sql_diagnostic_mode
        env:
          EXPECTED_CONTROLLER_SHA: ${{ inputs.expected_controller_sha }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          ALOPEX_804_ASSETS: ${{ runner.temp }}/alopex-804-candidate
        run: python3 -B scripts/ops/hosted_test_env_qualification_1951.py --admission-only
      - name: Retrieve exact 1951 diagnostic assets
        if: inputs.sql_diagnostic_mode
        env:
          EXPECTED_CONTROLLER_SHA: ${{ inputs.expected_controller_sha }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          ALOPEX_804_ASSETS: ${{ runner.temp }}/alopex-804-candidate
          GH_TOKEN: ${{ github.token }}
        run: python3 -B scripts/ops/hosted_test_env_qualification_1951.py --acquire-assets
      - name: Qualify 1951 on this runner
        if: inputs.sql_diagnostic_mode
        env:
          EXPECTED_CONTROLLER_SHA: ${{ inputs.expected_controller_sha }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          ALOPEX_804_ASSETS: ${{ runner.temp }}/alopex-804-candidate
        run: python3 -B scripts/ops/hosted_test_env_qualification_1951.py --execute
      - name: Preserve encrypted qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hosted-test-env-qualification
          path: native-qualification-export/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Capture selected CLI wire against offline fake socket
        if: inputs.s04_capture_mode
        id: s04_capture
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          EXPECTED_CONTROLLER_SHA: ${{ inputs.expected_controller_sha }}
        run: |
          python3 -B scripts/ops/s04_same_job_capture.py \
            --private "$RUNNER_TEMP/alopex-804-qualification" --cli /usr/bin/docker
      - name: Seal offline S04 wire evidence
        if: always() && inputs.s04_capture_mode && steps.s04_capture.outcome != 'skipped'
        env:
          CAPTURE_OUTCOME: ${{ steps.s04_capture.outcome }}
        run: |
          python3 -B scripts/ops/s04_capture_seal.py \
            --private "$RUNNER_TEMP/alopex-804-qualification" \
            --export native-s04-wire-export --capture-outcome "$CAPTURE_OUTCOME"
      - name: Upload only encrypted S04 wire and public status
        if: always() && inputs.s04_capture_mode && steps.s04_capture.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: s04-offline-wire-capture
          path: |
            native-s04-wire-export/private-evidence.cms
            native-s04-wire-export/public.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Compare four independent server/client SQL cases
        if: inputs.sql_four_case_mode
        id: matrix
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          EXPECTED_CONTROLLER_SHA: ${{ inputs.expected_controller_sha }}
          GH_TOKEN: ${{ github.token }}
        run: python3 -B scripts/ops/same_job_four_case.py
      - name: Preserve encrypted four-case evidence
        if: always() && inputs.sql_four_case_mode && steps.matrix.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: native-sql-four-case-matrix
          path: native-sql-four-case-export/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Run paired 12-cell SQL stage diagnostic
        if: inputs.sql_diagnostic_mode
        id: diagnostic
        env:
          EXPECTED_CONTROLLER_SHA: ${{ inputs.expected_controller_sha }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: python3 -B scripts/ops/diagnostic_entrypoint.py
      - name: Preserve encrypted diagnostic evidence
        if: always() && !cancelled() && inputs.sql_diagnostic_mode && steps.diagnostic.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: private-sql-stage-diagnostic
          path: ${{ runner.temp }}/alopex-712-diagnostic/export/evidence.cms
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
  wal_cost_682:
    if: inputs.wal_cost_mode && inputs.issue_number == '682' && !inputs.qualification_mode && !inputs.sql_four_case_mode && !inputs.sql_diagnostic_mode && !inputs.s04_inspect_mode && !inputs.s04_socket_inventory_mode && !inputs.s04_capture_mode
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - name: Bound checkout before source acquisition
        env:
          EXPECTED_CONTROLLER_SHA: ${{ inputs.expected_controller_sha }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re, stat, subprocess, sys, tempfile
          phase, error_code = 'SHA', 'IDENTITY'
          try:
              expected = os.environ['EXPECTED_CONTROLLER_SHA']
              assert re.fullmatch(r'[a-f0-9]{40}', expected) and expected == os.environ['GITHUB_SHA']
              phase, error_code = 'ROOTS', 'MEASUREMENT'
              workspace = pathlib.Path(os.environ['GITHUB_WORKSPACE']).parent
              workspace.mkdir(parents=True, exist_ok=True)
              assert workspace.is_absolute() and not workspace.is_symlink()
              runner_temp = pathlib.Path(os.environ['RUNNER_TEMP']).resolve(strict=True)
              assert runner_temp.is_absolute() and runner_temp.is_dir()
              assert not any(character in str(runner_temp) for character in ('\r', '\n', '\0'))
              env_file = pathlib.Path(os.environ['GITHUB_ENV'])
              assert env_file.is_absolute()
              for key in ('TMPDIR', 'TMP', 'TEMP'):
                  os.environ[key] = str(runner_temp)
              lines = ''.join(f'{key}={runner_temp}\n' for key in ('TMPDIR', 'TMP', 'TEMP'))
              fd = os.open(env_file, os.O_WRONLY | os.O_APPEND | os.O_NOFOLLOW)
              try:
                  info = os.fstat(fd)
                  assert stat.S_ISREG(info.st_mode) and info.st_uid == os.getuid()
                  payload = lines.encode('utf-8')
                  assert os.write(fd, payload) == len(payload)
              finally:
                  os.close(fd)
              assert all(pathlib.Path(os.environ[key]).resolve(strict=True) == runner_temp
                         for key in ('TMPDIR', 'TMP', 'TEMP'))
              assert pathlib.Path(tempfile.gettempdir()).resolve(strict=True) == runner_temp
              phase, error_code = 'BINARY', 'POLICY'
              binaries = [pathlib.Path('/usr/bin/du'), pathlib.Path('/usr/bin/sudo'),
                          pathlib.Path('/usr/bin/docker')]
              for path in (pathlib.Path('/'), pathlib.Path('/usr'), pathlib.Path('/usr/bin')):
                  info = path.lstat()
                  assert stat.S_ISDIR(info.st_mode) and info.st_uid == 0 and not info.st_mode & 0o022
              for binary in binaries:
                  info = binary.lstat()
                  assert stat.S_ISREG(info.st_mode) and info.st_uid == 0
                  assert not info.st_mode & 0o022 and info.st_mode & 0o111
              phase, error_code = 'DOCKER', 'PREREQUISITE'
              def run(args):
                  result = subprocess.run(args, stdin=subprocess.DEVNULL,
                                          capture_output=True, text=True, timeout=10)
                  assert result.returncode == 0 and not result.stderr
                  return result.stdout.strip()
              phase = 'DOCKER_CONTEXT'
              context = run(['/usr/bin/docker', 'context', 'show'])
              phase = 'DOCKER_INSPECT'
              inspection = json.loads(run(['/usr/bin/docker', 'context', 'inspect', context]))[0]
              assert inspection['Endpoints']['docker']['Host'].startswith('unix://')
              phase = 'DOCKER_INFO'
              docker = pathlib.Path(json.loads(run(['/usr/bin/docker', 'info', '--format',
                                                    '{{json .}}']))['DockerRootDir'])
              phase, error_code = 'ROOTS', 'MEASUREMENT'
              assert docker.is_absolute() and docker.resolve(strict=True) == docker
              home = pathlib.Path.home()
              temp = pathlib.Path(os.environ['RUNNER_TEMP'])
              candidates = [('WORK', workspace), ('HOME', home), ('TEMP', temp),
                            ('DOCKER', docker)]
              temp_snapshot = []
              for area, label in ((pathlib.Path('/tmp'), 'TMP'),
                                  (pathlib.Path('/var/tmp'), 'VARTMP')):
                  if not area.exists():
                      continue
                  assert area.is_dir()
                  with os.scandir(area) as entries:
                      for entry in entries:
                          info = entry.stat(follow_symlinks=False)
                          if info.st_uid == os.getuid() or 'alopex' in entry.name.lower():
                              actual = pathlib.Path(entry.path).resolve(strict=True)
                              candidates.append((label, actual))
                              temp_snapshot.append((str(area), entry.name, info.st_dev,
                                                    info.st_ino, info.st_uid, str(actual)))
              temp_snapshot.sort()
              categories = {}
              for label, path in candidates:
                  categories.setdefault(path.resolve(strict=True), label)
              roots = list(categories)
              assert docker in roots and all(not docker.is_relative_to(root) and
                                             not root.is_relative_to(docker)
                                             for root in roots if root != docker)
              selected = [root for root in roots if not any(root != other and
                          root.is_relative_to(other) for other in roots)]
              phase, error_code = 'DU', 'MEASUREMENT'
              def du_code(category, failure):
                  assert category in {'WORK', 'HOME', 'TEMP', 'TMP', 'VARTMP', 'DOCKER'}
                  assert failure in {'TIMEOUT', 'EXIT', 'PARSE'}
                  return 'DU_' + category + '_' + failure
              def allocation(root, category, privileged=False):
                  global error_code
                  args = (['/usr/bin/sudo', '-n'] if privileged else []) + [
                      '/usr/bin/du', '-skL' if not privileged else '-sk', '--', str(root)]
                  error_code = du_code(category, 'EXIT')
                  try:
                      result = subprocess.run(args, stdin=subprocess.DEVNULL,
                                              capture_output=True, text=True,
                                              timeout=60 if privileged else 10)
                  except subprocess.TimeoutExpired:
                      error_code = du_code(category, 'TIMEOUT')
                      raise
                  assert result.returncode == 0 and not result.stderr
                  error_code = du_code(category, 'PARSE')
                  fields = result.stdout.strip().split('\t')
                  assert len(fields) == 2 and fields[0].isascii()
                  assert fields[0].isdecimal() and fields[1] == str(root)
                  return int(fields[0]) * 1024
              aggregate = sum(allocation(root, categories[root], root == docker) for root in selected)
              workspace_bytes = allocation(workspace, 'WORK')
              phase, error_code = 'CAPACITY', 'CAPACITY'
              assert aggregate + 1_000_000_000 + 7_500_000_000 < 40_000_000_000
              assert os.statvfs(workspace).f_bavail * os.statvfs(workspace).f_frsize > 1_000_000_000
              assert os.statvfs(docker).f_bavail * os.statvfs(docker).f_frsize > 7_500_000_000
              phase, error_code = 'RECEIPT', 'COMMAND'
              private = pathlib.Path(os.environ['RUNNER_TEMP']) / 'alopex-804-qualification'
              private.mkdir(mode=0o700, exist_ok=True)
              private.chmod(0o700)
              receipt = private / 'checkout-preflight.private.json'
              receipt.write_text(json.dumps({'workspace_root': str(workspace),
                                             'allocated_bytes': workspace_bytes,
                                             'aggregate_allocated_bytes': aggregate,
                                             'roots': list(map(str, selected)),
                                             'temp_snapshot': temp_snapshot,
                                             'docker_root': str(docker),
                                             'expected_controller_sha': expected}) + '\n')
              receipt.chmod(0o600)
              print('{"case":"CHECKOUT_PREFLIGHT","outcome":"passed"}')
          except BaseException:
              public = {'schema': 'alopex.checkout-preflight-public/v1',
                        'case': 'CHECKOUT_PREFLIGHT', 'outcome': 'failed',
                        'phase': phase, 'error_code': error_code}
              try:
                  export = pathlib.Path(os.environ.get('GITHUB_WORKSPACE', '.')) / 'native-qualification-export'
                  export.mkdir(mode=0o700, parents=True, exist_ok=True)
                  (export / 'public.json').write_text(json.dumps(public, sort_keys=True) + '\n')
              except BaseException:
                  print('{"case":"CHECKOUT_PREFLIGHT","outcome":"evidence_failed"}')
                  sys.exit(1)
              print(json.dumps(public, sort_keys=True))
              sys.exit(1)
          PY
      - name: Stage current #804 controller in measured workspace
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          path: qualification-controller
      - name: Stage frozen #682 comparator in measured workspace
        uses: actions/checkout@v4
        with:
          ref: 490f002dfb2c7f509a2444891808d9704fe6b001
          fetch-depth: 1
          path: frozen-wal-controller
      - name: Qualify and measure on the same runner
        env:
          EXPECTED_CONTROLLER_SHA: ${{ inputs.expected_controller_sha }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          RUNNER_KIND: github-hosted
          ALOPEX_804_ASSETS: ${{ runner.temp }}/alopex-804-candidate
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -B qualification-controller/scripts/ops/wal_cost_next/same_job_wrapper.py \
            --qualification-checkout "$GITHUB_WORKSPACE/qualification-controller" \
            --frozen-checkout "$GITHUB_WORKSPACE/frozen-wal-controller" \
            --config "$GITHUB_WORKSPACE/qualification-controller/scripts/ops/wal_cost_next/exact-a415-wal-cost-input.private.json" \
            --config-sha256 24c31ed86f5643edfef6789b345e12d610e71d05c1c3a905d84e17c3771c055b
      - name: Seal wrapper evidence
        if: always()
        run: |
          python3 -B qualification-controller/scripts/ops/wal_cost_next/seal_wrapper.py \
            --qualification "$GITHUB_WORKSPACE/qualification-controller" \
            --frozen "$GITHUB_WORKSPACE/frozen-wal-controller" \
            --private "$RUNNER_TEMP/alopex-804-qualification" \
            --output "$GITHUB_WORKSPACE/wal-cost-wrapper-export"
      - name: Preserve encrypted and allowlisted evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v0817-682-wal-cost-same-job
          path: |
            native-qualification-export/public.json
            qualification-controller/native-qualification-export/public.json
            qualification-controller/native-qualification-export/private-evidence.cms
            frozen-wal-controller/wal-cost-export/result.json
            frozen-wal-controller/wal-cost-export/private-evidence.cms
            wal-cost-wrapper-export/public.json
            wal-cost-wrapper-export/private-evidence.cms
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
  s04_inspect:
    if: ${{ inputs.s04_inspect_mode && inputs.issue_number == '684' && !inputs.qualification_mode && !inputs.sql_four_case_mode && !inputs.wal_cost_mode && !inputs.sql_diagnostic_mode && !inputs.s04_socket_inventory_mode && !inputs.s04_capture_mode }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Gate exact source before checkout
        env:
          EXPECTED_CONTROLLER_SHA: ${{ inputs.expected_controller_sha }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        run: |
          python3 - <<'PY'
          import os, re, sys
          expected = os.environ.get('EXPECTED_CONTROLLER_SHA', '')
          passed = (os.environ.get('GITHUB_EVENT_NAME') == 'workflow_dispatch' and
                    os.environ.get('ISSUE_NUMBER') == '684' and
                    re.fullmatch(r'[a-f0-9]{40}', expected) is not None and
                    expected == os.environ.get('GITHUB_SHA'))
          print('{"case":"S04_INSPECT_SHA","outcome":"passed"}' if passed else
                '{"case":"S04_INSPECT_SHA","outcome":"failed"}')
          sys.exit(0 if passed else 1)
          PY
      - name: Measure selected-host storage before checkout
        run: |
          python3 - <<'PY'
          import json, os, pathlib, subprocess, sys
          code = 'MEASUREMENT'
          try:
              workspace_input = pathlib.Path(os.environ['GITHUB_WORKSPACE']).parent
              home_input = pathlib.Path.home()
              temporary_input = pathlib.Path(os.environ['RUNNER_TEMP'])
              assert all(path.is_absolute() and not path.is_symlink() for path in
                         (workspace_input, home_input, temporary_input))
              workspace = workspace_input.resolve(strict=True)
              home = home_input.resolve(strict=True)
              temporary = temporary_input.resolve(strict=True)
              assert workspace.is_dir() and home.is_dir() and temporary.is_dir()

              def command(argv, timeout=10):
                  result = subprocess.run(argv, stdin=subprocess.DEVNULL,
                                          capture_output=True, timeout=timeout, check=False)
                  assert result.returncode == 0 and not result.stderr
                  return result.stdout.decode('utf-8').strip()

              context = command(['/usr/bin/docker', 'context', 'show'])
              selected = json.loads(command(['/usr/bin/docker', 'context', 'inspect', context]))[0]
              assert selected['Endpoints']['docker']['Host'].startswith('unix://')
              docker = pathlib.Path(json.loads(command(['/usr/bin/docker', 'info', '--format',
                                                        '{{json .}}']))['DockerRootDir'])
              assert docker.is_absolute() and docker.resolve(strict=True) == docker
              roots = [workspace, home, temporary, docker]
              for area in (pathlib.Path('/tmp'), pathlib.Path('/var/tmp')):
                  if not area.exists():
                      continue
                  assert area.is_dir()
                  with os.scandir(area) as entries:
                      seen = 0
                      for entry in entries:
                          seen += 1
                          assert seen <= 1024
                          info = entry.stat(follow_symlinks=False)
                          if info.st_uid == os.getuid() or 'alopex' in entry.name.lower():
                              roots.append(pathlib.Path(entry.path).resolve(strict=True))
              roots = list(set(roots))
              assert len(roots) <= 64
              assert all(docker == root or
                         (not docker.is_relative_to(root) and not root.is_relative_to(docker))
                         for root in roots)
              roots = [root for root in roots if not any(root != other and
                       root.is_relative_to(other) for other in roots)]

              def allocation(root):
                  argv = (['/usr/bin/sudo', '-n'] if root == docker else []) + [
                      '/usr/bin/du', '-sk' if root == docker else '-skL', '--', str(root)]
                  value = command(argv, timeout=60 if root == docker else 10).split('\t')
                  assert len(value) == 2 and value[0].isascii() and value[0].isdecimal()
                  assert value[1] == str(root)
                  return int(value[0]) * 1024

              aggregate = sum(allocation(root) for root in roots)
              code = 'CAPACITY'
              # One GiB covers checkout, the <=1 MiB receipt, and <=2 MiB CMS export.
              assert aggregate + 1_000_000_000 < 40_000_000_000
              assert aggregate + 1_000_000_000 < 50_000_000_000
              for root in (workspace, temporary, docker):
                  vfs = os.statvfs(root)
                  assert vfs.f_bavail * vfs.f_frsize > 1_000_000_000
              print('{"case":"S04_INSPECT_STORAGE","outcome":"passed"}')
          except BaseException:
              print(json.dumps({'case': 'S04_INSPECT_STORAGE', 'outcome': 'failed',
                                'error_code': code}, sort_keys=True))
              sys.exit(1)
          PY
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_controller_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Inspect selected Docker context read-only
        id: inspect
        run: |
          set -euo pipefail
          private="$RUNNER_TEMP/alopex-s04-inspect"
          mkdir -m 700 "$private"
          context=$(/usr/bin/docker context show)
          python3 -B scripts/ops/s04_wire_preflight.py \
            --output "$private/inspector.private.json" --cli /usr/bin/docker \
            inspect --context "$context"
      - name: Seal bounded private inspector evidence
        if: always() && steps.inspect.outcome != 'skipped'
        env:
          INSPECT_OUTCOME: ${{ steps.inspect.outcome }}
        run: |
          python3 -B scripts/ops/s04_inspect_seal.py \
            --private "$RUNNER_TEMP/alopex-s04-inspect" \
            --export native-s04-inspect-export \
            --inspect-outcome "$INSPECT_OUTCOME"
      - name: Upload only encrypted inspector and public status
        if: always() && steps.inspect.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: s04-readonly-inspect
          path: |
            native-s04-inspect-export/private-evidence.cms
            native-s04-inspect-export/public.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
