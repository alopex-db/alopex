name: Alopex Python Performance Advisory

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: Owning issue for read-only host inventory
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: alopex-v0817-host-preflight
  cancel-in-progress: false

jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Collect encrypted read-only host inventory
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: python3 -B scripts/ops/hosted_test_env_inventory.py
      - name: Preserve encrypted inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: host-preflight-inventory
          path: native-inventory-export/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
