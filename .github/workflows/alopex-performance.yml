  wal_cost_682:
    if: ${{ !inputs.hnsw_release_admission_mode && !inputs.hnsw_release_measure_mode && inputs.wal_cost_mode && inputs.issue_number == '682' && !inputs.qualification_mode && !inputs.sql_four_case_mode && !inputs.sql_final_mode && !inputs.sql_diagnostic_mode && !inputs.s04_inspect_mode && !inputs.s04_socket_inventory_mode && !inputs.s04_capture_mode && !inputs.public_native_build_mode }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Gate selected source and storage before checkout
        timeout-minutes: 2
        env:
          EXPECTED_CONTROLLER_SHA: ${{ inputs.expected_controller_sha }}
          EXPECTED_WAL_COST_SOURCE_TREE: ${{ inputs.expected_wal_cost_source_tree }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re, stat, sys
          code = 'SOURCE'
          try:
              e = os.environ
              assert (e.get('GITHUB_EVENT_NAME') == 'workflow_dispatch' and
                      e.get('GITHUB_REPOSITORY') == 'alopex-db/alopex' and
                      e.get('ISSUE_NUMBER') == '682' and
                      e.get('RUNNER_ENVIRONMENT') == 'github-hosted' and
                      re.fullmatch(r'[0-9a-f]{40}', e.get('EXPECTED_CONTROLLER_SHA', '')) and
                      e['EXPECTED_CONTROLLER_SHA'] == e.get('GITHUB_SHA') and
                      re.fullmatch(r'[0-9a-f]{40}', e.get('EXPECTED_WAL_COST_SOURCE_TREE', '')))
              code = 'STORAGE'
              workspace = pathlib.Path(e['GITHUB_WORKSPACE'])
              assert (workspace.is_absolute() and workspace.is_dir() and
                      not workspace.is_symlink() and workspace.resolve(strict=True) == workspace and
                      workspace.stat().st_uid == os.geteuid() and not any(workspace.iterdir()))
              runner_temp = pathlib.Path(e['RUNNER_TEMP']).resolve(strict=True)
              assert (runner_temp.is_absolute() and runner_temp.is_dir() and
                      runner_temp.stat().st_uid == os.geteuid() and
                      not any(ch in str(runner_temp) for ch in ('\r', '\n', '\0')))
              home = pathlib.Path.home().resolve(strict=True)
              roots = [workspace.parent.resolve(strict=True), runner_temp]
              for candidate in (home / '.cargo', home / '.cache', home / '.rustup'):
                  if candidate.exists() and not candidate.is_symlink():
                      roots.append(candidate.resolve(strict=True))
              seen = set()
              total = 0
              for root in roots:
                  pending = [root]
                  while pending:
                      current = pending.pop()
                      try:
                          info = current.lstat()
                      except FileNotFoundError:
                          continue
                      ident = (info.st_dev, info.st_ino)
                      if ident in seen:
                          continue
                      seen.add(ident)
                      total += info.st_blocks * 512
                      if stat.S_ISDIR(info.st_mode):
                          try:
                              pending.extend(current.iterdir())
                          except FileNotFoundError:
                              continue
              assert total < 40_000_000_000
              free_bytes = os.statvfs(runner_temp).f_bavail * os.statvfs(runner_temp).f_frsize
              assert free_bytes > 10_000_000_000
              code = 'ENV_WRITE'
              env_file = pathlib.Path(e['GITHUB_ENV'])
              assert env_file.is_absolute()
              lines = ''.join(f'{k}={runner_temp}\n' for k in ('TMPDIR', 'TMP', 'TEMP')).encode('utf-8')
              fd = os.open(env_file, os.O_WRONLY | os.O_APPEND | os.O_NOFOLLOW)
              try:
                  info = os.fstat(fd)
                  assert stat.S_ISREG(info.st_mode) and info.st_uid == os.getuid()
                  assert os.write(fd, lines) == len(lines)
              finally:
                  os.close(fd)
              print(json.dumps({'case': 'WAL_COST_682_PRECHECK', 'outcome': 'passed'}, sort_keys=True))
          except BaseException:
              print(json.dumps({'case': 'WAL_COST_682_PRECHECK', 'outcome': 'failed', 'error_code': code}, sort_keys=True))
