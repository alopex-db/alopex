name: Native empty indexed query page composition
on:
  workflow_dispatch:
    inputs:
      runner_label:
        description: Managed VM label from the execution profile
        required: true
        type: string
      performance_config:
        description: Source-bound artifact identities and operation bounds
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: alopex-v0817-native-performance
  cancel-in-progress: false
jobs:
  construct:
    runs-on: ${{ inputs.runner_label }}
    timeout-minutes: 90
    steps:
      - name: Prepare source within the measured VM work budget
        env:
          RUNNER_KIND: ${{ runner.environment }}
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import json, os, pathlib, signal, stat, subprocess, time
          os.umask(0o077)
          try:
              assert os.environ.get('RUNNER_KIND') == 'github-hosted'
              assert os.environ.get('GITHUB_REPOSITORY') == 'alopex-db/alopex'
              root = pathlib.Path(os.environ['GITHUB_WORKSPACE'])
              temporary = pathlib.Path(os.environ['RUNNER_TEMP'])
              roots = [root.parent, temporary]
              for candidate in (root.parent.parent / '_actions', pathlib.Path.home() / '.cargo', pathlib.Path.home() / '.cache'):
                  if candidate.exists(): roots.append(candidate)
              def measure():
                  seen, total = set(), 0
                  pending = list(roots)
                  while pending:
                      path = pending.pop()
                      info = path.lstat()
                      identity = info.st_dev, info.st_ino
                      if identity in seen: continue
                      seen.add(identity)
                      total += info.st_blocks * 512
                      if stat.S_ISDIR(info.st_mode): pending.extend(path.iterdir())
                      elif stat.S_ISLNK(info.st_mode):
                          target = path.resolve()
                          if target.exists(): pending.append(target)
                  return total
              initial = measure()
              allowance = 1_000_000_000
              assert initial + allowance < 40_000_000_000
              assert root.is_dir() and not (root / '.git').exists()
              for args in (['git','init','--quiet'],
                           ['git','fetch','--quiet','--depth=1','https://github.com/alopex-db/alopex.git',os.environ['GITHUB_SHA']],
                           ['git','checkout','--quiet','--detach','FETCH_HEAD']):
                  with (temporary / 'alopex-source.log').open('ab') as output:
                      process = subprocess.Popen(args,cwd=root,stdout=output,stderr=output,start_new_session=True)
                      deadline = time.monotonic() + 120
                      try:
                          while process.poll() is None:
                              assert time.monotonic() < deadline and measure() <= initial + allowance
                              try: process.wait(timeout=2)
                              except subprocess.TimeoutExpired: pass
                          assert process.returncode == 0 and measure() <= initial + allowance
                      finally:
                          if process.poll() is None:
                              os.killpg(process.pid,signal.SIGTERM)
                              try: process.wait(timeout=5)
                              except subprocess.TimeoutExpired:
                                  os.killpg(process.pid,signal.SIGKILL)
                                  process.wait(timeout=5)
              actual = subprocess.run(['git','rev-parse','HEAD'],cwd=root,capture_output=True,text=True,check=True).stdout.strip()
              assert actual == os.environ['GITHUB_SHA']
              (temporary / 'alopex-source.log').unlink()
              print('{"source_preparation":"passed"}')
          except BaseException:
              print('{"source_preparation":"failed"}')
              raise SystemExit(1)
          PYCODE
      - name: Verify composed receipt and begin contracts
        shell: bash
        run: |
          PYTHONPATH=scripts/ops:scripts/test-env python3 -B -m unittest test_native_empty_query_pages test_empty_query_pages_receipts test_hosted_native_empty_query_pages test_audit_native_empty_query_pages test_query_page_observer test_composed_sql_products -v
          python3 -B -m unittest discover -s scripts/test-env/tests -p test_capacity_snapshot.py
      - name: Retrieve source-built products and verified environment image
        env:
          RUNNER_KIND: ${{ runner.environment }}
          GH_TOKEN: ${{ github.token }}
          PUBLIC_PERFORMANCE_CONFIG: ${{ inputs.performance_config }}
        shell: bash
        run: python3 -B scripts/ops/hosted_native_empty_query_pages.py fetch
      - name: Measure fixed begin fixtures and collect owned resources
        env:
          RUNNER_KIND: ${{ runner.environment }}
          NATIVE_IMAGE_INPUTS: ${{ secrets.ALOPEX_NATIVE_IMAGE_INPUTS }}
          PUBLIC_PERFORMANCE_CONFIG: ${{ inputs.performance_config }}
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import json, os, pathlib, subprocess
          try:
              assert os.environ.get('RUNNER_KIND') == 'github-hosted'
              env = dict(os.environ, OPERATOR_HOME=os.environ['HOME'], OPERATOR_UID=str(os.getuid()), OPERATOR_GID=str(os.getgid()))
              names = 'RUNNER_KIND,GITHUB_ACTIONS,GITHUB_WORKSPACE,GITHUB_SHA,RUNNER_TEMP,NATIVE_IMAGE_INPUTS,PUBLIC_PERFORMANCE_CONFIG,OPERATOR_HOME,OPERATOR_UID,OPERATOR_GID'
              command = ['sudo','-n','--preserve-env='+names,'python3','scripts/ops/hosted_native_empty_query_pages.py','run']
              result = subprocess.run(command,env=env,capture_output=True,text=True,timeout=4800)
              for line in result.stdout.splitlines():
                  value = json.loads(line)
                  assert set(value) <= {'status','error_code'}
                  assert value.get('status') in ('passed','failed')
                  assert value.get('error_code') in (None,'VM_SCOPE','PERFORMANCE')
                  print(json.dumps(value,sort_keys=True))
              raise SystemExit(result.returncode)
          except SystemExit: raise
          except BaseException:
              print('{"status":"failed","error_code":"PERFORMANCE"}')
              raise SystemExit(1)
          PYCODE
      - name: Preserve comparison and encrypted evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-begin-fixed-performance
          path: native-export/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
