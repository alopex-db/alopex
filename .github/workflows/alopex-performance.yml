          PY
      - name: Stage current #804 controller in measured workspace
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          path: qualification-controller
      - name: Stage frozen #682 comparator in measured workspace
        uses: actions/checkout@v4
        with:
          ref: 490f002dfb2c7f509a2444891808d9704fe6b001
          fetch-depth: 1
          path: frozen-wal-controller
      - name: Qualify and measure on the same runner
        env:
          EXPECTED_CONTROLLER_SHA: ${{ inputs.expected_controller_sha }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          RUNNER_KIND: github-hosted
          ALOPEX_804_ASSETS: ${{ runner.temp }}/alopex-804-candidate
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -B qualification-controller/scripts/ops/wal_cost_next/same_job_wrapper.py \
            --qualification-checkout "$GITHUB_WORKSPACE/qualification-controller" \
            --frozen-checkout "$GITHUB_WORKSPACE/frozen-wal-controller" \
            --config "$GITHUB_WORKSPACE/qualification-controller/scripts/ops/wal_cost_next/exact-a415-wal-cost-input.private.json" \
            --config-sha256 24c31ed86f5643edfef6789b345e12d610e71d05c1c3a905d84e17c3771c055b
      - name: Seal wrapper evidence
        if: always()
        run: |
          python3 -B qualification-controller/scripts/ops/wal_cost_next/seal_wrapper.py \
            --qualification "$GITHUB_WORKSPACE/qualification-controller" \
            --frozen "$GITHUB_WORKSPACE/frozen-wal-controller" \
            --private "$RUNNER_TEMP/alopex-804-qualification" \
            --output "$GITHUB_WORKSPACE/wal-cost-wrapper-export"
      - name: Preserve encrypted and allowlisted evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v0817-682-wal-cost-same-job
          path: |
            native-qualification-export/public.json
            qualification-controller/native-qualification-export/public.json
            qualification-controller/native-qualification-export/private-evidence.cms
            frozen-wal-controller/wal-cost-export/result.json
            frozen-wal-controller/wal-cost-export/private-evidence.cms
            wal-cost-wrapper-export/public.json
            wal-cost-wrapper-export/private-evidence.cms
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
