name: Post-release HNSW diagnostics

on:
  workflow_call:
    inputs:
      version:
        description: "Release tag or version to benchmark"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag or version to benchmark"
        required: true
        default: "v0.8.11"
        type: string
  release:
    types: [published]

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    # Advisory evidence only: this job never gates publication or rollback.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install the exact PyPI wheel
        id: release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#alopex-py-v}"
          version="${version#v}"
          [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          python -m pip install --disable-pip-version-check --only-binary=:all: \
            "alopex==${version}" numpy
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "RELEASE_VERSION=${version}" >> "${GITHUB_ENV}"
      - name: Record benchmark environment
        run: |
          {
            uname -a
            python --version
            python -m pip show alopex numpy
          } > artifacts-environment.txt
      - name: Generate reproducible diagnostic artifacts
        run: >-
          python scripts/performance/hnsw_v0811_contract.py
          --output artifacts/hnsw-diagnostic
          --release-version "${RELEASE_VERSION}"
      - name: Upload diagnostic artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hnsw-diagnostic-${{ github.sha }}
          path: |
            artifacts/hnsw-diagnostic
            artifacts-environment.txt
          if-no-files-found: error
          retention-days: 30
