name: Manual candidate Windows overflow acceptance

on:
  workflow_dispatch:
    inputs:
      acceptance_suite:
        description: Manual compatibility suite
        type: choice
        default: full
        options: [full, windows-overflow]

# Supersede PRs and unprotected development branch pushes. Preserve other
# push runs (protected/integration/release branches and tags), scheduled
# runs and manual runs individually as verification evidence.
concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.event_name }}-${{
      (github.event_name == 'pull_request' ||
       (github.event_name == 'push' && github.ref_type == 'branch' &&
        !github.ref_protected &&
        !startsWith(github.ref, 'refs/heads/integration/') &&
        !startsWith(github.ref, 'refs/heads/release/'))) &&
      github.ref || github.run_id }}
  cancel-in-progress: true

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always
  NIM_SQL_PARSER_DIR: crates/alopex-sql/nim-sql-parser

jobs:
  windows-overflow-public:
    name: Manual Windows public overflow acceptance
    if: github.event_name == 'workflow_dispatch' && inputs.acceptance_suite == 'windows-overflow'
    runs-on: windows-latest
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      ALOPEX_ACCEPTANCE_SUITE: windows-overflow
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_BUILD_JOBS: 2
      PYTHONUTF8: 1
      PYTHONDONTWRITEBYTECODE: 1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check manual runner selection and cleanup guards
        run: python -m unittest discover -s scripts/compatibility -p test_windows_overflow_acceptance.py -v
      - name: Record source, scope and measured host budget
        run: python scripts/ops/windows_overflow_private.py prepare
      - uses: dtolnay/rust-toolchain@1.96.0
      - name: Setup exact Nim parser toolchain
        uses: ./.github/actions/setup-nim-parser-toolchain
      - name: Build parser under storage watchdog
        run: python scripts/ops/windows_overflow_private.py parser
      - name: Normal extension and 15 ordinary public API cases
        timeout-minutes: 45
        run: python scripts/ops/windows_overflow_private.py normal
      - name: Instrumented Rust and Python boundary cases (24 each)
        timeout-minutes: 45
        run: python scripts/ops/windows_overflow_private.py instrumented
      - name: Published old reader, container and live WAL compatibility
        timeout-minutes: 25
        run: python scripts/ops/windows_overflow_private.py legacy
      - name: Reconcile all source-bound acceptance receipts
        run: python scripts/ops/windows_overflow_private.py verify
      - name: Remove owned binaries and fixtures, record final storage
        if: always()
        run: python scripts/ops/windows_overflow_private.py cleanup
      - name: Encrypt compact acceptance evidence
        if: always()
        run: python scripts/ops/windows_overflow_private.py collect
      - name: Upload encrypted Windows acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-overflow-private
          path: windows-overflow-private-export/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
