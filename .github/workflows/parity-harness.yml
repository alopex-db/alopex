name: Parity Harness Contract

on:
  push:
    paths:
      - 'scripts/parity/**'
      - 'docs/parity/**'
      - 'scripts/validate_v0811_ledgers.py'
      - 'scripts/test_validate_v0811_ledgers.py'
      - 'scripts/reference_tests/hnsw_public_inventory.py'
      - 'scripts/reference_tests/sql_public_inventory.py'
      - 'crates/**'
      - '.github/workflows/parity-harness.yml'
  pull_request:
    paths:
      - 'scripts/parity/**'
      - 'docs/parity/**'
      - 'scripts/validate_v0811_ledgers.py'
      - 'scripts/test_validate_v0811_ledgers.py'
      - 'scripts/reference_tests/hnsw_public_inventory.py'
      - 'scripts/reference_tests/sql_public_inventory.py'
      - 'crates/**'
      - '.github/workflows/parity-harness.yml'

jobs:
  contract:
    name: Parity harness contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify report, surface, and fixture contracts
        run: |
          python -m unittest \
            scripts.parity.runner.test_report \
            scripts.parity.runner.test_surfaces \
            scripts.parity.test_compat_fixture_contract
      - name: Verify ledger validation behavior
        run: python -m unittest scripts.test_validate_v0811_ledgers
      - name: Verify v0.8.11 compatibility ledgers
        run: python scripts/validate_v0811_ledgers.py
