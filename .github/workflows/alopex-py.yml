name: alopex-py

on:
  push:
    branches: [main, develop]
    paths:
      - ".github/workflows/alopex-py.yml"
      - ".github/actions/setup-nim-parser-toolchain/**"
      - "scripts/build-nim-parser.sh"
      - "crates/alopex-py/**"
      - "crates/alopex-embedded/**"
      - "crates/alopex-core/**"
      - "crates/alopex-sql/**"
  pull_request:
    paths:
      - ".github/workflows/alopex-py.yml"
      - ".github/actions/setup-nim-parser-toolchain/**"
      - "scripts/build-nim-parser.sh"
      - "crates/alopex-py/**"
      - "crates/alopex-embedded/**"
      - "crates/alopex-core/**"
      - "crates/alopex-sql/**"

defaults:
  run:
    shell: bash

env:
  NIM_SQL_PARSER_DIR: crates/alopex-sql/nim-sql-parser
  ALOPEX_NIM_PARSER_ALLOW_LOCAL_BUILD: "1"
  NIM_SQL_PARSER_LIB_DIR: ${{ github.workspace }}/crates/alopex-sql/nim-sql-parser

jobs:
  rust-check:
    name: rust-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Build Nim SQL parser library
        if: runner.os == 'Linux'
        run: bash scripts/build-nim-parser.sh --backend docker
      - name: Cargo fmt
        run: cargo fmt --all -- --check
      - name: Cargo clippy
        run: cargo clippy -p alopex-py --all-targets --all-features

  test:
    name: test ${{ matrix.numpy_runtime }} py${{ matrix.python }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11"]
        numpy_runtime: ["with-numpy", "without-numpy"]
    steps:
      - name: Skip non-ubuntu on ACT
        if: ${{ env.ACT && matrix.os != 'ubuntu-latest' }}
        run: echo "Skipping ${matrix.os} on ACT."
      - name: Checkout
        if: ${{ !env.ACT || (matrix.os == 'ubuntu-latest' && matrix.python == '3.11') }}
        uses: actions/checkout@v4
      - name: Setup Python
        if: ${{ !env.ACT }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Setup Rust
        if: ${{ !env.ACT || (matrix.os == 'ubuntu-latest' && matrix.python == '3.11') }}
        uses: dtolnay/rust-toolchain@stable
      - name: Setup virtualenv
        if: ${{ !env.ACT || (matrix.os == 'ubuntu-latest' && matrix.python == '3.11') }}
        run: |
          python_cmd="python"
          if [[ -n "${ACT:-}" ]]; then
            python_cmd="python3"
          fi
          rm -rf .venv
          "$python_cmd" -m venv .venv
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            venv_bin=".venv/Scripts"
          else
            venv_bin=".venv/bin"
          fi
          echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"
          echo "$PWD/$venv_bin" >> "$GITHUB_PATH"
      - name: Install base dependencies
        if: ${{ !env.ACT || (matrix.os == 'ubuntu-latest' && matrix.python == '3.11') }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install maturin pytest
      - name: Install numpy
        if: ${{ (!env.ACT || (matrix.os == 'ubuntu-latest' && matrix.python == '3.11')) && matrix.numpy_runtime == 'with-numpy' }}
        run: |
          if [[ -n "${ACT:-}" ]]; then
            python -m pip install numpy
            exit 0
          fi
          python -m pip install numpy
      - name: Install patchelf (Linux)
        if: ${{ !env.ACT || (matrix.os == 'ubuntu-latest' && matrix.python == '3.11') }}
        run: |
          if [[ "${{ matrix.os }}" != "ubuntu-latest" ]]; then
            exit 0
          fi
          if command -v patchelf &> /dev/null; then
            exit 0
          fi
          if [[ -n "${ACT:-}" ]]; then
            if command -v sudo &> /dev/null; then
              echo 'Acquire::ForceIPv4 "true";' | sudo tee /etc/apt/apt.conf.d/99force-ipv4 > /dev/null
            else
              echo 'Acquire::ForceIPv4 "true";' > /etc/apt/apt.conf.d/99force-ipv4
            fi
          fi
          if command -v sudo &> /dev/null; then
            sudo apt-get update
            sudo apt-get install -y patchelf
            exit 0
          fi
          apt-get update
          apt-get install -y patchelf
      - name: Build Nim SQL parser library
        if: runner.os == 'Linux'
        run: bash scripts/build-nim-parser.sh --backend docker
      # macOS/Windows はホストビルドを行うため、Linux/Windows の正規
      # リリースゲートと同じ exact toolchain と隔離 package store を使う。
      - name: Setup exact Nim parser toolchain (macOS/Windows)
        if: runner.os != 'Linux'
        uses: ./.github/actions/setup-nim-parser-toolchain
      - name: Build Nim SQL parser library (macOS/Windows)
        if: runner.os != 'Linux'
        shell: bash
        run: bash scripts/build-nim-parser.sh --backend host
      - name: Stage parser library in package-local native directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p crates/alopex-py/python/alopex/native
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            library="${NIM_SQL_PARSER_DIR}/alopex_sql_parser.dll"
          elif [[ "$RUNNER_OS" == "macOS" ]]; then
            library="${NIM_SQL_PARSER_DIR}/libalopex_sql_parser.dylib"
          else
            library="${NIM_SQL_PARSER_DIR}/libalopex_sql_parser.so"
          fi
          test -f "$library"
          cp "$library" crates/alopex-py/python/alopex/native/
          printf '0.9.0\n' > crates/alopex-py/python/alopex/native/CONTRACT_VERSION
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$library" | sed "s#${NIM_SQL_PARSER_DIR}/##" > crates/alopex-py/python/alopex/native/SHA256SUMS
          else
            shasum -a 256 "$library" | sed "s#${NIM_SQL_PARSER_DIR}/##" > crates/alopex-py/python/alopex/native/SHA256SUMS
          fi
      # 診断専用ステップ (fail させない): DLL の推移的依存と単体ロード可否を
      # CI ログへ出力する。静的リンク (nim_sql_parser.nimble) が不十分な場合、
      # 次の CI 実行でどの依存 DLL が残っているかをここで特定できる。
      - name: Diagnose Nim parser DLL dependencies (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          dll_unix="${GITHUB_WORKSPACE}/${NIM_SQL_PARSER_DIR}/alopex_sql_parser.dll"
          echo "=== DLL file ==="
          ls -la "$dll_unix" || true
          echo "=== Import table (objdump -p | DLL Name) ==="
          if command -v objdump >/dev/null 2>&1; then
            objdump -p "$dll_unix" | grep "DLL Name" || true
          else
            echo "objdump not available on this runner"
          fi
          echo "=== ctypes.WinDLL load test ==="
          python - <<'PY' || true
          import ctypes
          import os
          import traceback

          dll = os.path.join(
              os.environ["GITHUB_WORKSPACE"],
              *os.environ["NIM_SQL_PARSER_DIR"].split("/"),
              "alopex_sql_parser.dll",
          )
          print("loading:", dll)
          try:
              ctypes.WinDLL(dll)
              print("WinDLL load: OK")
          except Exception:
              traceback.print_exc()
          PY
          exit 0
      - name: Maturin develop
        if: ${{ !env.ACT || (matrix.os == 'ubuntu-latest' && matrix.python == '3.11') }}
        run: maturin develop -m crates/alopex-py/Cargo.toml
      - name: Run pytest
        if: ${{ !env.ACT || (matrix.os == 'ubuntu-latest' && matrix.python == '3.11') }}
        run: |
          if [[ -n "${ACT:-}" ]]; then
            python -m pytest crates/alopex-py/tests -k "not benchmark"
            exit 0
          fi
          pytest crates/alopex-py/tests
      - name: Verify vector APIs remain exported without NumPy installed
        if: ${{ (!env.ACT || (matrix.os == 'ubuntu-latest' && matrix.python == '3.11')) && matrix.numpy_runtime == 'without-numpy' }}
        run: |
          python - <<'PY'
          from alopex import Database, Transaction

          txn_missing = [
              "upsert_vector",
              "search_similar",
              "upsert_to_hnsw",
              "delete_from_hnsw",
          ]
          db_missing = [
              "create_hnsw_index",
              "search_hnsw",
              "drop_hnsw_index",
              "get_hnsw_stats",
          ]

          for name in txn_missing:
              assert hasattr(Transaction, name), f"{name} should remain exported"
          for name in db_missing:
              assert hasattr(Database, name), f"{name} should remain exported"
          PY

  polars-test:
    name: polars-test py${{ matrix.python }} polars-${{ matrix.polars }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11"]
        polars: ["0.20.*", "latest"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Setup virtualenv
        run: |
          rm -rf .venv
          python -m venv .venv
          echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install maturin pytest
          # The performance module's numeric values remain advisory, but its
          # scan/read/write correctness assertions stay in this required lane.
          python -m pip install pytest-benchmark
          if [[ "${{ matrix.polars }}" == "latest" ]]; then
            python -m pip install polars
          else
            python -m pip install "polars==${{ matrix.polars }}"
          fi
      - name: Install patchelf (Linux)
        run: |
          if command -v patchelf &> /dev/null; then
            exit 0
          fi
          if [[ -n "${ACT:-}" ]]; then
            if command -v sudo &> /dev/null; then
              echo 'Acquire::ForceIPv4 "true";' | sudo tee /etc/apt/apt.conf.d/99force-ipv4 > /dev/null
            else
              echo 'Acquire::ForceIPv4 "true";' > /etc/apt/apt.conf.d/99force-ipv4
            fi
          fi
          if command -v sudo &> /dev/null; then
            sudo apt-get update
            sudo apt-get install -y patchelf
            exit 0
          fi
          apt-get update
          apt-get install -y patchelf
      - name: Build Nim SQL parser library
        if: runner.os == 'Linux'
        run: bash scripts/build-nim-parser.sh --backend docker
      - name: Maturin develop
        run: |
          maturin develop -m crates/alopex-py/Cargo.toml
      - name: Run polars tests
        run: |
          pytest crates/alopex-py/tests -m "requires_polars"

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        if: ${{ !env.ACT }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install mypy
        run: |
          if [[ -n "${ACT:-}" ]]; then
            venv_dir=".venv-act"
            rm -rf "$venv_dir"
            python -m venv "$venv_dir"
            echo "VIRTUAL_ENV=$PWD/$venv_dir" >> "$GITHUB_ENV"
            echo "$PWD/$venv_dir/bin" >> "$GITHUB_PATH"
            source "$venv_dir/bin/activate"
            python -m pip install --upgrade pip
            python -m pip install mypy
            exit 0
          fi
          python -m pip install --upgrade pip
          python -m pip install mypy
      - name: Run mypy
        run: |
          if [[ -n "${ACT:-}" ]]; then
            python -m mypy crates/alopex-py/python/alopex
            exit 0
          fi
          mypy crates/alopex-py/python/alopex

  benchmarks:
    name: benchmarks (advisory; small/medium)
    runs-on: ubuntu-latest
    # Performance measurements are advisory. Functional behavior remains
    # covered by the regular test jobs; benchmark noise must not gate CI.
    continue-on-error: true
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        if: ${{ !env.ACT }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Setup virtualenv
        run: |
          python_cmd="python"
          if [[ -n "${ACT:-}" ]]; then
            python_cmd="python3"
          fi
          rm -rf .venv
          "$python_cmd" -m venv .venv
          echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install maturin pytest pytest-benchmark numpy polars
      - name: Install patchelf (Linux)
        run: |
          if command -v patchelf &> /dev/null; then
            exit 0
          fi
          if [[ -n "${ACT:-}" ]]; then
            if command -v sudo &> /dev/null; then
              echo 'Acquire::ForceIPv4 "true";' | sudo tee /etc/apt/apt.conf.d/99force-ipv4 > /dev/null
            else
              echo 'Acquire::ForceIPv4 "true";' > /etc/apt/apt.conf.d/99force-ipv4
            fi
          fi
          if command -v sudo &> /dev/null; then
            sudo apt-get update
            sudo apt-get install -y patchelf
            exit 0
          fi
          apt-get update
          apt-get install -y patchelf
      - name: Build Nim SQL parser library
        if: runner.os == 'Linux'
        run: bash scripts/build-nim-parser.sh --backend docker
      - name: Maturin develop
        run: |
          maturin develop -m crates/alopex-py/Cargo.toml
      - name: Run benchmarks
        run: |
          pytest crates/alopex-py/tests/benchmarks/ -v --benchmark-only --benchmark-json=benchmark.json -m "not large"
      - name: Upload benchmark artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alopex-py-benchmark-${{ github.run_id }}-${{ github.run_attempt }}
          path: benchmark.json
          if-no-files-found: ignore

  ci-success:
    name: ci-success
    if: ${{ always() }}
    needs: [rust-check, test, polars-test, typecheck]
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        run: |
          if [[ "${{ needs.rust-check.result }}" != "success" ]]; then
            exit 1
          fi
          if [[ "${{ needs.test.result }}" != "success" ]]; then
            exit 1
          fi
          if [[ "${{ needs.polars-test.result }}" != "success" ]]; then
            exit 1
          fi
          if [[ "${{ needs.typecheck.result }}" != "success" ]]; then
            exit 1
          fi
