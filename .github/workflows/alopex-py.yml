name: alopex-py

on:
  push:
    branches: [main, develop]
    paths:
      - ".github/workflows/alopex-py.yml"
      - "crates/alopex-py/**"
      - "crates/alopex-embedded/**"
      - "crates/alopex-core/**"
  pull_request:
    paths:
      - ".github/workflows/alopex-py.yml"
      - "crates/alopex-py/**"
      - "crates/alopex-embedded/**"
      - "crates/alopex-core/**"

defaults:
  run:
    shell: bash

env:
  NIM_SQL_PARSER_DIR: crates/alopex-sql/nim-sql-parser

jobs:
  rust-check:
    name: rust-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Checkout Chirps dependency
        run: bash .github/scripts/checkout-chirps.sh
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Build Nim SQL parser library
        if: runner.os == 'Linux'
        run: |
          docker run --rm \
            -v "$PWD":/workspace \
            -w "/workspace/${NIM_SQL_PARSER_DIR}" \
            -e PATH=/opt/nim/bin:/usr/local/bin:/usr/bin:/bin \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            nimlang/nim:2.2 \
            sh -c 'nimble install -y npeg msgpack4nim && nimble lib'
      - name: Cargo fmt
        run: cargo fmt --all -- --check
      - name: Cargo clippy
        run: cargo clippy -p alopex-py --all-targets --all-features

  test:
    name: test ${{ matrix.feature }} py${{ matrix.python }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11"]
        feature: ["numpy", "no-numpy"]
    steps:
      - name: Skip non-ubuntu on ACT
        if: ${{ env.ACT && matrix.os != 'ubuntu-latest' }}
        run: echo "Skipping ${matrix.os} on ACT."
      - name: Checkout
        if: ${{ !env.ACT || (matrix.os == 'ubuntu-latest' && matrix.python == '3.11') }}
        uses: actions/checkout@v4
      - name: Setup Python
        if: ${{ !env.ACT }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Setup Rust
        if: ${{ !env.ACT || (matrix.os == 'ubuntu-latest' && matrix.python == '3.11') }}
        uses: dtolnay/rust-toolchain@stable
      - name: Setup virtualenv
        if: ${{ !env.ACT || (matrix.os == 'ubuntu-latest' && matrix.python == '3.11') }}
        run: |
          python_cmd="python"
          if [[ -n "${ACT:-}" ]]; then
            python_cmd="python3"
          fi
          rm -rf .venv
          "$python_cmd" -m venv .venv
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            venv_bin=".venv/Scripts"
          else
            venv_bin=".venv/bin"
          fi
          echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"
          echo "$PWD/$venv_bin" >> "$GITHUB_PATH"
      - name: Install base dependencies
        if: ${{ !env.ACT || (matrix.os == 'ubuntu-latest' && matrix.python == '3.11') }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install maturin pytest
      - name: Install numpy
        if: ${{ (!env.ACT || (matrix.os == 'ubuntu-latest' && matrix.python == '3.11')) && matrix.feature == 'numpy' }}
        run: |
          if [[ -n "${ACT:-}" ]]; then
            python -m pip install numpy
            exit 0
          fi
          python -m pip install numpy
      - name: Install patchelf (Linux)
        if: ${{ !env.ACT || (matrix.os == 'ubuntu-latest' && matrix.python == '3.11') }}
        run: |
          if [[ "${{ matrix.os }}" != "ubuntu-latest" ]]; then
            exit 0
          fi
          if command -v patchelf &> /dev/null; then
            exit 0
          fi
          if [[ -n "${ACT:-}" ]]; then
            if command -v sudo &> /dev/null; then
              echo 'Acquire::ForceIPv4 "true";' | sudo tee /etc/apt/apt.conf.d/99force-ipv4 > /dev/null
            else
              echo 'Acquire::ForceIPv4 "true";' > /etc/apt/apt.conf.d/99force-ipv4
            fi
          fi
          if command -v sudo &> /dev/null; then
            sudo apt-get update
            sudo apt-get install -y patchelf
            exit 0
          fi
          apt-get update
          apt-get install -y patchelf
      - name: Build Nim SQL parser library
        if: runner.os == 'Linux'
        run: |
          docker run --rm \
            -v "$PWD":/workspace \
            -w "/workspace/${NIM_SQL_PARSER_DIR}" \
            -e PATH=/opt/nim/bin:/usr/local/bin:/usr/bin:/bin \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            nimlang/nim:2.2 \
            sh -c 'nimble install -y npeg msgpack4nim && nimble lib'
      # macOS/Windows ランナーは docker で Linux コンテナを動かせないため、
      # ネイティブ Nim ツールチェーン (2.2 固定) をセットアップして共有ライブラリを生成する。
      # 要 CI 検証: macOS/Windows ランナー上でのみ動作確認可能（ローカル検証不可）。
      - name: Setup Nim (macOS/Windows)
        if: runner.os != 'Linux'
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: '2.2.x'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build Nim SQL parser library (macOS/Windows)
        if: runner.os != 'Linux'
        shell: bash
        run: |
          cd "${NIM_SQL_PARSER_DIR}"
          nimble install -y npeg msgpack4nim
          nimble lib
      # Windows は rpath を持たないため、拡張のビルドと import 時に
      # alopex_sql_parser.dll を見つけられるよう Nim ライブラリのディレクトリを
      # PATH に追加する（Windows の DLL 検索は PATH を含む）。
      - name: Add Nim library to PATH (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: echo "${GITHUB_WORKSPACE}/${NIM_SQL_PARSER_DIR}" >> "$GITHUB_PATH"
      - name: Maturin develop
        if: ${{ !env.ACT || (matrix.os == 'ubuntu-latest' && matrix.python == '3.11') }}
        run: |
          if [[ -n "${ACT:-}" ]]; then
            if [[ "${{ matrix.feature }}" == "numpy" ]]; then
              maturin develop -m crates/alopex-py/Cargo.toml --features numpy
            else
              maturin develop -m crates/alopex-py/Cargo.toml
            fi
            exit 0
          fi
          if [[ "${{ matrix.feature }}" == "numpy" ]]; then
            maturin develop -m crates/alopex-py/Cargo.toml --features numpy
          else
            maturin develop -m crates/alopex-py/Cargo.toml
          fi
      - name: Run pytest
        if: ${{ !env.ACT || (matrix.os == 'ubuntu-latest' && matrix.python == '3.11') }}
        run: |
          if [[ -n "${ACT:-}" ]]; then
            python -m pytest crates/alopex-py/tests -k "not benchmark"
            exit 0
          fi
          pytest crates/alopex-py/tests
      - name: Verify vector APIs are absent
        if: ${{ (!env.ACT || (matrix.os == 'ubuntu-latest' && matrix.python == '3.11')) && matrix.feature == 'no-numpy' }}
        run: |
          python - <<'PY'
          from alopex import Database, Transaction

          txn_missing = [
              "upsert_vector",
              "search_similar",
              "upsert_to_hnsw",
              "delete_from_hnsw",
          ]
          db_missing = [
              "create_hnsw_index",
              "search_hnsw",
              "drop_hnsw_index",
              "get_hnsw_stats",
          ]

          for name in txn_missing:
              assert not hasattr(Transaction, name), f"{name} should be absent"
          for name in db_missing:
              assert not hasattr(Database, name), f"{name} should be absent"
          PY

  polars-test:
    name: polars-test py${{ matrix.python }} polars-${{ matrix.polars }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11"]
        polars: ["0.20.*", "latest"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Checkout Chirps dependency
        run: bash .github/scripts/checkout-chirps.sh
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Setup virtualenv
        run: |
          rm -rf .venv
          python -m venv .venv
          echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install maturin pytest
          if [[ "${{ matrix.polars }}" == "latest" ]]; then
            python -m pip install polars
          else
            python -m pip install "polars==${{ matrix.polars }}"
          fi
      - name: Install patchelf (Linux)
        run: |
          if command -v patchelf &> /dev/null; then
            exit 0
          fi
          if [[ -n "${ACT:-}" ]]; then
            if command -v sudo &> /dev/null; then
              echo 'Acquire::ForceIPv4 "true";' | sudo tee /etc/apt/apt.conf.d/99force-ipv4 > /dev/null
            else
              echo 'Acquire::ForceIPv4 "true";' > /etc/apt/apt.conf.d/99force-ipv4
            fi
          fi
          if command -v sudo &> /dev/null; then
            sudo apt-get update
            sudo apt-get install -y patchelf
            exit 0
          fi
          apt-get update
          apt-get install -y patchelf
      - name: Build Nim SQL parser library
        if: runner.os == 'Linux'
        run: |
          docker run --rm \
            -v "$PWD":/workspace \
            -w "/workspace/${NIM_SQL_PARSER_DIR}" \
            -e PATH=/opt/nim/bin:/usr/local/bin:/usr/bin:/bin \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            nimlang/nim:2.2 \
            sh -c 'nimble install -y npeg msgpack4nim && nimble lib'
      - name: Maturin develop
        run: |
          maturin develop -m crates/alopex-py/Cargo.toml
      - name: Run polars tests
        run: |
          pytest crates/alopex-py/tests -m "requires_polars"

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Checkout Chirps dependency
        run: bash .github/scripts/checkout-chirps.sh
      - name: Setup Python
        if: ${{ !env.ACT }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install mypy
        run: |
          if [[ -n "${ACT:-}" ]]; then
            venv_dir=".venv-act"
            rm -rf "$venv_dir"
            python -m venv "$venv_dir"
            echo "VIRTUAL_ENV=$PWD/$venv_dir" >> "$GITHUB_ENV"
            echo "$PWD/$venv_dir/bin" >> "$GITHUB_PATH"
            source "$venv_dir/bin/activate"
            python -m pip install --upgrade pip
            python -m pip install mypy
            exit 0
          fi
          python -m pip install --upgrade pip
          python -m pip install mypy
      - name: Run mypy
        run: |
          if [[ -n "${ACT:-}" ]]; then
            python -m mypy crates/alopex-py/python/alopex
            exit 0
          fi
          mypy crates/alopex-py/python/alopex

  benchmarks:
    name: benchmarks (small/medium)
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
      - name: Checkout
        uses: actions/checkout@v4
      - name: Checkout Chirps dependency
        run: bash .github/scripts/checkout-chirps.sh
      - name: Setup Python
        if: ${{ !env.ACT }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Setup virtualenv
        run: |
          python_cmd="python"
          if [[ -n "${ACT:-}" ]]; then
            python_cmd="python3"
          fi
          rm -rf .venv
          "$python_cmd" -m venv .venv
          echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install maturin pytest pytest-benchmark numpy polars
      - name: Install patchelf (Linux)
        run: |
          if command -v patchelf &> /dev/null; then
            exit 0
          fi
          if [[ -n "${ACT:-}" ]]; then
            if command -v sudo &> /dev/null; then
              echo 'Acquire::ForceIPv4 "true";' | sudo tee /etc/apt/apt.conf.d/99force-ipv4 > /dev/null
            else
              echo 'Acquire::ForceIPv4 "true";' > /etc/apt/apt.conf.d/99force-ipv4
            fi
          fi
          if command -v sudo &> /dev/null; then
            sudo apt-get update
            sudo apt-get install -y patchelf
            exit 0
          fi
          apt-get update
          apt-get install -y patchelf
      - name: Build Nim SQL parser library
        if: runner.os == 'Linux'
        run: |
          docker run --rm \
            -v "$PWD":/workspace \
            -w "/workspace/${NIM_SQL_PARSER_DIR}" \
            -e PATH=/opt/nim/bin:/usr/local/bin:/usr/bin:/bin \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            nimlang/nim:2.2 \
            sh -c 'nimble install -y npeg msgpack4nim && nimble lib'
      - name: Maturin develop (numpy)
        run: |
          maturin develop -m crates/alopex-py/Cargo.toml --features numpy
      - name: Run benchmarks
        run: |
          pytest crates/alopex-py/tests/benchmarks/ -v --benchmark-only --benchmark-json=benchmark.json -m "not large"
      - name: Upload benchmark artifact
        uses: actions/upload-artifact@v4
        with:
          name: alopex-py-benchmark-${{ github.run_id }}-${{ github.run_attempt }}
          path: benchmark.json

  ci-success:
    name: ci-success
    if: ${{ always() }}
    needs: [rust-check, test, polars-test, typecheck, benchmarks]
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        run: |
          if [[ "${{ needs.rust-check.result }}" != "success" ]]; then
            exit 1
          fi
          if [[ "${{ needs.test.result }}" != "success" ]]; then
            exit 1
          fi
          if [[ "${{ needs.polars-test.result }}" != "success" ]]; then
            exit 1
          fi
          if [[ "${{ needs.typecheck.result }}" != "success" ]]; then
            exit 1
          fi
          if [[ "${{ needs.benchmarks.result }}" != "success" ]]; then
            exit 1
          fi
