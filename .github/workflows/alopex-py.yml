name: alopex-py

on:
  push:
    branches: [main, 'integration/**', 'release/**']
    paths:
      - ".github/workflows/alopex-py.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "scripts/release/verify_macos_wheel_linkedit.py"
      - ".github/actions/setup-nim-parser-toolchain/**"
      - "scripts/build-nim-parser.sh"
      - "scripts/compatibility/**"
      - "scripts/reference_tests/hnsw_public_inventory.py"
      - "scripts/reference_tests/test_hnsw_public_inventory.py"
      - "docs/parity/hnsw-v0.8.11.json"
      - "crates/alopex-py/**"
      - "crates/alopex-embedded/**"
      - "crates/alopex-core/**"
      - "crates/alopex-sql/**"
      # The server client's e2e lane asserts the HTTP wire contract, so a
      # change on the server side has to re-run it.
      - "crates/alopex-server/**"
      - "crates/alopex-cluster/**"
  pull_request:
    paths:
      - ".github/workflows/alopex-py.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "scripts/release/verify_macos_wheel_linkedit.py"
      - ".github/actions/setup-nim-parser-toolchain/**"
      - "scripts/build-nim-parser.sh"
      - "scripts/compatibility/**"
      - "scripts/reference_tests/hnsw_public_inventory.py"
      - "scripts/reference_tests/test_hnsw_public_inventory.py"
      - "docs/parity/hnsw-v0.8.11.json"
      - "crates/alopex-py/**"
      - "crates/alopex-embedded/**"
      - "crates/alopex-core/**"
      - "crates/alopex-sql/**"
      # The server client's e2e lane asserts the HTTP wire contract, so a
      # change on the server side has to re-run it.
      - "crates/alopex-server/**"
      - "crates/alopex-cluster/**"

# Supersede PRs and unprotected development branch pushes. Preserve other
# push runs (protected/integration/release branches and tags), scheduled
# runs and manual runs individually as verification evidence.
concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.event_name }}-${{
      (github.event_name == 'pull_request' ||
       (github.event_name == 'push' && github.ref_type == 'branch' &&
        !github.ref_protected &&
        !startsWith(github.ref, 'refs/heads/integration/') &&
        !startsWith(github.ref, 'refs/heads/release/'))) &&
      github.ref || github.run_id }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  NIM_SQL_PARSER_DIR: crates/alopex-sql/nim-sql-parser
  ALOPEX_NIM_PARSER_ALLOW_LOCAL_BUILD: "1"
  NIM_SQL_PARSER_LIB_DIR: ${{ github.workspace }}/crates/alopex-sql/nim-sql-parser

jobs:
  rust-check:
    name: rust-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Build Nim SQL parser library
        if: runner.os == 'Linux'
        run: bash scripts/build-nim-parser.sh --backend docker
      - name: Cargo fmt
        run: cargo fmt --all -- --check
      - name: Cargo clippy
        run: cargo clippy -p alopex-py --all-targets --all-features

  test:
    name: test ${{ matrix.numpy_runtime }} py${{ matrix.python }} (${{ matrix.os }})
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_BUILD_JOBS: "2"
    # Opt in only for trusted candidate pushes; PRs retain hosted runners.
    runs-on: ${{ matrix.os == 'macos-latest' && github.event_name == 'push' && github.ref == 'refs/heads/integration/v0.8.16-candidate' && vars.ALOPEX_V0816_MACOS_RUNNER == 'self-hosted' && 'alopex-v0816-macos' || matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11"]
        numpy_runtime: ["with-numpy", "without-numpy"]
    steps:
      - name: Skip non-ubuntu on ACT
        if: ${{ env.ACT && matrix.os != 'ubuntu-latest' }}
        run: echo "Skipping ${matrix.os} on ACT."
      - name: Checkout
        if: ${{ !env.ACT || (matrix.os == 'ubuntu-latest' && matrix.python == '3.11') }}
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare bounded temporary macOS runner
        if: runner.environment == 'self-hosted'
        run: bash scripts/ci/prepare-temporary-macos-runner.sh
      - name: Setup Python
        if: ${{ !env.ACT && runner.environment != 'self-hosted' }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Setup Rust
        if: ${{ !env.ACT || (matrix.os == 'ubuntu-latest' && matrix.python == '3.11') }}
        uses: dtolnay/rust-toolchain@stable
      - name: Setup virtualenv
        if: ${{ !env.ACT || (matrix.os == 'ubuntu-latest' && matrix.python == '3.11') }}
        run: |
          python_cmd="python"
          if [[ -n "${ACT:-}" ]]; then
            python_cmd="python3"
          fi
          rm -rf .venv
          "$python_cmd" -m venv .venv
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            venv_bin=".venv/Scripts"
          else
            venv_bin=".venv/bin"
          fi
          echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"
          echo "$PWD/$venv_bin" >> "$GITHUB_PATH"
      - name: Install base dependencies
        if: ${{ !env.ACT || (matrix.os == 'ubuntu-latest' && matrix.python == '3.11') }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install maturin pytest
      - name: Install numpy
        if: ${{ (!env.ACT || (matrix.os == 'ubuntu-latest' && matrix.python == '3.11')) && matrix.numpy_runtime == 'with-numpy' }}
        run: |
          if [[ -n "${ACT:-}" ]]; then
            python -m pip install numpy pyarrow
            exit 0
          fi
          python -m pip install numpy pyarrow
      - name: Install patchelf (Linux)
        if: ${{ !env.ACT || (matrix.os == 'ubuntu-latest' && matrix.python == '3.11') }}
        run: |
          if [[ "${{ matrix.os }}" != "ubuntu-latest" ]]; then
            exit 0
          fi
          if command -v patchelf &> /dev/null; then
            exit 0
          fi
          if [[ -n "${ACT:-}" ]]; then
            if command -v sudo &> /dev/null; then
              echo 'Acquire::ForceIPv4 "true";' | sudo tee /etc/apt/apt.conf.d/99force-ipv4 > /dev/null
            else
              echo 'Acquire::ForceIPv4 "true";' > /etc/apt/apt.conf.d/99force-ipv4
            fi
          fi
          if command -v sudo &> /dev/null; then
            sudo apt-get update
            sudo apt-get install -y patchelf
            exit 0
          fi
          apt-get update
          apt-get install -y patchelf
      - name: Build Nim SQL parser library
        if: runner.os == 'Linux'
        run: bash scripts/build-nim-parser.sh --backend docker
      # macOS/Windows はホストビルドを行うため、Linux/Windows の正規
      # リリースゲートと同じ exact toolchain と隔離 package store を使う。
      - name: Setup exact Nim parser toolchain (macOS/Windows)
        if: runner.os != 'Linux'
        uses: ./.github/actions/setup-nim-parser-toolchain
      - name: Build Nim SQL parser library (macOS/Windows)
        if: runner.os != 'Linux'
        shell: bash
        run: bash scripts/build-nim-parser.sh --backend host
      - name: Stage parser library in package-local native directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p crates/alopex-py/python/alopex/native
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            library="${NIM_SQL_PARSER_DIR}/alopex_sql_parser.dll"
          elif [[ "$RUNNER_OS" == "macOS" ]]; then
            library="${NIM_SQL_PARSER_DIR}/libalopex_sql_parser.dylib"
          else
            library="${NIM_SQL_PARSER_DIR}/libalopex_sql_parser.so"
          fi
          test -f "$library"
          cp "$library" crates/alopex-py/python/alopex/native/
          printf '0.28.0\n' > crates/alopex-py/python/alopex/native/CONTRACT_VERSION
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$library" | sed "s#${NIM_SQL_PARSER_DIR}/##" > crates/alopex-py/python/alopex/native/SHA256SUMS
          else
            shasum -a 256 "$library" | sed "s#${NIM_SQL_PARSER_DIR}/##" > crates/alopex-py/python/alopex/native/SHA256SUMS
          fi
      # 診断専用ステップ (fail させない): DLL の推移的依存と単体ロード可否を
      # CI ログへ出力する。静的リンク (nim_sql_parser.nimble) が不十分な場合、
      # 次の CI 実行でどの依存 DLL が残っているかをここで特定できる。
      - name: Diagnose Nim parser DLL dependencies (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          dll_unix="${GITHUB_WORKSPACE}/${NIM_SQL_PARSER_DIR}/alopex_sql_parser.dll"
          echo "=== DLL file ==="
          ls -la "$dll_unix" || true
          echo "=== Import table (objdump -p | DLL Name) ==="
          if command -v objdump >/dev/null 2>&1; then
            objdump -p "$dll_unix" | grep "DLL Name" || true
          else
            echo "objdump not available on this runner"
          fi
          echo "=== ctypes.WinDLL load test ==="
          python - <<'PY' || true
          import ctypes
          import os
          import traceback

          dll = os.path.join(
              os.environ["GITHUB_WORKSPACE"],
              *os.environ["NIM_SQL_PARSER_DIR"].split("/"),
              "alopex_sql_parser.dll",
          )
          print("loading:", dll)
          try:
              ctypes.WinDLL(dll)
              print("WinDLL load: OK")
          except Exception:
              traceback.print_exc()
          PY
          exit 0
      - name: Maturin develop
        if: ${{ !env.ACT || (matrix.os == 'ubuntu-latest' && matrix.python == '3.11') }}
        run: maturin develop -m crates/alopex-py/Cargo.toml
      - name: Run pytest
        if: ${{ !env.ACT || (matrix.os == 'ubuntu-latest' && matrix.python == '3.11') }}
        run: |
          if [[ -n "${ACT:-}" ]]; then
            python -m pytest crates/alopex-py/tests --ignore=crates/alopex-py/tests/benchmarks --ignore=crates/alopex-py/tests/test_benchmark_nfr13.py -k "not benchmark"
            exit 0
          fi
          pytest crates/alopex-py/tests --ignore=crates/alopex-py/tests/benchmarks --ignore=crates/alopex-py/tests/test_benchmark_nfr13.py
      - name: Run HNSW management and commit GIL regressions
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.numpy_runtime == 'with-numpy' }}
        run: cargo test -p alopex-py --lib releases_gil -- --nocapture
      - name: Verify release wheel import and SQL API
        if: ${{ !env.ACT && matrix.numpy_runtime == 'with-numpy' }}
        run: |
          set -euo pipefail
          release_temp_root="$RUNNER_TEMP"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            release_temp_root="$(cygpath -u "$release_temp_root")"
          fi
          wheel_dir="${release_temp_root}/alopex-release-wheel"
          mkdir -p "$wheel_dir"
          env -u RUSTFLAGS -u CARGO_ENCODED_RUSTFLAGS -u CARGO_PROFILE_RELEASE_STRIP \
            maturin build -m crates/alopex-py/Cargo.toml --release --out "$wheel_dir"
          wheel="$(find "$wheel_dir" -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "$wheel"
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            python scripts/release/verify_macos_wheel_linkedit.py "$wheel"
          fi
          smoke_venv="${release_temp_root}/alopex-release-wheel-smoke"
          python -m venv "$smoke_venv"
          smoke_python="$smoke_venv/bin/python"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            smoke_python="$smoke_venv/Scripts/python.exe"
          fi
          "$smoke_python" -m pip install pytest numpy
          "$smoke_python" -m pip install --no-index --no-deps "$wheel"
          "$smoke_python" -m pytest -q crates/alopex-py/tests/test_sql.py
      - name: Run old-writer to candidate-reader compatibility matrix
        if: ${{ !env.ACT && matrix.os == 'ubuntu-latest' && matrix.numpy_runtime == 'with-numpy' }}
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
          CARGO_INCREMENTAL: "0"
          CARGO_PROFILE_DEV_DEBUG: "0"
          CARGO_PROFILE_TEST_DEBUG: "0"
          CARGO_BUILD_JOBS: "2"
          PIP_NO_CACHE_DIR: "1"
        run: |
          set -euo pipefail
          compat_root="${RUNNER_TEMP}/alopex-upgrade-compatibility"
          old_env="${compat_root}/old-env"
          candidate_python="${RUNNER_TEMP}/alopex-release-wheel-smoke/bin/python"
          candidate_wheel="$(find "${RUNNER_TEMP}/alopex-release-wheel" -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "$candidate_wheel"
          mkdir -p "$compat_root"
          cleanup() { rm -rf -- "$old_env"; }
          trap cleanup EXIT
          python -m unittest scripts.compatibility.test_runner scripts.compatibility.test_api
          baseline_commit='d3917e1fa21d41097742a971e14094c0d6ae397e'
          if ! git cat-file -e "$baseline_commit^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$baseline_commit"
          fi
          python scripts/compatibility/storage.py --log "$compat_root/storage.jsonl" \
            --additional-bytes 20000000000 -- bash scripts/compatibility/build-rust.sh
          python scripts/compatibility/storage.py --log "$compat_root/storage.jsonl" \
            --additional-bytes 2000000000 -- python -m venv "$old_env"
          python scripts/compatibility/storage.py --log "$compat_root/storage.jsonl" \
            --additional-bytes 2000000000 -- "$old_env/bin/python" -m pip install \
            --only-binary=:all: 'alopex==0.8.15' 'numpy==2.2.1' 'pyarrow==26.0.0' 'pytest==9.1.1' 'polars==1.43.2'
          python scripts/compatibility/storage.py --log "$compat_root/storage.jsonl" \
            --additional-bytes 2000000000 -- "$candidate_python" -m pip install \
            --only-binary=:all: 'numpy==2.2.1' 'pyarrow==26.0.0' 'pytest==9.1.1' 'polars==1.43.2'
          python scripts/compatibility/storage.py --log "$compat_root/storage.jsonl" \
            --additional-bytes 2000000000 -- python scripts/compatibility/run.py \
            --old-python "$old_env/bin/python" --new-python "$candidate_python" \
            --candidate-wheel "$candidate_wheel" \
            --old-rust "$CARGO_TARGET_DIR/debug/alopex-compat-baseline" \
            --new-rust "$CARGO_TARGET_DIR/debug/alopex-compat-candidate" \
            --output "$compat_root/results"
      - name: Upload cross-version compatibility evidence
        if: ${{ always() && !env.ACT && matrix.os == 'ubuntu-latest' && matrix.numpy_runtime == 'with-numpy' }}
        uses: actions/upload-artifact@v4
        with:
          name: upgrade-compatibility-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/alopex-upgrade-compatibility/results
            ${{ runner.temp }}/alopex-upgrade-compatibility/storage.jsonl
          if-no-files-found: error
          retention-days: 14
      - name: Verify HNSW runtime and source inventory
        if: ${{ (!env.ACT || (matrix.os == 'ubuntu-latest' && matrix.python == '3.11')) && matrix.numpy_runtime == 'with-numpy' }}
        run: |
          python -m unittest scripts.reference_tests.test_hnsw_public_inventory
          python scripts/reference_tests/hnsw_public_inventory.py --runtime docs/parity/hnsw-v0.8.11.json
      - name: Verify vector APIs remain exported without NumPy installed
        if: ${{ (!env.ACT || (matrix.os == 'ubuntu-latest' && matrix.python == '3.11')) && matrix.numpy_runtime == 'without-numpy' }}
        run: |
          python - <<'PY'
          from alopex import Database, Transaction

          txn_missing = [
              "upsert_vector",
              "search_similar",
              "upsert_to_hnsw",
              "delete_from_hnsw",
          ]
          db_missing = [
              "create_hnsw_index",
              "search_hnsw",
              "drop_hnsw_index",
              "get_hnsw_stats",
          ]

          for name in txn_missing:
              assert hasattr(Transaction, name), f"{name} should remain exported"
          for name in db_missing:
              assert hasattr(Database, name), f"{name} should remain exported"
          PY

  polars-test:
    name: polars-test py${{ matrix.python }} polars-${{ matrix.polars }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11"]
        polars: ["0.20.*", "1.43.2"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Setup virtualenv
        run: |
          rm -rf .venv
          python -m venv .venv
          echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install maturin pytest
          python -m pip install "polars==${{ matrix.polars }}"
      - name: Install patchelf (Linux)
        run: |
          if command -v patchelf &> /dev/null; then
            exit 0
          fi
          if [[ -n "${ACT:-}" ]]; then
            if command -v sudo &> /dev/null; then
              echo 'Acquire::ForceIPv4 "true";' | sudo tee /etc/apt/apt.conf.d/99force-ipv4 > /dev/null
            else
              echo 'Acquire::ForceIPv4 "true";' > /etc/apt/apt.conf.d/99force-ipv4
            fi
          fi
          if command -v sudo &> /dev/null; then
            sudo apt-get update
            sudo apt-get install -y patchelf
            exit 0
          fi
          apt-get update
          apt-get install -y patchelf
      - name: Build Nim SQL parser library
        if: runner.os == 'Linux'
        run: bash scripts/build-nim-parser.sh --backend docker
      - name: Maturin develop
        run: |
          maturin develop -m crates/alopex-py/Cargo.toml
      - name: Run polars tests
        run: |
          pytest crates/alopex-py/tests --ignore=crates/alopex-py/tests/benchmarks --ignore=crates/alopex-py/tests/test_benchmark_nfr13.py -m "requires_polars and not polars_reference"
      - name: Run exact Polars Python differential
        if: matrix.polars == '1.43.2'
        run: |
          python scripts/reference_tests/polars_public_inventory.py \
            docs/parity/polars-v1.43.2.json
          pytest crates/alopex-py/tests/test_polars_1432_reference.py
      - name: Run exact Polars reference differential
        if: matrix.polars == '1.43.2'
        env:
          ALOPEX_POLARS_PYTHON: ${{ github.workspace }}/.venv/bin/python
        run: >-
          cargo test -p alopex-dataframe --features lane_ci --test polars_reference
          live_polars_1_43_2_matches_dataframe_contract -- --ignored --exact

  server-e2e:
    name: server-e2e
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Setup virtualenv
        run: |
          rm -rf .venv
          python -m venv .venv
          echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install maturin pytest
      - name: Install patchelf
        run: |
          if command -v patchelf &> /dev/null; then
            exit 0
          fi
          sudo apt-get update
          sudo apt-get install -y patchelf
      - name: Build Nim SQL parser library
        run: bash scripts/build-nim-parser.sh --backend docker
      - name: Maturin develop
        run: maturin develop -m crates/alopex-py/Cargo.toml
      - name: Build alopex-server
        run: cargo build -p alopex-server
      - name: Run server e2e tests
        env:
          # Without this the lane would silently skip when the binary is
          # missing, and the wire contract would go unverified.
          ALOPEX_REQUIRE_SERVER_E2E: "1"
          ALOPEX_SERVER_BIN: ${{ github.workspace }}/target/debug/alopex-server
        run: |
          export LD_LIBRARY_PATH="${NIM_SQL_PARSER_LIB_DIR}${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          pytest crates/alopex-py/tests --ignore=crates/alopex-py/tests/benchmarks --ignore=crates/alopex-py/tests/test_benchmark_nfr13.py -m requires_server

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        if: ${{ !env.ACT }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install mypy
        run: |
          if [[ -n "${ACT:-}" ]]; then
            venv_dir=".venv-act"
            rm -rf "$venv_dir"
            python -m venv "$venv_dir"
            echo "VIRTUAL_ENV=$PWD/$venv_dir" >> "$GITHUB_ENV"
            echo "$PWD/$venv_dir/bin" >> "$GITHUB_PATH"
            source "$venv_dir/bin/activate"
            python -m pip install --upgrade pip
            python -m pip install mypy
            exit 0
          fi
          python -m pip install --upgrade pip
          python -m pip install mypy
      - name: Run mypy
        run: |
          if [[ -n "${ACT:-}" ]]; then
            python -m mypy crates/alopex-py/python/alopex
            exit 0
          fi
          mypy crates/alopex-py/python/alopex

  ci-success:
    name: ci-success
    if: ${{ !cancelled() }}
    needs: [rust-check, test, polars-test, server-e2e, typecheck]
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        run: |
          if [[ "${{ needs.rust-check.result }}" != "success" ]]; then
            exit 1
          fi
          if [[ "${{ needs.test.result }}" != "success" ]]; then
            exit 1
          fi
          if [[ "${{ needs.polars-test.result }}" != "success" ]]; then
            exit 1
          fi
          if [[ "${{ needs.server-e2e.result }}" != "success" ]]; then
            exit 1
          fi
          if [[ "${{ needs.typecheck.result }}" != "success" ]]; then
            exit 1
          fi
