name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  RUSTFLAGS: -D warnings
  NIM_SQL_PARSER_DIR: crates/alopex-sql/nim-sql-parser

jobs:
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Build Nim SQL parser library
        if: runner.os == 'Linux'
        run: |
          docker run --rm \
            -v "$PWD":/workspace \
            -w "/workspace/${NIM_SQL_PARSER_DIR}" \
            -e PATH=/opt/nim/bin:/usr/local/bin:/usr/bin:/bin \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            nimlang/nim:2.2 \
            sh -c 'nimble install -y npeg msgpack4nim && nimble lib'
      - run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: Test Suite (${{ matrix.os }}, ${{ matrix.rust }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable, beta]
        exclude:
          # Only run beta on Linux to save CI time
          - os: macos-latest
            rust: beta
          - os: windows-latest
            rust: beta
    steps:
      - name: Free disk space (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Setup Python venv
        shell: bash
        run: |
          VENV_DIR="${RUNNER_TEMP:-/tmp}/alopex-ci-venv"
          rm -rf "$VENV_DIR"
          python -m venv "$VENV_DIR"
          VENV_ROOT=$(VENV_DIR="$VENV_DIR" python -c "import os; from pathlib import Path; print(Path(os.environ['VENV_DIR']).resolve().as_posix())")
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            VENV_BIN="$VENV_ROOT/Scripts"
            VENV_PY="$VENV_BIN/python.exe"
          else
            VENV_BIN="$VENV_ROOT/bin"
            VENV_PY="$VENV_BIN/python"
            if [[ ! -x "$VENV_PY" ]]; then
              VENV_PY="$VENV_BIN/python3"
            fi
          fi
          if [[ ! -x "$VENV_PY" ]]; then
            echo "venv python not found at $VENV_PY" >&2
            ls -la "$VENV_ROOT" || true
            exit 1
          fi
          echo "$VENV_BIN" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$VENV_ROOT" >> "$GITHUB_ENV"
          echo "PYO3_PYTHON=$VENV_PY" >> "$GITHUB_ENV"
          echo "PYTHON_SYS_EXECUTABLE=$VENV_PY" >> "$GITHUB_ENV"
          "$VENV_PY" -m ensurepip --upgrade
          "$VENV_PY" -m pip install --upgrade pip
          "$VENV_PY" -m pip install "numpy<2"
          PYTHON_SITE=$("$VENV_PY" -c "import sysconfig; print(sysconfig.get_paths()['purelib'])")
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            PATH_SEP=";"
          else
            PATH_SEP=":"
          fi
          if [[ -n "${PYTHONPATH:-}" ]]; then
            echo "PYTHONPATH=$PYTHON_SITE$PATH_SEP$PYTHONPATH" >> "$GITHUB_ENV"
          else
            echo "PYTHONPATH=$PYTHON_SITE" >> "$GITHUB_ENV"
          fi

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}

      - uses: Swatinem/rust-cache@v2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: python -m pip install --upgrade pip numpy

      - name: Build Nim SQL parser library
        if: runner.os == 'Linux'
        run: |
          docker run --rm \
            -v "$PWD":/workspace \
            -w "/workspace/${NIM_SQL_PARSER_DIR}" \
            -e PATH=/opt/nim/bin:/usr/local/bin:/usr/bin:/bin \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            nimlang/nim:2.2 \
            sh -c 'nimble install -y npeg msgpack4nim && nimble lib'
      # macOS/Windows ランナーは docker で Linux コンテナを動かせないため、
      # ネイティブ Nim ツールチェーン (2.2 固定) をセットアップして共有ライブラリを生成する。
      # 要 CI 検証: macOS/Windows ランナー上でのみ動作確認可能（ローカル検証不可）。
      - name: Setup Nim (macOS/Windows)
        if: runner.os != 'Linux'
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: '2.2.x'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build Nim SQL parser library (macOS/Windows)
        if: runner.os != 'Linux'
        shell: bash
        run: |
          cd "${NIM_SQL_PARSER_DIR}"
          nimble install -y npeg msgpack4nim
          nimble lib

      # Windows は rpath を持たないため、テストバイナリ実行時に
      # alopex_sql_parser.dll を見つけられるよう Nim ライブラリのディレクトリを
      # PATH に追加する（Windows の DLL 検索は PATH を含む）。
      - name: Add Nim library to PATH (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: echo "${GITHUB_WORKSPACE}/${NIM_SQL_PARSER_DIR}" >> "$GITHUB_PATH"

      - name: Run tests
        env:
          # テストバイナリ（target/debug/deps 配下）は build.rs の rpath だけでは
          # Nim 共有ライブラリを解決できないため、ライブラリのディレクトリを
          # LD_LIBRARY_PATH に追加して実行時解決する（Linux のみ有効）。
          LD_LIBRARY_PATH: ${{ github.workspace }}/${{ env.NIM_SQL_PARSER_DIR }}:${{ env.LD_LIBRARY_PATH }}
        run: cargo test --workspace --features lane_ci

      - name: Run doc tests
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/${{ env.NIM_SQL_PARSER_DIR }}:${{ env.LD_LIBRARY_PATH }}
        run: cargo test --doc --workspace --features lane_ci

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Setup Python venv
        shell: bash
        run: |
          VENV_DIR="${RUNNER_TEMP:-/tmp}/alopex-ci-venv"
          rm -rf "$VENV_DIR"
          python -m venv "$VENV_DIR"
          VENV_ROOT=$(VENV_DIR="$VENV_DIR" python -c "import os; from pathlib import Path; print(Path(os.environ['VENV_DIR']).resolve().as_posix())")
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            VENV_BIN="$VENV_ROOT/Scripts"
            VENV_PY="$VENV_BIN/python.exe"
          else
            VENV_BIN="$VENV_ROOT/bin"
            VENV_PY="$VENV_BIN/python"
            if [[ ! -x "$VENV_PY" ]]; then
              VENV_PY="$VENV_BIN/python3"
            fi
          fi
          if [[ ! -x "$VENV_PY" ]]; then
            echo "venv python not found at $VENV_PY" >&2
            ls -la "$VENV_ROOT" || true
            exit 1
          fi
          echo "$VENV_BIN" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$VENV_ROOT" >> "$GITHUB_ENV"
          echo "PYO3_PYTHON=$VENV_PY" >> "$GITHUB_ENV"
          echo "PYTHON_SYS_EXECUTABLE=$VENV_PY" >> "$GITHUB_ENV"
          "$VENV_PY" -m ensurepip --upgrade
          "$VENV_PY" -m pip install --upgrade pip
          "$VENV_PY" -m pip install "numpy<2"
          PYTHON_SITE=$("$VENV_PY" -c "import sysconfig; print(sysconfig.get_paths()['purelib'])")
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            PATH_SEP=";"
          else
            PATH_SEP=":"
          fi
          if [[ -n "${PYTHONPATH:-}" ]]; then
            echo "PYTHONPATH=$PYTHON_SITE$PATH_SEP$PYTHONPATH" >> "$GITHUB_ENV"
          else
            echo "PYTHONPATH=$PYTHON_SITE" >> "$GITHUB_ENV"
          fi
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: python -m pip install --upgrade pip numpy

      - name: Build Nim SQL parser library
        run: |
          docker run --rm \
            -v "$PWD":/workspace \
            -w "/workspace/${NIM_SQL_PARSER_DIR}" \
            -e PATH=/opt/nim/bin:/usr/local/bin:/usr/bin:/bin \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            nimlang/nim:2.2 \
            sh -c 'nimble install -y npeg msgpack4nim && nimble lib'

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Generate coverage
        env:
          # cargo-llvm-cov は target/llvm-cov-target/ を使い、build.rs が設定した
          # rpath だけでは実行時に Nim 共有ライブラリを解決できないため、
          # Nim ライブラリのディレクトリを LD_LIBRARY_PATH に追加して解決する。
          LD_LIBRARY_PATH: ${{ github.workspace }}/${{ env.NIM_SQL_PARSER_DIR }}:${{ env.LD_LIBRARY_PATH }}
        run: >
          cargo llvm-cov --workspace --features lane_ci --lcov --output-path lcov.info --
          --skip e2e_

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          fail_ci_if_error: false

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true  # Advisory: don't fail CI on new vulnerabilities

  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      PYO3_PYTHON: python
      PYTHON_SYS_EXECUTABLE: python
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build Nim SQL parser library
        if: runner.os == 'Linux'
        run: |
          docker run --rm \
            -v "$PWD":/workspace \
            -w "/workspace/${NIM_SQL_PARSER_DIR}" \
            -e PATH=/opt/nim/bin:/usr/local/bin:/usr/bin:/bin \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            nimlang/nim:2.2 \
            sh -c 'nimble install -y npeg msgpack4nim && nimble lib'
      # macOS/Windows ランナーは docker で Linux コンテナを動かせないため、
      # ネイティブ Nim ツールチェーン (2.2 固定) をセットアップして共有ライブラリを生成する。
      # 要 CI 検証: macOS/Windows ランナー上でのみ動作確認可能（ローカル検証不可）。
      - name: Setup Nim (macOS/Windows)
        if: runner.os != 'Linux'
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: '2.2.x'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build Nim SQL parser library (macOS/Windows)
        if: runner.os != 'Linux'
        shell: bash
        run: |
          cd "${NIM_SQL_PARSER_DIR}"
          nimble install -y npeg msgpack4nim
          nimble lib

      - name: Build
        run: cargo build --release --all-features

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: alopex-${{ matrix.os }}
          path: |
            target/release/alopex-cli
            target/release/alopex-cli.exe

  v07-release-gate:
    name: v0.7 Release Gate
    runs-on: ubuntu-latest
    env:
      PYO3_PYTHON: python
      PYTHON_SYS_EXECUTABLE: python
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Python deps
        run: python -m pip install --upgrade pip maturin pytest numpy
      - name: Build Nim SQL parser library
        run: |
          docker run --rm \
            -v "$PWD":/workspace \
            -w "/workspace/${NIM_SQL_PARSER_DIR}" \
            -e PATH=/opt/nim/bin:/usr/local/bin:/usr/bin:/bin \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            nimlang/nim:2.2 \
            sh -c 'nimble install -y npeg msgpack4nim && nimble lib'
      - name: Run v0.7 release gate
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/${{ env.NIM_SQL_PARSER_DIR }}:${{ env.LD_LIBRARY_PATH }}
        run: bash scripts/release/v07_gate.sh

  ci-success:
    name: CI Success
    needs: [fmt, clippy, test, coverage, security-audit, build, v07-release-gate]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ needs.fmt.result }}" != "success" ]] || \
             [[ "${{ needs.clippy.result }}" != "success" ]] || \
             [[ "${{ needs.test.result }}" != "success" ]] || \
             [[ "${{ needs.coverage.result }}" != "success" ]] || \
             [[ "${{ needs['security-audit'].result }}" != "success" ]] || \
             [[ "${{ needs.build.result }}" != "success" ]] || \
             [[ "${{ needs['v07-release-gate'].result }}" != "success" ]]; then
            echo "One or more jobs failed"
            echo "fmt: ${{ needs.fmt.result }}"
            echo "clippy: ${{ needs.clippy.result }}"
            echo "test: ${{ needs.test.result }}"
            echo "coverage: ${{ needs.coverage.result }}"
            echo "security-audit: ${{ needs['security-audit'].result }}"
            echo "build: ${{ needs.build.result }}"
            echo "v07-release-gate: ${{ needs['v07-release-gate'].result }}"
            exit 1
          fi
          echo "All CI jobs passed!"
