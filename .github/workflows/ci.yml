name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  RUSTFLAGS: -D warnings
  NIM_SQL_PARSER_DIR: crates/alopex-sql/nim-sql-parser

jobs:
  scope:
    name: Change scope
    runs-on: ubuntu-latest
    outputs:
      production: ${{ steps.classify.outputs.production }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Classify production and release-process changes
        id: classify
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          base_sha="${PUSH_BEFORE_SHA}"
          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            base_sha="${PR_BASE_SHA}"
          fi
          [[ "${base_sha}" =~ ^[0-9a-f]{40}$ ]]
          production=false
          changed=0
          while IFS= read -r -d '' path; do
            changed=$((changed + 1))
            case "${path}" in
              .github/workflows/*|scripts/release/*|scripts/parity/*|formal/release-report/*) ;;
              *) production=true ;;
            esac
          done < <(git diff --name-only -z "${base_sha}" "${GITHUB_SHA}")
          if [[ "${changed}" -eq 0 ]]; then
            production=true
          fi
          echo "production=${production}" >> "${GITHUB_OUTPUT}"

  fmt:
    name: Rustfmt
    needs: [scope]
    if: needs.scope.outputs.production == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    needs: [scope]
    if: needs.scope.outputs.production == 'true'
    runs-on: ubuntu-latest
    env:
      ALOPEX_NIM_PARSER_ALLOW_LOCAL_BUILD: "1"
      NIM_SQL_PARSER_LIB_DIR: ${{ github.workspace }}/crates/alopex-sql/nim-sql-parser
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Setup exact Nim parser toolchain
        uses: ./.github/actions/setup-nim-parser-toolchain
      - name: Build Nim SQL parser library
        shell: bash
        run: bash scripts/build-nim-parser.sh --backend host
      - name: Run Nim SQL parser tests
        shell: bash
        run: bash scripts/test-nim-parser.sh --backend host
      - run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: Test Suite (${{ matrix.os }}, ${{ matrix.rust }})
    needs: [scope]
    if: needs.scope.outputs.production == 'true'
    runs-on: ${{ matrix.os }}
    env:
      ALOPEX_NIM_PARSER_ALLOW_LOCAL_BUILD: "1"
      NIM_SQL_PARSER_LIB_DIR: ${{ github.workspace }}/crates/alopex-sql/nim-sql-parser
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable, beta]
        exclude:
          # Only run beta on Linux to save CI time
          - os: macos-latest
            rust: beta
          - os: windows-latest
            rust: beta
    steps:
      - name: Free disk space (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Setup Python venv
        shell: bash
        run: |
          VENV_DIR="${RUNNER_TEMP:-/tmp}/alopex-ci-venv"
          rm -rf "$VENV_DIR"
          python -m venv "$VENV_DIR"
          VENV_ROOT=$(VENV_DIR="$VENV_DIR" python -c "import os; from pathlib import Path; print(Path(os.environ['VENV_DIR']).resolve().as_posix())")
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            VENV_BIN="$VENV_ROOT/Scripts"
            VENV_PY="$VENV_BIN/python.exe"
          else
            VENV_BIN="$VENV_ROOT/bin"
            VENV_PY="$VENV_BIN/python"
            if [[ ! -x "$VENV_PY" ]]; then
              VENV_PY="$VENV_BIN/python3"
            fi
          fi
          if [[ ! -x "$VENV_PY" ]]; then
            echo "venv python not found at $VENV_PY" >&2
            ls -la "$VENV_ROOT" || true
            exit 1
          fi
          echo "$VENV_BIN" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$VENV_ROOT" >> "$GITHUB_ENV"
          echo "PYO3_PYTHON=$VENV_PY" >> "$GITHUB_ENV"
          echo "PYTHON_SYS_EXECUTABLE=$VENV_PY" >> "$GITHUB_ENV"
          "$VENV_PY" -m ensurepip --upgrade
          "$VENV_PY" -m pip install --upgrade pip
          "$VENV_PY" -m pip install "numpy<2"
          PYTHON_SITE=$("$VENV_PY" -c "import sysconfig; print(sysconfig.get_paths()['purelib'])")
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            PATH_SEP=";"
          else
            PATH_SEP=":"
          fi
          if [[ -n "${PYTHONPATH:-}" ]]; then
            echo "PYTHONPATH=$PYTHON_SITE$PATH_SEP$PYTHONPATH" >> "$GITHUB_ENV"
          else
            echo "PYTHONPATH=$PYTHON_SITE" >> "$GITHUB_ENV"
          fi

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}

      - uses: Swatinem/rust-cache@v2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: python -m pip install --upgrade pip numpy

      - name: Setup exact Nim parser toolchain
        uses: ./.github/actions/setup-nim-parser-toolchain
      - name: Build Nim SQL parser library
        shell: bash
        run: bash scripts/build-nim-parser.sh --backend host
      - name: Run Nim SQL parser tests
        shell: bash
        run: bash scripts/test-nim-parser.sh --backend host

      # Windows は rpath を持たないため、テストバイナリ実行時に
      # alopex_sql_parser.dll を見つけられるよう Nim ライブラリのディレクトリを
      # PATH に追加する（Windows の DLL 検索は PATH を含む）。
      - name: Add Nim library to PATH (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: echo "${GITHUB_WORKSPACE}/${NIM_SQL_PARSER_DIR}" >> "$GITHUB_PATH"

      - name: Run tests
        env:
          # テストバイナリ（target/debug/deps 配下）は build.rs の rpath だけでは
          # Nim 共有ライブラリを解決できないため、ライブラリのディレクトリを
          # LD_LIBRARY_PATH に追加して実行時解決する（Linux のみ有効）。
          LD_LIBRARY_PATH: ${{ github.workspace }}/${{ env.NIM_SQL_PARSER_DIR }}:${{ env.LD_LIBRARY_PATH }}
        run: cargo test --workspace --features lane_ci

      - name: Run doc tests
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/${{ env.NIM_SQL_PARSER_DIR }}:${{ env.LD_LIBRARY_PATH }}
        run: cargo test --doc --workspace --features lane_ci

  coverage:
    name: Code Coverage
    needs: [scope]
    if: needs.scope.outputs.production == 'true'
    runs-on: ubuntu-latest
    env:
      ALOPEX_NIM_PARSER_ALLOW_LOCAL_BUILD: "1"
      NIM_SQL_PARSER_LIB_DIR: ${{ github.workspace }}/crates/alopex-sql/nim-sql-parser
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Setup Python venv
        shell: bash
        run: |
          VENV_DIR="${RUNNER_TEMP:-/tmp}/alopex-ci-venv"
          rm -rf "$VENV_DIR"
          python -m venv "$VENV_DIR"
          VENV_ROOT=$(VENV_DIR="$VENV_DIR" python -c "import os; from pathlib import Path; print(Path(os.environ['VENV_DIR']).resolve().as_posix())")
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            VENV_BIN="$VENV_ROOT/Scripts"
            VENV_PY="$VENV_BIN/python.exe"
          else
            VENV_BIN="$VENV_ROOT/bin"
            VENV_PY="$VENV_BIN/python"
            if [[ ! -x "$VENV_PY" ]]; then
              VENV_PY="$VENV_BIN/python3"
            fi
          fi
          if [[ ! -x "$VENV_PY" ]]; then
            echo "venv python not found at $VENV_PY" >&2
            ls -la "$VENV_ROOT" || true
            exit 1
          fi
          echo "$VENV_BIN" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$VENV_ROOT" >> "$GITHUB_ENV"
          echo "PYO3_PYTHON=$VENV_PY" >> "$GITHUB_ENV"
          echo "PYTHON_SYS_EXECUTABLE=$VENV_PY" >> "$GITHUB_ENV"
          "$VENV_PY" -m ensurepip --upgrade
          "$VENV_PY" -m pip install --upgrade pip
          "$VENV_PY" -m pip install "numpy<2"
          PYTHON_SITE=$("$VENV_PY" -c "import sysconfig; print(sysconfig.get_paths()['purelib'])")
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            PATH_SEP=";"
          else
            PATH_SEP=":"
          fi
          if [[ -n "${PYTHONPATH:-}" ]]; then
            echo "PYTHONPATH=$PYTHON_SITE$PATH_SEP$PYTHONPATH" >> "$GITHUB_ENV"
          else
            echo "PYTHONPATH=$PYTHON_SITE" >> "$GITHUB_ENV"
          fi
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: python -m pip install --upgrade pip numpy

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Setup exact Nim parser toolchain
        uses: ./.github/actions/setup-nim-parser-toolchain

      - name: Build Nim SQL parser library
        shell: bash
        run: bash scripts/build-nim-parser.sh --backend host

      - name: Run Nim SQL parser tests
        shell: bash
        run: bash scripts/test-nim-parser.sh --backend host

      - name: Generate coverage
        env:
          # cargo-llvm-cov は target/llvm-cov-target/ を使い、build.rs が設定した
          # rpath だけでは実行時に Nim 共有ライブラリを解決できないため、
          # Nim ライブラリのディレクトリを LD_LIBRARY_PATH に追加して解決する。
          LD_LIBRARY_PATH: ${{ github.workspace }}/${{ env.NIM_SQL_PARSER_DIR }}:${{ env.LD_LIBRARY_PATH }}
        run: >
          cargo llvm-cov --workspace --features lane_ci --lcov --output-path lcov.info --
          --skip e2e_

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          fail_ci_if_error: false

  security-audit:
    name: Security Audit
    needs: [scope]
    if: needs.scope.outputs.production == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90.0
      - name: Verify ignored rkyv advisory remains unreachable
        shell: bash
        run: |
          set -euo pipefail
          tree_file="${RUNNER_TEMP}/alopex-security-dependency-tree.txt"
          cargo tree --locked --workspace --all-features --target all > "${tree_file}"
          if grep -Eq '^rkyv v0\.7\.46([[:space:]]|$)' "${tree_file}"; then
            echo "::error::RUSTSEC-2026-0235 is reachable; remove the exception and upgrade rkyv"
            exit 1
          fi
      - name: Install pinned cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Run RustSec audit
        # rust_decimal's `std` feature weakly forwards `rkyv?/std`, so Cargo.lock
        # contains rkyv 0.7.46 even though no resolved target/feature path uses it.
        # The preceding full dependency-tree check must fail before this exception
        # can conceal a reachable RUSTSEC-2026-0235 path. Tracking: #94.
        run: cargo audit --file Cargo.lock --ignore RUSTSEC-2026-0235

  build:
    name: Build (${{ matrix.os }})
    needs: [scope]
    if: needs.scope.outputs.production == 'true'
    runs-on: ${{ matrix.os }}
    env:
      PYO3_PYTHON: python
      PYTHON_SYS_EXECUTABLE: python
      ALOPEX_NIM_PARSER_ALLOW_LOCAL_BUILD: "1"
      NIM_SQL_PARSER_LIB_DIR: ${{ github.workspace }}/crates/alopex-sql/nim-sql-parser
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Setup exact Nim parser toolchain
        uses: ./.github/actions/setup-nim-parser-toolchain
      - name: Build Nim SQL parser library
        shell: bash
        run: bash scripts/build-nim-parser.sh --backend host

      - name: Build
        run: cargo build --release --all-features

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: alopex-${{ matrix.os }}
          path: |
            target/release/alopex-cli
            target/release/alopex-cli.exe

  v08-release-gate:
    name: v0.8 Implementation Surface Contract (${{ matrix.os }})
    needs: [scope]
    if: needs.scope.outputs.production == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYO3_PYTHON: python
      PYTHON_SYS_EXECUTABLE: python
      ALOPEX_NIM_PARSER_ALLOW_LOCAL_BUILD: "1"
      NIM_SQL_PARSER_LIB_DIR: ${{ github.workspace }}/crates/alopex-sql/nim-sql-parser
    steps:
      - name: Free disk space
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Setup Python venv
        shell: bash
        run: |
          VENV_DIR="${RUNNER_TEMP:-/tmp}/alopex-v08-gate-venv"
          rm -rf "$VENV_DIR"
          python -m venv "$VENV_DIR"
          VENV_ROOT=$(VENV_DIR="$VENV_DIR" python -c "import os; from pathlib import Path; print(Path(os.environ['VENV_DIR']).resolve().as_posix())")
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            VENV_BIN="$VENV_ROOT/Scripts"
            VENV_PY="$VENV_BIN/python.exe"
          else
            VENV_BIN="$VENV_ROOT/bin"
            VENV_PY="$VENV_BIN/python"
          fi
          test -x "$VENV_PY"
          echo "$VENV_BIN" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$VENV_ROOT" >> "$GITHUB_ENV"
          echo "PYO3_PYTHON=$VENV_PY" >> "$GITHUB_ENV"
          echo "PYTHON_SYS_EXECUTABLE=$VENV_PY" >> "$GITHUB_ENV"
          echo "ALOPEX_PYTHON=$VENV_PY" >> "$GITHUB_ENV"
          echo "V07_GATE_VENV_DIR=$VENV_ROOT" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Python deps
        run: python -m pip install --upgrade pip maturin pytest numpy
      - name: Setup exact Nim parser toolchain
        uses: ./.github/actions/setup-nim-parser-toolchain
      - name: Build Nim SQL parser library
        shell: bash
        run: bash scripts/build-nim-parser.sh --backend host
      - name: Run Nim SQL parser tests
        shell: bash
        run: bash scripts/test-nim-parser.sh --backend host
      - name: Run controlled Nim parser failure
        id: nim_parser_controlled_failure
        continue-on-error: true
        shell: bash
        run: |
          proof_root="${RUNNER_TEMP:-/tmp}"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            proof_root="$(cygpath -u "$proof_root")"
          fi
          proof_path="${proof_root}/alopex-nim-controlled-failure-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.txt"
          test ! -e "$proof_path"
          export ALOPEX_NIM_CONTROLLED_FAILURE_PROOF="$proof_path"
          echo "ALOPEX_NIM_CONTROLLED_FAILURE_PROOF=$proof_path" >> "$GITHUB_ENV"
          bash scripts/test-nim-parser.sh --backend host --controlled-failure
      - name: Stage just-built parser for v0.8 surfaces
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux)
              parser_library="libalopex_sql_parser.so"
              parser_static_library="libalopex_sql_parser.a"
              ;;
            Windows)
              parser_library="alopex_sql_parser.dll"
              parser_static_library="alopex_sql_parser.lib"
              ;;
            *)
              echo "unsupported v0.8 parser gate runner: $RUNNER_OS" >&2
              exit 2
              ;;
          esac
          local_dir="${NIM_SQL_PARSER_DIR}"
          for candidate in "$parser_library" "$parser_static_library" CONTRACT_VERSION SHA256SUMS; do
            test -f "${local_dir}/${candidate}"
            test ! -L "${local_dir}/${candidate}"
          done
          cmp -s "${local_dir}/PARSER_CONTRACT_VERSION" "${local_dir}/CONTRACT_VERSION"
          (cd "${local_dir}" && sha256sum -c SHA256SUMS)
          native_dir="crates/alopex-py/python/alopex/native"
          mkdir -p "${native_dir}"
          for candidate in "$parser_library" CONTRACT_VERSION SHA256SUMS; do
            cp -f -- "${local_dir}/${candidate}" "${native_dir}/${candidate}"
            cmp -s "${local_dir}/${candidate}" "${native_dir}/${candidate}"
          done
      # Windows has no rpath; make the staged parser DLL discoverable by every
      # subsequent v0.8 gate executable, including distributed-read tests.
      - name: Add Nim library to PATH (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: echo "${GITHUB_WORKSPACE}/${NIM_SQL_PARSER_DIR}" >> "$GITHUB_PATH"
      - name: Run v0.7 baseline gate (Linux)
        if: runner.os == 'Linux'
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/${{ env.NIM_SQL_PARSER_DIR }}:${{ env.LD_LIBRARY_PATH }}
        run: bash scripts/release/v07_gate.sh
      - name: Build Python extension for v0.8 gate (Windows)
        if: runner.os == 'Windows'
        run: maturin develop -m crates/alopex-py/Cargo.toml
      - name: Run v0.8 release gate
        shell: bash
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
          LD_LIBRARY_PATH: ${{ github.workspace }}/${{ env.NIM_SQL_PARSER_DIR }}:${{ env.LD_LIBRARY_PATH }}
          ALOPEX_NIM_CONTROLLED_FAILURE_OUTCOME: ${{ steps.nim_parser_controlled_failure.outcome }}
        run: bash crates/alopex-tools/v08/verify-v08-surfaces.sh

  ci-success:
    name: CI Success
    needs: [scope, fmt, clippy, test, coverage, security-audit, build, v08-release-gate]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ needs.scope.result }}" != "success" ]]; then
            echo "change scope classification failed"
            exit 1
          fi
          if [[ "${{ needs.scope.outputs.production }}" == "false" ]]; then
            if [[ "${{ needs.fmt.result }}" != "skipped" ]] || \
               [[ "${{ needs.clippy.result }}" != "skipped" ]] || \
               [[ "${{ needs.test.result }}" != "skipped" ]] || \
               [[ "${{ needs.coverage.result }}" != "skipped" ]] || \
               [[ "${{ needs['security-audit'].result }}" != "skipped" ]] || \
               [[ "${{ needs.build.result }}" != "skipped" ]] || \
               [[ "${{ needs['v08-release-gate'].result }}" != "skipped" ]]; then
              echo "release-process-only change unexpectedly ran production verification"
              exit 1
            fi
            echo "Release-process-only change: production verification delegated to its owners"
            exit 0
          fi
          if [[ "${{ needs.fmt.result }}" != "success" ]] || \
             [[ "${{ needs.clippy.result }}" != "success" ]] || \
             [[ "${{ needs.test.result }}" != "success" ]] || \
             [[ "${{ needs.coverage.result }}" != "success" ]] || \
             [[ "${{ needs['security-audit'].result }}" != "success" ]] || \
             [[ "${{ needs.build.result }}" != "success" ]] || \
             [[ "${{ needs['v08-release-gate'].result }}" != "success" ]]; then
            echo "One or more jobs failed"
            echo "fmt: ${{ needs.fmt.result }}"
            echo "clippy: ${{ needs.clippy.result }}"
            echo "test: ${{ needs.test.result }}"
            echo "coverage: ${{ needs.coverage.result }}"
            echo "security-audit: ${{ needs['security-audit'].result }}"
            echo "build: ${{ needs.build.result }}"
            echo "v08-release-gate: ${{ needs['v08-release-gate'].result }}"
            exit 1
          fi
          echo "All CI jobs passed!"
