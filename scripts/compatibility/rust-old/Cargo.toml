[package]
name = "alopex-compat-baseline"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[[bin]]
name = "alopex-compat-baseline"
path = "../rust_harness.rs"

[dependencies]
alopex-embedded = "=0.8.15"
alopex-core = "=0.8.15"
alopex-sql = "=0.8.15"
alopex-cluster = "=0.8.15"
alopex-dataframe = "=0.8.15"
serde_json = "1"
chrono = "0.4"
csv = "1"

[profile.dev]
debug = 0
incremental = false
