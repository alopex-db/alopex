[package]
name = "alopex-compat-candidate"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[[bin]]
name = "alopex-compat-candidate"
path = "../rust_harness.rs"

[features]
candidate-reader = []
default = ["candidate-reader"]
legacy-config-literal = []
source-config-clients = []

[dependencies]
alopex-core = { path = "../../../crates/alopex-core" }
alopex-embedded = { path = "../../../crates/alopex-embedded" }
alopex-sql = { path = "../../../crates/alopex-sql" }
serde_json = "1"
chrono = "0.4"
csv = "1"

[profile.dev]
debug = 0
incremental = false

[[bin]]
name = "config-constructor"
path = "../config_constructor_client.rs"
required-features = ["source-config-clients"]

[[bin]]
name = "config-literal-v0815"
path = "../config_literal_v0815_client.rs"
required-features = ["source-config-clients"]

[[bin]]
name = "config-literal-v0816"
path = "../config_literal_v0816_client.rs"
required-features = ["source-config-clients"]

[[bin]]
name = "config-options"
path = "../config_options_client.rs"
required-features = ["source-config-clients"]
