[package]
name = "issue577-parquet-native"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[features]
alopex = ["dep:alopex-core", "dep:alopex-sql", "dep:tokio"]
reference = []
fixtures = ["dep:arrow-array", "dep:arrow-schema", "dep:parquet"]

[dependencies]
alopex-core = { path = "../../../crates/alopex-core", optional = true }
alopex-sql = { path = "../../../crates/alopex-sql", features = ["tokio"], optional = true }
tokio = { version = "=1.49.0", features = ["rt", "sync"], optional = true }
arrow-array = { version = "=60.1.0", optional = true }
arrow-schema = { version = "=60.1.0", optional = true }
parquet = { version = "=60.1.0", default-features = false, features = ["arrow", "snap", "brotli", "flate2-rust_backend", "lz4", "zstd", "base64"], optional = true }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
sha2 = "=0.10.9"
libc = "=0.2.186"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
