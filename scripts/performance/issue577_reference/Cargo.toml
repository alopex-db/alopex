[package]
name = "issue577-parquet-reference"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[[bin]]
name = "issue577-parquet-reference"
path = "../issue577_native/src/main.rs"

[features]
default = ["reference"]
reference = []
alopex = []
fixtures = []

[dependencies]
duckdb = { version = "=1.4.0", default-features = false }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
sha2 = "=0.10.9"
libc = "=0.2.186"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
